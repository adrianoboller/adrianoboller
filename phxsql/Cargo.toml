[workspace]
resolver = "2"
members = [
    "crates/phxhash",
    "crates/phxsql-core",
    "crates/phxzip",
    "crates/phxzip-cmd",
    "crates/phxzip-web",
    "crates/phxsql-store",
    "crates/phxsql-sql",
    "crates/phxsql-cli",
    "crates/phxsql-cmd",
    "crates/phxsql-server",
    "crates/phxsql-odbc",
    "crates/phxsql-ffi",
]

[workspace.package]
version = "0.19.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adrianoboller/adrianoboller"

[workspace.dependencies]
phxhash = { path = "crates/phxhash" }
phxzip = { path = "crates/phxzip" }
phxsql-core = { path = "crates/phxsql-core" }
phxsql-store = { path = "crates/phxsql-store" }
phxsql-sql = { path = "crates/phxsql-sql" }
phxsql-server = { path = "crates/phxsql-server" }

[profile.release]
opt-level = 3
lto = "thin"

# A derivacao do 7zAES faz 2^19 voltas de SHA-256 a cada .phz lido ou gravado:
# sem otimizacao, cada uma custava segundos nos testes (a bateria do .phz
# levou 49,9 s). So a crate do hash sai otimizada no perfil de teste; o resto
# continua depuravel.
[profile.dev.package.phxhash]
opt-level = 3
