[workspace]
resolver = "2"
members = [
    "crates/phxsql-core",
    "crates/phxsql-store",
    "crates/phxsql-sql",
    "crates/phxsql-cli",
    "crates/phxsql-cmd",
    "crates/phxsql-server",
    "crates/phxsql-odbc",
    "crates/phxsql-ffi",
    "crates/phxzip",
    "crates/phxzip-cmd",
    "crates/phxzip-web",
]

[workspace.package]
version = "0.20.0"
edition = "2021"
# 1.89 desde o pedido 635: a trava de instancia e `File::try_lock`, a trava
# do nucleo pela `std`. Era 1.75; o preco medido foram 19 avisos novos do
# clippy, todos mecanicos (`is_multiple_of`, `is_none_or`). Ver
# `crates/phxsql-store/src/trava_de_instancia.rs`.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adrianoboller/adrianoboller"

[workspace.dependencies]
phxsql-core = { path = "crates/phxsql-core" }
phxsql-store = { path = "crates/phxsql-store" }
phxsql-sql = { path = "crates/phxsql-sql" }
phxsql-server = { path = "crates/phxsql-server" }
phxzip = { path = "crates/phxzip" }

[profile.release]
opt-level = 3
lto = "thin"
