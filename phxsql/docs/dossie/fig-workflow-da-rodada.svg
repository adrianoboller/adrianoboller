    <rect x="502" y="116" width="198" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="601" y="136" text-anchor="middle" font-size="10.5">comparativo-no-dossie.py</text>
    <rect x="502" y="180" width="198" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="601" y="200" text-anchor="middle" font-size="10.5">pagina-dos-pedidos.py</text>
    <rect x="502" y="244" width="198" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="601" y="264" text-anchor="middle" font-size="10.5">pagina-dos-testes.py</text>
    <path d="M460 74 L496 74" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <path d="M460 82 L482 82 L482 138 L496 138" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <path d="M460 90 L468 90 L468 266 L496 266" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <path d="M460 146 L475 146 L475 274 L496 274" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <path d="M460 202 L496 202" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <rect x="742" y="52" width="176" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="830" y="72" text-anchor="middle" font-size="10.5">docs/COMPARATIVO.md</text><text x="830" y="87" text-anchor="middle" font-size="9.5" opacity=".75">não se edita</text>
    <rect x="742" y="116" width="176" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="830" y="136" text-anchor="middle" font-size="10.5">dossiê §33</text><text x="830" y="151" text-anchor="middle" font-size="9.5" opacity=".75">artefato 5c14044e</text>
    <rect x="742" y="180" width="176" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="830" y="200" text-anchor="middle" font-size="10.5">pedidos.html</text><text x="830" y="215" text-anchor="middle" font-size="9.5" opacity=".75">artefato d6c8f13c</text>
    <rect x="742" y="244" width="176" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="830" y="264" text-anchor="middle" font-size="10.5">testes.html</text><text x="830" y="279" text-anchor="middle" font-size="9.5" opacity=".75">artefato 0c069766</text>
    <path d="M700 74 L736 74" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <path d="M700 138 L736 138" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
