    <path d="M700 266 L736 266" stroke="currentColor" stroke-width="1.3" marker-end="url(#setaWf)"/>
    <line x1="20" y1="336" x2="918" y2="336" stroke="currentColor" stroke-width="1" opacity=".22"/>
    <text x="20" y="358" font-size="11" opacity=".85"><tspan font-weight="600">A regra que fecha o desenho:</tspan> nada da coluna 4 se edita. Quem quiser mudar uma palavra mexe na coluna 3, e quem quiser</text>
    <text x="20" y="375" font-size="11" opacity=".85">mudar um número mexe na coluna 1 — porque número digitado à mão envelhece calado, e a receita do número envelhece junto.</text>
    <text x="20" y="399" font-size="10.5" opacity=".6">Medido nesta rodada: 19 capacidades, 136 operações no catálogo, 109 alcançadas pela tela. Os três saem da coluna 1, nenhum do teclado.</text>
  </g>
</svg>