<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 415" role="img" aria-label="Diagrama de workflow da rodada: dois medidores gravam resultados JSON, quatro geradores leem esses arquivos e o PENDENCIAS escrito a mao, e produzem quatro saidas que ninguem edita; a prova dos portoes guarda os medidores repondo cada defeito">
  <style>svg{--ok:#2f7a3e;--log:#b71414;--pend:#8a6a1f;--acento:#c63c0a;color:#4a3f3a;background:#fbf9f7}</style>
  <defs>
    <marker id="setaWf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="setaWfO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/>
