  <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor">
    <text x="120" y="30" text-anchor="middle" font-size="10" fill="var(--acento)" letter-spacing="1.3">1 &#183; MEDIR</text><line x1="20" y1="38" x2="220" y2="38" stroke="var(--acento)" stroke-width="1" opacity=".45"/>
    <text x="361" y="30" text-anchor="middle" font-size="10" fill="var(--acento)" letter-spacing="1.3">2 &#183; O QUE FICA GRAVADO</text><line x1="262" y1="38" x2="460" y2="38" stroke="var(--acento)" stroke-width="1" opacity=".45"/>
    <text x="601" y="30" text-anchor="middle" font-size="10" fill="var(--acento)" letter-spacing="1.3">3 &#183; OS GERADORES</text><line x1="502" y1="38" x2="700" y2="38" stroke="var(--acento)" stroke-width="1" opacity=".45"/>
    <text x="830" y="30" text-anchor="middle" font-size="10" fill="var(--acento)" letter-spacing="1.3">4 &#183; O QUE O DONO VÊ</text><line x1="742" y1="38" x2="918" y2="38" stroke="var(--acento)" stroke-width="1" opacity=".45"/>
    <rect x="20" y="52" width="200" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="120" y="72" text-anchor="middle" font-size="10.5">comparativo/medir.py</text><text x="120" y="87" text-anchor="middle" font-size="9.5" opacity=".75">4 motores vivos + sonda</text>
    <rect x="20" y="116" width="200" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="120" y="136" text-anchor="middle" font-size="10.5">cobertura-da-tela/medir.py</text><text x="120" y="151" text-anchor="middle" font-size="9.5" opacity=".75">as 2 listas saem do código</text>
    <rect x="20" y="214" width="200" height="58" rx="4" fill="var(--ok)" fill-opacity=".10" stroke="var(--ok)" stroke-width="1.6"/><text x="120" y="234" text-anchor="middle" font-size="10.5">prova-dos-portoes.py</text><text x="120" y="249" text-anchor="middle" font-size="9.5" opacity=".75">repõe o defeito, exige a parada</text>
    <path d="M120 214 L120 168" stroke="var(--ok)" stroke-width="1.5" marker-end="url(#setaWfO)"/>
    <text x="128" y="192" font-size="9.5" fill="var(--ok)">guarda os dois</text>
    <text x="20" y="292" font-size="9.5" opacity=".75">e exige que SEM defeito o medidor</text>
    <text x="20" y="305" font-size="9.5" opacity=".75">vá até o fim — senão um que parasse</text>
    <text x="20" y="318" font-size="9.5" opacity=".75">sempre passaria em tudo.</text>
    <rect x="262" y="52" width="198" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="361" y="72" text-anchor="middle" font-size="10.5">comparativo/</text><text x="361" y="87" text-anchor="middle" font-size="9.5" opacity=".75">resultados.json · 19 linhas</text>
    <rect x="262" y="116" width="198" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="361" y="136" text-anchor="middle" font-size="10.5">cobertura-da-tela/</text><text x="361" y="151" text-anchor="middle" font-size="9.5" opacity=".75">resultados.json · 136 ops</text>
