[package]
name = "phxzip-web"
description = "PhxZipWeb -- a porta web do PhxZip, so em 127.0.0.1, com a tela embutida"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "phxzip_web"
path = "src/lib.rs"

[[bin]]
name = "phxzipweb"
path = "src/main.rs"

# O `phxsql-core` da o HTTP (`http.rs`, fatia Z1), o JSON e a maquina de
# idiomas (Z2); o `phxzip` e o motor das rotas (Z6 a Z8). Os dois de caminho,
# nenhum de fora.
[dependencies]
phxsql-core.workspace = true
phxzip.workspace = true
