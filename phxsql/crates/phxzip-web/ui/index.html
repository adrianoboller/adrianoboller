<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhxZip</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,__ICONE_B64__">
<style>
/*FONTES*/
</style>
<style>
  :root {
    --fundo: #010418; --painel: #0a1122; --borda: #1c2640; --texto: #DDE2EB;
    --fraco: #8a93a8; --ambar: #FFC43D; --laranja: #FF8A1C; --vermelhao: #FF4D10;
    --verde: #3ecf8e; --azul: #5aa9ff; --vermelho: #ff5c5c;
    /* O acento do PhxZip na familia Phoenix e o ambar (marca/LEIA-ME.md):
       o PhxSql e laranja, o PhxMail vermelhao, o Phxblockchain vermelho. */
    --acento: var(--ambar);
    --linha-tabela: #141c30; --realce-soltar: rgba(255,196,61,.08);
  }
  /* Tema claro: os mesmos tons do PhxSql, e pela mesma regra da marca -- o
     laranja e o vermelhao escurecem para #C63C0A, e as cores da acao
     escurecem ate passar 4,5:1 sobre o papel (medido: tela-phxzip.mjs). */
  :root[data-tema="claro"] {
    --fundo: #f7f5f2; --painel: #ffffff; --borda: #ded7cf; --texto: #1a1210;
    --fraco: #6b5e57; --ambar: #8a5c00; --laranja: #c63c0a; --vermelhao: #c63c0a;
    --verde: #2f7a3e; --azul: #1f5c93; --vermelho: #b71414;
    --linha-tabela: #ece7e1; --realce-soltar: rgba(160,106,0,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .marca { font-family: "Exo 2", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px;
    border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
    header h1.logo { display: inline-flex; flex-direction: column; line-height: 1; margin: 0; font-weight: 600; }
  /* «PHX / Z I P» (decisao do dono): Z I P espacado ate a largura de PHX,
     pelo flex -- a mesma conta do SVG da marca, sem letter-spacing chutado. */
  header h1.logo .l1 { font-size: 34px; letter-spacing: .01em; color: var(--texto); }
  /* Z I P em negrito e laranja (decisao do dono): 700 e o teto da Exo 2 embutida. */
  header h1.logo .l2 { display: flex; justify-content: space-between; font-size: 21px; margin-top: 5px; color: var(--laranja); }
  header h1.logo b { font-weight: 700; }
    .ic { width: 16px; height: 16px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.pasta { color: var(--ambar); } .ic.cadeado { color: var(--laranja); } .ic.doc { color: var(--fraco); }
  header .sub { color: var(--fraco); font-size: 13px; margin-top: 9px; }
  header .dir { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px;
    padding: 20px; min-width: 0; }
  .cartao h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .campo > span { font-size: 12px; color: var(--fraco); letter-spacing: .04em; }
  .caixa { width: 100%; background: var(--fundo); color: var(--texto); border: 1px solid var(--borda);
    border-radius: 8px; padding: 9px 11px; font: inherit; }
  .caixa:focus { outline: 2px solid var(--laranja); outline-offset: 0; }
  .linha { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .marcar { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
  .marcar input { width: auto; margin: 0; }
  .botao { background: transparent; border: 1.5px solid currentColor; border-radius: 8px;
    padding: 9px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer; color: var(--texto); }
  .botao:disabled { opacity: .45; cursor: default; }
  .botao.inclui { color: var(--verde); } .botao.inclui:hover:not(:disabled) { background: var(--verde); color: var(--fundo); }
  .botao.consulta { color: var(--azul); } .botao.consulta:hover:not(:disabled) { background: var(--azul); color: var(--fundo); }
  .botao.neutro { color: var(--fraco); } .botao.neutro:hover { color: var(--texto); }
  .arquivo-escolha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .arquivo-escolha input[type=file] { display: none; }
  .escolhidos { color: var(--fraco); font-size: 13px; overflow-wrap: anywhere; }
  /* A area de soltar: tracejado ambar em repouso, cheio quando ha algo em
     cima -- a mesma regra do botao (contorno, e preenchimento so com intencao). */
  /* A zona encostava na legenda do campo seguinte (visto a 375 px). */
  .zona { margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 118px; padding: 16px; border: 2px dashed var(--borda); border-radius: 12px; cursor: pointer;
    color: var(--fraco); text-align: center; transition: border-color .15s, background .15s; }
  .zona:hover, .zona:focus-visible { border-color: var(--acento); color: var(--texto); outline: none; }
  .zona.em-cima { border-color: var(--acento); border-style: solid; background: var(--realce-soltar); color: var(--texto); }
  .zona .ic { width: 30px; height: 30px; color: var(--acento); }
  .zona strong { color: var(--texto); font-weight: 600; }
  .zona input[type=file] { display: none; }
  .zona.menor { min-height: 84px; }
  .lista-fila { max-height: 240px; overflow: auto; margin: 10px 0 12px; border: 1px solid var(--borda); border-radius: 8px; }
  .lista-fila table { margin-top: 0; }
  .rodape-lista { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 8px;
    font-size: 13px; color: var(--fraco); border-top: 1px solid var(--borda); background: var(--fundo); position: sticky; bottom: 0; }
  .filtro { max-width: 260px; padding: 6px 10px; font-size: 13px; }
  .botao.remover { color: var(--fraco); padding: 2px 6px; line-height: 0; border-color: transparent; }
  .botao.remover:hover { color: var(--vermelho); border-color: var(--vermelho); background: transparent; }
  .resultado { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid var(--borda); display: none; overflow-wrap: anywhere; }
  .resultado.ok { display: block; border-color: var(--verde); color: var(--verde); }
  .resultado.erro { display: block; border-color: var(--vermelho); color: var(--vermelho); }
  .tabela-rolagem { overflow-x: auto; margin-top: 14px; }
  table.entradas { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.entradas th { text-align: left; color: var(--fraco); font-weight: 500; padding: 6px 8px;
    border-bottom: 1px solid var(--borda); white-space: nowrap; }
  table.entradas td { padding: 6px 8px; border-bottom: 1px solid var(--linha-tabela); vertical-align: middle; }
  table.entradas td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.entradas td.nome { overflow-wrap: break-word; min-width: 9em; }
  table.entradas td.data { white-space: nowrap; color: var(--fraco); }
  .selo { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
    border: 1px solid var(--borda); color: var(--ambar); }
  .mini { padding: 3px 10px; font-size: 12px; }
  .botao.icone { padding: 4px 7px; line-height: 0; }
  /* Nivel e senha lado a lado; a legenda longa da senha quebrava em duas
     linhas e desalinhava do Nivel (visto a 375 px) -- alinhados pelo TOPO, e
     um embaixo do outro quando a tela nao comporta os dois. */
  .lado-a-lado { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 2fr);
    gap: 12px; align-items: start; }
  @media (max-width: 520px) { .lado-a-lado { grid-template-columns: 1fr; gap: 0; } }
  .dica { font-size: 12px; color: var(--fraco); min-height: 1.3em; }
  .com-olho { display: flex; gap: 6px; align-items: stretch; }
  .com-olho .caixa { flex: 1; min-width: 0; }
  .botao.olho[aria-pressed=true] { color: var(--ambar); }
  #c_teto { margin-bottom: 12px; }
  /* Progresso: a barra mede o que o navegador SABE medir (envio e
     recebimento); o trabalho do servidor nao tem porcentagem, e a barra diz
     isso andando sem numero em vez de inventar um. */
  .progresso { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--fraco); }
  .progresso .trilho { flex: 1; height: 6px; border-radius: 99px; background: var(--borda); overflow: hidden; position: relative; }
  .progresso .barra { height: 100%; width: 0; background: var(--acento); transition: width .15s; }
  .progresso.indeterminado .barra { width: 30%; position: absolute; animation: vaivem 1.1s ease-in-out infinite alternate; }
  @keyframes vaivem { from { left: 0; } to { left: 70%; } }
  @media (prefers-reduced-motion: reduce) { .progresso.indeterminado .barra { animation: none; width: 100%; opacity: .5; } }
  .progresso .rotulo { min-width: 12em; font-variant-numeric: tabular-nums; }
  /* Arvore: a pasta e uma linha que abre e fecha; a ordenacao mantem as
     pastas antes dos arquivos em cada nivel, como o 7-Zip e o Explorer. */
  .seta { background: none; border: 0; color: var(--fraco); cursor: pointer; padding: 0 4px 0 0; font: inherit; line-height: 1; width: 1.2em; }
  .seta:hover { color: var(--texto); }
  .seta .ic { transition: transform .12s; }
  .seta[aria-expanded="false"] .ic { transform: rotate(-90deg); }
  .recuo { display: inline-block; width: 1.2em; }
  th button.ordenar { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  th button.ordenar:hover { color: var(--texto); }
  th[aria-sort="ascending"] button.ordenar::after { content: " ▲"; font-size: 9px; }
  th[aria-sort="descending"] button.ordenar::after { content: " ▼"; font-size: 9px; }
  .resultado.aviso { display: block; border-color: var(--ambar); color: var(--ambar); }
  #login { max-width: 380px; margin: 60px auto; }
  .oculto { display: none !important; }
  footer { text-align: center; color: var(--fraco); font-size: 12px; padding: 24px 16px 32px; }
  footer em { font-style: normal; color: var(--ambar); }
  @media (max-width: 480px) { header { padding: 12px 16px; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="marca logo" aria-label="PhxZip"><span class="l1">PHX</span><span class="l2"><b>Z</b><b>I</b><b>P</b></span></h1>
    <div class="sub" data-txt="zip.sub">7z · LZMA2 · AES-256 — escrito em Rust, sem dependências</div>
  </div>
  <div class="dir">
    <span id="quem" class="sub"></span>
    <button id="sair" class="botao neutro mini oculto" data-txt="zip.sair">Sair</button>
    <button id="tema" class="botao neutro mini icone" type="button"><svg class="ic" aria-hidden="true"><use href="#i-sol"/></svg></button>
    <select id="idioma" class="caixa" style="width:auto" aria-label="idioma"></select>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Icones desenhados aqui, no traco da familia (2 px, currentColor): o
       emoji muda de desenho por sistema e nao segue a cor da marca. -->
  <symbol id="i-pasta" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-cadeado" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-baixar" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-soltar" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-olho" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-lua" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
</svg>

<section id="login" class="cartao oculto">
  <h2 class="marca" data-txt="zip.login_titulo">Entrar</h2>
  <label class="campo"><span data-txt="zip.usuario">Usuário</span>
    <input id="l_usuario" class="caixa" autocomplete="username"></label>
  <label class="campo"><span data-txt="zip.senha">Senha</span>
    <input id="l_senha" class="caixa" type="password" autocomplete="current-password"></label>
  <button id="entrar" class="botao consulta" data-txt="zip.entrar">Entrar</button>
  <div id="l_res" class="resultado"></div>
</section>

<main id="principal" class="oculto">
  <section class="cartao">
    <h2 class="marca" data-txt="zip.compactar_titulo">Compactar</h2>
    <label id="c_zona" class="zona" tabindex="0">
      <input id="c_arquivos" type="file" multiple>
      <svg class="ic" aria-hidden="true"><use href="#i-soltar"/></svg>
      <strong data-txt="zip.soltar_titulo">Arraste arquivos ou pastas para cá</strong>
      <span data-txt="zip.soltar_ou">ou clique para escolher</span>
    </label>
    <div id="c_fila" class="lista-fila oculto">
      <table class="entradas"><thead><tr><th></th><th data-txt="zip.col_nome">Nome</th><th data-txt="zip.col_tamanho">Tamanho</th><th></th></tr></thead>
        <tbody></tbody></table>
      <div class="rodape-lista"><span id="c_total"></span>
        <button id="c_limpar" class="botao neutro mini" data-txt="zip.limpar">Limpar</button></div>
    </div>
    <div id="c_teto" class="resultado aviso oculto" role="status"></div>
    <div class="linha lado-a-lado">
      <label class="campo estreito"><span data-txt="zip.nivel">Nível</span>
        <select id="c_nivel" class="caixa" aria-describedby="c_dica">
          <option value="0" data-txt="zip.nivel_copy">0 — sem compressão</option><option value="1">1</option><option value="3">3</option>
          <option value="5" selected>5</option><option value="7">7</option><option value="9" data-txt="zip.nivel_max">9 — máximo</option>
        </select>
        <small id="c_dica" class="dica"></small></label>
      <label class="campo largo"><span data-txt="zip.senha_arquivo">Senha do arquivo (opcional)</span>
        <span class="com-olho">
          <input id="c_senha" class="caixa" type="password" autocomplete="new-password">
          <button id="c_olho" type="button" class="botao neutro mini icone olho" aria-pressed="false">
            <svg class="ic" aria-hidden="true"><use href="#i-olho"/></svg></button>
        </span></label>
    </div>
    <label id="c_conf" class="campo oculto"><span data-txt="zip.confirmar_senha">Repita a senha</span>
      <input id="c_senha2" class="caixa" type="password" autocomplete="new-password"></label>
    <label class="campo"><span data-txt="zip.nome_saida">Nome do arquivo</span>
      <input id="c_nome" class="caixa" value="phxzip.7z"></label>
    <div class="linha" style="margin-bottom:12px">
      <label class="marcar"><input id="c_visiveis" type="checkbox"><span data-txt="zip.nomes_visiveis">nomes visíveis sem senha</span></label>
    </div>
    <button id="compactar" class="botao inclui" data-txt="zip.compactar">Compactar e baixar</button>
    <div id="c_prog" class="progresso oculto" role="status" aria-live="polite">
      <div class="trilho"><div class="barra"></div></div><span class="rotulo"></span>
      <button type="button" class="botao neutro mini" data-txt="zip.cancelar">Cancelar</button>
    </div>
    <div id="c_res" class="resultado"></div>
  </section>

  <section class="cartao">
    <h2 class="marca" data-txt="zip.abrir_titulo">Abrir .7z</h2>
    <label id="a_zona" class="zona menor" tabindex="0">
      <input id="a_arquivo" type="file" accept=".7z,.phz">
      <svg class="ic" aria-hidden="true"><use href="#i-cadeado"/></svg>
      <strong id="a_escolhido" data-txt="zip.soltar_7z">Arraste o .7z ou .phz para cá</strong>
      <span data-txt="zip.soltar_ou">ou clique para escolher</span>
    </label>
    <label class="campo"><span data-txt="zip.senha_arquivo">Senha do arquivo (opcional)</span>
      <input id="a_senha" class="caixa" type="password" autocomplete="off"></label>
    <div class="linha">
      <button id="abrir" class="botao consulta" data-txt="zip.abrir">Abrir</button>
      <button id="testar" class="botao consulta" data-txt="zip.testar">Testar integridade</button>
      <button id="tudo" class="botao consulta" data-txt="zip.extrair_tudo">Extrair tudo</button>
    </div>
    <div id="a_prog" class="progresso oculto" role="status" aria-live="polite">
      <div class="trilho"><div class="barra"></div></div><span class="rotulo"></span>
      <button type="button" class="botao neutro mini" data-txt="zip.cancelar">Cancelar</button>
    </div>
    <div id="a_res" class="resultado"></div>
    <div id="a_barra" class="linha oculto" style="margin-top:14px;justify-content:space-between">
      <input id="a_filtro" class="caixa filtro" type="search" autocomplete="off">
      <span id="a_total" class="escolhidos"></span>
    </div>
    <div class="tabela-rolagem"><table id="a_tabela" class="entradas oculto">
      <thead><tr><th data-ordem="nome"><button class="ordenar" data-txt="zip.col_nome">Nome</button></th>
        <th data-ordem="tamanho"><button class="ordenar" data-txt="zip.col_tamanho">Tamanho</button></th>
        <th data-ordem="metodo"><button class="ordenar" data-txt="zip.col_metodo">Método</button></th>
        <th data-ordem="data"><button class="ordenar" data-txt="zip.col_data">Data</button></th><th></th></tr></thead>
      <tbody></tbody></table></div>
  </section>
</main>

<footer class="marca"><em>Built to store. Engineered to scale.</em> · PhxZip <span id="versao"></span></footer>

<script>
'use strict';
// Texto de tela resolvido por CHAVE, nunca pela frase -- a lei da fabrica de
// idiomas do PhxSql, e o MESMO motor: o servidor devolve os textos `zip.*` ja
// resolvidos (`/api/textos`, `src/textos.rs`), nos seis idiomas da fabrica.
// A pagina nao carrega traducao nenhuma: duas verdades, e a segunda envelhece.
// Dado -- nome de arquivo, numero -- nunca passa por aqui.
let TEXTOS = {};
let IDIOMAS = ['Portugues'];
let idioma = 'Portugues';
try { idioma = localStorage.getItem('phxzip_idioma') || 'Portugues'; } catch (_) {}
// A sigla do seletor e o formato de numero e data de cada coluna da fabrica.
const SIGLA = { Portugues: 'PT', Frances: 'FR', Ingles: 'EN', Italiano: 'IT', Alemao: 'DE', Espanhol: 'ES' };
const LOCAL = { Portugues: 'pt-BR', Frances: 'fr-FR', Ingles: 'en-US', Italiano: 'it-IT', Alemao: 'de-DE', Espanhol: 'es-ES' };
const local = () => LOCAL[idioma] || 'pt-BR';
// Marcadores `{nome}` recebem DADO ja formatado; chave ausente mostra a chave,
// para o defeito aparecer em vez de sumir.
const t = (k, dados) => (TEXTOS[k] ?? k).replace(/\{([a-z0-9_]+)\}/g, (m, n) => dados && n in dados ? dados[n] : m);
const fmt = n => Number(n).toLocaleString(local());
const pct = (b, a) => a ? (100 * b / a).toLocaleString(local(), { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + '%' : '—';
const nArquivos = n => n === 1 ? t('zip.arquivo_1') : t('zip.arquivos_n', { n: fmt(n) });
async function carregarTextos() {
  const r = await fetch('/api/textos?idioma=' + encodeURIComponent(idioma), { credentials: 'same-origin' });
  const j = await r.json();
  TEXTOS = j.textos || {}; IDIOMAS = j.idiomas || IDIOMAS; idioma = j.idioma || idioma;
}
const $ = id => document.getElementById(id);

function traduzir() {
  document.documentElement.lang = local();
  const sel = $('idioma');
  if (sel.options.length !== IDIOMAS.length) {
    sel.textContent = '';
    for (const i of IDIOMAS) { const o = document.createElement('option'); o.value = i; o.textContent = SIGLA[i] || i; sel.appendChild(o); }
  }
  document.querySelectorAll('[data-txt]').forEach(el => {
    if (el.dataset.dinamico) return;
    el.textContent = t(el.dataset.txt);
  });
  $('idioma').value = idioma;
  $('a_filtro').placeholder = t('zip.filtrar');
}
$('idioma').onchange = async () => {
  idioma = $('idioma').value;
  try { localStorage.setItem('phxzip_idioma', idioma); } catch (_) {}
  await carregarTextos();
  traduzir(); desenharFila(); rotularAberto(); rotularNivel(); rotularOlho(); aplicarTema(document.documentElement.getAttribute('data-tema')); if (ultimaLista) desenhar(ultimaLista);
};

function mostrar(id, ok, texto) { const el = $(id); el.className = 'resultado ' + (ok ? 'ok' : 'erro'); el.textContent = texto; }
function limpar(id) { $(id).className = 'resultado'; $(id).textContent = ''; }

// UM caminho de pedido para a pagina inteira. XMLHttpRequest e nao fetch
// porque so ele mede o ENVIO (upload.onprogress) e cancela no meio (abort):
// com fetch, a barra so poderia andar no recebimento, e o que demora e mandar
// centenas de MiB. `prog` e opcional -- o login e o sair nao tem barra.
function api(rota, corpo, binario, prog) {
  return new Promise((ok, falha) => {
    const x = new XMLHttpRequest();
    x.open('POST', rota);
    x.setRequestHeader('X-PhxZip', '1');
    x.responseType = binario ? 'blob' : 'text';
    const erro = (tipo, texto, metodo) => { const e = new Error(texto || tipo); e.tipo = tipo; e.metodo = metodo; return e; };
    if (prog) {
      prog.abrir(x);
      x.upload.onprogress = ev => prog.fase('zip.enviando', ev.loaded, ev.total);
      x.upload.onload = () => prog.fase('zip.processando');
      x.onprogress = ev => prog.fase('zip.recebendo', ev.loaded, ev.lengthComputable ? ev.total : 0);
    }
    const fim = () => { if (prog) prog.fechar(); };
    x.onload = async () => {
      fim();
      if (x.status >= 200 && x.status < 300) {
        ok(binario ? { blob: x.response, cabecalho: n => x.getResponseHeader(n) } : JSON.parse(x.response || '{}'));
        return;
      }
      let j = {};
      try { j = JSON.parse(binario ? await x.response.text() : x.response); } catch (_) {}
      if (x.status === 401 && j.tipo === 'login') await estado();
      falha(erro(j.tipo || 'rede', j.erro || x.statusText, j.metodo));
    };
    x.onerror = () => { fim(); falha(erro('rede')); };
    x.onabort = () => { fim(); falha(erro('cancelado')); };
    x.send(corpo);
  });
}

// A barra de um cartao. O Cancelar aborta o pedido EM CURSO; o que o
// servidor ja estava fazendo termina la e e jogado fora -- o que o cancelar
// garante e que nada chega nem e baixado, e o texto diz isso.
function progresso(id) {
  const el = $(id), barra = el.querySelector('.barra'), rot = el.querySelector('.rotulo');
  let x = null;
  el.querySelector('button').onclick = ev => { ev.preventDefault(); if (x) x.abort(); };
  return {
    abrir(xhr) { x = xhr; el.classList.remove('oculto'); this.fase('zip.enviando', 0, 0); },
    fase(chave, feito, total) {
      const pct = total ? Math.min(100, Math.round(feito * 100 / total)) : null;
      el.classList.toggle('indeterminado', pct === null);
      barra.style.width = pct === null ? '' : pct + '%';
      rot.textContent = t(chave, { pct: pct === null ? '' : pct + '%' });
    },
    fechar() { x = null; el.classList.add('oculto'); },
  };
}
const progC = progresso('c_prog'), progA = progresso('a_prog');

const ERRO = {
  senha_necessaria: 'zip.senha_necessaria', senha_errada: 'zip.senha_errada', recusado: 'zip.recusado',
  corrompido: 'zip.corrompido', teto: 'zip.teto', caminho: 'zip.caminho', login: 'zip.login',
  login_errado: 'zip.login_errado', uso: 'zip.uso', origem: 'zip.origem', rota: 'zip.rota',
  interno: 'zip.interno', rede: 'zip.rede', cancelado: 'zip.cancelado',
};
function textoDoErro(e) { return t(ERRO[e.tipo] || 'zip.rede', { metodo: e.metodo || '' }); }

function envelope(meta, partes) { return new Blob([JSON.stringify(meta) + '\n', ...partes]); }

function baixar(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function estado() {

  const j = await r.json();

}

$('entrar').onclick = async () => {

// A fila do que vai ser compactado: {nome (caminho relativo), arquivo}.
// Mesmo nome duas vezes SUBSTITUI -- o 7z nao aceita nome repetido, e soltar
// a mesma pasta de novo quer dizer «a versao nova».
let fila = [];
let maxCorpo = 0;
let aberto = null;
let ultimaLista = null;

function adicionar(itens) {
  for (const it of itens) {
    const i = fila.findIndex(x => x.nome === it.nome);
    if (i >= 0) fila[i] = it; else fila.push(it);
  }
  desenharFila();
}

function desenharFila() {
  const tb = $('c_fila').querySelector('tbody');
  tb.textContent = '';
  fila.forEach((it, i) => {
    const tr = document.createElement('tr');
    const td = (txt, cls) => { const c = document.createElement('td'); if (cls) c.className = cls; c.textContent = txt; tr.appendChild(c); return c; };
    td('').innerHTML = '<svg class="ic doc" aria-hidden="true"><use href="#i-doc"/></svg>';
    td(it.nome, 'nome');
    td(fmt(it.arquivo.size), 'num');
    const b = document.createElement('button');
    b.className = 'botao remover'; b.title = t('zip.remover'); b.setAttribute('aria-label', t('zip.remover') + ' ' + it.nome);
    b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-fechar"/></svg>';
    b.onclick = ev => { ev.preventDefault(); fila.splice(i, 1); desenharFila(); };
    td('').appendChild(b);
    tb.appendChild(tr);
  });
  const tot = fila.reduce((s, x) => s + x.arquivo.size, 0);
  $('c_total').textContent = t('zip.total_fila', { arquivos: nArquivos(fila.length), bytes: fmt(tot) });
  // O aviso do teto aparece na FILA, antes do clique: esperar o Compactar
  // seria enviar centenas de MiB para ouvir o 413 no fim.
  const passa = fila.length > 0 && maxCorpo > 0 && tot > maxCorpo;
  $('c_teto').classList.toggle('oculto', !passa);
  if (passa) $('c_teto').textContent = t('zip.teto_fila', { teto: fmt(maxCorpo) });
  $('c_fila').classList.toggle('oculto', !fila.length);
}

// Pasta solta: o navegador entrega uma ENTRADA de diretorio, e a arvore se
// le aqui, recursiva, guardando o caminho relativo -- «pasta/sub/a.txt» vira
// o nome dentro do 7z. `readEntries` devolve em lotes: le ate vir vazio.
function lerEntrada(entrada, prefixo) {
  return new Promise(ok => {
    if (entrada.isFile) {
      entrada.file(f => ok([{ nome: prefixo + f.name, arquivo: f }]), () => ok([]));
    } else if (entrada.isDirectory) {
      const leitor = entrada.createReader();
      const todos = [];
      const lote = () => leitor.readEntries(async es => {
        if (!es.length) {
          const partes = await Promise.all(todos.map(e => lerEntrada(e, prefixo + entrada.name + '/')));
          ok(partes.flat());
        } else { todos.push(...es); lote(); }
      }, () => ok([]));
      lote();
    } else ok([]);
  });
}

async function itensDoSoltar(dt) {
  const entradas = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  // Sem a API de entradas (ou num evento sintetico), cai nos arquivos soltos.
  if (!entradas.length) return [...dt.files].map(f => ({ nome: f.name, arquivo: f }));
  return (await Promise.all(entradas.map(e => lerEntrada(e, '')))).flat();
}

function armarZona(id, aoSoltar) {
  const z = $(id);
  z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('em-cima'); });
  z.addEventListener('dragleave', ev => { if (!z.contains(ev.relatedTarget)) z.classList.remove('em-cima'); });
  z.addEventListener('drop', async ev => { ev.preventDefault(); z.classList.remove('em-cima'); aoSoltar(ev.dataTransfer); });
  z.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); z.querySelector('input').click(); } });
}
// Arquivo solto FORA das zonas nao pode fazer o navegador sair da pagina e
// abrir o arquivo no lugar dela -- perderia a fila inteira.
window.addEventListener('dragover', ev => ev.preventDefault());
window.addEventListener('drop', ev => ev.preventDefault());

armarZona('c_zona', async dt => adicionar(await itensDoSoltar(dt)));
$('c_arquivos').onchange = () => {
  adicionar([...$('c_arquivos').files].map(f => ({ nome: f.webkitRelativePath || f.name, arquivo: f })));
  $('c_arquivos').value = '';
};
$('c_limpar').onclick = ev => { ev.preventDefault(); fila = []; desenharFila(); limpar('c_res'); };

function rotularAberto() {
  const ea = $('a_escolhido');
  ea.dataset.dinamico = aberto ? '1' : '';
  ea.textContent = aberto ? aberto.name + ' · ' + fmt(aberto.size) + ' bytes' : t('zip.soltar_7z');
}
function escolherAberto(f) {
  aberto = f || null;
  ultimaLista = null;
  rotularAberto();
  $('a_tabela').classList.add('oculto'); $('a_barra').classList.add('oculto'); limpar('a_res');
}
$('a_arquivo').onchange = () => { escolherAberto($('a_arquivo').files[0]); $('a_arquivo').value = ''; if (aberto) abrir(false); };
armarZona('a_zona', dt => { const f = dt.files[0]; escolherAberto(f); if (f) abrir(false); });

// Senha errada ao compactar tranca o arquivo para sempre -- nem o 7-Zip abre.
// Por isso a senha nova se digita DUAS vezes, e a repeticao so aparece quando
// ha senha (quem compacta sem senha nao ganha campo inutil).
function ajustarConfirmacao() {
  const tem = $('c_senha').value !== '';
  $('c_conf').classList.toggle('oculto', !tem);
  if (!tem) $('c_senha2').value = '';
}
$('c_senha').oninput = ajustarConfirmacao;
function rotularOlho() {
  const b = $('c_olho'), vis = b.getAttribute('aria-pressed') === 'true';
  b.title = t(vis ? 'zip.ocultar_senha' : 'zip.mostrar_senha');
  b.setAttribute('aria-label', b.title);
}
$('c_olho').onclick = () => {
  const vis = $('c_olho').getAttribute('aria-pressed') !== 'true';
  $('c_olho').setAttribute('aria-pressed', String(vis));
  $('c_senha').type = $('c_senha2').type = vis ? 'text' : 'password';
  rotularOlho();
};

const DICA_NIVEL = { 0: 'zip.dica_0', 1: 'zip.dica_1', 3: 'zip.dica_3', 5: 'zip.dica_5', 7: 'zip.dica_7', 9: 'zip.dica_9' };
function rotularNivel() { $('c_dica').textContent = t(DICA_NIVEL[$('c_nivel').value] || 'zip.dica_5'); }
$('c_nivel').onchange = rotularNivel;

// O corpo que vai no fio: a linha de metadados mais os bytes. E a mesma conta
// do envelope(), sem montar o Blob, para recusar ANTES de enviar.
function tamanhoDoEnvelope(meta, tamanhos) {
  return new TextEncoder().encode(JSON.stringify(meta) + '\n').length + tamanhos.reduce((s, n) => s + n, 0);
}
function acimaDoTeto(meta, tamanhos) { return maxCorpo > 0 && tamanhoDoEnvelope(meta, tamanhos) > maxCorpo; }

$('compactar').onclick = async () => {
  const itens = fila.slice();
  limpar('c_res');
  if (!itens.length) { mostrar('c_res', false, t('zip.escolha_antes')); return; }
  const senha = $('c_senha').value;
  if (senha !== $('c_senha2').value) { mostrar('c_res', false, t('zip.senha_difere')); $('c_senha2').focus(); return; }
  const meta = { nivel: +$('c_nivel').value, senha, nomes_visiveis: $('c_visiveis').checked,
    arquivos: itens.map(x => ({ nome: x.nome, tamanho: x.arquivo.size, mtime: Math.floor(x.arquivo.lastModified / 1000) })) };
  const tamanhos = itens.map(x => x.arquivo.size);
  if (acimaDoTeto(meta, tamanhos)) {
    mostrar('c_res', false, t('zip.teto_antes', { bytes: fmt(tamanhoDoEnvelope(meta, tamanhos)), teto: fmt(maxCorpo) }));
    return;
  }
  $('compactar').disabled = true;
  try {
    const r = await api('/api/compactar', envelope(meta, itens.map(x => x.arquivo)), true, progC);
    const blob = r.blob;
    const tot = tamanhos.reduce((s, n) => s + n, 0);
    const feito = t('zip.feito_compactar', { arquivos: nArquivos(itens.length), antes: fmt(tot), depois: fmt(blob.size), pct: pct(blob.size, tot), ms: r.cabecalho('X-PhxZip-Ms') || '?' });
    // Conferir o que acabou de ser gravado, pelo mesmo testar da tela de
    // abrir: «gerado» diz que o servidor respondeu, «conferido» diz que o
    // arquivo abre e cada CRC bate. So entao se entrega o arquivo.
    const metaT = { senha };
    let conferido;
    if (acimaDoTeto(metaT, [blob.size])) conferido = { ok: null, txt: t('zip.nao_conferido_teto') };
    else {
      try {
        const j = await api('/api/testar', envelope(metaT, [blob]), false, progC);
        conferido = { ok: true, txt: t('zip.conferido', { n: fmt(j.entradas.length), ms: j.ms }) };
      } catch (e) {
        if (e.tipo === 'cancelado') throw e;
        conferido = { ok: false, txt: t('zip.conferir_falhou', { erro: textoDoErro(e) }) };
      }
    }
    if (conferido.ok === false) { mostrar('c_res', false, feito + ' — ' + conferido.txt); }
    else {
      baixar(blob, $('c_nome').value || 'phxzip.7z');
      mostrar('c_res', true, feito + ' — ' + conferido.txt);
      if (conferido.ok === null) $('c_res').className = 'resultado aviso';
    }
  } catch (e) { mostrar('c_res', false, textoDoErro(e)); }
  $('compactar').disabled = false;
};

async function abrir(testar) {
  const f = aberto;
  limpar('a_res');
  if (!f) { mostrar('a_res', false, t('zip.escolha_antes')); return; }
  botoesA(true);
  try {
    const j = await api(testar ? '/api/testar' : '/api/listar', envelope({ senha: $('a_senha').value }, [f]), false, progA);
    ultimaLista = j; recolhidas = recolhidasIniciais(j); desenhar(j);
    mostrar('a_res', true, testar ? t('zip.feito_testar', { n: fmt(j.entradas.length), ms: j.ms })
      : t(j.cabecalho_cifrado ? 'zip.feito_listar_cifrado' : 'zip.feito_listar', { n: fmt(j.entradas.length) }));
  } catch (e) { $('a_tabela').classList.add('oculto'); mostrar('a_res', false, textoDoErro(e)); }
  botoesA(false);
}
$('abrir').onclick = () => abrir(false);
$('a_filtro').oninput = () => { if (ultimaLista) desenhar(ultimaLista); };
$('testar').onclick = () => abrir(true);

// A listagem em ARVORE. O 7z guarda caminhos planos («a/b/c.txt»), e pasta
// nem sempre tem entrada propria -- entao a arvore nasce dos NOMES, e a pasta
// que so existe no caminho vira no implicito (sem indice, sem baixar).
let ordem = { col: 'nome', asc: true };
let recolhidas = new Set();

function montarArvore(entradas) {
  const raiz = { filhos: new Map(), caminho: '' };
  for (const e of entradas) {
    const partes = e.nome.split(/[\\/]/).filter(Boolean);
    let no = raiz;
    partes.forEach((parte, i) => {
      const ultimo = i === partes.length - 1;
      const caminho = partes.slice(0, i + 1).join('/');
      let f = no.filhos.get(parte);
      if (!f) { f = { nome: parte, caminho, filhos: new Map(), pasta: !ultimo, e: null }; no.filhos.set(parte, f); }
      if (ultimo) { f.e = e; f.pasta = f.pasta || e.pasta; }
      no = f;
    });
  }
  // Tamanho e data da pasta saem dos filhos: e o que se quer ordenar por
  // tamanho -- a pasta pesada sobe junto com os arquivos pesados.
  const somar = no => {
    let tam = 0, data = null;
    for (const f of no.filhos.values()) {
      if (f.pasta) somar(f);
      const tf = f.pasta ? f.tam : f.e.tamanho, df = f.pasta ? f.data : f.e.mtime;
      tam += tf; if (df != null && (data == null || df > data)) data = df;
    }
    no.tam = tam; no.data = data;
  };
  somar(raiz);
  return raiz;
}

function recolhidasIniciais(j) {
  // Arquivo pequeno abre inteiro; arquivo grande abre so o primeiro nivel --
  // dez mil linhas desenhadas de uma vez travam a tela e ninguem as le.
  const s = new Set();
  if (j.entradas.length > 200) {
    for (const e of j.entradas) {
      const partes = e.nome.split(/[\\/]/).filter(Boolean);
      for (let i = 1; i < partes.length; i++) s.add(partes.slice(0, i).join('/'));
    }
  }
  return s;
}

function comparar(a, b) {
  if (a.pasta !== b.pasta) return a.pasta ? -1 : 1;
  const chave = no => ({
    nome: no.nome.toLowerCase(),
    tamanho: no.pasta ? no.tam : no.e.tamanho,
    data: (no.pasta ? no.data : no.e.mtime) ?? -Infinity,
    metodo: no.e && no.e.metodos || '',
  })[ordem.col];
  const [x, y] = [chave(a), chave(b)];
  const r = typeof x === 'string' ? x.localeCompare(y, local(), { numeric: true }) : x - y;
  return (ordem.asc ? r : -r) || a.nome.localeCompare(b.nome, local(), { numeric: true });
}

function casa(no, filtro) {
  if (!filtro) return true;
  if (no.caminho.toLowerCase().includes(filtro)) return true;
  for (const f of no.filhos.values()) if (casa(f, filtro)) return true;
  return false;
}

function desenhar(j) {
  const tb = $('a_tabela').querySelector('tbody');
  tb.textContent = '';
  const filtro = $('a_filtro').value.trim().toLowerCase();
  const arqs = j.entradas.filter(e => !e.pasta);
  const bytes = arqs.reduce((s, e) => s + e.tamanho, 0);
  $('a_total').textContent = t('zip.total_arquivo', { arquivos: nArquivos(arqs.length), bytes: fmt(bytes), no7z: fmt(j.tamanho_arquivo), pct: pct(j.tamanho_arquivo, bytes) });
  $('a_barra').classList.remove('oculto');
  for (const th of $('a_tabela').querySelectorAll('th[data-ordem]')) {
    th.setAttribute('aria-sort', th.dataset.ordem === ordem.col ? (ordem.asc ? 'ascending' : 'descending') : 'none');
  }
  const linha = (no, nivel) => {
    const tr = document.createElement('tr');
    const c = (txt, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = txt; tr.appendChild(td); return td; };
    const e = no.e;
    const tipo = no.pasta ? 'pasta' : (e.cifrada ? 'cadeado' : 'doc');
    const nome = c('', 'nome');
    nome.style.paddingLeft = (4 + nivel * 18) + 'px';
    if (no.pasta) {
      // Com filtro, a pasta que tem o que casa fica aberta: esconder o
      // resultado atras de um clique seria filtrar e nao mostrar.
      const aberta = filtro ? true : !recolhidas.has(no.caminho);
      const b = document.createElement('button');
      b.className = 'seta'; b.setAttribute('aria-expanded', String(aberta));
      b.setAttribute('aria-label', t(aberta ? 'zip.recolher' : 'zip.expandir') + ' ' + no.caminho);
      b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-seta"/></svg>';
      b.onclick = () => { if (recolhidas.has(no.caminho)) recolhidas.delete(no.caminho); else recolhidas.add(no.caminho); desenhar(ultimaLista); };
      if (filtro) b.disabled = true;
      nome.appendChild(b);
    } else {
      const r = document.createElement('span'); r.className = 'recuo'; nome.appendChild(r);
    }
    // O icone mora na celula do nome e recua junto: numa coluna propria ele
    // ficava parado enquanto o nome andava, e a arvore nao se lia.
    nome.insertAdjacentHTML('beforeend', `<svg class="ic ${tipo}" aria-hidden="true"><use href="#i-${tipo}"/></svg> `);
    nome.appendChild(document.createTextNode(no.nome));
    c(fmt(no.pasta ? no.tam : e.tamanho), 'num');
    const m = c(''); if (e && e.metodos) { const s = document.createElement('span'); s.className = 'selo'; s.textContent = e.metodos; m.appendChild(s); }
    const data = no.pasta ? no.data : e.mtime;
    c(data != null ? new Date(data * 1000).toLocaleString(local(), { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '', 'data');
    const ac = c('');
    if (!no.pasta && e.seguro) {
      // Icone e nao texto: com o texto «baixar» a coluna saia cortada a
      // 1200 px (visto na captura). O rotulo continua, para leitor de tela.
      const b = document.createElement('button'); b.className = 'botao consulta mini icone';
      b.title = t('zip.baixar'); b.setAttribute('aria-label', t('zip.baixar') + ' ' + e.nome);
      b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-baixar"/></svg>';
      b.onclick = () => extrair(e); ac.appendChild(b);
    }
    tb.appendChild(tr);
    if (no.pasta && (filtro || !recolhidas.has(no.caminho))) filhos(no, nivel + 1);
  };
  const filhos = (no, nivel) => {
    for (const f of [...no.filhos.values()].filter(f => casa(f, filtro)).sort(comparar)) linha(f, nivel);
  };
  filhos(montarArvore(j.entradas), 0);
  $('a_tabela').classList.remove('oculto');
}
for (const th of document.querySelectorAll('#a_tabela th[data-ordem]')) {
  th.querySelector('button').onclick = () => {
    const col = th.dataset.ordem;
    ordem = { col, asc: ordem.col === col ? !ordem.asc : col === 'nome' };
    if (ultimaLista) desenhar(ultimaLista);
  };
}

async function extrair(e) {
  const f = aberto;
  try {
    const r = await api('/api/extrair', envelope({ senha: $('a_senha').value, indice: e.indice }, [f]), true, progA);
    baixar(r.blob, e.nome.split(/[\\/]/).pop());
  } catch (err) { mostrar('a_res', false, textoDoErro(err)); }
}

function botoesA(ocupado) { $('abrir').disabled = $('testar').disabled = $('tudo').disabled = ocupado; }

// «Extrair tudo»: UM envio do .7z, e a resposta traz a lista e os bytes
// emendados (o mesmo envelope do pedido, ao contrario). Onde o navegador
// grava pasta (File System Access), a arvore sai inteira na pasta escolhida;
// onde nao grava, cada arquivo baixa por si -- e a tela diz qual dos dois
// aconteceu, porque «extraido para a pasta» e «baixado um a um» nao sao a
// mesma promessa.
$('tudo').onclick = async () => {
  const f = aberto;
  limpar('a_res');
  if (!f) { mostrar('a_res', false, t('zip.escolha_antes')); return; }
  // A pasta se pede ANTES do envio: o navegador so abre o seletor dentro do
  // gesto do clique, e depois de um envio longo o gesto ja expirou.
  let pasta = null;
  if (window.showDirectoryPicker) {
    try { pasta = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { if (e.name === 'AbortError') { mostrar('a_res', false, t('zip.cancelado')); return; } pasta = null; }
  }
  botoesA(true);
  try {
    const r = await api('/api/extrair_tudo', envelope({ senha: $('a_senha').value }, [f]), true, progA);
    const buf = new Uint8Array(await r.blob.arrayBuffer());
    const q = buf.indexOf(10);
    const cab = JSON.parse(new TextDecoder().decode(buf.subarray(0, q)));
    const soma = cab.arquivos.reduce((s, a) => s + a.tamanho, 0);
    // O servidor manda o tamanho antes de descompactar; se um CRC quebrar no
    // meio, a resposta chega CURTA. Conta que nao fecha e recusa inteira.
    if (buf.length - (q + 1) !== soma) { const e = new Error('curta'); e.tipo = 'corrompido'; throw e; }
    let pos = q + 1;
    const pedacos = cab.arquivos.map(a => { const d = buf.subarray(pos, pos + a.tamanho); pos += a.tamanho; return [a, d]; });
    if (pasta) {
      for (const [a, d] of pedacos) {
        const partes = a.nome.split(/[\\/]/).filter(Boolean);
        let dir = pasta;
        for (const p of partes.slice(0, -1)) dir = await dir.getDirectoryHandle(p, { create: true });
        const w = await (await dir.getFileHandle(partes[partes.length - 1], { create: true })).createWritable();
        await w.write(d); await w.close();
      }
    } else {
      // Sem pasta, o nome perde a arvore; quando dois arquivos de pastas
      // diferentes tem o mesmo nome, o caminho entra no nome para um nao
      // sobrescrever o outro na pasta de downloads.
      const base = a => a.nome.split(/[\\/]/).pop();
      const conta = new Map();
      for (const [a] of pedacos) conta.set(base(a), (conta.get(base(a)) || 0) + 1);
      for (const [a, d] of pedacos) {
        baixar(new Blob([d]), conta.get(base(a)) > 1 ? a.nome.replace(/[\\/]/g, '_') : base(a));
        await new Promise(ok => setTimeout(ok, 120));
      }
    }
    let txt = t(pasta ? 'zip.feito_extrair_pasta' : 'zip.feito_extrair_um_a_um',
      { arquivos: nArquivos(cab.arquivos.length), bytes: fmt(soma), pasta: pasta ? pasta.name : '' });
    if (cab.pulados.length) txt += ' ' + t('zip.pulados', { n: fmt(cab.pulados.length), nomes: cab.pulados.map(p => p.nome).join(', ') });
    mostrar('a_res', true, txt);
  } catch (e) { mostrar('a_res', false, textoDoErro(e)); }
  botoesA(false);
};

// Tema: o escolhido fica lembrado; sem escolha, segue o sistema. O icone
// mostra PARA ONDE o clique leva (a mesma convencao do PhxSql).
function lembrado(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lembrar(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function aplicarTema(qual) {
  document.documentElement.setAttribute('data-tema', qual);
  const b = $('tema'), claro = qual === 'claro';
  b.querySelector('use').setAttribute('href', claro ? '#i-lua' : '#i-sol');
  b.title = t(claro ? 'zip.tema_escuro' : 'zip.tema_claro');
  b.setAttribute('aria-label', b.title);
}
$('tema').onclick = () => {
  const novo = document.documentElement.getAttribute('data-tema') === 'claro' ? 'escuro' : 'claro';
  lembrar('phxzip-tema', novo); aplicarTema(novo);
};
const temaInicial = () => lembrado('phxzip-tema') ||
  (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro');
aplicarTema(temaInicial());

carregarTextos().catch(() => {}).then(() => { traduzir(); rotularNivel(); rotularOlho(); aplicarTema(temaInicial()); return estado(); })
  .catch(() => mostrar('l_res', false, t('zip.rede')));
</script>
