        </tr></thead>

      </table>
    </div>

      <div class="medidor"><div class="medidor-barra" id="medidorEnvio"></div></div>
    </div>
  </div>

  <div class="bloco opcoes" id="opcoesCompactar" hidden>
    <fieldset class="grupo">
      <legend data-txt="zip.formato"></legend>
      <div class="segmentos" id="segFormato"></div>
      <p class="dica" id="dicaFormato"></p>
    </fieldset>
    <fieldset class="grupo" id="grupoNivel">
      <legend data-txt="zip.nivel"></legend>
      <div class="segmentos" id="segNivel"></div>
      <p class="dica" id="dicaNivel"></p>
    </fieldset>
    <fieldset class="grupo">
      <legend><label for="inNomePacote" data-txt="zip.nome_do_pacote"></label></legend>
      <div class="campo-nome">
        <input id="inNomePacote" class="campo dado" type="text" spellcheck="false" autocomplete="off">
        <span class="sufixo dado" id="sufixo"></span>
      </div>
    </fieldset>
    <fieldset class="grupo senhas">
      <legend id="legendaSenha"></legend>
      <div class="campo-rotulado">
        <label class="rotulo" for="inSenha" data-txt="zip.senha"></label>
        <input id="inSenha" class="campo" type="password" autocomplete="new-password" spellcheck="false">
      </div>
      <div class="campo-rotulado" id="campoSenha2">
        <label class="rotulo" for="inSenha2" data-txt="zip.confirmar_senha"></label>
        <input id="inSenha2" class="campo" type="password" autocomplete="new-password" spellcheck="false">
      </div>
      <label class="marcar"><input type="checkbox" id="ckMostrar"><span data-txt="zip.mostrar_senha"></span></label>
      <label class="marcar" id="rotuloCifrarNomes"><input type="checkbox" id="ckCifrarNomes" checked><span data-txt="zip.cifrar_nomes"></span></label>
      <p class="dica" data-txt="zip.cifra_dica"></p>
    </fieldset>
    <div class="executar">

      <ul class="porques" id="porquesCompactar"></ul>
    </div>

      <div class="pacote-acoes">
        <button type="button" class="acao consultar" id="btTestar" data-trava data-icone="testar"><span data-txt="zip.testar"></span></button>
        <button type="button" class="acao consultar" id="btBaixarTodas" data-trava data-icone="baixar"><span data-txt="zip.baixar_todas"></span></button>
        <button type="button" class="acao neutra" id="btFechar" data-icone="fechar"><span data-txt="zip.fechar_pacote"></span></button>
      </div>
    </div>

    <div class="senha-pacote" id="senhaPacote" hidden>
      <label class="rotulo" for="inSenhaPacote" data-txt="zip.senha_do_pacote"></label>
      <div class="linha-senha">
        <input id="inSenhaPacote" class="campo" type="password" autocomplete="off" spellcheck="false" aria-describedby="dicaSenhaPacote">
        <button type="button" class="acao consultar" id="btAbrirComSenha" data-trava data-icone="cadeado"><span data-txt="zip.abrir"></span></button>
      </div>
      <p class="dica" id="dicaSenhaPacote"></p>
    </div>

    <div id="avisoAbrir"></div>
    <div id="resultadoTeste" hidden></div>
    <div class="resumo" id="resumoPacote" hidden></div>

    <div class="lista" id="listaPacote" hidden>
      <div class="lista-topo">
        <h3 data-txt="zip.conteudo_do_pacote"></h3>
        <input id="inFiltro" class="campo filtro" type="search" autocomplete="off" spellcheck="false" data-txt-ph="zip.filtrar" data-txt-al="zip.filtrar">
      </div>
      <div class="rolagem">
        <table class="grade" id="gradePacote">
          <thead><tr>
            <th class="c-tipo"><span class="sr" data-txt="zip.col_tipo"></span></th>
            <th class="c-nome" data-txt="zip.col_nome"></th>
            <th class="num" data-txt="zip.col_tamanho"></th>
            <th class="num" data-txt="zip.col_compactado"></th>
            <th class="c-data" data-txt="zip.col_modificado"></th>
            <th class="c-acoes"><span class="sr" data-txt="zip.col_acoes"></span></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="vazio" id="filtroVazio" data-txt="zip.filtro_vazio" hidden></p>
      <p class="vazio" id="listaVazia" data-txt="zip.pacote_vazio" hidden></p>
    </div>
  </div>
  <div class="bloco progresso" id="progressoAbrir" hidden></div>
</section>
</main>

<!-- ============================================================ ESPIAR -->
<dialog id="espiar" aria-labelledby="espiarTitulo">
  <div class="espiar-topo">
    <div class="espiar-id">
      <p class="espiar-rotulo" data-txt="zip.espiar_titulo"></p>
      <h2 id="espiarTitulo"></h2>
    </div>
    <button type="button" class="botao-barra" id="btFecharEspiar" data-txt-al="zip.fechar" data-txt-tt="zip.fechar" data-icone="fechar"></button>
  </div>
  <div class="selos" id="espiarSelos"></div>
  <p class="espiar-disco" data-icone="cadeado"><span data-txt="zip.espiar_nada_no_disco"></span></p>
  <div class="espiar-corpo" id="espiarCorpo" tabindex="0" data-txt-al="zip.espiar_conteudo"></div>
  <div class="espiar-acoes">
    <p class="recado" id="recadoEspiar" role="status" hidden></p>
    <button type="button" class="acao consultar" id="btCopiar" data-icone="copiar"><span data-txt="zip.copiar"></span></button>
    <button type="button" class="acao consultar" id="btBaixarEspiado" data-icone="baixar"><span data-txt="zip.baixar"></span></button>
  </div>
</dialog>

<div class="soltar" id="soltar" hidden><p id="soltarTexto"></p></div>
<p class="sr" id="anuncio" aria-live="polite"></p>

<footer class="rodape">
  <p class="lema">Built to store. Engineered to scale.</p>
  <p class="garantia" data-icone="cadeado"><span data-txt="zip.garantia_disco"></span></p>
  <p class="versao dado" id="versao"></p>
</footer>
</body>
</html>
