function montarFerramentas() {
  $("#ferramentas").innerHTML = FERRAMENTAS.map((f, i) => {
    if (f === "risco") return `<div class="risco" role="separator"></div>`;
    const pendente = !!f.falta && !f.faz;
    // `rot()` deixa o editor de menu trocar o nome exibido sem mexer no que a
    // ferramenta faz.
    const rotulo = rot(`fer.${i}`, f.rot);
    return `<button class="fer${pendente ? " afazer" : ""}"
      data-f="${i}" style="color:${f.cor}"
      title="${esc(rotulo)}${pendente ? " · ainda não existe" : ""}">
      ${svg(f.ico)}<span class="rot">${esc(rotulo)}</span></button>`;
  }).join("");

  $("#ferramentas").onclick = ev => {
    const b = ev.target.closest(".fer");
    if (!b) return;
    const f = FERRAMENTAS[+b.dataset.f];
    if (!f.faz) return aindaNao(f);
    Promise.resolve().then(f.faz).catch(e => avisar(`${e}`, true));
  };
}

/** A tela do que ainda nao existe. Diz o que e, o que falta e de que depende. */
function aindaNao(f) {
  folha(f.rot, "ainda não existe — e é melhor dizer do que fingir",
    `<div class="nota">
       <p><strong>Este botão não faz nada ainda</strong>, e está aqui apagado
       de propósito: some da lista seria esconder o roteiro, e ligá-lo a um
       aviso genérico seria fingir.</p>
       <p>${esc(f.falta)}</p>
     </div>
     <p class="leg">O estado de cada pedido está em
     <code>docs/PENDENCIAS.md</code>.</p>`);
}

/* ------------------------------------------------ o que a barra liga de fato */

/* A tela do Serviço: parar e subir a porta de dados, e trocar a porta.
 *
 * O que ela NÃO faz, de propósito: derrubar o processo. Um botão que se
 * desfaz é um botão; um que não se desfaz é um alçapão — não sobraria
 * ninguém para atender o «subir». O processo continua vivo, a interface web
 * continua no ar na porta dela, e é por ela que a porta de dados volta.
 */
async function verServico() {
  const [p, s] = await Promise.all([api("ping"), api("servico")]);
  const noAr = !!s.no_ar;
  folha("Serviço",
    noAr ? "a porta de dados está aceitando conexão"
         : "a porta de dados está PARADA — a interface web continua no ar",
    `<div class="fichas">
       <div class="ficha"><div class="v" style="color:${
          noAr ? "var(--ok)" : "var(--vermelho)"}">${noAr ? "no ar" : "parada"}</div>
         <div class="r">porta de dados</div></div>
       <div class="ficha"><div class="v">${esc(s.endereco || "—")}</div>
         <div class="r">${noAr ? "escutando em" : "última porta"}</div></div>
       <div class="ficha"><div class="v">${fmt(s.conexoes ?? 0)}</div>
         <div class="r">conexões abertas</div></div>
       <div class="ficha"><div class="v">${esc(p.papel || "—")}</div>
         <div class="r">papel</div></div>
       <div class="ficha"><div class="v">${esc(s.web_ligada ? s.web : "desligada")}</div>
         <div class="r">interface web</div></div>
     </div>

     ${s.difere_do_arquivo ? `<div class="aviso">
       <p><strong>A porta de agora não é a do arquivo.</strong> O
       <code>config.json</code> diz <code>${esc(s.bind_configurado)}</code>, e o
       servidor está em <code>${esc(s.endereco || "—")}</code>. Trocar pela tela
       vale <b>até o próximo arranque</b> — esta tela não reescreve o
       <code>config.json</code>, que carrega comentários e o resto da
       configuração. Para valer sempre, mude o campo <code>bind</code> lá.</p>
     </div>` : ""}

     <h3>Trocar a porta, ou religar</h3>
     <div class="barra-acao">
       <label>Endereço<input id="svBind" value="${esc(s.endereco || s.bind_configurado || "")}"
         placeholder="127.0.0.1:5000"></label>
       <button class="botao ${noAr ? "alterar" : "incluir"}" id="btSvSubir">${
         noAr ? "Trocar para esta porta" : "Subir nesta porta"}</button>
       ${noAr ? `<button class="botao excluir" id="btSvParar">Parar a porta de dados</button>` : ""}
       <button class="botao consultar" id="btSvVer">Atualizar</button>
     </div>

     <div class="nota">
       <p><strong>Quem fica sem resposta.</strong> Ninguém que já está
       conectado: as conexões vivas seguem até elas mesmas acabarem. O que para
       é o <code>accept</code> — cliente <em>novo</em> recebe recusa de conexão,
       o mesmo que receberia com o serviço desligado. Agora há
       <b>${fmt(s.conexoes ?? 0)}</b> conexão(ões) aberta(s).</p>
       <p><strong>Como se volta se errar a porta.</strong> A porta nova é
       <em>presa antes</em> de a antiga ser solta: porta ocupada, permissão
       negada (abaixo de 1024 sem raiz) ou endereço escrito errado falham sem
       trocar nada, e o serviço continua exatamente como estava. E mesmo com a
       porta de dados parada, esta tela continua aqui — a interface web é outro
       soquete, no mesmo processo.</p>
       <p><strong>O processo não é derrubado por aqui.</strong> Para isso é o
       sistema: <code>systemctl stop phxsql</code> no Linux, ou o Gerenciador de
       Serviços no Windows.</p>
     </div>
     <p class="cores-acao"><b><i style="background:var(--acao-incluir)"></i>subir</b>
       <b><i style="background:var(--acao-alterar)"></i>trocar</b>
       <b><i style="background:var(--acao-excluir)"></i>parar</b>
       <b><i style="background:var(--acao-consultar)"></i>consultar</b></p>`);

  $("#btSvVer").onclick = () => verServico();
  const parar = $("#btSvParar");
  if (parar) parar.onclick = async () => {
    if (!confirm("Parar de aceitar conexão nova na porta de dados?\n\n"
      + "As conexões abertas continuam. Para voltar, use esta mesma tela.")) return;
    try {
      const r = await api("servico_parar");
      avisar(`porta de dados parando · ${r.conexoes_abertas} conexão(ões) aberta(s)`);
      setTimeout(verServico, 500);
    } catch (e) { avisar(`${e}`, true); }
  };
  $("#btSvSubir").onclick = async () => {
    const bind = $("#svBind").value.trim();
    if (noAr && bind && bind !== s.endereco
        && !confirm(`Trocar a porta de dados para ${bind}?\n\n`
          + `Todo cliente que fala com ${s.endereco} precisa ser reapontado.`)) return;
    try {
      const r = await api("servico_subir", { bind });
      avisar(`subindo em ${r.subindo_em}`);
      setTimeout(verServico, 600);
    } catch (e) { avisar(`${e}`, true); }
  };
}

/* ======================================================== jobs de execução
 *
 * Um job é um NOME, uma AGENDA e uma operação do protocolo que já existe. O
 * agendador do backup já era esse desenho; o que muda é qual operação roda.
 *
 * A parte que mais importa nesta tela é o campo «roda como»: o job carrega o
 * login de um usuário do cadastro e roda com o poder DAQUELE usuário, nem um
 * pingo a mais. Um agendador com poder próprio seria uma porta dos fundos com
 * hora marcada.
 */
async function telaJobs() {
  const j = await api("jobs", { historico: 40 });
  const jobs = j.jobs || [];
  const hist = j.historico || [];

  const linha = x => `<tr class="linha-job" data-n="${esc(x.nome)}">
    <td class="dado"><b>${esc(x.nome)}</b>${x.descricao
      ? `<div class="leg">${esc(x.descricao)}</div>` : ""}</td>
    <td>${x.ligado ? '<span class="pino ok">ligado</span>'
                   : '<span class="pino nao">desligado</span>'}</td>
    <td class="dado">${esc(x.agenda)}</td>
    <td class="dado">${esc(x.op)}</td>
    <td class="dado">${esc(x.usuario) || '<span class="leg">sem cadastro</span>'}</td>
    <td class="dado">${x.ultimo_ms
      ? esc(new Date(x.ultimo_ms).toLocaleString("pt-BR"))
      : "nunca rodou"}</td>
    <td>${x.vencido ? '<span class="pino mal">vencido</span>' : ""}</td>
    <td><button class="botao mini alterar bt-rodar" data-n="${esc(x.nome)}">Rodar agora</button></td>
  </tr>`;

  folha("Jobs de execução",
    `${jobs.length} job(s) · cadastro em ${esc(j.arquivo)} · corridas em ${esc(j.log)}`,
    (jobs.length
      ? tabela([{t:"nome"},{t:"estado"},{t:"agenda"},{t:"operação"},{t:"roda como"},
                {t:"última corrida"},{t:""},{t:""}], jobs, linha)
      : `<div class="vazio">nenhum job cadastrado ainda</div>`)
    + `<div class="acoes">
         <button class="botao incluir" id="btJobNovo">Novo job…</button>
         <button class="botao consultar" id="btJobVer">Atualizar</button>
       </div>
       <h3>Últimas corridas</h3>
       ${hist.length ? tabela(
          [{t:"quando"},{t:"job"},{t:"operação"},{t:"como"},{t:"resultado"},
           {t:"ms",cls:"num"},{t:"detalhe"}],
          hist, h => `<tr><td class="dado">${esc(h.quando)}</td>
            <td class="dado">${esc(h.job)}</td>
            <td class="dado">${esc(h.op)}</td>
            <td class="dado">${esc(h.usuario) || "—"}</td>
            <td>${h.ok ? '<span class="pino ok">ok</span>'
                       : '<span class="pino mal">falhou</span>'}</td>
            <td class="num">${fmt(h.duracao_ms)}</td>
            <td class="dado prof-pedido" title="${esc(h.detalhe)}">${esc(h.detalhe)}</td></tr>`)
        : `<div class="vazio">nenhuma corrida registrada</div>`}
       <div class="nota">
         <p><strong>Um job roda com o poder do usuário dele</strong>, e nem um
         pingo a mais. Usuário que sumiu do cadastro ou foi desativado
         <b>para</b> o job, com o motivo escrito — em vez de cair para uma
         sessão sem dono, que rodaria com tudo liberado.</p>
         <p><strong>O relógio acorda de 30 em 30 segundos</strong>, e só sobe se
         havia algum job ligado quando o servidor arrancou. Ligar o primeiro job
         pela tela vale a partir do próximo arranque — a tela avisa quando é o
         caso.</p>
         <p><strong>Falha entra no histórico igual</strong> ao acerto: job que
         falha calado não existe. O detalhe é o resumo da resposta — a resposta
         inteira não cabe, e uma varredura de vinte mil linhas vira
         «linhas: 20000 itens».</p>
       </div>
       <p class="cores-acao"><b><i style="background:var(--acao-incluir)"></i>novo</b>
         <b><i style="background:var(--acao-alterar)"></i>rodar / editar</b>
         <b><i style="background:var(--acao-excluir)"></i>excluir</b>
         <b><i style="background:var(--acao-consultar)"></i>consultar</b></p>`);

  $("#btJobVer").onclick = () => telaJobs();
  $("#btJobNovo").onclick = () => editarJob(null);
  // `filter`, e não `find`: cada botão precisa do próprio ouvinte. Ligar só o
  // primeiro é exatamente o defeito que o vídeo achou no `rownum`.
  $$("#painel .bt-rodar").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    await rodarJob(b.dataset.n);
  });
  $$("#painel .linha-job").forEach(tr => tr.onclick = () => editarJob(tr.dataset.n));
}

async function rodarJob(nome) {
  try {
    const r = await api("job_rodar", { nome });
    // O pedido deu certo; o JOB pode ter falhado. São duas coisas, e a tela
    // não pode dizer "pronto" quando o job voltou com erro.
    avisar(r.ok ? `job ${nome} rodou em ${r.duracao_ms} ms`
                : `job ${nome} FALHOU: ${r.detalhe}`, !r.ok);
  } catch (e) { avisar(`${e}`, true); }
  telaJobs();
}

/** As operações que fazem sentido num job, com um pedido de exemplo cada.
 *
 * Não é uma lista fechada: o campo do pedido aceita qualquer operação do
 * protocolo. Ela existe para quem não sabe de cor o nome dos campos. */
const JOBS_MODELO = [
  ["backup",     'Backup do servidor',        '{"op":"backup"}'],
  ["reindexar",  'Refazer o índice de uma tabela',
    '{"op":"reindexar","database":"Comercial","tabela":"cadastroClientes"}'],
  ["verificar",  'Conferir a integridade de uma tabela',
    '{"op":"verificar","database":"Comercial","tabela":"cadastroClientes"}'],
  ["checksum",   'Soma de verificação de uma tabela',
    '{"op":"checksum","database":"Comercial","tabela":"cadastroClientes"}'],
  ["esvaziar_lixeira", 'Esvaziar a lixeira de uma tabela',
    '{"op":"esvaziar_lixeira","database":"Comercial","tabela":"cadastroClientes"}'],
  ["ping",       'Só um pulso, para provar que o relógio anda', '{"op":"ping"}'],
];

async function editarJob(nome) {
  const [j, us] = await Promise.all([api("jobs"), api("usuarios").catch(() => [])]);
  const x = nome ? (j.jobs || []).find(a => a.nome === nome) : null;
  const porHora = !!(x && x.hora);
  const logins = (Array.isArray(us) ? us : []).filter(u => u.ativo).map(u => u.login);

  folha(x ? `Job ${x.nome}` : "Novo job",
    x ? "o nome não muda — para renomear, crie outro e apague este"
      : "letras, números, _ e - no nome · ele nasce desligado, de propósito",
    `<div class="forma-job">
       <label><span>Nome</span>
         <input id="jbNome" value="${esc(x ? x.nome : "")}" ${x ? "disabled" : ""}></label>
       <label><span>Roda como</span>
         ${logins.length
           ? `<select id="jbUsuario">${
               logins.map(l => `<option ${x && x.usuario === l ? "selected" : ""}
                 >${esc(l)}</option>`).join("")}</select>`
           : `<input id="jbUsuario" value="${esc(x ? x.usuario : "")}"
                placeholder="(este servidor não tem cadastro)">`}
         <span class="leg">o job roda com o poder deste usuário, e nem um pingo a mais</span>
       </label>
       <label class="largo"><span>Descrição</span>
         <input id="jbDesc" value="${esc(x ? x.descricao : "")}"></label>

       <label><span>Quando</span>
         <select id="jbQuando">
           <option value="cada" ${porHora ? "" : "selected"}>a cada N minutos</option>
           <option value="hora" ${porHora ? "selected" : ""}>todo dia, numa hora</option>
         </select></label>
       <label><span>A cada (min)</span>
         <input id="jbCada" type="number" min="1"
           value="${esc(x && x.cada_minutos ? x.cada_minutos : 60)}"></label>
       <label><span>Hora (HH:MM)</span>
         <input id="jbHora" value="${esc(x && x.hora ? x.hora : "")}" placeholder="03:00">
         <span class="leg">preenchida, ela manda — e o job roda uma vez por dia</span></label>

       <label class="largo"><span>Modelo de pedido</span>
         <select id="jbModelo"><option value="">— escolha para preencher abaixo —</option>
           ${JOBS_MODELO.map(([o, rot, ex]) =>
             `<option value="${esc(ex)}">${esc(o)} — ${esc(rot)}</option>`).join("")}
         </select></label>
       <label class="largo"><span>Pedido do protocolo</span>
         <textarea id="jbPedido" spellcheck="false">${
           esc(x ? JSON.stringify(x.pedido, null, 2) : '{\n  "op": "ping"\n}')}</textarea>
         <span class="leg">o mesmo objeto que a porta 5000 aceita, <b>sem</b> o
           <code>token</code> — o job não entra pela rede</span></label>

       <label class="chk largo">
         <input type="checkbox" id="jbLigado" ${x && x.ligado ? "checked" : ""}>
         <span>Ligado — o relógio passa a considerá-lo</span></label>
     </div>
     <div class="acoes">
       <button class="botao ${x ? "alterar" : "incluir"}" id="btJbGravar">${
         x ? "Gravar alterações" : "Criar o job"}</button>
       ${x ? `<button class="botao alterar" id="btJbRodar">Rodar agora</button>
              <button class="botao excluir" id="btJbApagar">Excluir job</button>` : ""}
       <button class="botao consultar" id="btJbVolta">← Jobs</button>
     </div>`);

  $("#btJbVolta").onclick = () => telaJobs();
  /* Os dois campos de agenda ficavam ativos ao mesmo tempo: quem escolhia
     «a cada N minutos» e ainda assim digitava a hora não recebia aviso nenhum
     — o valor era simplesmente ignorado na gravação. Só apareceu abrindo a
     tela. O que não vale fica desabilitado, e o olho vê. */
  const ajustarAgenda = () => {
    const porHoraAgora = $("#jbQuando").value === "hora";
    $("#jbCada").disabled = porHoraAgora;
    $("#jbHora").disabled = !porHoraAgora;
    $("#jbCada").closest("label").style.opacity = porHoraAgora ? ".45" : "1";
    $("#jbHora").closest("label").style.opacity = porHoraAgora ? "1" : ".45";
  };
  $("#jbQuando").onchange = ajustarAgenda;
  ajustarAgenda();
  $("#jbModelo").onchange = ev => {
    if (!ev.target.value) return;
    $("#jbPedido").value = JSON.stringify(JSON.parse(ev.target.value), null, 2);
  };
  const gravar = async () => {
    let pedido;
    try {
      pedido = JSON.parse($("#jbPedido").value);
    } catch (e) {
      // Analisar aqui em vez de mandar o texto: o erro de digitação aparece
      // com o nome dele, e não como «esquema inválido» vindo do servidor.
      return avisar(`o pedido não é um JSON válido: ${e.message}`, true);
    }
    const job = {
      nome: (x ? x.nome : $("#jbNome").value).trim(),
      descricao: $("#jbDesc").value.trim(),
      usuario: $("#jbUsuario").value.trim(),
      ligado: $("#jbLigado").checked,
      pedido,
    };
    if ($("#jbQuando").value === "hora") job.hora = $("#jbHora").value.trim();
    else job.cada_minutos = Number($("#jbCada").value) || 60;
    try {
      const r = await api("job_salvar", { job });
      avisar(`job ${r.salvo} gravado`);
      if (job.ligado && !r.relogio_no_ar) {
        avisar("gravado — mas o relógio de jobs não subiu neste arranque: "
             + "ele só sobe quando já há job ligado. Reinicie para o job andar sozinho.", true);
      }
      telaJobs();
    } catch (e) { avisar(`${e}`, true); }
  };
  $("#btJbGravar").onclick = gravar;
  if (x) {
    $("#btJbRodar").onclick = () => rodarJob(x.nome);
    $("#btJbApagar").onclick = async () => {
      if (!confirm(`Excluir o job ${x.nome}? O histórico das corridas dele fica.`)) return;
      try { await api("job_excluir", { nome: x.nome }); avisar(`job ${x.nome} excluído`); }
      catch (e) { return avisar(`${e}`, true); }
      telaJobs();
    };
  }
}

/* =========================================================== diagrama ER
 *
 * As chaves estrangeiras já estão declaradas e já vêm no `esquema` — o que
 * faltava era o desenho. O layout mora em `ui/diagrama-er.js`, porque é a
 * única parte da interface que é algoritmo.
 */
async function telaDiagramaER(db) {
  db = db || databaseCorrente();
  const bancos = est.bancos || await api("bancos");
  if (!db) db = bancos[0];
  if (!db) return folha("Diagrama ER", "não há database ainda",
    `<div class="vazio">crie um database primeiro</div>`);

  folha("Diagrama ER", `${esc(db)} · lendo o esquema…`,
    `<div class="centro">lendo o esquema de cada tabela…</div>`);
  const t = await api("tabelas", { database: db });
  const esquemas = [];
  for (const nome of (t.tabelas || [])) {
    // Uma tabela que este usuário não pode ler simplesmente não entra no
    // desenho -- e a contagem embaixo diz quantas ficaram de fora, em vez de
    // o diagrama fingir que o banco é menor do que é.
    try { esquemas.push(await api("esquema", { database: db, tabela: nome })); }
    catch (e) { /* sem permissão ou tabela quebrada */ }
  }
  const fora = (t.tabelas || []).length - esquemas.length;
  const r = PhxER.resumo(esquemas);
  const svg = PhxER.desenhar(esquemas);

  folha("Diagrama ER",
    `${esc(db)} · ${r.tabelas} tabela(s), ${r.ligacoes} chave(s) estrangeira(s)`,
    `<div class="barra-acao">
       <label>Database<select id="erDb">${bancos.map(b =>
         `<option ${b === db ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
       <button class="botao consultar" id="btErVer">Redesenhar</button>
     </div>
     ${svg ? `<div class="er-rolo">${svg}</div>` : `<div class="vazio">
       nenhuma tabela para desenhar</div>`}
     <p class="er-legenda">
       <b style="color:var(--laranja)">PK</b> chave primária
       <b style="color:var(--ndx)">FK</b> chave estrangeira
       <b>→</b> a seta sai do filho e chega no pai
       <b style="font-style:italic">- - →</b> aponta para fora deste database
     </p>
     ${fora > 0 ? `<div class="aviso">${fora} tabela(s) ficaram de fora do
       desenho — sem permissão de leitura, ou com o esquema ilegível.</div>` : ""}
     <div class="nota">
       <p><strong>Só o desenho, por enquanto.</strong> Arrastar caixa, criar
       tabela pelo diagrama e ligar duas colunas com o mouse são o
       <em>editor de modelo</em>, e ele é outra rodada. Dizer isso é melhor do
       que deixar a pessoa descobrir clicando e não acontecendo nada.</p>
       <p>Cada caixa mostra até ${PhxER.MEDIDAS.maxColunas} colunas, com a chave
       primeiro — o resto vira uma contagem. As colunas de sistema
       (<code>rownum</code>, <code>softdeleted</code>) não entram: elas são do
       motor, e não do modelo.</p>
       ${r.soltas ? `<p><strong>${r.soltas} chave(s) apontam para fora deste
         database.</strong> Elas aparecem penduradas, tracejadas — sumir com
         elas seria fingir que a declaração não existe.</p>` : ""}
       ${r.sem_ligacao ? `<p>${r.sem_ligacao} tabela(s) não participam de
         nenhuma chave estrangeira.</p>` : ""}
     </div>`);

  $("#btErVer").onclick = () => telaDiagramaER($("#erDb").value);
  $("#erDb").onchange = ev => telaDiagramaER(ev.target.value);
  $$("#painel .er-tabela").forEach(g => g.onclick = () =>
    abrirTabela(db, g.dataset.tabela));
}

/* ================================================ dado pessoal (LGPD/GDPR)
 *
 * A marca vive no esquema, por coluna, no campo booleano `pessoal`. Esta tela
 * só AUDITA: mostra onde as marcas estão, por base e por tabela.
 *
 * A regra que ela não pode quebrar: se o esquema deste servidor ainda não
 * traz o campo, a tela diz isso — e não «nenhum dado pessoal encontrado», que
 * seria uma mentira tranquilizadora sobre exatamente o assunto em que ela
 * custa mais caro.
 */
async function telaDadosPessoais(db) {
  const bancos = est.bancos || await api("bancos");
  const alvos = db ? [db] : bancos;
  folha("Dado pessoal", "varrendo o esquema…",
    `<div class="centro">lendo o esquema de cada tabela…</div>`);

  const achados = [];
  let colunasVistas = 0, comCampo = 0, tabelas = 0, semAcesso = 0;
  for (const base of alvos) {
    let t;
    try { t = await api("tabelas", { database: base }); }
    catch (e) { semAcesso++; continue; }
    for (const nome of (t.tabelas || [])) {
      let e;
      try { e = await api("esquema", { database: base, tabela: nome }); }
      catch (err) { semAcesso++; continue; }
      tabelas++;
      for (const c of (e.colunas || [])) {
        if (c.sistema) continue;
        colunasVistas++;
        // A diferença que decide o texto da tela: o campo AUSENTE não é o
        // mesmo que o campo `false`. Um diz «o motor ainda não sabe marcar»;
        // o outro diz «alguém olhou e disse que não é pessoal».
        if (Object.prototype.hasOwnProperty.call(c, "pessoal")) comCampo++;
        if (c.pessoal) achados.push({ base, tabela: nome, coluna: c });
      }
    }
  }

  const semSuporte = comCampo === 0;
  const bases = new Set(achados.map(a => a.base)).size;
  const tabelasComDado = new Set(achados.map(a => `${a.base}.${a.tabela}`)).size;

  folha("Dado pessoal",
    db ? `${esc(db)} · onde estão as marcas de LGPD/GDPR`
       : "todas as bases · onde estão as marcas de LGPD/GDPR",
    `<div class="fichas">
       <div class="ficha"><div class="v">${fmt(achados.length)}</div>
         <div class="r">colunas marcadas</div></div>
       <div class="ficha"><div class="v">${fmt(tabelasComDado)}</div>
         <div class="r">tabelas atingidas</div></div>
       <div class="ficha"><div class="v">${fmt(bases)}</div>
         <div class="r">bases atingidas</div></div>
       <div class="ficha"><div class="v">${fmt(tabelas)}</div>
         <div class="r">tabelas varridas</div></div>
       <div class="ficha"><div class="v">${fmt(colunasVistas)}</div>
         <div class="r">colunas varridas</div></div>
     </div>

     <div class="barra-acao">
       <label>Alcance<select id="lgDb">
         <option value="">todas as bases</option>
         ${bancos.map(b => `<option ${b === db ? "selected" : ""}>${esc(b)}</option>`).join("")}
       </select></label>
       <button class="botao consultar" id="btLgVer">Varrer de novo</button>
     </div>

     ${semSuporte ? `<div class="aviso mal">
       <p><strong>O esquema deste servidor ainda não traz a marca
       <code>pessoal</code> por coluna.</strong> Nenhuma das
       ${fmt(colunasVistas)} colunas varridas respondeu esse campo — nem
       <code>true</code>, nem <code>false</code>.</p>
       <p>Por isso esta tela <b>não</b> diz «nenhum dado pessoal encontrado»:
       ela não sabe. Campo ausente e campo <code>false</code> são coisas
       diferentes, e confundir os dois num relatório de LGPD é exatamente onde
       a confusão custa mais caro. Quando a marca entrar no cadastro de campos
       — ao lado de <code>caption</code>, <code>descricao</code> e
       <code>mascara</code> —, esta tela passa a listar sozinha.</p>
     </div>` : ""}

     ${achados.length
       ? tabela([{t:"base"},{t:"tabela"},{t:"coluna"},{t:"rótulo"},{t:"tipo"},
                 {t:"papel"},{t:"descrição"}],
           achados, a => `<tr class="linha-lg" data-db="${esc(a.base)}"
             data-tab="${esc(a.tabela)}">
             <td class="dado">${esc(a.base)}</td>
             <td class="dado">${esc(a.tabela)}</td>
             <td class="dado"><b>${esc(a.coluna.nome)}</b></td>
             <td><span class="rot-dado">${esc(a.coluna.rotulo || a.coluna.caption || "—")}</span></td>
             <td class="dado">${esc(a.coluna.tipo)}</td>
             <td>${a.coluna.primaria ? '<span class="pino">PK</span> ' : ""}${
                  a.coluna.estrangeira ? '<span class="pino ndx">FK</span> ' : ""}${
                  (a.coluna.nos_indices || []).length
                    ? `<span class="pino reg">indexada</span>` : ""}</td>
             <td>${esc(a.coluna.descricao || "")}</td></tr>`)
       : (semSuporte ? "" : `<div class="vazio">nenhuma coluna marcada como dado
           pessoal nas ${fmt(tabelas)} tabelas varridas</div>`)}

     ${semAcesso ? `<div class="aviso">${semAcesso} tabela(s) ou base(s) não
       puderam ser lidas com este login — uma auditoria feita por quem não vê
       tudo não é uma auditoria completa, e é melhor a tela dizer.</div>` : ""}

     <div class="nota">
       <p><strong>Coluna indexada com dado pessoal merece um olhar a mais.</strong>
       A chave vai para o <code>.ndx</code> em claro, e o índice é um segundo
       lugar onde o dado existe — apagar a linha do <code>.reg</code> não é a
       mesma coisa que tirá-lo de todo lugar.</p>
       <p>Esta tela <b>lê</b> a marca. Marcar e desmarcar é no cadastro de
       campos da tabela, junto com <code>caption</code>,
       <code>descricao</code> e <code>mascara</code>.</p>
     </div>`);

  $("#btLgVer").onclick = () => telaDadosPessoais($("#lgDb").value || null);
  $("#lgDb").onchange = ev => telaDadosPessoais(ev.target.value || null);
  $$("#painel .linha-lg").forEach(tr => tr.onclick = () =>
    abrirTabela(tr.dataset.db, tr.dataset.tab));
}

/* A tela da replicação. Ela mostra a POSIÇÃO de cada tabela, que é o número
   que diz se a réplica está em dia — e não só a configuração, que era tudo o
   que ela sabia mostrar enquanto a replicação não existia. */
async function verReplicacao() {
  const c = await api("config");
  const portas = c.replicacao_portas || {};
  const papel = c.papel || "isolado";
  const comImagem = !!c.imagem_da_linha;
  const origens = c.origens || [];

  // A posição de cada tabela de cada banco: é o que a réplica compara com a do
  // source para saber o que falta. Sai do cabeçalho do .log, sem ler evento.
  let posicoes = "";
  try {
    // `bancos` responde uma LISTA de nomes, e nao um objeto com `bancos`
    // dentro. Ler o campo errado devolvia vazio, e a tela dizia "nenhuma
    // tabela ainda" numa réplica que tinha a tabela na árvore ao lado.
    const bancos = await api("bancos");
    const linhas = [];
    for (const b of bancos) {
      const nome = b.nome || b;
      const r = await api("posicao", { database: nome });
      for (const [tab, d] of Object.entries(r.tabelas || {}))
        linhas.push({ db: nome, tabela: tab, eventos: d.eventos, registros: d.registros });
    }
    posicoes = linhas.length
      ? `<h3 class="sub">Posição do diário</h3>` + tabela(
          [{t:"database"},{t:"tabela"},{t:"registros",cls:"num"},{t:"eventos",cls:"num"}],
          linhas, l => `<tr><td class="dado">${esc(l.db)}</td>
            <td class="dado">${esc(l.tabela)}</td>
            <td class="num">${fmt(l.registros)}</td>
            <td class="num">${fmt(l.eventos)}</td></tr>`)
        + `<p class="leg">O evento N <b>é</b> a posição N — não há GTID a inventar.
           Uma réplica guarda um número por tabela e pede o que falta.</p>`
      : `<p class="leg">Nenhuma tabela ainda.</p>`;
  } catch (e) {
    posicoes = `<p class="leg">Sem permissão para ler a posição
      (a operação <code>posicao</code> exige <b>replicar</b>).</p>`;
  }

  const fichas = `<div class="fichas">
       <div class="ficha"><div class="v">${esc(papel)}</div>
         <div class="r">papel</div></div>
       <div class="ficha"><div class="v">${comImagem ? "ligada" : "desligada"}</div>
         <div class="r">imagem da linha</div></div>
       <div class="ficha"><div class="v">${esc(portas.envio || "porta de dados")}</div>
         <div class="r">envio</div></div>
       <div class="ficha"><div class="v">${origens.length || "—"}</div>
         <div class="r">origens</div></div>
     </div>`;

  const deOrigens = origens.length
    ? `<h3 class="sub">De onde esta réplica puxa</h3>` + tabela(
        [{t:"origem"},{t:"endereço"},{t:"usuário"},{t:"databases"},{t:"a cada",cls:"num"}],
        origens, o => `<tr><td class="dado">${esc(o.nome)}</td>
          <td class="dado">${esc(o.host)}:${esc(String(o.porta))}</td>
          <td>${esc(o.usuario || "—")}</td>
          <td>${esc((o.databases || []).join(", ") || "todos")}</td>
          <td class="num">${esc(String(o.reconectar_em))}s</td></tr>`)
      + `<p class="leg">Uma <b>thread por origem</b>: uma origem lenta ou caída
         não segura as outras. A senha não fica em claro nem viaja — a réplica
         se autentica pelo desafio-resposta, com a chave derivada do
         <code>senha_hash</code>.</p>`
    : "";

  const aviso = papel === "source" && !comImagem
    ? `<div class="nota"><p><strong>Este servidor é source e está com a imagem
       da linha DESLIGADA.</strong> O diário grava que a linha mudou, não grava
       para quê, e as réplicas não terão o que aplicar. Ligue
       <code>replicacao.imagem_da_linha</code> no <code>config.json</code>.</p></div>`
    : papel === "isolado"
    ? `<div class="nota"><p><strong>Servidor isolado.</strong> Para virar origem,
       ponha <code>"replicacao": {"papel": "source"}</code> no
       <code>config.json</code> — a imagem da linha liga junto. Para virar
       réplica, <code>"papel": "replica"</code> com uma origem, e
       <code>"somente_leitura": true</code>.</p></div>`
    : `<div class="nota">
       <p><strong>O rowid é o que faz a réplica ser fiel.</strong> O
       <code>.reg</code> nunca reaproveita slot e o rowid é sempre o próximo.
       Se a réplica aplicar todos os eventos na ordem, e mais ninguém escrever
       nela, os rowids saem <b>iguais</b> aos do master — sem transmitir nem
       negociar nada. Se não saírem, ela divergiu, e a replicação
       <b>para ali</b> em vez de espalhar.</p>
       <p>Medido com quatro servidores: master a 18.773 linhas/s, réplica
       aplicando 4.273 eventos/s, atraso de 1,3 a 2,1 s até as três, e o
       retrato SHA-256 das quatro tabelas idêntico no fim.</p>
     </div>`;

  folha("Replicação", `papel ${papel}`, fichas + aviso + deOrigens + posicoes);
}

/* O PROFILER: o que está chegando pela porta, antes de virar dado.
 *
 * A tela atualiza sozinha enquanto está ligada, pedindo só o que ainda não
 * viu (`desde_serial`) — rebaixar o anel inteiro a cada segundo seria a tela
 * gerando mais tráfego do que a que ela observa. */
let profTimer = null;
let profVisto = 0;
let profLinhas = [];

async function verProfiler() {
  clearInterval(profTimer);
  profVisto = 0; profLinhas = [];
  const bancos = await api("bancos").catch(() => []);
  const e = await api("profiler", { max: 200 }).catch(() => ({ ligado:false, filtro:{} }));
  const f = e.filtro || {};

  folha("Profiler", "o que chega pela porta 5000, antes de virar dado",
    `<div class="acoes prof-topo">
       <label class="mini-campo">Database
         <select id="pfDb"><option value="">— todos —</option>
           ${(bancos || []).map(b => { const n = b.nome || b;
             return `<option ${f.database === n ? "selected" : ""}>${esc(n)}</option>`; }).join("")}
         </select></label>
       <label class="mini-campo">Usuário
         <input id="pfUsr" placeholder="— todos —" value="${esc(f.usuario || "")}"></label>
       <label class="mini-campo">Operação
         <input id="pfOp" placeholder="— todas —" value="${esc(f.operacao || "")}"></label>
       <label class="mini-campo">Guardar
         <input id="pfTeto" type="number" min="10" max="20000" value="${esc(String(e.guardar || 500))}"></label>
       <label class="mini-campo largo">Arquivo de log (.txt) — opcional
         <input id="pfArq" placeholder="/var/log/phxsql-monitor.txt"
                value="${esc(e.arquivo || "")}"></label>
       <label class="mini-campo caixa"><input type="checkbox" id="pfEscrita"
         ${f.so_escrita ? "checked" : ""}> só escrita</label>
       <button class="botao consultar" id="pfLigar">${e.ligado ? "Reiniciar" : "Ligar"}</button>
       <button class="botao excluir" id="pfParar" ${e.ligado ? "" : "disabled"}>Parar</button>
       <button class="botao secundario" id="pfLimpar">Limpar</button>
     </div>
     <div id="pfEstado"></div>
     <div class="rolo"><table class="prof">
       <thead><tr><th>hora</th><th>ip</th><th>usuário</th><th>operação</th>
         <th>alvo</th><th class="num">ms</th><th></th><th class="num">bytes</th>
         <th>pedido, como chegou</th></tr></thead>
       <tbody id="pfCorpo"></tbody></table></div>
     <div class="nota">
       <span class="t">A senha não passa por aqui</span>
       <p>O pedido é mostrado como chegou pelo soquete — <b>menos</b> os campos
       sensíveis. <code>senha</code>, <code>token</code>, <code>prova</code> e
       os outros viram <code>"***"</code> <b>antes</b> de encostar na memória
       ou no arquivo. Pedido que não é JSON válido não vira texto nenhum: vira
       o tamanho dele, porque não há como tapar um campo numa estrutura que
       não se lê. Há teste que falha se uma senha aparecer.</p>
       <p>O ponto de captura é uma linha depois do <code>read_line</code> e uma
       antes do despacho: <b>nada foi gravado ainda</b>. Por isso o pedido que
       trava aparece na lista como «em curso» — que é justamente o que se
       quer achar.</p>
     </div>`);

  $("#pfLigar").onclick = async () => {
    try {
      const r = await api("profiler_ligar", {
        database: $("#pfDb").value, usuario: $("#pfUsr").value.trim(),
        operacao: $("#pfOp").value.trim(), so_escrita: $("#pfEscrita").checked,
        arquivo: $("#pfArq").value.trim(), guardar: +$("#pfTeto").value || 500,
      });
      avisar(r.arquivo ? `observando · gravando em ${r.arquivo}` : "observando");
      profVisto = 0; profLinhas = [];
      verProfiler();
    } catch (err) { avisar(String(err), true); }
  };
  $("#pfParar").onclick = async () => {
    const r = await api("profiler_desligar");
    avisar(`parado — ${fmt(r.observados)} evento(s) observados`);
    verProfiler();
  };
  $("#pfLimpar").onclick = async () => {
    await api("profiler_limpar"); profVisto = 0; profLinhas = [];
    $("#pfCorpo").innerHTML = ""; 
  };

  const pintar = d => {
    const est = $("#pfEstado"); if (!est) return false;
    est.innerHTML = d.ligado
      ? `<div class="aviso bem">observando desde <b>${esc(d.desde)}</b> ·
           ${fmt(d.observados)} evento(s)${d.esquecidos ? ` · ${fmt(d.esquecidos)} saíram do anel` : ""}
           ${d.arquivo ? ` · gravando em <code>${esc(d.arquivo)}</code>` : " · só em memória"}</div>`
      : `<div class="aviso">parado. Escolha os filtros e clique em <b>Ligar</b>.</div>`;
    return d.ligado;
  };

  const atualizar = async () => {
    let d;
    try { d = await api("profiler", { max: 200, desde_serial: profVisto }); }
    catch { clearInterval(profTimer); return; }
    if (!$("#pfCorpo")) { clearInterval(profTimer); return; }   // saiu da tela
    pintar(d);
    for (const ev of (d.eventos || []).slice().reverse()) {
      profVisto = Math.max(profVisto, ev.serial);
      profLinhas.unshift(ev);
    }
    if (profLinhas.length > 300) profLinhas.length = 300;
    $("#pfCorpo").innerHTML = profLinhas.map(ev => {
      const estado = ev.ok === null || ev.ok === undefined
        ? `<span class="pino">em curso</span>`
        : ev.ok ? `<span class="pino ok">ok</span>`
                : `<span class="pino mal" title="${esc(ev.erro || "")}">erro</span>`;
      return `<tr class="${ev.ok === false ? "prof-mal" : ""}">
        <td class="dado">${esc((ev.quando || "").slice(11))}</td>
        <td class="dado">${esc(ev.ip)}</td>
        <td>${esc(ev.usuario || "—")}</td>
        <td class="dado"><b>${esc(ev.op)}</b></td>
        <td class="dado">${esc(ev.database ? (ev.tabela ? ev.database + "." + ev.tabela : ev.database) : "—")}</td>
        <td class="num">${ev.ms === null || ev.ms === undefined ? "—" : fmt(ev.ms)}</td>
        <td>${estado}</td>
        <td class="num">${fmt(ev.bytes)}</td>

function montarMenu() {
  const bar = $("#menubar");
  bar.innerHTML = MENUS.map(([nomeOriginal, letra, itens], i) => {
    // O editor de menu troca o texto; a LETRA do atalho continua a de fabrica,
    // senao trocar um nome mudaria a tecla debaixo do dedo de quem ja aprendeu.
    const nome = rot(`menu.${i}`, nomeOriginal);
    const rotulo = letra && nome.includes(letra)
      ? nome.replace(letra, `<u>${letra}</u>`)
      : `<u>${nome[0]}</u>${nome.slice(1)}`;
    const linhas = itens.map((it, j) => {
      if (it === "sep") return `<div class="sep" role="separator"></div>`;
      const off = it.quando && !it.quando();
      return `<button class="item" role="menuitem" data-m="${i}" data-i="${j}"
        ${off ? "disabled" : ""}><span class="ico">${it.ico || ""}</span
        ><span class="rot">${esc(rot(`menu.${i}.${j}`, it.rot))}</span
        ><span class="tecla">${it.tecla || ""}</span></button>`;
    }).join("");
    return `<div class="menu" data-m="${i}">
      <button class="titulo" role="menuitem" aria-haspopup="true"
              aria-expanded="false" data-m="${i}">${rotulo}</button>
      <div class="lista" role="menu" aria-label="${esc(nome)}">${linhas}</div>
    </div>`;
  }).join("");
}

/** Acende e apaga os itens conforme o estado de agora.
 *
 * Atualiza o `disabled` dos botoes que ja existem, em vez de refazer o
 * `innerHTML` da barra. Refazer parecia mais simples e tinha um defeito
 * sutil: o clique que abria o menu destruia o proprio elemento clicado, o
 * `ev.target` virava um no solto, e o `closest("#menubar")` do
 * fechar-ao-clicar-fora devolvia `null` -- entao o menu fechava no mesmo
 * clique que o abriu. So apareceu no teste de navegador. */
function atualizarItens() {
  $$(".menubar .item").forEach(b => {
    const entrada = MENUS[+b.dataset.m][2][+b.dataset.i];
    b.disabled = !!(entrada.quando && !entrada.quando());
  });
}

let menuAberto = null;

function fecharMenu() {
  if (menuAberto === null) return;
  const m = $(`.menubar .menu[data-m="${menuAberto}"]`);
  if (m) {
    m.classList.remove("aberto");
    m.querySelector(".titulo").setAttribute("aria-expanded", "false");
  }
  menuAberto = null;
}

function abrirMenu(i) {
  if (menuAberto === i) return fecharMenu();
  fecharMenu();
  // O "cinza porque nao ha tabela aberta" tem de refletir o estado de AGORA,
  // e nao o de quando a pagina carregou.
  atualizarItens();
  const m = $(`.menubar .menu[data-m="${i}"]`);
  if (!m) return;
  m.classList.add("aberto");
  m.querySelector(".titulo").setAttribute("aria-expanded", "true");
  menuAberto = i;
}

function itensVisiveis(i) {
  return [...$$(`.menubar .menu[data-m="${i}"] .item:not(:disabled)`)];
}

function ligarMenu() {
  montarMenu();
  const bar = $("#menubar");

  bar.addEventListener("click", ev => {
    const t = ev.target.closest(".titulo");
    if (t) { abrirMenu(+t.dataset.m); return; }
    const it = ev.target.closest(".item");
    if (!it || it.disabled) return;
    const entrada = MENUS[+it.dataset.m][2][+it.dataset.i];
    fecharMenu();
    Promise.resolve().then(entrada.faz).catch(e => avisar(`${e}`, true));
  });

  // Passar o mouse por outro titulo com um menu aberto troca de menu, como
  // em qualquer barra de menu que ja se usou.
  bar.addEventListener("mouseover", ev => {
    if (menuAberto === null) return;
    const t = ev.target.closest(".titulo");
    if (t && +t.dataset.m !== menuAberto) abrirMenu(+t.dataset.m);
  });

  document.addEventListener("click", ev => {
    if (!ev.target.closest("#menubar")) fecharMenu();
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && menuAberto !== null) {
      fecharMenu();
      ev.preventDefault();
      return;
    }
    // Alt + letra abre o menu correspondente.
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey) {
      const i = MENUS.findIndex(([n, l]) => l.toLowerCase() === ev.key.toLowerCase());
      if (i >= 0) {
        abrirMenu(i);
        const [primeiro] = itensVisiveis(i);
        if (primeiro) primeiro.focus();
        ev.preventDefault();
        return;
      }
    }
    if (menuAberto === null) return;

    const itens = itensVisiveis(menuAberto);
    const at = itens.indexOf(document.activeElement);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      const passo = ev.key === "ArrowDown" ? 1 : -1;
      const alvo = itens[(at + passo + itens.length) % itens.length] || itens[0];
      if (alvo) alvo.focus();
      ev.preventDefault();
    } else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      const passo = ev.key === "ArrowRight" ? 1 : -1;
      const i = (menuAberto + passo + MENUS.length) % MENUS.length;
      abrirMenu(i);
      const [primeiro] = itensVisiveis(i);
      if (primeiro) primeiro.focus();
      ev.preventDefault();
    }
  });
}

/* ------------------------------------------------------- atalhos globais */
function ligarAtalhos() {
  document.addEventListener("keydown", ev => {
    if (!$("#app").classList.contains("ativo")) return;
    if (ev.target.matches("input, textarea, select")) return;

    if (ev.key === "F5") { ev.preventDefault(); atualizarVista(); return; }
    if (ev.ctrlKey && (ev.key === "b" || ev.key === "B")) {
      ev.preventDefault(); backupAgora(); return;
    }
    if (ev.altKey && ev.key === "1") { ev.preventDefault(); irPara("painel"); return; }
    if (ev.altKey && ev.key === "2" && est.atual) { ev.preventDefault(); irAba("estrutura"); return; }
    if (ev.altKey && ev.key === "3" && est.atual) { ev.preventDefault(); irAba("conteudo"); return; }
    if (ev.altKey && ev.key === "4") { ev.preventDefault(); viewDatabaseAtual(); return; }
    if (ev.altKey && ev.key === "5") { ev.preventDefault(); gerirTabelasAtual(); return; }
    if (ev.altKey && ev.key === "6") { ev.preventDefault(); gerirDatabase(); return; }
    if (ev.altKey && ev.key === "7") { ev.preventDefault(); telaPivot(); }
  });
}

function irAba(qual) {

/** Mostra um resultado numa folha simples, sem abas.
 *
 * NAO limpa `est.atual` de proposito. Limpava, e isso apagava qual tabela
 * estava aberta: carregar a tabela na RAM pelo menu mostrava uma folha, a
 * folha esquecia a tabela, e a ferramenta de consulta abria com o database
 * vazio -- o erro saia com uma barra solta, `/naoexiste`. Quem escolhe uma
 * tabela na arvore continua com ela escolhida; o que muda e o que esta na
 * tela. */
function folha(titulo, subtitulo, corpoHtml) {
  $("#abas").innerHTML = "";
  // Trocar o `innerHTML` troca o conteudo, nao o elemento: um `onclick` que a
  // tela anterior tenha pendurado no proprio `#painel` continuaria ali e
  // dispararia nesta. Ja aconteceu -- a gestao do banco levava o clique das
  // telas seguintes.
  $("#painel").onclick = null;
  // E o mesmo caso do onclick: o relogio do monitor continuaria batendo numa
  // tela que nao tem mais onde desenhar.
  pararMonitor();
  $("#titulo").textContent = titulo;
  $("#subtitulo").textContent = subtitulo || "";
  $("#painel").innerHTML = corpoHtml;
}

///
/// Depende da ORDEM de propósito: aqui a ordem de digitação é o dado, e duas
/// tabelas com as mesmas linhas em ordem diferente não são a mesma tabela.
async function checksumTabela(db, tab) {
  db = db || (est.atual || {}).db;
  tab = tab || (est.atual || {}).tab;
  if (!db || !tab) return avisar("escolha uma tabela primeiro", true);
  folha(`Soma de verificação de ${tab}`, "lendo…", `<div class="centro">lendo…</div>`);
  let r;
  try { r = await api("checksum", { database: db, tabela: tab }); }
  catch (e) { return folha(`Soma de verificação de ${tab}`, "", `<div class="aviso mal">${esc(String(e))}</div>`); }
  folha(`Soma de verificação de ${esc(db)}.${esc(tab)}`,
    "para comparar duas cópias sem transportar as duas",
    `<div class="fichas">
       ${ficha(`<code>${esc(r.checksum)}</code>`, "soma", "64 bits, em hexadecimal")}
       ${ficha(fmt(r.linhas), "linhas vivas")}
       ${ficha(fmt(r.slots), "slots", "inclui os excluídos")}
       ${ficha(fmt(r.ms), "ms")}
     </div>
     <div class="aviso"><b>Serve para responder «estas duas tabelas são a
       mesma?»</b> sem transportar as duas — conferir uma réplica contra a
       origem, ou provar que um backup restaurado ficou igual. O
       <code>conferir-backup</code> compara <em>arquivo</em>, que é mais forte
       do que preciso: dois <code>.reg</code> podem diferir no enchimento e ter
       o mesmo dado.</div>
     <div class="aviso"><b>A conta depende da ordem.</b> É de propósito: aqui a
       ordem de digitação <em>é</em> o dado, e duas tabelas com as mesmas linhas
       em ordem diferente não são a mesma tabela. Slot excluído não entra —
       se entrasse, restaurar um backup daria outro número só porque os buracos
       caem em outro lugar.</div>
     <div class="acoes">
       <button class="botao secundario" id="btVoltaCk">← Gerir tabelas</button>
     </div>`);
  $("#btVoltaCk").onclick = () => gerirTabelasAtual();
}

async function reindexarTabela() {
  const { db, tab } = est.atual;
  if (!confirm(`Recriar os índices de ${tab} a partir do .reg?\n\nO .ndx é refeito do zero.`)) return;
  const r = await api("reindexar", { database: db, tabela: tab });
  avisar(`índices de ${tab} refeitos`);
  folha(`Reindex de ${tab}`, "o .ndx foi recriado a partir do .reg",
        `<pre class="dado">${esc(JSON.stringify(r, null, 1))}</pre>`);
}

async function repararTabela() {
  const { db, tab } = est.atual;
  if (!confirm(`Reparar ${tab} pelo espelho .bkp?\n\nCada slot é conferido nos dois lados.`)) return;
  const r = await api("reparar", { database: db, tabela: tab });
  folha(`Reparo de ${tab}`, "cada slot conferido no .reg e no .bkp",
        fichasDe(r, [["conferidos","conferidos"],["reparados","reparados"],
                     ["perdidos","perdidos"]]) +
        (r.perdidos ? `<div class="nota">Há ${r.perdidos} slot(s) perdido(s) dos dois lados.</div>` : ""));
}

async function carregarNaMemoria() {
  const { db, tab } = est.atual;
  const r = await api("memoria_carregar", { database: db, tabela: tab });
  avisar(`${tab} está na RAM`);
  folha(`${tab} em memória`, "a consulta deixa de tocar o disco",
        `<pre class="dado">${esc(JSON.stringify(r, null, 1))}</pre>`);
}

async function liberarDaMemoria() {
  const { db, tab } = est.atual;
  const r = await api("memoria_liberar", { database: db, tabela: tab });
  avisar(`${tab} saiu da RAM`);
  await verResidentes();
  return r;
}

async function verResidentes() {
  const r = await api("memoria");
  const linhas = r.tabelas || r || [];
  folha("Tabelas em memória", "carregadas na RAM · a consulta não toca o disco",
    Array.isArray(linhas) && linhas.length
      ? tabela([{t:"tabela"},{t:"linhas",cls:"num"},{t:"bytes",cls:"num"},{t:"carregada em"}],
          linhas, t => `<tr><td class="dado">${esc(t.tabela || t.nome || "—")}</td>
            <td class="num">${esc(String(t.linhas ?? "—"))}</td>
            <td class="num">${esc(String(t.bytes ?? "—"))}</td>
            <td class="dado">${esc(String(t.carregada_em ?? "—"))}</td></tr>`)
      : `<div class="centro">nenhuma tabela na RAM</div>`);
}

async function verIps() {
  const r = await api("ips");
  const linhas = Array.isArray(r) ? r : (r.ips || []);
  folha("De onde vêm", "resumo do acessos.log por IP",
    linhas.length
      ? tabela([{t:"IP"},{t:"acessos",cls:"num"},{t:"recusados",cls:"num"},{t:"último"}],
          linhas, i => `<tr><td class="dado">${esc(i.ip)}</td>
            <td class="num">${esc(String(i.acessos ?? 0))}</td>
            <td class="num">${esc(String(i.recusados ?? 0))}</td>
            <td class="dado">${esc(String(i.ultimo ?? "—"))}</td></tr>`)
      : `<div class="centro">nenhum acesso registrado</div>`);
}

/* O que cada ajuste de `recursos` faz, em uma linha.
 *
 * Fica aqui e não no servidor porque é TEXTO DE TELA: o servidor devolve o
 * valor, e explicar para gente é trabalho da tela. O que não pode é a lista
 * envelhecer calada — por isso o campo que o servidor mandar e que não estiver
 * aqui aparece assim mesmo, com a explicação em branco, em vez de sumir. */
const DIZ_RECURSO = {
  durabilidade:       ["quando o gravado vai de fato para o disco",
                       "por_operacao é seguro e 20× mais lento; por_lote é o padrão"],
  lote_operacoes:     ["gravações por janela de sincronização", ""],
  lote_milissegundos: ["duração máxima da janela", "um relógio de fundo fecha quando ninguém grava"],
  cache_paginas:      ["páginas do .ndx em RAM, por tabela aberta",
                       "4 KiB cada; 2.048 dão 8 MiB. Vale 2,4× na inserção"],
  carga_prazo_min:    ["minutos que um BULKINSERT dura sem ser renovado",
                       "a segunda rede contra reserva órfã — a primeira é a queda da conexão"],
  memoria_max_mb:     ["teto das tabelas residentes (SelectMemory)", "zero = sem teto"],
  threads:            ["linhas de execução do trabalho dividido", "zero = um por núcleo"],
  cpu_percentual:     ["quantos núcleos o trabalho dividido usa", "não é cota do sistema operacional"],
  nucleos_efetivos:   ["quantos núcleos isso dá nesta máquina", "calculado, não configurado"],
  conexoes_max:       ["soquetes simultâneos aceitos", ""],
  usuarios_max:       ["logins DIFERENTES ao mesmo tempo", "zero = sem teto; é o que uma licença por posto conta"],
};

async function verConfig() {
  const c = await api("config");
  const r = c.recursos || {};

  // A lista de cargas exige administrar. Quem não tem vê a tela sem ela, em
  // vez de ver a tela quebrada.
  let cargas = null;
  try { cargas = await api("cargas"); } catch (e) { /* sem poder: segue */ }

  const linhasRec = Object.entries(r).map(([k, v]) => {
    const diz = DIZ_RECURSO[k] || ["", ""];
    return `<tr>
      <td class="dado"><b>${esc(k)}</b></td>
      <td class="num">${esc(String(v))}</td>
      <td>${esc(diz[0])}${diz[1] ? `<br><span class="leg">${esc(diz[1])}</span>` : ""}</td>
    </tr>`;
  }).join("");

  const linhasCargas = (cargas && cargas.cargas || []).map(x => `<tr>
      <td class="dado"><b>${esc(x.database)}.${esc(x.tabela)}</b></td>
      <td class="dado">${esc(x.usuario || "—")}</td>
      <td class="num">${esc(String(x.ligacao))}</td>
      <td class="dado">${esc(x.desde)}</td>
      <td class="num">${fmt(Math.round(x.expira_em_s))} s</td>
    </tr>`).join("");

  folha("Configuração", "o config.json como o servidor o entendeu · o token nunca sai",
    `<h3 class="secao">Recursos</h3>
     <p class="leg">O que o servidor pode consumir e — o mais importante —
       <b>quando</b> o que foi gravado vai de fato para o disco.</p>
     ${tabela([{t:"campo"},{t:"valor",cls:"num"},{t:"o que faz"}],
              [0], () => linhasRec)}

     <h3 class="secao">Cargas em andamento</h3>
     ${cargas === null
       ? `<div class="nota"><p>A lista de cargas exige <b>administrar</b>.</p></div>`
       : (cargas.total
          ? `${tabela([{t:"tabela"},{t:"usuário"},{t:"ligação",cls:"num"},
                       {t:"desde"},{t:"expira em",cls:"num"}], [0], () => linhasCargas)}
             <p class="leg">Enquanto reservada, a tabela recusa todo mundo com
               <code>EM_CARGA</code> — inclusive a leitura. Solta na queda da
               conexão, ou quando o prazo vence.</p>`
          : `<p class="leg">Nenhuma tabela reservada agora. Um
              <code>BULKINSERT(true)</code> pela porta de dados reserva uma, e
              a carga inteira passa a valer um <code>fsync</code> só.</p>`)}

     <h3 class="secao">O arquivo inteiro, como o servidor o leu</h3>
     <pre class="dado">${esc(JSON.stringify(c, null, 1))}</pre>`);
}

function lembrar(chave, valor) {
  try { localStorage.setItem(chave, valor); } catch {}
}
function lembrado(chave) {
  try { return localStorage.getItem(chave); } catch { return null; }
}

function aplicarTema(qual) {
  const claro = qual === "claro";
  document.documentElement.setAttribute("data-tema", claro ? "claro" : "escuro");
  // O icone mostra PARA ONDE o clique leva, nao onde se esta: no escuro
  // aparece o sol, porque clicar acende.
  $("#btTema").textContent = claro ? TEMAS.escuro : TEMAS.claro;
  $("#btTema").title = claro ? "Mudar para o tema escuro" : "Mudar para o tema claro";
  lembrar("phxsql-tema", claro ? "claro" : "escuro");
}

const sistemaClaro = () =>
  window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;

aplicarTema(lembrado("phxsql-tema") || (sistemaClaro() ? "claro" : "escuro"));
$("#btTema").onclick = () =>
  aplicarTema(document.documentElement.getAttribute("data-tema") === "claro"
    ? "escuro" : "claro");
