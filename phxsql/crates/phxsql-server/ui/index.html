/* ------------------------------------------------------------- partições */

/** As faixas de rowid de cada volume, calculadas — nao adivinhadas.
 *
 * O volume sai de uma DIVISAO, entao a faixa de cada arquivo e exata e nao
 * precisa perguntar nada ao disco:
 *   volume = (rowid-1) / registros_por_arquivo + 1  */
function volumesDe(e) {
  const pag = e.paginacao;
  if (!pag || !pag.registros_por_arquivo) return [];
  const larg = pag.digitos || 3;
  const total = Math.max(Number(e.slots) || 0, 0);
  const nome = v => `${e.tabela}_${String(v).padStart(larg, "0")}.reg`;

  // Na alfanumérica os baldes vêm PRONTOS do servidor, com quantas linhas cada
  // um tem. Calcular aqui daria errado: `slots` nesta partição é a marca
  // d'água — o maior rowid que já existiu —, e não uma contagem. Dividir a
  // marca d'água pelo teto por letra diria que o balde A tem 36 mil linhas.
  if (pag.baldes && pag.baldes.length) {
    return pag.baldes.map(b => ({
      volume: b.volume, arquivo: b.arquivo, letra: b.letra, existe: b.existe,
      de: b.primeiro_rowid,
      ate: b.primeiro_rowid + pag.registros_por_arquivo - 1,
      usados: b.registros,
    }));
  }

  // Na particao por periodo o volume NAO sai de conta: ele corta quando o
  // calendario vira, e so o servidor sabe quando isso aconteceu. As
  // fronteiras vem prontas no `esquema`; calcular aqui daria o numero errado
  // -- e dava: quatro meses apareciam como um volume so.
  if (e.volumes && e.volumes.length) {
    return e.volumes.map((v, i) => {
      const prox = e.volumes[i + 1];
      const ate = prox ? prox.primeiro_rowid - 1 : total;
      return { volume: v.volume, arquivo: nome(v.volume), periodo: v.periodo,
               de: v.primeiro_rowid, ate,
               usados: Math.max(0, ate - v.primeiro_rowid + 1) };
    });
  }

  const rpa = pag.registros_por_arquivo;
  const quantos = Math.max(1, Math.ceil(total / rpa));
  const out = [];
  for (let v = 1; v <= quantos; v++) {
    const de = (v - 1) * rpa + 1;
    const ate = v * rpa;
    out.push({ volume:v, arquivo: nome(v),
      de, ate, usados: Math.max(0, Math.min(total, ate) - de + 1) });
  }
  return out;
}

async function verParticoes(db, tab) {
  const e = await api("esquema", { database: db, tabela: tab });
  const pag = e.paginacao;

  if (!pag) {
    folha(`Partições de ${tab}`, `${db} · esta tabela não é paginada`,
      `<div class="nota">
         <p><strong>Arquivo único.</strong> Tudo mora em
         <code>${esc(tab)}.reg</code>, sem sufixo numérico.</p>
         <p>A paginação é decidida na <em>criação</em> e não se muda depois: ela
         é o que transforma o rowid em endereço, e trocar o divisor mudaria o
         endereço de cada registro já gravado. Para paginar esta tabela seria
         preciso criar outra já paginada e copiar as linhas — o que refaz os
         rowids e quebra a ordem de digitação.</p>
       </div>
       <div class="acoes">
         <button class="botao secundario" id="btVoltarGer">← Gestão de ${esc(tab)}</button>
       </div>`);
    return ligarVoltarGestao(db, tab);
  }

  const vols = volumesDe(e);
  const porLetra = pag.modo === "letra";
  const porPeriodo = pag.modo && pag.modo !== "quantidade" && !porLetra;
  const gb = n => (n / (1024 * 1024 * 1024)).toFixed(2);
  const comLinhas = vols.filter(v => v.usados > 0).length;
  folha(`Partições de ${tab}`,
    `${db} · ${porLetra
        ? `${comLinhas} de ${vols.length} baldes com linha · pela primeira letra de ${pag.coluna}`
        : `${vols.length} volume(s) do .reg · ${
            porPeriodo ? `corta ${pag.modo}, pela coluna ${pag.coluna}` : "corta por quantidade"}`}`,
    `<div class="fichas">
       <div class="ficha"><div class="v">${esc(porLetra ? "alfanumérica" : porPeriodo ? pag.modo : "por faixa")}</div>
         <div class="r">regra de corte</div>
         <div class="u">${porLetra || porPeriodo ? esc(`pela coluna ${pag.coluna}`) : "por quantidade"}</div></div>
       <div class="ficha"><div class="v">${esc(String(pag.registros_por_arquivo))}</div>
         <div class="r">${porLetra ? "teto POR LETRA" : porPeriodo ? "teto por volume" : "registros por arquivo"}</div></div>
       <div class="ficha"><div class="v">${pag.max_arquivos ? esc(String(pag.max_arquivos)) : "∞"}</div>
         <div class="r">teto de volumes</div></div>
       <div class="ficha"><div class="v">${esc(String(pag.capacidade || "—"))}</div>
         <div class="r">capacidade</div><div class="u">registros no total</div></div>
       <div class="ficha"><div class="v">${esc(gb(pag.bytes_por_arquivo || 0))} GiB</div>
         <div class="r">volume dos externos</div><div class="u">.bin, .memo, .log</div></div>
     </div>` +
    tabela([{t:"volume",cls:"num"},{t:"arquivo"},
            ...(porPeriodo ? [{t:"período que o abriu"}] : []),
            ...(porLetra ? [{t:"existe"}] : []),
            {t:"do rowid",cls:"num"},{t:"até o rowid",cls:"num"},{t:"slots usados",cls:"num"}],
      vols, v => `<tr${porLetra && !v.usados ? ' class="balde-vazio"' : ""}>
        <td class="num dado">${v.volume}${porLetra ? ` <b>${esc(v.letra)}</b>` : ""}</td>
        <td class="dado"><code>${esc(v.arquivo)}</code></td>
        ${porPeriodo ? `<td class="dado">${esc(v.periodo || "—")}</td>` : ""}
        ${porLetra ? `<td>${v.existe ? "sim" : "<span class=\"leg\">ainda não</span>"}</td>` : ""}
        <td class="num">${v.de}</td><td class="num">${v.ate}</td>
        <td class="num">${v.usados}</td></tr>`) +
    `<div class="nota">
       ${porLetra ? `
       <p><strong>Um arquivo por letra inicial de
       <code>${esc(pag.coluna)}</code>.</strong> A linha vai para o arquivo
       dela, e o endereço continua saindo de uma conta:
       <code>rowid = (balde − 1) × ${esc(String(pag.registros_por_arquivo))} + slot</code>.
       O balde que nunca recebeu linha não ganha arquivo — os 37 estão previstos,
       nem todos existem.</p>
       <p><strong>O teto é por letra, e não da tabela.</strong> Num cadastro
       brasileiro o <code>_S</code> enche muito antes do <code>_K</code>: quem
       enche primeiro derruba a inserção daquela letra, com as outras 36 ainda
       com espaço. É a conta a fazer ao dimensionar.</p>
       <p><strong>A ordem de digitação está no <code>rownum</code>.</strong>
       Aqui o rowid diz em que <em>arquivo</em> a linha está, e não quando ela
       chegou — a leitura sai em ordem alfabética de balde. A ordem de chegada
       é a coluna de sistema, e é por ela que a grade pagina.</p>
       ` : ""}
       ${porPeriodo ? `
       <p><strong>Aqui as faixas não são conta.</strong> O volume corta quando o
       período da coluna <code>${esc(pag.coluna)}</code> vira — ou quando enche,
       o que vier primeiro. Cada volume grava no próprio cabeçalho o rowid em
       que começou, e achar o volume de um rowid é uma busca binária nessa
       tabela pequena, em vez de uma divisão.</p>
       <p><strong>A linha atrasada não volta.</strong> Um lançamento de janeiro
       digitado em março entra no volume de março: a ordem de digitação é
       sagrada, e voltar seria escrever no meio de um arquivo já fechado. Por
       isso o período de um volume é <em>o período em que ele abriu</em>.</p>`
       : `
       <p><strong>Estas faixas são conta, não busca.</strong>
       <code>volume = (rowid−1) ÷ ${esc(String(pag.registros_por_arquivo))} + 1</code>,
       e o resto da divisão é o slot dentro do volume. É por isso que paginar
       não custa nada na leitura.</p>`}
       <p>O <code>.ndx</code> <em>não</em> se parte: ele já guarda rowid global,
       e nenhuma linha do código de índice sabe que volume existe.</p>
       <p><strong>Não dá para editar isto depois.</strong> Mudar o divisor mudaria
       o endereço de cada registro já gravado. Ele se escolhe na criação.</p>
     </div>
     <div class="acoes">
       <button class="botao secundario" id="btVoltarGer">← Gestão de ${esc(tab)}</button>
     </div>`);
  ligarVoltarGestao(db, tab);
}

function ligarVoltarGestao(db, tab) {
  const b = $("#btVoltarGer");
  if (b) b.onclick = () => gerirTabela(db, tab);
}

/* ------------------------------------------- duplicar, reparar, reindexar */

async function duplicarTabelaPara(db, tab) {
  const destino = prompt(
    `Duplicar ${tab} com que nome?\n\n`
    + `Os cinco arquivos são copiados byte a byte: a cópia nasce com os MESMOS `
    + `rowids e na MESMA ordem de digitação.`,
    `${tab}_copia`);
  if (!destino || !destino.trim()) return;
  const r = await api("duplicar_tabela",
    { database: db, tabela: tab, destino: destino.trim() });
  avisar(`${tab} duplicada em ${r.destino} · ${r.arquivos} arquivo(s)`);
  return gerirTabelas(db);
}

async function repararTabelaDe(db, tab) {
  if (!confirm(`Reparar ${tab} pelo espelho .bkp?\n\nCada slot é conferido nos dois lados.`)) return;
  const r = await api("reparar", { database: db, tabela: tab });
  folha(`Reparo de ${tab}`, `${db} · cada slot conferido no .reg e no .bkp`,
    fichasDe(r, [["conferidos","conferidos"],["reparados","reparados"],
                 ["perdidos","perdidos"]]) +
    (r.perdidos ? `<div class="nota">Há ${r.perdidos} slot(s) perdido(s) dos dois
       lados — nem o .reg nem o .bkp têm CRC válido para eles.</div>` : "") +
    `<div class="acoes">
       <button class="botao secundario" id="btVoltarGer">← Gestão de ${esc(tab)}</button>
     </div>`);
  ligarVoltarGestao(db, tab);
}

async function reindexarTabelaDe(db, tab) {
  if (!confirm(`Reparar o índice de ${tab}?\n\nO .ndx é jogado fora e refeito do zero a partir do .reg.`)) return;
  const r = await api("reindexar", { database: db, tabela: tab });
  avisar(`índices de ${tab} refeitos`);
  folha(`Índice de ${tab} refeito`, `${db} · a árvore foi reconstruída lendo o .reg`,
    `<pre class="dado">${esc(JSON.stringify(r, null, 1))}</pre>
     <div class="acoes">
       <button class="botao secundario" id="btVoltarGer">← Gestão de ${esc(tab)}</button>
     </div>`);
  ligarVoltarGestao(db, tab);
}

/* --------------------------------------------------------------- excluir */

/** Exigir o nome digitado nao e cerimonia: um clique errado aqui apaga cinco
 *  arquivos e nao ha desfazer. O servidor exige o mesmo, entao a tela nao e a
 *  unica guarda -- e a primeira. */
async function excluirTabelaDe(db, tab) {
  const digitado = prompt(
    `EXCLUIR a tabela ${tab} de ${db}.\n\n`
    + `Isto apaga o .reg, o .ndx, o .bin, o .memo, o .log e o espelho .bkp — `
    + `todos os volumes de cada um. Não há desfazer, e não existe lixeira.\n\n`
    + `Para confirmar, digite o nome da tabela:`);
  if (digitado === null) return;
  if (digitado.trim() !== tab) {
    return avisar(`nome não confere: a tabela não foi excluída`, true);
  }
  const r = await api("excluir_tabela",
    { database: db, tabela: tab, confirmar: tab });
  est.atual = null;
  avisar(`${tab} excluída · ${(r.arquivos_apagados || []).length} arquivo(s) apagados`);
  await montarArvore(false);
  return gerirTabelas(db);
}

/* ----------------------------------------------------------- nova tabela */

/** Quantos volumes cabem num sufixo de N digitos: `_999` para tres.
 *
 * Nao e detalhe de tela. Zero volumes de teto seria "infinito", e infinito
 * nao existe aqui: o volume 1000 com tres digitos nao teria nome de arquivo. */
const tetoDoSufixo = digitos => Math.pow(10, Math.min(9, Math.max(1, digitos))) - 1;

/** Como cada regra de particao corta o volume, em uma linha. */
const PARTICOES = [
  ["quantidade", "por faixa de quantidade", "volume novo a cada N registros — o endereço sai de divisão"],
  ["letra",      "alfanumérica (A–Z, 0–9)", "um arquivo por letra inicial: Clientes_A.reg … Clientes_Outros.reg"],
  ["mensal",     "mensal",                  "volume novo quando o mês vira"],
  ["bimestral",  "bimestral",               "jan-fev, mar-abr, mai-jun, jul-ago, set-out, nov-dez"],
  ["semestral",  "semestral",               "jan-jun e jul-dez"],
  ["anual",      "anual",                   "volume novo a cada ano"],
];

/** Os tipos que podem carregar a data da particao. */
const TIPOS_DATA = ["Date", "DateTime"];

/** Os tipos que servem de REFERENCIA na particao alfanumerica.
 *
 * `Bin` e `Memo` ficam de fora, e nao por gosto: o valor deles mora fora do
 * slot, e o balde precisa ser decidido ANTES de a linha ser gravada -- ler o
 * `.memo` para saber em que arquivo gravar seria a ordem invertida. */
const TIPOS_REFERENCIA = t => !/^(Bin|Memo)$/.test(String(t || ""));

/** O formulario de criacao: colunas e indices montados linha a linha.
 *
 * O indice aponta a coluna pelo NOME e nao pela posicao, porque posicao muda
 * quando alguem reordena e nome nao. */
function telaNovaTabela(db) {
  est.rascunho = est.rascunho || {
    dig: 3,
    particao: "quantidade",
    colunas: [
      { nome:"id", tipo:"Sequence", obrigatoria:true, caption:"Código",
        descricao:"", mascara:"" },
      { nome:"nome", tipo:"Str(60)", obrigatoria:false, caption:"",
        descricao:"", mascara:"" },
    ],
    indices: [{ nome:"porId", colunas:"id", unico:true, primario:true }],
  };
  desenharNovaTabela(db);
}

/** A linha de um campo na grade do cadastro.
 *
 * O `id` aparece apagado e nao se digita: ele e sorteado pelo motor na
 * criacao. Mostrar mesmo assim tem razao -- e por ele que uma tela ou um
 * relatorio se referem a coluna, e quem for escrever essa integracao precisa
 * ve-lo. */
function linhaDeCampo(c, i, opcoesTipo) {
  return `<tr>
    <td class="num"><span class="pos">${i + 1}</span></td>
    <td><input class="c-nome" data-i="${i}" value="${esc(c.nome)}" placeholder="nome_no_disco"></td>
    <td><input class="c-caption" data-i="${i}" value="${esc(c.caption || "")}" placeholder="rótulo de tela"></td>
    <td><select class="c-tipo" data-i="${i}">${opcoesTipo(c.tipo)}</select></td>
    <td><input class="c-mascara" data-i="${i}" value="${esc(c.mascara || "")}" placeholder="@N-11.2"></td>
    <td class="num"><input type="checkbox" class="c-obrig" data-i="${i}" ${c.obrigatoria ? "checked" : ""}></td>
    <td><input class="c-desc" data-i="${i}" value="${esc(c.descricao || "")}" placeholder="para que serve"></td>
    <td><button type="button" class="mini perigo c-rm" data-i="${i}">remover</button></td>
  </tr>`;
}

function desenharNovaTabela(db) {
  const r = est.rascunho;
  const opcoesTipo = v => TIPOS.map(([t, d]) =>
    `<option value="${esc(t)}"${t === v ? " selected" : ""}>${esc(t)} — ${esc(d)}</option>`
  ).join("");

  const porLetra = r.particao === "letra";
  const porPeriodo = r.particao && r.particao !== "quantidade" && !porLetra;
  const colunasData = r.colunas.filter(c => TIPOS_DATA.includes(c.tipo) && c.nome);
  const colunasRef = r.colunas.filter(c => c.nome && TIPOS_REFERENCIA(c.tipo));
  const nomesCol = r.colunas.filter(c => c.nome).map(c => c.nome);

  // A chave primaria e um indice marcado. Mostrar quais colunas a compoem
  // aqui, e nao so na grade de indices, porque e a pergunta que quem cadastra
  // campo faz: "qual campo e a chave?".
  const pk = r.indices.find(x => x.primario && x.nome);
  const colsDaPk = pk ? pk.colunas.split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean) : [];

  folha("Nova tabela", `${db} · sete arquivos nascem juntos`,
    `<form class="criar" id="formNovaTab" autocomplete="off">
       <div class="bloco">
         <label class="largo"><span>nome da tabela</span>
           <input id="nt_nome" placeholder="cadastroClientes" value="${esc(r.nome || "")}"></label>
         <label class="largo"><span>schema
             <em>(vazio = na raiz do database; a pasta nasce junto se faltar)</em></span>
           <input id="nt_schema" placeholder="vendas" value="${esc(r.schema || "")}"></label>
       </div>

       <h3 class="secao">Campos
         <button type="button" class="mini" id="nt_addCol">+ campo</button>
         <em>o <code>id</code> de cada campo é sorteado na criação e nunca muda —
         é por ele que telas e relatórios apontam para a coluna</em></h3>
       <div class="rolo"><table class="montar campos"><thead><tr>
         <th class="num">#</th><th>nome</th><th>caption</th><th>tipo e tamanho</th>
         <th>máscara <em>(picture)</em></th><th class="num">obrig.</th>
         <th>descrição</th><th></th>
       </tr></thead><tbody id="nt_cols">${
         r.colunas.map((c, i) => linhaDeCampo(c, i, opcoesTipo)).join("")}</tbody></table></div>

       ${colsDaPk.length ? `<p class="leg chave">Chave primária:
         <b>${colsDaPk.map(esc).join(" + ")}</b>${colsDaPk.length > 1 ? " — composta" : ""}
         · declarada no índice <code>${esc(pk.nome)}</code></p>`
        : `<p class="leg chave sem">Sem chave primária. Marque um índice como
           primário abaixo — é o que as chaves estrangeiras das outras tabelas
           vão apontar.</p>`}

       <h3 class="secao">Índices e chaves
         <button type="button" class="mini" id="nt_addIdx">+ índice</button>
         <em>a coluna vai por nome; aceita “cidade desc” e “nome nocase”</em></h3>
       <div class="rolo"><table class="montar"><thead><tr>
         <th>nome</th><th>colunas</th><th class="num">único</th>
         <th class="num">primária</th><th></th>
       </tr></thead><tbody id="nt_idxs">${r.indices.map((x, i) => `
         <tr><td><input class="i-nome" data-i="${i}" value="${esc(x.nome)}"></td>
             <td><input class="i-cols" data-i="${i}" value="${esc(x.colunas)}"
                        placeholder="${esc(nomesCol.slice(0, 2).join(", ") || "cidade desc, limite")}"></td>
             <td class="num"><input type="checkbox" class="i-unico" data-i="${i}" ${x.unico ? "checked" : ""}></td>
             <td class="num"><input type="radio" name="nt_pk" class="i-pk" data-i="${i}" ${x.primario ? "checked" : ""}></td>
             <td><button type="button" class="mini perigo i-rm" data-i="${i}">remover</button></td>
         </tr>`).join("")}</tbody></table></div>

       <h3 class="secao">Exclusão
         <label class="chk"><input type="checkbox" id="nt_motivo_obrig"
           ${r.motivo_obrigatorio ? "checked" : ""}> exigir motivo escrito</label></h3>
       <p class="leg">Toda tabela nasce com a coluna de sistema
         <code>softdeleted</code>: excluir <b>marca</b> a linha, que some das
         listas e continua inteira no <code>.reg</code>, e dá para restaurar.
         Quem manda apagar de vez tem a linha guardada no <code>.trash</code>
         antes de o slot sair, e o motivo vai para o <code>.reason</code> com a
         data, a hora e quem foi.<br>
         Marcada, esta caixa faz o motor <b>recusar</b> qualquer exclusão desta
         tabela sem uma frase escrita. Vale para tabela cujo apagamento alguém
         vai ter de justificar depois — e não para tabela de rascunho, onde
         obrigar só ensina todo mundo a digitar um ponto.</p>

       <h3 class="secao">Partição
         <label class="chk"><input type="checkbox" id="nt_particionada"
           ${r.particionada ? "checked" : ""}> tabela particionada</label></h3>

       ${r.particionada ? `
       <div class="bloco">
         <label class="largo"><span>como o volume corta</span>
           <select id="nt_regra">${PARTICOES.map(([k, rot, diz]) =>
             `<option value="${k}"${k === r.particao ? " selected" : ""}>${esc(rot)} — ${esc(diz)}</option>`
           ).join("")}</select></label>

         ${porLetra ? `
         <label class="largo"><span>coluna de referência
             <em>(a primeira letra dela decide o arquivo; precisa ser obrigatória)</em></span>
           <select id="nt_pcol">${
             colunasRef.length
               ? colunasRef.map(c => `<option value="${esc(c.nome)}"${
                   c.nome === r.particao_coluna ? " selected" : ""}>${esc(c.nome)}${
                   c.obrigatoria ? "" : " — atenção: aceita nulo"}</option>`).join("")
               : `<option value="">— nenhuma coluna serve de referência —</option>`
           }</select></label>` : ""}

         ${porPeriodo ? `
         <label class="largo"><span>coluna de data que decide o período
             <em>(precisa ser <code>Date</code> ou <code>DateTime</code> e obrigatória)</em></span>
           <select id="nt_pcol">${
             colunasData.length
               ? colunasData.map(c => `<option value="${esc(c.nome)}"${
                   c.nome === r.particao_coluna ? " selected" : ""}>${esc(c.nome)}${
                   c.obrigatoria ? "" : " — atenção: aceita nulo"}</option>`).join("")
               : `<option value="">— nenhuma coluna de data no cadastro acima —</option>`
           }</select></label>` : ""}

         <label><span>${porLetra ? "teto de registros POR LETRA"
                        : porPeriodo ? "teto de registros por volume" : "registros por arquivo"}
             <em>${porLetra ? "num cadastro brasileiro o _S enche muito antes do _K"
                   : porPeriodo ? "corta antes se o período render demais" : "0 = arquivo único"}</em></span>
           <input id="nt_pag" inputmode="numeric" placeholder="0" value="${esc(String(r.pag ?? 0))}"></label>
         ${porLetra ? `<p class="leg">O sufixo é a <b>letra</b>, e os volumes são
           <b>37</b> — A a Z, 0 a 9 e <code>Outros</code>. Nenhum dos dois se
           escolhe: são o formato desta partição.</p>` : `
         <label><span>dígitos do sufixo <em>(3 dá <code>_001</code>)</em></span>
           <input id="nt_dig" inputmode="numeric" placeholder="3" value="${esc(String(r.dig ?? 3))}"></label>
         <label><span>teto de volumes <em>(0 = o que couber no sufixo)</em></span>
           <input id="nt_max" inputmode="numeric" placeholder="${esc(String(tetoDoSufixo(r.dig ?? 3)))}"
                  value="${esc(String(r.max ?? 0))}"></label>`}
       </div>

       ${porLetra ? `<div class="nota"><p><strong>A ordem de digitação muda de
         campo.</strong> A linha vai para o arquivo da letra dela, então duas
         linhas digitadas em seguida caem em arquivos diferentes e o
         <code>rowid</code> deixa de crescer com a chegada — ele passa a dizer
         em que <em>arquivo</em> a linha está. A ordem de chegada continua
         inteira na coluna de sistema <code>rownum</code>, e é por ela que a
         grade pagina.</p>
         <p>Alterar a coluna de referência depois é <strong>recusado</strong>:
         mudaria o arquivo em que a linha mora, e com ele o rowid, que é a
         identidade dela em todo índice. Para mudar, exclua e insira de novo.</p>
         </div>` : ""}

       ${gradeDeParticoes(r, porPeriodo)}
       ` : `<p class="leg">Sem partição, a tabela é um arquivo único:
         <code>${esc(r.nome || "tabela")}.reg</code>, sem sufixo.</p>`}
     </form>

     <div class="acoes">
       <button class="botao" id="nt_criar">Criar tabela</button>
       <button class="botao secundario" id="nt_voltar">← Tabelas de ${esc(db)}</button>
       <span class="leg" id="nt_recado"></span>
     </div>

     <div class="nota">
       <p><strong>A partição entra agora e não muda depois.</strong> Ela decide
       como o rowid vira endereço; trocá-la mais tarde mudaria o endereço de
       cada registro já gravado.</p>
       <p><code>Sequence</code> deixado em branco na inclusão é numerado pelo
       motor; <code>Uuid</code> aceita a palavra <code>novo</code> e gera um v7,
       que é crescente e por isso cai sempre na folha mais à direita da árvore.</p>
     </div>`);

  ligarNovaTabela(db);
}

/** A grade que explica a regra de corte escolhida, com exemplo.
 *
 * Nao e enfeite: a diferenca entre "por faixa" e "mensal" e o que decide se o
 * endereco sai de divisao ou de busca, e quem escolhe precisa ver isso antes
 * de gravar -- porque depois nao muda. */
function gradeDeParticoes(r, porPeriodo) {
  const por = +r.pag || 0;
  const dig = r.dig ?? 3;
  const teto = +r.max || tetoDoSufixo(dig);
  const sufixo = n => `_${String(n).padStart(dig, "0")}`;

  if (!porPeriodo) {
    if (!por) return `<div class="nota">Informe quantos registros cabem em cada
      arquivo — sem esse número não há como cortar o volume.</div>`;
    return `<div class="rolo"><table class="montar"><thead><tr>
        <th class="num">volume</th><th>arquivo</th><th class="num">do rowid</th>
        <th class="num">até o rowid</th></tr></thead><tbody>${
        [1, 2, 3].map(v => `<tr><td class="num dado">${v}</td>
          <td class="dado"><code>${esc(r.nome || "tabela")}${sufixo(v)}.reg</code></td>
          <td class="num">${(v - 1) * por + 1}</td><td class="num">${v * por}</td></tr>`).join("")}
        <tr><td class="num dado">…</td><td class="dado">…</td>
          <td class="num">…</td><td class="num">…</td></tr>
        <tr><td class="num dado">${teto}</td>
          <td class="dado"><code>${esc(r.nome || "tabela")}${sufixo(teto)}.reg</code></td>
          <td class="num">${(teto - 1) * por + 1}</td><td class="num">${teto * por}</td></tr>
      </tbody></table></div>
      <div class="nota"><p><strong>O endereço é conta, não busca:</strong>
      <code>volume = (rowid−1) ÷ ${por} + 1</code>. Capacidade total:
      <b>${(teto * por).toLocaleString("pt-BR")}</b> registros.</p></div>`;
  }

  const regra = PARTICOES.find(p => p[0] === r.particao) || PARTICOES[1];
  const exemplos = {
    mensal:    ["2026-01", "2026-02", "2026-03"],
    bimestral: ["2026-B1 (jan-fev)", "2026-B2 (mar-abr)", "2026-B3 (mai-jun)"],
    semestral: ["2026-S1 (jan-jun)", "2026-S2 (jul-dez)", "2027-S1 (jan-jun)"],
    anual:     ["2026", "2027", "2028"],
  }[r.particao] || [];

  return `<div class="rolo"><table class="montar"><thead><tr>
      <th class="num">volume</th><th>arquivo</th><th>período que o abre</th>
      </tr></thead><tbody>${exemplos.map((p, i) => `<tr>
        <td class="num dado">${i + 1}</td>
        <td class="dado"><code>${esc(r.nome || "tabela")}${sufixo(i + 1)}.reg</code></td>
        <td class="dado">${esc(p)}</td></tr>`).join("")}
      <tr><td class="num dado">…</td><td class="dado">…</td>
        <td class="dado">e assim por diante, até ${teto} volumes</td></tr>
    </tbody></table></div>
    <div class="nota">
      <p><strong>${esc(regra[1])}:</strong> ${esc(regra[2])}. O volume também
      corta quando enche${por ? ` — o teto de ${por} registros vale igual` : ""},
      para um período movimentado não estourar o arquivo.</p>
      <p><strong>A linha atrasada não volta.</strong> Um lançamento de janeiro
      digitado em março entra no volume de março. A ordem de digitação é
      sagrada: voltar significaria escrever no meio de um arquivo já fechado, e
      o rowid deixaria de crescer com o arquivo.</p>
      <p>Por isso o período de um volume é <em>o período em que ele abriu</em>,
      e um volume pode conter linhas de períodos anteriores que chegaram
      depois. Quem quiser todos os lançamentos de janeiro usa o índice pela
      data, que é para isso que ele existe.</p>
    </div>`;
}

/** Le a tela de volta para o rascunho e liga os botoes. */
function ligarNovaTabela(db) {
  const r = est.rascunho;

  const lerForm = () => {
    r.nome = $("#nt_nome").value.trim();
    r.schema = $("#nt_schema").value.trim();
    r.particionada = $("#nt_particionada").checked;
    r.motivo_obrigatorio = $("#nt_motivo_obrig").checked;
    if ($("#nt_regra")) r.particao = $("#nt_regra").value;
    if ($("#nt_pcol")) r.particao_coluna = $("#nt_pcol").value;
    if ($("#nt_pag")) r.pag = +$("#nt_pag").value || 0;
    if ($("#nt_dig")) r.dig = Math.min(9, Math.max(1, +$("#nt_dig").value || 3));
    if ($("#nt_max")) r.max = +$("#nt_max").value || 0;
    r.colunas = $$("#nt_cols tr").map(tr => ({
      nome: tr.querySelector(".c-nome").value.trim(),
      caption: tr.querySelector(".c-caption").value.trim(),
      tipo: tr.querySelector(".c-tipo").value,
      mascara: tr.querySelector(".c-mascara").value.trim(),
      obrigatoria: tr.querySelector(".c-obrig").checked,
      descricao: tr.querySelector(".c-desc").value.trim(),
    }));
    r.indices = $$("#nt_idxs tr").map(tr => ({
      nome: tr.querySelector(".i-nome").value.trim(),
      colunas: tr.querySelector(".i-cols").value.trim(),
      unico: tr.querySelector(".i-unico").checked,
      primario: tr.querySelector(".i-pk").checked,
    }));
  };
  const refazer = () => { lerForm(); desenharNovaTabela(db); };

  $("#nt_addCol").onclick = () => {
    lerForm();
    r.colunas.push({ nome:"", tipo:"Str(60)", obrigatoria:false,
                     caption:"", descricao:"", mascara:"" });
    desenharNovaTabela(db);
  };
  $("#nt_addIdx").onclick = () => {
    lerForm();
    r.indices.push({ nome:"", colunas:"", unico:false, primario:false });
    desenharNovaTabela(db);
  };
  $$("#painel .c-rm").forEach(b => b.onclick = () => {
    lerForm(); r.colunas.splice(+b.dataset.i, 1); desenharNovaTabela(db);
  });
  $$("#painel .i-rm").forEach(b => b.onclick = () => {
    lerForm(); r.indices.splice(+b.dataset.i, 1); desenharNovaTabela(db);
  });

  // O que muda a FORMA da tela redesenha; o resto não, senão o campo perde o
  // foco a cada tecla.
  $("#nt_particionada").onchange = refazer;
  if ($("#nt_regra")) $("#nt_regra").onchange = refazer;
  // Marcar primária desmarca as outras (é um `radio`) e reacende a linha de
  // resumo da chave.
  $$("#painel .i-pk").forEach(b => b.onchange = refazer);
  // Trocar o tipo de um campo pode criar ou tirar uma coluna de data, o que
  // muda a lista da partição.
  $$("#painel .c-tipo").forEach(b => b.onchange = refazer);
  $("#nt_voltar").onclick = ev => { ev.preventDefault(); gerirTabelas(db); };

  $("#nt_criar").onclick = async ev => {
    ev.preventDefault();
    lerForm();
    const rec = $("#nt_recado");
    if (!r.nome) return avisar("dê um nome à tabela", true);
    const cols = r.colunas.filter(c => c.nome);
    if (!cols.length) return avisar("a tabela precisa de ao menos uma coluna", true);

    const pedido = {
      database: db, tabela: r.nome,
      ...(r.schema ? { schema: r.schema } : {}),
      colunas: cols.map(c => ({
        nome: c.nome, tipo: c.tipo, obrigatoria: c.obrigatoria,
        caption: c.caption || "", descricao: c.descricao || "", mascara: c.mascara || "",
      })),
      indices: r.indices.filter(x => x.nome && x.colunas).map(x => ({
        nome: x.nome, unico: x.unico, primario: x.primario,
        colunas: x.colunas.split(",").map(s => s.trim()).filter(Boolean),
      })),
      motivo_obrigatorio: !!r.motivo_obrigatorio,
    };

    if (r.particionada) {
      const porLetra = r.particao === "letra";
      const porPeriodo = r.particao && r.particao !== "quantidade" && !porLetra;
      if (porLetra && !r.particao_coluna)
        return avisar("a partição alfanumérica precisa de uma coluna de referência obrigatória", true);
      if (porPeriodo && !r.particao_coluna)
        return avisar("a partição por período precisa de uma coluna de data obrigatória", true);
      if (!porPeriodo && !porLetra && !r.pag)
        return avisar("informe quantos registros cabem em cada arquivo", true);
      pedido.registros_por_arquivo = r.pag || 1000000;
      if (porLetra) {
        // Nem `digitos` nem `max_arquivos` vão: os 37 baldes e o sufixo de
        // letra são o formato desta partição, e não uma escolha da tela.
        pedido.particao = "letra";
        pedido.particao_coluna = r.particao_coluna;
      } else {
        pedido.digitos = r.dig;
        pedido.max_arquivos = r.max;   // zero = o que couber no sufixo
        if (porPeriodo) {
          pedido.particao = r.particao;
          pedido.particao_coluna = r.particao_coluna;
        }
      }
    }

    rec.textContent = "criando…";
    try {
      const feito = await api("criar_tabela", pedido);
      avisar(`tabela ${feito.tabela} criada${r.schema ? ` em ${r.schema}` : ""}`
           + ` · ${feito.colunas} coluna(s), ${feito.indices} índice(s)`
           + `${feito.paginada ? `, ${r.particao === "quantidade" ? "particionada por faixa" : `partição ${r.particao}`}` : ""}`);
      est.rascunho = null;
      await montarArvore(false);
      return gerirTabelas(db);
    } catch (err) {
      rec.textContent = "";
      avisar(String(err), true);
    }
  };
}


/* ================================================ Sequências do banco
   O contador de cada tabela num lugar so, e o caminho do administrador para
   zerar ou pular uma faixa.

   O numero NAO mora aqui: cada tabela guarda o proprio contador no cabecalho
   do `.reg` dela. Esta tela junta para mostrar. Uma segunda copia seria uma
   segunda verdade, e as duas divergiriam no primeiro caminho que esquecesse de
   atualizar uma delas -- e ainda custaria uma leitura e uma gravacao a mais
   por insercao, justamente na operacao mais cara. */

async function verSequencias(db) {
  db = db || databaseCorrente();
  if (!db) return avisar("nenhum database escolhido", true);
  folha(`Sequências de ${db}`, "carregando…", `<div class="centro">carregando…</div>`);

  const r = await api("sequencias", { database: db });
  const linhas = r.sequencias || [];
  const com = linhas.filter(x => x.tem_sequencia);

  folha(`Sequências de ${db}`,
    `${com.length} de ${linhas.length} tabela(s) têm coluna Sequence`,
    `<div class="fichas">
       ${ficha(linhas.length, "tabelas")}
       ${ficha(com.length, "com contador")}
       ${ficha(com.filter(x => x.proxima === 0).length, "nunca usadas", "o primeiro sai 1")}
     </div>` +
    tabela([{t:"tabela"},{t:"coluna"},{t:"próximo número",cls:"num"},
            {t:"registros",cls:"num"},{t:""}],
      linhas, x => `<tr${x.tem_sequencia ? ` class="linha-seq" data-t="${esc(x.tabela)}"
          data-p="${x.proxima}"` : ""}>
        <td class="dado"><b>${esc(x.tabela)}</b></td>
        <td class="dado">${x.coluna ? `<code>${esc(x.coluna)}</code>`
          : `<span class="leg">— sem Sequence</span>`}</td>
        <td class="num">${x.tem_sequencia ? esc(String(x.proxima)) : ""}</td>
        <td class="num">${esc(String(x.registros))}</td>
        <td>${x.tem_sequencia ? `<span class="pino">ajustar</span>` : ""}</td></tr>`) +

    `<div class="nota">
       <p><strong>Zero quer dizer «nunca usada»</strong> — o primeiro número
       sai 1. O contador nunca anda para trás sozinho: excluir uma linha não
       devolve o número dela, pela mesma razão que o <code>.reg</code> não
       reaproveita slot.</p>
       <p><strong>O número mora no cabeçalho do <code>.reg</code> de cada
       tabela</strong>, e continua assim. Esta tela junta para mostrar; não há
       um arquivo <code>sequences</code> com uma segunda cópia, porque duas
       cópias divergem — e porque um arquivo separado custaria uma leitura e
       uma gravação a mais em cada inserção.</p>
     </div>

     <div class="acoes">
       <button class="botao secundario" id="btVoltaDb">← Gerir ${esc(db)}</button>
     </div>`);

  $("#btVoltaDb").onclick = () => gerirDatabase(db);
  $$("#painel .linha-seq").forEach(tr => tr.onclick = () => ajustarSequencia(db, tr.dataset.t, +tr.dataset.p));
}

async function ajustarSequencia(db, tabela, atual) {
  const digitado = prompt(
    `Contador de ${tabela}\n\n`
    + `O próximo número que a sequência vai dar é ${atual}.\n\n`
    + `ATENÇÃO ao baixar: se já houver número gravado na faixa, a próxima\n`
    + `inclusão repete, e um índice único recusa — o erro aparece longe\n`
    + `de quem causou.\n\n`
    + `Novo valor (0 zera, e o primeiro sai 1):`,
    String(atual));
  if (digitado === null) return;
  const n = Number(digitado.trim());
  if (!Number.isInteger(n) || n < 0) return avisar("informe um inteiro de zero para cima", true);
  try {
    const r = await api("ajustar_sequencia", { database: db, tabela, proxima: n });
    avisar(`${tabela}: ${r.antes} → ${r.proxima}${r.aviso ? " · atenção" : ""}`, !!r.aviso);
    return verSequencias(db);
  } catch (e) { avisar(String(e), true); }
}

/* ==================================================== Tabela dinâmica (pivot)
   Um assistente de tres passos: quais tabelas entram, que campo vai em cada
   eixo, e o resultado.

   A agregacao acontece no SERVIDOR. Um pivot resume -- cem mil linhas viram
   uma grade de vinte por doze --, e trazer as cem mil para o navegador somar
   seria pagar o transporte do que vai ser jogado fora. */

const AGREGADORES = [
  ["soma",       "Soma",              "o total dos valores"],
  ["media",      "Média",             "a soma dividida pela quantidade"],
  ["contagem",   "Contagem",          "quantas linhas caem na célula — não precisa de campo de valor"],
  ["minimo",     "Mínimo",            "o menor valor"],
  ["maximo",     "Máximo",            "o maior valor"],
  ["distintos",  "Valores distintos", "quantos valores DIFERENTES caem na célula"],
];

const GRANULARIDADES = [
  ["exato",     "cada valor"],
  ["dia",       "por dia"],
  ["mes",       "por mês"],
  ["trimestre", "por trimestre"],
  ["ano",       "por ano"],
];

const EIXOS = [
  ["linhas",  "Linhas",  "cada valor vira uma linha da grade"],
  ["colunas", "Colunas", "cada valor vira uma coluna — deixe vazio para uma coluna só"],
  ["valor",   "Valores", "o campo que a célula resume"],
];

/** O estado do assistente, para ele sobreviver a ir e voltar entre os passos. */
function pivotNovo(db) {
  return { db, passo: 1, tabela: "", juncoes: [], linhas: [], colunas: [],
           valor: null, agregador: "soma", resultado: null, erro: "" };
}

function telaPivot(db) {
  db = db || databaseCorrente();
  if (!db) return avisar("nenhum database escolhido", true);
  if (!est.pivot || est.pivot.db !== db) est.pivot = pivotNovo(db);
  return desenharPivot();
}

async function desenharPivot() {
  const w = est.pivot;
  const passos = ["Tabelas", "Campos", "Resultado"];
  const trilha = `<div class="passos">${passos.map((p, i) => {
    const n = i + 1;
    return `<button class="passo${n === w.passo ? " agora" : ""}${n < w.passo ? " feito" : ""}"
      data-passo="${n}" ${n > 1 && !w.tabela ? "disabled" : ""}>
      <span class="passo-n">${n}</span>${esc(p)}</button>`;
  }).join('<span class="passo-traco"></span>')}</div>`;

  folha("Tabela dinâmica", `${w.db} · o cruzamento é somado no servidor`,
    trilha + `<div id="pvCorpo"><div class="centro">carregando…</div></div>`);

  $$("#painel .passo").forEach(b => b.onclick = () => {
    w.passo = +b.dataset.passo;
    desenharPivot();
  });

  if (w.passo === 1) return pivotPasso1();
  if (w.passo === 2) return pivotPasso2();
  return pivotPasso3();
}

/* ------------------------------------------------ passo 1: quais tabelas */

async function pivotPasso1() {
  const w = est.pivot;
  const t = await api("tabelas", { database: w.db });
  const nomes = t.tabelas || [];

  // O esquema da tabela de fatos diz quais junções o motor JÁ CONHECE: as
  // chaves estrangeiras declaradas. Propor a partir delas poupa quem monta de
  // lembrar por qual coluna liga.
  let sugeridas = [];
  if (w.tabela) {
    try {
      const e = await api("esquema", { database: w.db, tabela: w.tabela });
      sugeridas = (e.chaves_estrangeiras || []).map(fk => ({
        tabela: fk.tabela_ref, coluna: (fk.colunas || [])[0],
        prefixo: fk.tabela_ref.split(".").pop(), origem: fk.nome,
      }));
    } catch (_) { /* tabela ilegível não trava o assistente */ }
  }

  $("#pvCorpo").innerHTML = `
    <h3 class="secao">A tabela dos fatos</h3>
    <p class="leg">É a que tem as linhas a somar — vendas, lançamentos, movimentos.
    As outras entram como consulta, para trazer um campo de descrição.</p>
    <div class="rolo"><table><tbody>${nomes.map(n => `<tr class="linha-tab${
        n === w.tabela ? " escolhida" : ""}" data-t="${esc(n)}">
      <td class="dado"><b>${esc(n)}</b></td>
      <td><span class="pino">${n === w.tabela ? "escolhida" : "escolher"}</span></td>
    </tr>`).join("")}</tbody></table></div>

    ${w.tabela ? `
    <h3 class="secao">Tabelas de consulta
      <em>(opcional — para cruzar por um campo que mora em outra tabela)</em></h3>

    ${sugeridas.length ? `<p class="leg">O esquema de <code>${esc(w.tabela)}</code>
      declara ${sugeridas.length} chave(s) estrangeira(s). Clique para usar:</p>
      <div class="acoes">${sugeridas.map((s, i) =>
        `<button class="botao secundario" data-sug="${i}">+ ${esc(s.tabela)}
          <span class="leg">por ${esc(s.coluna)}</span></button>`).join("")}</div>`
      : `<p class="leg">Esta tabela não declara chave estrangeira, então não há o
         que propor. Dá para juntar à mão abaixo.</p>`}

    ${w.juncoes.length ? `<div class="rolo"><table><thead><tr>
        <th>prefixo</th><th>tabela</th><th>ligada por</th><th></th>
      </tr></thead><tbody>${w.juncoes.map((j, i) => `<tr>
        <td class="dado"><code>${esc(j.prefixo)}</code></td>
        <td class="dado">${esc(j.tabela)}</td>
        <td class="dado">${esc(w.tabela)}.<b>${esc(j.coluna)}</b></td>
        <td><button class="mini perigo" data-tirar="${i}">tirar</button></td>
      </tr>`).join("")}</tbody></table></div>` : ""}

    <form class="criar" id="fPvJun" autocomplete="off"><div class="bloco">
      <label><span>juntar com a tabela</span>
        <select id="pv_jt"><option value="">— escolha —</option>${
          nomes.filter(n => n !== w.tabela).map(n =>
            `<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select></label>
      <label><span>pela coluna de ${esc(w.tabela)}</span>
        <select id="pv_jc"><option value="">— escolha —</option></select></label>
      <label><span>prefixo <em>(como os campos dela vão aparecer)</em></span>
        <input id="pv_jp" placeholder="cliente"></label>
    </div>
    <div class="acoes"><button class="botao secundario" id="pv_addjun">+ juntar</button></div>
    </form>

    <div class="nota">
      <p><strong>A tabela de consulta é lida inteira para a memória, uma vez.</strong>
      É o <em>hash join</em>: para a forma de dado que um pivot cruza — muitos
      fatos, poucas dimensões — ele custa uma varredura em vez de uma descida na
      árvore por linha de fato. O teto é 500.000 linhas por tabela de consulta.</p>
    </div>

    <div class="acoes">
      <button class="botao" id="pv_ir2">Escolher os campos →</button>
    </div>` : ""}`;

  $$("#pvCorpo .linha-tab").forEach(tr => tr.onclick = () => {
    if (w.tabela !== tr.dataset.t) { w.tabela = tr.dataset.t; w.juncoes = [];
      w.linhas = []; w.colunas = []; w.valor = null; w.resultado = null; }
    pivotPasso1();
  });
  $$("#pvCorpo [data-sug]").forEach(b => b.onclick = ev => {
    ev.preventDefault();
    const s = sugeridas[+b.dataset.sug];
    if (!w.juncoes.some(j => j.prefixo === s.prefixo)) w.juncoes.push(s);
    pivotPasso1();
  });
  $$("#pvCorpo [data-tirar]").forEach(b => b.onclick = () => {
    w.juncoes.splice(+b.dataset.tirar, 1); pivotPasso1();
  });

  const sel = $("#pv_jt");
  if (sel) {
    // As colunas de ligação saem do esquema, e não da digitação.
    const e = await api("esquema", { database: w.db, tabela: w.tabela });
    $("#pv_jc").innerHTML = `<option value="">— escolha —</option>` +
      (e.colunas || []).map(c => `<option value="${esc(c.nome)}">${esc(c.nome)}
        — ${esc(tipoCurto(c.tipo))}</option>`).join("");
    sel.onchange = () => {
      if (!$("#pv_jp").value.trim())
        $("#pv_jp").value = sel.value.split(".").pop();
    };
    $("#pv_addjun").onclick = ev => {
      ev.preventDefault();
      const tabela = sel.value, coluna = $("#pv_jc").value;
      const prefixo = $("#pv_jp").value.trim() || tabela.split(".").pop();
      if (!tabela || !coluna) return avisar("escolha a tabela e a coluna de ligação", true);
      if (w.juncoes.some(j => j.prefixo === prefixo))
        return avisar(`já existe uma junção com o prefixo ${prefixo}`, true);
      w.juncoes.push({ tabela, coluna, prefixo });
      pivotPasso1();
    };
    $("#pv_ir2").onclick = ev => { ev.preventDefault(); w.passo = 2; desenharPivot(); };
  }
}

/* ------------------------------------------------- passo 2: os campos */

/** Todos os campos disponíveis: os da tabela de fatos e os das junções. */
async function camposDoPivot() {
  const w = est.pivot;
  const e = await api("esquema", { database: w.db, tabela: w.tabela });
  const out = (e.colunas || []).map(c => ({
    campo: c.nome, rotulo: c.rotulo || c.nome, tipo: c.tipo,
    de: w.tabela, data: /^Date|^DateTime/.test(c.tipo),
    numero: /^Int|^UInt|^Real|^Decimal|^Sequence/.test(c.tipo),
  }));
  for (const j of w.juncoes) {
    try {
      const ej = await api("esquema", { database: w.db, tabela: j.tabela });
      for (const c of ej.colunas || []) out.push({
        campo: `${j.prefixo}.${c.nome}`, rotulo: c.rotulo || c.nome, tipo: c.tipo,
        de: j.tabela, data: /^Date|^DateTime/.test(c.tipo),
        numero: /^Int|^UInt|^Real|^Decimal|^Sequence/.test(c.tipo),
      });
    } catch (_) { /* junção ilegível não trava a lista */ }
  }
  return out;
}

async function pivotPasso2() {
  const w = est.pivot;
  const campos = await camposDoPivot();
  const porNome = {};
  campos.forEach(c => { porNome[c.campo] = c; });
  w._campos = porNome;

  const usado = n => w.linhas.some(x => x.campo === n) ||
                     w.colunas.some(x => x.campo === n) ||
                     (w.valor && w.valor.campo === n);

  const zona = (chave, titulo, diz) => {
    const lista = chave === "valor" ? (w.valor ? [w.valor] : []) : w[chave];
    return `<div class="pv-zona" data-zona="${chave}">
      <div class="pv-zona-cab"><b>${esc(titulo)}</b><span>${esc(diz)}</span></div>
      <div class="pv-zona-corpo">${
        lista.length ? lista.map((f, i) => {
          const c = porNome[f.campo] || {};
          return `<span class="pv-chip" draggable="true" data-zona="${chave}" data-i="${i}">
            ${esc(c.rotulo || f.campo)}
            ${chave !== "valor" && c.data ? `<select class="pv-gran" data-zona="${chave}" data-i="${i}">${
              GRANULARIDADES.map(([k, r]) =>
                `<option value="${k}"${k === (f.granularidade||"exato") ? " selected":""}>${esc(r)}</option>`
              ).join("")}</select>` : ""}
            <button type="button" class="pv-chip-x" data-zona="${chave}" data-i="${i}">×</button>
          </span>`;
        }).join("")
        : `<span class="pv-zona-vazia">arraste um campo para cá</span>`}</div>
    </div>`;
  };

  $("#pvCorpo").innerHTML = `
    <div class="pv-montagem">
      <div class="pv-paleta">
        <div class="pv-zona-cab"><b>Campos</b><span>arraste, ou clique para mandar às linhas</span></div>
        <div class="pv-paleta-lista">${campos.map(c => `
          <span class="pv-campo${usado(c.campo) ? " usado" : ""}" draggable="true"
                data-campo="${esc(c.campo)}" title="${esc(c.de)} · ${esc(c.tipo)}">
            <span class="pv-campo-ico">${c.data ? "◷" : c.numero ? "#" : "A"}</span>
            ${esc(c.rotulo)}${c.campo.includes(".") ? `<em>${esc(c.campo.split(".")[0])}</em>` : ""}
          </span>`).join("")}</div>
      </div>
      <div class="pv-zonas">${EIXOS.map(([k, t, d]) => zona(k, t, d)).join("")}
        <div class="pv-agg">
          <label><span>como resumir</span>
            <select id="pv_ag">${AGREGADORES.map(([k, r, d]) =>
              `<option value="${k}"${k === w.agregador ? " selected" : ""}>${esc(r)} — ${esc(d)}</option>`
            ).join("")}</select></label>
        </div>
      </div>
    </div>

    ${w.erro ? `<div class="nota mal"><p>${esc(w.erro)}</p></div>` : ""}

    <div class="acoes">
      <button class="botao" id="pv_montar">Montar a tabela dinâmica</button>
      <button class="botao secundario" id="pv_voltar1">← Tabelas</button>
      <button class="botao secundario" id="pv_limpar">Limpar os eixos</button>
    </div>

    <div class="nota">
      <p><strong>Contagem</strong> é o único resumo que dispensa campo de valor —
      ele conta linhas. Os outros precisam de um campo em <em>Valores</em>.</p>
      <p>Célula vazia quer dizer <strong>nenhuma linha caiu ali</strong>, e não
      zero: zero seria «somou e deu nada».</p>
    </div>`;

  // ---- arrastar e soltar, e o clique como atalho
  const solta = (zonaChave, campo) => {
    if (!campo || !porNome[campo]) return;
    tiraDeTodos(campo);
    const item = { campo, granularidade: "exato" };
    if (zonaChave === "valor") w.valor = item; else w[zonaChave].push(item);
    pivotPasso2();
  };
  const tiraDeTodos = campo => {
    w.linhas = w.linhas.filter(x => x.campo !== campo);
    w.colunas = w.colunas.filter(x => x.campo !== campo);
    if (w.valor && w.valor.campo === campo) w.valor = null;
  };

  $$("#pvCorpo .pv-campo").forEach(el => {
    el.ondragstart = ev => ev.dataTransfer.setData("text/plain", el.dataset.campo);
    el.onclick = () => solta("linhas", el.dataset.campo);
  });
  $$("#pvCorpo .pv-zona").forEach(z => {
    z.ondragover = ev => { ev.preventDefault(); z.classList.add("sobre"); };
    z.ondragleave = () => z.classList.remove("sobre");
    z.ondrop = ev => {
      ev.preventDefault(); z.classList.remove("sobre");
      solta(z.dataset.zona, ev.dataTransfer.getData("text/plain"));
    };
  });
  $$("#pvCorpo .pv-chip").forEach(c => {
    c.ondragstart = ev => {
      const z = c.dataset.zona, i = +c.dataset.i;
      const f = z === "valor" ? w.valor : w[z][i];
      ev.dataTransfer.setData("text/plain", f.campo);
    };
  });
  $$("#pvCorpo .pv-chip-x").forEach(b => b.onclick = () => {
    const z = b.dataset.zona;
    if (z === "valor") w.valor = null; else w[z].splice(+b.dataset.i, 1);
    pivotPasso2();
  });
  $$("#pvCorpo .pv-gran").forEach(s => s.onchange = () => {
    w[s.dataset.zona][+s.dataset.i].granularidade = s.value;
  });
  $("#pv_ag").onchange = () => { w.agregador = $("#pv_ag").value; };
  $("#pv_voltar1").onclick = ev => { ev.preventDefault(); w.passo = 1; desenharPivot(); };
  $("#pv_limpar").onclick = ev => {
    ev.preventDefault();
    w.linhas = []; w.colunas = []; w.valor = null; pivotPasso2();
  };
  $("#pv_montar").onclick = async ev => {
    ev.preventDefault();
    w.erro = "";
    if (!w.linhas.length) { w.erro = "escolha ao menos um campo para as Linhas"; return pivotPasso2(); }
    if (w.agregador !== "contagem" && !w.valor) {
      w.erro = `o resumo «${w.agregador}» precisa de um campo em Valores — ou troque para Contagem`;
      return pivotPasso2();
    }
    w.passo = 3;
    return desenharPivot();
  };
}

/* --------------------------------------------------- passo 3: o resultado */

async function pivotPasso3() {
  const w = est.pivot;
  $("#pvCorpo").innerHTML = `<div class="centro">cruzando no servidor…</div>`;
  let r;
  try {
    r = await api("pivotar", {
      database: w.db, tabela: w.tabela,
      juntar: w.juncoes.map(j => ({ tabela:j.tabela, coluna:j.coluna, prefixo:j.prefixo })),
      linhas: w.linhas, colunas: w.colunas,
      ...(w.valor ? { valor: w.valor.campo } : {}),
      agregador: w.agregador,
    });
  } catch (e) {
    w.erro = String(e);
    w.passo = 2;
    return desenharPivot();
  }
  w.resultado = r;

  const nome = c => (w._campos && w._campos[c] ? w._campos[c].rotulo : c);
  const cabLinha = r.campos_linha.map(nome).join(" / ");
  const agRot = (AGREGADORES.find(a => a[0] === r.agregador) || ["", r.agregador])[1];

  $("#pvCorpo").innerHTML = `
    <div class="fichas">
      ${ficha(r.rotulos_linha.length, "linhas")}
      ${ficha(r.rotulos_coluna.length, "colunas")}
      ${ficha(agRot, "resumo", r.valor || "linhas")}
      ${ficha(Number(r.lidas).toLocaleString("pt-BR"), "linhas lidas")}
      ${ficha(Number(r.consideradas).toLocaleString("pt-BR"), "consideradas", "sem os nulos")}
      ${ficha(r.total ?? "—", "total geral")}
    </div>

    ${r.juncoes && r.juncoes.length ? `<p class="leg">Juntou com ${
      r.juncoes.map(j => `<code>${esc(j.prefixo)}</code> = ${esc(j.tabela)}
        (${j.linhas} linha(s))`).join(", ")}.</p>` : ""}

    <div class="rolo"><table class="pivot"><thead>
      <tr><th class="pv-canto">${esc(cabLinha)}</th>
        ${r.rotulos_coluna.map(c => `<th class="num">${esc(c)}</th>`).join("")}
        <th class="num pv-tot">total</th></tr>
    </thead><tbody>
      ${r.rotulos_linha.map((l, i) => `<tr>
        <td class="dado pv-rot">${esc(l)}</td>
        ${r.celulas[i].map(c => `<td class="num${c == null ? " pv-vazia" : ""}">${
          c == null ? "·" : esc(c)}</td>`).join("")}
        <td class="num pv-tot">${esc(r.total_linha[i] ?? "")}</td></tr>`).join("")}
    </tbody><tfoot>
      <tr><td class="dado pv-rot">total</td>
        ${r.total_coluna.map(c => `<td class="num pv-tot">${esc(c ?? "")}</td>`).join("")}
        <td class="num pv-tot pv-geral">${esc(r.total ?? "")}</td></tr>
    </tfoot></table></div>

    <div class="acoes">
      <button class="botao secundario" id="pv_voltar2">← Trocar os campos</button>
      <button class="botao secundario" id="pv_csv">Copiar como CSV</button>
      <button class="botao secundario" id="pv_json">Ver o pedido</button>
    </div>

    <div class="nota">
      <p><strong>Os totais fecham nas duas direções</strong>: a soma das células
      de uma linha bate com o total dela, e a soma dos totais de coluna bate com
      o total geral. Um pivot que não fecha não serve para nada, e há teste que
      confere isso.</p>
      ${r.valor ? `<p><strong>Dinheiro não perde centavo.</strong> Um campo
      <code>Decimal</code> é somado no domínio inteiro escalado e só vira texto
      na saída; a média divide uma vez, no fim — não a cada parcela.</p>` : ""}
    </div>`;

  $("#pv_voltar2").onclick = () => { w.passo = 2; desenharPivot(); };
  $("#pv_csv").onclick = () => {
    const linhas = [[cabLinha, ...r.rotulos_coluna, "total"].join(";")];
    r.rotulos_linha.forEach((l, i) =>
      linhas.push([l, ...r.celulas[i].map(c => c ?? ""), r.total_linha[i] ?? ""].join(";")));
    linhas.push(["total", ...r.total_coluna.map(c => c ?? ""), r.total ?? ""].join(";"));
    const txt = linhas.join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
      () => avisar(`${linhas.length} linha(s) copiadas`),
      () => avisar("o navegador não deixou copiar", true));
    else avisar("o navegador não tem área de transferência", true);
  };
  $("#pv_json").onclick = () => folha("Tabela dinâmica · o pedido",

/* ==================================== Configurações e diretivas da tabela
   O que vale para UMA tabela: a geometria que ela ganhou na criacao, o que ela
   herda do servidor, e quem a alcanca.

   A separacao importa. Quase nada aqui se ajusta por tabela -- a paginacao e
   as chaves entraram na criacao e nao mudam, o espelho e do servidor, a
   permissao e do database. Dizer isso e o servico: quem procura "onde mudo o
   tamanho do volume desta tabela" precisa saber que a resposta e "recriando". */

async function verConfigTabela(db, tab) {
  folha(`Configurações de ${tab}`, `${db} · carregando…`, `<div class="centro">carregando…</div>`);

  const [e, c, mem, quem] = await Promise.all([
    api("esquema", { database: db, tabela: tab }),
    api("config"),
    api("memoria").catch(() => ({ tabelas: [] })),
    api("quem_sou").catch(() => ({})),
  ]);
  const pag = e.paginacao;
  const naRam = (mem.tabelas || []).some(m =>
    (m.tabela || m) === tab || (m.tabela || m) === `${db}/${tab}`);
  const pk = (e.indices || []).find(i => i.primario);
  const seg = c.seguranca || {};
  const proibida = (seg.bases_proibidas || []).includes(db);

  folha(`Configurações de ${tab}`, `${db} · o que vale para esta tabela`,
    `<div class="fichas">
       ${ficha(e.registros, "registros")}
       ${ficha(e.slots, "slots", "inclui excluídos")}
       ${ficha((e.colunas || []).length, "colunas")}
       ${ficha(pk ? pk.nome : "—", "chave primária", pk && pk.composto ? "composta" : "")}
       ${ficha(pag ? (pag.modo === "quantidade" ? "por faixa" : pag.modo) : "arquivo único", "partição")}
       ${ficha(naRam ? "sim" : "não", "carregada na RAM")}
     </div>

     <h3 class="secao">Geometria — decidida na criação, não muda</h3>
     <div class="rolo"><table><thead><tr>
       <th>ajuste</th><th>valor</th><th>por que não muda depois</th>
     </tr></thead><tbody>
       <tr><td class="dado">regra de partição</td>
         <td class="dado"><b>${esc(pag ? (pag.modo === "quantidade" ? "por faixa de quantidade" : pag.modo) : "arquivo único")}</b></td>
         <td class="leg">decide como o rowid vira endereço</td></tr>
       ${pag ? `
       <tr><td class="dado">registros por arquivo</td>
         <td class="dado"><b>${esc(String(pag.registros_por_arquivo))}</b></td>
         <td class="leg">é o divisor do endereço, ou o teto do volume</td></tr>
       <tr><td class="dado">coluna do período</td>
         <td class="dado"><b>${esc(pag.coluna || "—")}</b></td>
         <td class="leg">quem decide quando o volume corta</td></tr>
       <tr><td class="dado">dígitos do sufixo</td>
         <td class="dado"><b>${esc(String(pag.digitos))}</b> — <code>${esc(tab)}_${"0".repeat(Math.max(0, pag.digitos - 1))}1.reg</code></td>
         <td class="leg">o nome do arquivo depende dele</td></tr>
       <tr><td class="dado">teto de volumes</td>
         <td class="dado"><b>${esc(String(pag.max_arquivos))}</b></td>
         <td class="leg">o que cabe no sufixo</td></tr>
       <tr><td class="dado">volume dos externos</td>
         <td class="dado"><b>${((pag.bytes_por_arquivo || 0) / 1073741824).toFixed(2)} GiB</b></td>
         <td class="leg">.bin, .memo e .log</td></tr>` : ""}
       <tr><td class="dado">colunas e tipos</td>
         <td class="dado"><b>${(e.colunas || []).length} coluna(s)</b></td>
         <td class="leg">o tamanho do slot é fixo; mudar reescreveria a tabela</td></tr>
     </tbody></table></div>

     <h3 class="secao">Índices e chaves</h3>
     ${tabela([{t:"índice"},{t:"colunas"},{t:"único",cls:"num"},{t:"primária",cls:"num"},{t:"composta",cls:"num"}],
       e.indices || [], i => `<tr>
         <td class="dado"><b>${esc(i.nome)}</b></td>
         <td class="dado">${(i.colunas || []).map(c =>
            `${esc(c.coluna)}${c.desc ? " ↓" : ""}${c.nocase ? " ~" : ""}`).join(", ")}</td>

         <td class="num">${i.composto ? "sim" : ""}</td></tr>`)}

     ${(e.chaves_estrangeiras || []).length ? `
     <h3 class="secao">Chaves estrangeiras</h3>
     <div class="nota mal"><p><strong>Declaradas, não aplicadas.</strong> Elas
     estão gravadas no cabeçalho do <code>.reg</code> e aparecem aqui, mas

     ${tabela([{t:"nome"},{t:"colunas"},{t:"aponta para"},{t:"ao excluir"},{t:"ao alterar"}],

         <td class="dado">${esc(f.ao_excluir)}</td>
         <td class="dado">${esc(f.ao_alterar)}</td></tr>`)}` : ""}

     ${pag && (e.volumes || []).length ? `
     <h3 class="secao">Volumes no disco</h3>
     ${tabela([{t:"volume",cls:"num"},{t:"arquivo"},{t:"primeiro rowid",cls:"num"},{t:"período"}],

     <div class="rolo"><table><thead><tr>
       <th>diretiva</th><th>vale aqui</th><th>de onde vem</th>
     </tr></thead><tbody>
       <tr><td class="dado">espelho <code>.bkp</code></td>
         <td class="dado">${c.espelho ? '<span class="pino ok">ligado</span>' : "desligado"}</td>
         <td class="leg">campo <code>espelho</code> do servidor — não é por tabela</td></tr>
       <tr><td class="dado">somente leitura</td>
         <td class="dado">${c.somente_leitura ? '<span class="pino mal">ligado</span>' : "desligado"}</td>
         <td class="leg">campo <code>somente_leitura</code> do servidor</td></tr>
       <tr><td class="dado">base proibida</td>
         <td class="dado">${proibida ? '<span class="pino mal">SIM</span>' : "não"}</td>
         <td class="leg"><code>seguranca.bases_proibidas</code> — recusa antes de olhar</td></tr>
       <tr><td class="dado">comandos proibidos</td>
         <td class="dado">${(seg.comandos_proibidos||[]).length
            ? (seg.comandos_proibidos).map(x=>`<code>${esc(x)}</code>`).join(" ") : "nenhum"}</td>
         <td class="leg">recusados no portão, para qualquer tabela</td></tr>
       <tr><td class="dado">teto de linhas por resposta</td>
         <td class="dado">${esc(String(c.max_linhas ?? "—"))}</td>
         <td class="leg">campo <code>max_linhas</code></td></tr>
       <tr><td class="dado">seu poder aqui</td>
         <td class="dado">${quem.supervisor ? '<span class="pino ok">supervisor</span>'
            : esc(quem.nivel || quem.login || "—")}</td>
         <td class="leg">a permissão é por <em>database</em>, não por tabela</td></tr>
     </tbody></table></div>

     <div class="nota">
       <p><strong>Quase nada aqui se ajusta por tabela</strong>, e isso é
       desenho, não falta. A geometria entra na criação porque é ela que
       transforma o rowid em endereço; o espelho e a política são do servidor,
       porque valem para tudo que ele abrir; a permissão é do database, porque
       é ali que a árvore de pastas separa.</p>
       <p>Para mudar a geometria: crie a tabela nova com a partição que quer e
       copie as linhas. Isso <em>refaz os rowids</em> — que é exatamente o
       motivo de a mudança não ser automática.</p>
     </div>

     <div class="acoes">
       <button class="botao secundario" id="btVoltarGer">← Gestão de ${esc(tab)}</button>
       <button class="botao secundario" id="btVerEstr">Estrutura completa</button>
     </div>`);

  ligarVoltarGestao(db, tab);
  $("#btVerEstr").onclick = () => { est.aba = "estrutura"; abrirTabela(db, tab); };
}

const GRUPOS_DB = [
  ["dados",    "Dados e catálogo"],
  ["config",   "Configuração e acesso"],
  ["operacao", "Operação"],
  ["falta",    "Ainda não existe"],
];

async function gerirDatabase(db) {
  db = db || databaseCorrente();
  if (!db) return avisar("nenhum database — crie um pelo [+] da árvore", true);
  est.database = db;

  folha(`Gerir ${db}`, "carregando…", `<div class="centro">carregando…</div>`);
  let resumo = "";
  try {
    const st = await api("sistabelas", { database: db });
    const t = st.tabelas || [];
    const soma = f => t.reduce((a, x) => a + (+x[f] || 0), 0);
    resumo = `<div class="fichas">
      ${ficha(t.length, "tabelas")}
      ${ficha(soma("registros").toLocaleString("pt-BR"), "registros")}
      ${ficha(soma("colunas"), "colunas")}
      ${ficha(t.filter(x => x.chave_primaria).length, "com chave primária")}
      ${ficha(t.filter(x => x.particao).length, "particionadas")}
      ${ficha(soma("volumes"), "volumes no disco")}
    </div>`;
  } catch (e) { resumo = `<div class="aviso mal">${esc(String(e))}</div>`; }

  const itens = itensDoDatabase(db);
  folha(`Gerir ${db}`, "tudo que se faz sobre este banco",
    resumo + GRUPOS_DB.map(([g, titulo]) => {
      const doGrupo = itens.map((it, i) => [it, i]).filter(([it]) => it.g === g);
      if (!doGrupo.length) return "";
      return `<h3 class="secao">${esc(titulo)}</h3>
        <div class="ops">${doGrupo.map(([it, i]) =>
          `<button class="op${it.faz ? "" : " afazer"}" data-op="${i}">
             <span class="op-ico">${it.ico}</span>
             <span class="op-txt"><b>${esc(it.rot)}</b><span>${esc(
               it.diz || "ainda não existe — clique para ver o que falta")}</span></span>
           </button>`).join("")}</div>`;
    }).join(""));

  // No container das operacoes, e nao no `#painel`: o `folha()` troca o
  // conteudo do painel mas nao o ELEMENTO, entao um `onclick` posto ali
  // sobrevive a troca de tela e dispara na tela seguinte.
  $$("#painel .ops").forEach(caixa => caixa.onclick = ev => {
    const b = ev.target.closest(".op");
    if (!b) return;
    const it = itens[+b.dataset.op];
    if (!it.faz) return aindaNao(it);
    Promise.resolve().then(it.faz).catch(e => avisar(String(e), true));
  });
}

/* ------------------------------------------------------ copiar e colar */

/** O que esta na area de transferencia da gestao de tabelas. */
function copiarTabela(db, tab) {
  est.copia = { db, tab };
  avisar(`${db}.${tab} copiada — abra o banco de destino e use Colar`);
  const b = $("#btColar");
  if (b) b.disabled = false;
}

/** A tela de colar: escolhe destino e nome, e diz o que vai acontecer. */
function telaCopiarColar(db) {
  const c = est.copia;
  const bancos = est.bancos || [];

  folha("Copiar e colar tabela", c ? `na área: ${c.db}.${c.tab}` : "nada copiado ainda",
    !c
      ? `<div class="nota">
           <p><strong>Nada na área de transferência.</strong> Abra a gestão de
           tabelas de um banco, escolha uma tabela e clique em <em>Copiar</em>.
           Depois volte aqui — ou use o <em>Colar</em> da própria grade.</p>
         </div>
         <div class="acoes">
           <button class="botao secundario" id="btIrTabelas">→ Tabelas de ${esc(db)}</button>
         </div>`
      : `<form class="criar" id="formColar" autocomplete="off">
           <div class="bloco">
             <label><span>de onde</span>
               <input value="${esc(c.db)} · ${esc(c.tab)}" disabled></label>
             <label><span>para qual banco</span>
               <select id="cc_db">${bancos.map(b =>
                 `<option value="${esc(b)}"${b === db ? " selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
             <label><span>com que nome
                 <em>(aceita <code>schema.tabela</code>; a pasta nasce se faltar)</em></span>
               <input id="cc_nome" value="${esc(c.tab)}"></label>
           </div>
         </form>
         <div class="acoes">
           <button class="botao" id="btColarAgora">Colar</button>
           <button class="botao secundario" id="btLimparCopia">Esvaziar a área</button>
           <span class="leg" id="ccRecado"></span>
         </div>
         <div class="nota">
           <p><strong>A cópia é byte a byte</strong>, os cinco arquivos e o
           espelho, todos os volumes de cada um. Por isso ela nasce com os
           <em>mesmos rowids</em> e na <em>mesma ordem de digitação</em> — o que
           uma reinserção linha a linha não daria.</p>
           <p>Colar por cima de uma tabela existente é recusado. Para substituir,
           exclua a de destino primeiro — de propósito: sobrescrever cinco
           arquivos sem aviso não tem desfazer.</p>
         </div>`);

  if (!c) { $("#btIrTabelas").onclick = () => gerirTabelas(db); return; }

  $("#btLimparCopia").onclick = () => { est.copia = null; telaCopiarColar(db); };
  $("#btColarAgora").onclick = async ev => {
    ev.preventDefault();
    const destinoDb = $("#cc_db").value;
    const destino = $("#cc_nome").value.trim();
    if (!destino) return avisar("dê um nome à cópia", true);
    $("#ccRecado").textContent = "copiando…";
    try {
      const r = await api("copiar_tabela", {
        database: c.db, tabela: c.tab,
        destino_database: destinoDb, destino,
      });
      avisar(`${r.origem} colada em ${r.destino_database}.${r.destino} · ${r.arquivos} arquivo(s)`);
      await montarArvore(false);
      return gerirTabelas(destinoDb);
    } catch (err) {
      $("#ccRecado").textContent = "";
      avisar(String(err), true);
    }
  };
}

/* --------------------------------------------- diretivas de acesso ao banco */

async function verDiretivasDoBanco(db) {
  db = db || databaseCorrente();
  const [c, u, eu] = await Promise.all([
    api("config"), api("usuarios").catch(() => []), api("quem_sou").catch(() => ({})),
  ]);
  const seg = c.seguranca || {};
  const lista = u.usuarios || u || [];
  const proibida = (seg.bases_proibidas || []).includes(db);

  // O poder de cada usuario sobre ESTE banco, resolvido pelas tres regras.
  const poder = x => {
    if (x.supervisor) return { tudo:true, itens:["tudo — supervisor"] };
    const bases = x.bases || {};
    const b = bases[db] || bases["*"];
    if (bases[db] === undefined && bases["*"] === undefined)
      return { nada:true, itens:[] };
    const ativos = Object.entries(b || {}).filter(([, v]) => v).map(([k]) => k);
    return { itens: ativos, vazio: !ativos.length, curinga: bases[db] === undefined };
  };

  folha(`Diretivas de acesso · ${db}`, "quem alcança este banco, e o que o servidor recusa antes de olhar",
    `${proibida ? `<div class="nota mal"><p><strong>Este banco está em
       <code>seguranca.bases_proibidas</code>.</strong> Nenhum usuário o alcança,
       nem supervisor: a recusa acontece no portão, antes da permissão ser
       consultada, e a tentativa conta como violação.</p></div>` : ""}

     <h3 class="secao">Os portões, na ordem em que fecham</h3>
     <div class="rolo"><table><thead><tr>

     </tr></thead><tbody>
       <tr><td class="num dado">1</td><td class="dado">IP permitido</td>
         <td class="leg">quem não está na lista nem chega a falar</td>
         <td class="dado">${(c.ips_permitidos || []).length
            ? (c.ips_permitidos).map(x => `<code>${esc(x)}</code>`).join(" ") : "<span class=leg>qualquer IP</span>"}</td></tr>
       <tr><td class="num dado">2</td><td class="dado">lista de bloqueio</td>

         <td class="dado"><code>${esc(seg.blacklist || "blacklist.json")}</code>

/* ============================================================ editor de menu
   Trocar o rotulo de qualquer item da barra e do menu.

   Fica no navegador de quem mexeu (`localStorage`), e nao no servidor: e
   preferencia de quem opera, nao politica do banco. Dois operadores podem
   querer nomes diferentes, e nenhum dos dois deveria mudar a tela do outro. */

const CHAVE_ROTULOS = "phxsql.rotulos";

function rotulosSalvos() {
  try { return JSON.parse(localStorage.getItem(CHAVE_ROTULOS) || "{}"); }
  catch (_) { return {}; }
}

function gravarRotulos(r) {
  try { localStorage.setItem(CHAVE_ROTULOS, JSON.stringify(r)); }
  catch (_) { avisar("o navegador não deixou guardar a preferência", true); }
}

/** O rotulo a exibir para uma chave, com o original como reserva. */
function rot(chave, original) {
  const r = est.rotulos || (est.rotulos = rotulosSalvos());
  return r[chave] || original;
}

function editorDeMenu() {
  est.rotulos = est.rotulos || rotulosSalvos();
  const itens = [];
  MENUS.forEach(([nome, , lista], m) => {
    itens.push({ chave:`menu.${m}`, original:nome, onde:"menu", grupo:nome });
    lista.forEach((it, i) => {
      if (it === "sep") return;
      itens.push({ chave:`menu.${m}.${i}`, original:it.rot, onde:"item", grupo:nome });
    });
  });
  FERRAMENTAS.forEach((f, i) => {
    if (f === "risco") return;
    itens.push({ chave:`fer.${i}`, original:f.rot, onde:"ferramenta", grupo:"Barra de ferramentas" });
  });

  const trocados = Object.keys(est.rotulos).length;
  const grupos = [...new Set(itens.map(i => i.grupo))];

  folha("Editor de menu", `${itens.length} rótulos · ${trocados} trocado(s) neste navegador`,
    `<div class="acoes">
       <button class="botao" id="emSalvar">Aplicar</button>
       <button class="botao secundario" id="emReverter">Voltar aos nomes de fábrica</button>
       <span class="leg">em branco = usa o nome original</span>
     </div>` +
    grupos.map(g => `<h3 class="secao">${esc(g)}</h3>
      <div class="rolo"><table class="montar"><thead><tr>
        <th>onde</th><th>nome de fábrica</th><th>nome que você quer</th>
      </tr></thead><tbody>${itens.filter(i => i.grupo === g).map(i => `<tr>
        <td class="dado leg">${esc(i.onde)}</td>
        <td class="dado">${esc(i.original)}</td>
        <td><input class="em-rot" data-chave="${esc(i.chave)}"
             value="${esc(est.rotulos[i.chave] || "")}"
             placeholder="${esc(i.original)}"></td></tr>`).join("")}
      </tbody></table></div>`).join("") +
    `<div class="nota">
       <p><strong>Fica neste navegador, não no servidor.</strong> É preferência
       de quem opera, não política do banco: dois operadores podem querer nomes
       diferentes, e nenhum dos dois deveria mudar a tela do outro.</p>
       <p>Trocar o rótulo <em>não</em> troca o que o item faz, nem a letra do
       atalho — <code>Alt</code> continua abrindo o menu pela letra de fábrica.</p>
     </div>`);

  $("#emSalvar").onclick = () => {
    const novo = {};
    $$("#painel .em-rot").forEach(inp => {
      const v = inp.value.trim();
      if (v && v !== inp.placeholder) novo[inp.dataset.chave] = v;
    });
    est.rotulos = novo;
    gravarRotulos(novo);
    montarMenu(); montarFerramentas();
    avisar(`${Object.keys(novo).length} rótulo(s) trocado(s)`);
    editorDeMenu();
  };
  $("#emReverter").onclick = () => {
    est.rotulos = {};
    gravarRotulos({});
    montarMenu(); montarFerramentas();
    avisar("nomes de fábrica de volta");
    editorDeMenu();
  };
}

/* ============================================ Configurações e diretivas
   Tres telas, tres alcances: o SERVIDOR (o `config.json` inteiro), o BANCO
   (o que vale para um database) e os USUARIOS (quem pode o que).

   As tres LEEM. Nenhuma grava, e isso e escolha, nao esquecimento: gravar o
   `config.json` pela porta web significaria que uma sessao roubada abre o
   firewall, troca a lista de comandos proibidos e cria um supervisor. A tela
