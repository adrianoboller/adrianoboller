<style>
/* A marca do PhxSql e escura por natureza, e um console de banco se usa em
   sessao longa. Esta pagina assume o mundo escuro de proposito: pinta todas
   as cores explicitamente e nao depende do tema de quem abre. */
:root{
  --fundo:#010418; --painel:#0a1122; --painel-2:#0f182c; --realce:#152238;
  --linha:#1e2940; --linha-forte:#2b3a56;
  --texto:#dde2eb; --texto-2:#a8b0c0; --texto-3:#7c8598;
  --laranja:#ff8a1c; --ambar:#ffc43d; --vermelhao:#ff4d10; --vermelho:#ff5f5f;
  --reg:#5fa6e8; --ndx:#b394f0; --bin:#3fc8d4; --memo:#7bcb6a; --log:#ff5f5f;
  --ok:#6cc98c; --aviso:#ffc43d;
  --barra:52px; --arvore:268px;
  --sombra-fenix:0 6px 22px rgba(255,77,16,.28);
  --brilho-entrada:#0d1830; --tinta-botao:#160a00;
}

/* Tema claro. Nao e o escuro invertido: sobre papel, o vermelhao #ff4d10 da
   3,5:1 de contraste -- abaixo do minimo para texto. Escurece para #c63c0a,
   que mantem a cor da marca e passa dos 4,5:1. E a mesma adaptacao que o
   dossie ja fazia; agora as duas paginas concordam.

   As cinco cores de arquivo tambem escurecem: elas precisam se distinguir
   entre si E do fundo, e as do tema escuro somem no branco. */
:root[data-tema="claro"]{
  --fundo:#f7f5f2; --painel:#ffffff; --painel-2:#f2efeb; --realce:#e9e4de;
  --linha:#ded7cf; --linha-forte:#c4bab0;
  --texto:#1a1210; --texto-2:#4a3f3a; --texto-3:#7a6d66;
  --laranja:#c63c0a; --ambar:#a06a00; --vermelhao:#c63c0a; --vermelho:#b71414;
  --reg:#1f5c93; --ndx:#6a44a8; --bin:#0e7a85; --memo:#37702e; --log:#b71414;
  --ok:#2f7a3e; --aviso:#8a6a1f;
  --sombra-fenix:0 6px 18px rgba(198,60,10,.18);
  --brilho-entrada:#efe7dd; --tinta-botao:#fff6f0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fundo);color:var(--texto);
  font-family:"Exo 2","Helvetica Neue",Arial,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.mono,code,td.dado,th.dado,pre{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

/* --------------------------------------------------------------- entrada */
#entrada{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1200px 600px at 50% -10%,var(--brilho-entrada) 0%,var(--fundo) 62%);
  z-index:50;
}
.cartao{
  width:min(400px,92vw);background:var(--painel);border:1px solid var(--linha);
  border-radius:10px;padding:34px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
/* A fenix vem do logo oficial, com o fundo #010418 retirado para o alfa --
   assim ela assenta em cima do painel sem deixar emenda de retangulo. */
.cartao .simbolo{
  display:block;width:172px;height:auto;margin:0 auto 18px;
  filter:drop-shadow(var(--sombra-fenix));
}
.cartao h1{
  font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;
  text-align:center;
}
.cartao h1 .x{color:var(--laranja)}
.cartao .assin{
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--texto-3);margin:0 0 8px;text-align:center;
}
.cartao .lema{
  font-size:9px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--texto-3);opacity:.62;margin:0 0 26px;text-align:center;
}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-3);margin:0 0 6px}
label .opc{text-transform:none;letter-spacing:0;font-size:10.5px;opacity:.6;
  font-style:italic}
.onde{display:grid;grid-template-columns:1fr 88px;gap:10px}
input,select{
  width:100%;background:var(--fundo);border:1px solid var(--linha-forte);
  color:var(--texto);border-radius:6px;padding:10px 12px;font-size:14px;
  font-family:inherit;
}
input:focus,select:focus{border-color:var(--laranja);outline:none}
.campo{margin-bottom:16px}
.botao{
  width:100%;background:var(--laranja);color:var(--tinta-botao);border:none;border-radius:6px;
  padding:11px;font-weight:600;letter-spacing:.02em;
}
.botao:hover{background:var(--ambar)}
.botao.secundario{background:transparent;border:1px solid var(--linha-forte);color:var(--texto-2);width:auto;padding:7px 14px;font-weight:500}
.botao.secundario:hover{border-color:var(--laranja);color:var(--texto)}
.recado{margin-top:14px;font-size:12.5px;min-height:18px}
.recado.erro{color:var(--vermelho)}
.recado.info{color:var(--texto-3)}
.modo{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--linha);
  font-size:11.5px;color:var(--texto-3);line-height:1.5;
}

/* ----------------------------------------------------------------- barra */
#app{display:none;height:100%;grid-template-rows:var(--barra) auto auto 1fr;
  grid-template-columns:var(--arvore) 1fr;
  grid-template-areas:"barra barra" "menu menu" "tools tools" "arvore corpo"}
#app.ativo{display:grid}

/* ------------------------------------------------------- barra de ferramentas
   Dezesseis botoes, e nem todos tem motor por tras. Os que ainda nao existem
   aparecem apagados e com a tarja "a fazer" -- clicar neles diz o que falta e
   de que dependem, em vez de nao fazer nada.

   Botao que parece funcionar e nao funciona custa mais caro do que botao que
   falta: o primeiro so se descobre no meio do trabalho. */
.ferramentas{
  grid-area:tools;display:flex;align-items:stretch;gap:2px;
  padding:5px 8px;overflow-x:auto;overflow-y:hidden;
  background:var(--painel);border-bottom:1px solid var(--linha);
  scrollbar-width:thin;
}
.ferramentas .fer{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:1px solid transparent;border-radius:5px;
  padding:5px 9px 4px;min-width:62px;cursor:pointer;
  font-family:inherit;font-size:10px;line-height:1.15;color:var(--texto-2);
  white-space:nowrap;position:relative;flex:none;
}
.ferramentas .fer:hover{background:var(--painel-3);border-color:var(--linha-forte);color:var(--texto)}
.ferramentas .fer:focus-visible{outline:2px solid var(--laranja);outline-offset:1px}
.ferramentas .fer svg{width:19px;height:19px;display:block;flex:none}
/* A cor vem do proprio botao: cada ferramenta tem a sua, e o SVG a herda. */
.ferramentas .fer svg *{stroke:currentColor}
.ferramentas .fer .rot{color:var(--texto-2)}
.ferramentas .fer:hover .rot{color:var(--texto)}

/* O que ainda nao existe: apagado, mas presente e clicavel. */
.ferramentas .fer.afazer{opacity:.42}
.ferramentas .fer.afazer:hover{opacity:.75}
.ferramentas .fer.afazer::after{
  content:"";position:absolute;top:4px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--pend);
}
.form-consulta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:end;
  padding:14px;background:var(--painel-2);border:1px solid var(--linha);
  border-radius:7px;margin:14px 0;
}
.form-consulta label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--texto-3)}
.form-consulta input,.form-consulta select{
  background:var(--painel);border:1px solid var(--linha-forte);border-radius:5px;
  padding:6px 9px;font-family:inherit;font-size:12.5px;color:var(--texto);min-width:130px;
}
.form-consulta input:focus,.form-consulta select:focus{outline:none;border-color:var(--laranja)}

.ferramentas .risco{
  width:1px;background:var(--linha);margin:4px 5px;flex:none;
}

@media (max-width:900px){
  .ferramentas .fer{min-width:54px;padding:5px 6px 4px;font-size:9.5px}
  .ferramentas .fer svg{width:17px;height:17px}
}

/* ------------------------------------------------------------ menu superior
   Barra de menu tradicional: titulos na horizontal, cada um abrindo uma lista
   por baixo. O motivo de existir e simples -- metade do que o servidor sabe
   fazer (backup, reparo, reindex, tabela em memoria) nao tinha porta de
   entrada nenhuma na tela. */
.menubar{
  grid-area:menu;display:flex;align-items:stretch;
  background:var(--painel-2);border-bottom:1px solid var(--linha);
  position:relative;z-index:60;user-select:none;
}
.menubar > .menu{position:relative;display:flex}
.menubar .titulo{
  background:none;border:0;border-radius:0;padding:0 13px;height:30px;
  font-family:inherit;font-size:12.5px;color:var(--texto-2);cursor:pointer;
  display:flex;align-items:center;gap:1px;white-space:nowrap;
}
.menubar .titulo:hover{background:var(--painel-3);color:var(--texto)}
.menubar .menu.aberto .titulo{background:var(--laranja);color:#fff}
/* A letra sublinhada e a tecla de atalho com Alt, como manda a tradicao. */
.menubar .titulo u{text-decoration:underline;text-underline-offset:2px}

.menubar .lista{
  display:none;position:absolute;top:100%;left:0;min-width:238px;
  background:var(--painel);border:1px solid var(--linha-forte);
  border-radius:0 0 5px 5px;box-shadow:0 8px 24px rgba(0,0,0,.22);
  padding:4px 0;
}
.menubar .menu.aberto .lista{display:block}
.menubar .item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;text-align:left;padding:6px 14px 6px 12px;
  font-family:inherit;font-size:12.5px;color:var(--texto);cursor:pointer;
}
.menubar .item:hover:not(:disabled),
.menubar .item:focus-visible{background:var(--laranja);color:#fff;outline:none}
.menubar .item:disabled{color:var(--texto-3);cursor:default;opacity:.55}
.menubar .item .ico{width:16px;text-align:center;font-size:12px;flex:none}
.menubar .item .rot{flex:1}
.menubar .item .tecla{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--texto-3);
  flex:none;letter-spacing:.02em;
}
.menubar .item:hover:not(:disabled) .tecla{color:rgba(255,255,255,.75)}
.menubar .sep{height:1px;background:var(--linha);margin:4px 0}

/* Em tela estreita a arvore some e o menu continua sendo o caminho. */
@media (max-width:820px){
  .menubar .titulo{padding:0 9px;font-size:12px}
  .menubar .lista{min-width:200px}
}
.barra{
  grid-area:barra;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--painel);border-bottom:1px solid var(--linha);
}
.barra .marca{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.barra .marca img{width:auto;height:30px;display:block}
.barra .marca .x{color:var(--laranja)}
.barra .fita{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texto-3);
}
.barra .espaco{flex:1}
.barra .recado{
  font-size:11.5px;padding:3px 10px;border-radius:99px;
  background:var(--painel-3);border:1px solid var(--linha-forte);
  color:var(--texto-2);white-space:nowrap;max-width:42ch;
  overflow:hidden;text-overflow:ellipsis;
}
.barra .recado.mal{border-color:var(--log);color:var(--log)}
.tema{
  background:none;border:1px solid var(--linha-forte);border-radius:99px;
  width:34px;height:26px;display:grid;place-items:center;font-size:13px;
  line-height:1;padding:0;color:var(--texto-2);
}
.tema:hover{border-color:var(--laranja);color:var(--laranja)}
body,.cartao,.barra,.arvore,table,td,th{
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.demo{
  background:rgba(255,196,61,.12);border:1px solid rgba(255,196,61,.35);
  color:var(--ambar);border-radius:99px;padding:3px 11px;font-size:11px;
}
.eu{font-size:12.5px;color:var(--texto-2)}
.eu b{color:var(--texto);font-weight:600}

/* ---------------------------------------------------------------- arvore */
.arvore{
  grid-area:arvore;background:var(--painel);border-right:1px solid var(--linha);
  overflow-y:auto;padding:12px 0 24px;
}
.grupo{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--texto-3);padding:14px 16px 7px;
}
.no{
  display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;
  border-left:2px solid transparent;color:var(--texto-2);
}
.no:hover{background:var(--painel-2);color:var(--texto)}
.no.sel{background:var(--realce);color:var(--texto);border-left-color:var(--laranja)}
.no .ic{width:14px;text-align:center;color:var(--texto-3);font-size:11px}
.no.db{font-weight:600;color:var(--texto)}
.no.tab{padding-left:34px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.no.esq{padding-left:26px;color:var(--texto-3);font-size:12px}
.no.tab.emesq{padding-left:46px}
.vazio{padding:10px 16px;font-size:12px;color:var(--texto-3);font-style:italic}

/* ----------------------------------------------------------------- corpo */
.corpo{grid-area:corpo;overflow:hidden;display:flex;flex-direction:column}
.cabecalho{padding:16px 22px 0}
.cabecalho h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.cabecalho .sub{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--texto-3);
  margin-top:3px;
}
.abas{display:flex;gap:2px;padding:14px 22px 0;border-bottom:1px solid var(--linha)}
.aba{
  background:none;border:none;padding:8px 14px;color:var(--texto-3);
  border-bottom:2px solid transparent;font-size:13px;
}
.aba:hover{color:var(--texto-2)}
.aba.sel{color:var(--laranja);border-bottom-color:var(--laranja);font-weight:600}
.painel{flex:1;overflow:auto;padding:20px 22px 40px}

.ferramentas{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ferramentas label{margin:0}
.ferramentas select,.ferramentas input{width:auto;padding:6px 10px;font-size:13px}
.conta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--texto-3)}
.dica{font-size:11.5px;color:var(--texto-3);opacity:.8;font-style:italic;margin-left:auto}

/* ------------------------------------------------------------------ painel */
.no.painel{font-weight:600;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;
      margin-bottom:22px}
.kpi{background:var(--painel-2);border:1px solid var(--linha);border-radius:9px;
     padding:13px 15px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
        font-variant-numeric:tabular-nums}
.kpi .r{font-size:10px;letter-spacing:.11em;text-transform:uppercase;
        color:var(--texto-3);margin-top:5px}
.kpi .u{font-size:11px;color:var(--texto-3);margin-top:2px}
.kpi.viva .v{color:var(--laranja)}
.kpi.mal .v{color:var(--log)}
/* align-items:start para carta de 1 item nao esticar ate a altura da de 12.
   O grid iguala a altura da linha por padrao, e sobra branco no meio. */
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;
        align-items:start}
.carta{background:var(--painel-2);border:1px solid var(--linha);border-radius:10px;
       padding:15px 17px 12px}
.carta h4{margin:0 0 2px;font-size:13px;font-weight:600;letter-spacing:-.01em}
.carta .leg{font-size:11px;color:var(--texto-3);margin:0 0 12px}
.carta svg{width:100%;height:auto;display:block;overflow:visible}
.carta.larga{grid-column:1/-1}
.vazioc{color:var(--texto-3);font-size:12.5px;font-style:italic;padding:14px 0}

/* O phx-grid traz o proprio tema claro. Aqui ele passa a seguir o do
   console: os tokens dele apontam para os nossos, e o sol/lua troca os dois
   ao mesmo tempo. Sem isso, no tema escuro o grid ficaria branco no meio da
   pagina preta. */
.phx-grid{
  --phx-bg:var(--painel); --phx-bg2:var(--painel-2); --phx-fg:var(--texto);
  --phx-meta:var(--texto-3); --phx-borda:var(--linha); --phx-acc:var(--laranja);
  font-family:"Exo 2","Helvetica Neue",Arial,sans-serif;
}
.phx-grid input,.phx-grid select,.phx-grid button{
  background:var(--painel-2);color:var(--texto);border-color:var(--linha-forte);
}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
thead th{
  position:sticky;top:0;background:var(--painel-2);z-index:1;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500;white-space:nowrap;
}
tbody tr:hover{background:var(--painel-2)}
td.dado{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.nulo{color:var(--texto-3);font-style:italic}
.rolo{overflow:auto;border:1px solid var(--linha);border-radius:8px;background:var(--painel)}

.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--linha);border:1px solid var(--linha);border-radius:8px;overflow:hidden;margin-bottom:20px}
.ficha{background:var(--painel);padding:13px 15px}
.ficha .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ficha .r{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--texto-3);margin-top:4px}

.pino{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;
  border:1px solid currentColor;white-space:nowrap;
}
.pino.ok{color:var(--ok)} .pino.nao{color:var(--texto-3)} .pino.mal{color:var(--vermelho)}
.pino.reg{color:var(--reg)} .pino.ndx{color:var(--ndx)} .pino.bin{color:var(--bin)}
.pino.memo{color:var(--memo)} .pino.log{color:var(--log)}

h3{font-size:13px;font-weight:600;margin:26px 0 10px;color:var(--texto-2)}
h3:first-child{margin-top:0}
.aviso{
  border-left:2px solid var(--ambar);background:rgba(255,196,61,.07);
  padding:11px 14px;border-radius:0 6px 6px 0;font-size:12.5px;
  color:var(--texto-2);margin:16px 0;
}
.aviso.mal{border-left-color:var(--vermelho);background:rgba(255,95,95,.07)}
.centro{display:grid;place-items:center;height:100%;color:var(--texto-3);
  text-align:center;font-size:13.5px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function api(op, params = {}) {

// ---------------------------------------------------------------------
// Desafio-resposta. Base64 tira a senha do olho de quem passa; isto tira a
// senha do FIO. Quem grava o pacote nao consegue reproduzir a prova, porque
// o nonce do servidor vale uma vez so.
//
// Depende de crypto.subtle, que so existe em contexto seguro: https, ou
// http em 127.0.0.1. Fora disso a interface cai no Base64 e avisa.
// ---------------------------------------------------------------------
const podeProvar = () => !!(window.crypto && crypto.subtle && crypto.subtle.deriveBits);

const bytesDeHex = h => Uint8Array.from(h.match(/../g) || [], b => parseInt(b, 16));
const hexDeBytes = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");

/// Assina o MESMO desafio da senha, com a chave privada Ed25519.
///
/// Segundo fator: a senha prova que voce sabe, a chave prova que voce tem.
/// Depende de crypto.subtle com Ed25519 -- que e recente. Sem ele, a pagina
/// diz para usar a linha de comando em vez de fingir que assinou.
async function assinarDesafio(chaveHex, nonce, nonceCliente, usuario) {
  if (!/^[0-9a-fA-F]{64}$/.test(chaveHex))
    throw new Error("a chave privada tem 64 hexadecimais");
  let chave;
  try {
    chave = await crypto.subtle.importKey(
      "raw", bytesDeHex(chaveHex), { name:"Ed25519" }, false, ["sign"]);
  } catch {
    throw new Error("este navegador não assina Ed25519; entre sem chave por "
                  + "um cliente de linha de comando");
  }
  const msg = new TextEncoder().encode(`${nonce},${nonceCliente},${usuario}`);
  return hexDeBytes(await crypto.subtle.sign("Ed25519", chave, msg));
}

async function calcularProva(senha, salHex, iteracoes, nonce, nonceCliente, usuario) {
  const cru = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  const dk = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt: bytesDeHex(salHex), iterations: iteracoes, hash:"SHA-256" },
    cru, 256);
  const chave = await crypto.subtle.importKey(
    "raw", dk, { name:"HMAC", hash:"SHA-256" }, false, ["sign"]);
  const msg = new TextEncoder().encode(`${nonce},${nonceCliente},${usuario}`);
  return hexDeBytes(await crypto.subtle.sign("HMAC", chave, msg));
}

function demo(op, p) {
  const d = DEMO, nome = (p.tabela||"").split(".").pop();
  switch (op) {
    case "ping": return {phxsql:"0.3.0", papel:"isolado", conexoes:1};
    case "bancos": return d.bancos;
    case "tabelas": return {database:p.database, ...(d.tabelas[p.database]||{schemas:[],tabelas:[]})};
    case "esquema": return d.esquema[nome] || {tabela:nome,registros:0,slots:0,colunas:[],indices:[],chaves_estrangeiras:[],paginacao:null};
    case "varrer": {
      const l = [...d.linhas];
      if (p.indice === "porNome") l.sort((a,b)=>a.nome.localeCompare(b.nome));
      if (p.indice === "porCidadeLimite") l.sort((a,b)=>
        a.cidade.localeCompare(b.cidade) || parseFloat(b.limite)-parseFloat(a.limite));
      return {total:l.length, devolvidas:l.length,
              ordem:p.indice?`indice ${p.indice}`:"digitacao", linhas:l};
    }
    case "diario": return {total:d.diario.length, eventos:d.diario};
    case "verificar": return {tabela:nome, registros:6, slots:7, eventos:8,
      indices:{porId:6,porNome:6,porCidadeLimite:6}, volumes:{reg:4,bin:1,memo:1,log:1}};
    case "usuarios": return d.usuarios;
    case "acessos": return {total:d.acessos.length, acessos:[...d.acessos].reverse()};
    case "bloqueios": return {arquivo:"blacklist.json", ativos:d.bloqueios};
    default: throw new Error("operação sem demonstração: " + op);
  }
}

// Utilidades de tela

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/** Recado curto no rodape da barra, que some sozinho.
 *
 * Um `alert()` interromperia quem esta trabalhando para dizer "backup
 * pronto"; um recado que aparece e sai nao interrompe ninguem. Erro fica
 * mais tempo, porque erro se le. */
let sumicoDoAviso = null;
function avisar(texto, ehErro) {
  const alvo = $("#aviso");
  if (!alvo) return;
  alvo.textContent = texto;
  alvo.className = "recado" + (ehErro ? " mal" : "");
  alvo.hidden = false;
  clearTimeout(sumicoDoAviso);
  sumicoDoAviso = setTimeout(() => { alvo.hidden = true; }, ehErro ? 9000 : 4000);
}

function tabela(colunas, linhas, montar) {
  if (!linhas.length) return `<div class="vazio">nada aqui</div>`;
  return `<div class="rolo"><table><thead><tr>${
    colunas.map(c=>`<th class="${c.cls||""}">${esc(c.t)}</th>`).join("")
  }</tr></thead><tbody>${linhas.map(montar).join("")}</tbody></table></div>`;
}

function celulaValor(v) {
  if (v === null || v === undefined) return `<td class="dado nulo">NULL</td>`;
  if (typeof v === "number") return `<td class="dado num">${v}</td>`;
  const s = String(v);
  return `<td class="dado">${esc(s.length > 60 ? s.slice(0,57)+"…" : s)}</td>`;
}

async function detectarModo() {
  try {
    // /saude nao pede token e nao conta tentativa: e so o sinal de vida.
    const r = await fetch("/saude");
    if (!r.ok) throw new Error("sem servidor");
    const saude = await r.json();
    est.demo = false;
    // A porta que aparece no formulario e a que o servidor REALMENTE escuta,
    // lida dele. O 5000 e so o padrao de fabrica.
    est.portaLocal = saude.porta_dados || 5000;
    est.servidores = saude.servidores || [];
    $("#pt").value = est.portaLocal;
    $("#campoChave").hidden = !saude.exige_chave;
    if (est.servidores.length) {
      $("#h").setAttribute("list", "servidores");
      const dl = document.createElement("datalist");
      dl.id = "servidores";
      for (const d of est.servidores) {
        const o = document.createElement("option");
        o.value = d.split(":")[0];
        dl.appendChild(o);
      }
      document.body.appendChild(dl);
    }
    $("#modo").innerHTML = "Servidor encontrado nesta origem. Informe o token do "
      + "<code>config.json</code> e as suas credenciais.<br>"
      + (podeProvar()
          ? "Login por <b>desafio&#8209;resposta</b>: a senha não sai desta máquina."
          : "Contexto não seguro: o login cai em <b>Base64</b>, que esconde a senha "
            + "de quem olha, não de quem captura. Use HTTPS ou um túnel.");
    $("#t").parentElement.hidden = false;
  } catch {
    est.demo = true;
    $("#modo").innerHTML = "<b>Nenhum servidor nesta origem.</b> A interface abre em "
      + "modo demonstração, com dados embutidos, para ser avaliada antes de instalar. "
      + "Entre com qualquer coisa.";
    $("#t").parentElement.hidden = true;
    $("#s").value = "demonstracao";
  }
}

/// Este endereco e o proprio servidor que serviu a pagina?
function ehLocal(host, porta) {
  const h = (host || "").trim().toLowerCase();
  const aqui = h === "" || h === "localhost" || h === "127.0.0.1" || h === "::1"
            || h === location.hostname.toLowerCase();
  return aqui && Number(porta) === Number(est.portaLocal);
}

async function entrar() {
  const usuario = $("#u").value.trim(), senha = $("#s").value, token = $("#t").value;
  const host = $("#h").value.trim(), porta = $("#pt").value.trim() || "5000";
  const chave = $("#k").value.trim();
  const recado = $("#recado");
  recado.className = "recado info"; recado.textContent = "Conferindo…";
  est.token = token;
  est.database = $("#db").value.trim();
  // So manda "servidor" quando for OUTRO servidor. Para o proprio, o caminho
  // curto continua sendo o caminho curto.
  est.servidor = ehLocal(host, porta) ? "" : `${host}:${porta}`;
  try {
    if (est.demo) {
      est.usuario = { nome:"Adriano Boller", login:usuario||"demo", supervisor:true };
    } else if (podeProvar()) {
      // Caminho bom: a senha nao sai desta maquina.
      recado.textContent = "Derivando a prova…";
      const d = await api("desafio",
        est.servidor ? { usuario, servidor: est.servidor } : { usuario });
      const nonceCliente = hexDeBytes(crypto.getRandomValues(new Uint8Array(12)));
      const prova = await calcularProva(
        senha, d.sal, d.iteracoes, d.nonce, nonceCliente, usuario);
      const pedido = { usuario, prova, nonce_cliente:nonceCliente };
      if (est.servidor) pedido.servidor = est.servidor;
      if (chave) {
        recado.textContent = "Assinando o desafio…";
        pedido.assinatura = await assinarDesafio(chave, d.nonce, nonceCliente, usuario);
      }
      est.usuario = await api("login", pedido);
    } else {
      // Reserva: Base64. Nao e cifra -- so tira a senha do olho e do escape
      // do JSON. O que protege de verdade e o tunel.
      const b64 = s => btoa(unescape(encodeURIComponent(s)));
      const pedido = { usuario_b64:b64(usuario), senha_b64:b64(senha) };
      if (est.servidor) pedido.servidor = est.servidor;
      est.usuario = await api("login", pedido);
    }
    await abrirApp();
  } catch (e) {
    recado.className = "recado erro";
    recado.textContent = e.message || "não consegui entrar";
  }
}

async function abrirApp() {
  $("#entrada").style.display = "none";
  $("#app").classList.add("ativo");
  $("#selo").hidden = !est.demo;
  $("#eu").innerHTML = `<b>${esc(est.usuario.login)}</b>`
    + (est.usuario.supervisor ? " · supervisor" : "");
  const p = await api("ping");
  $("#fita").textContent = `v${p.phxsql} · papel ${p.papel}`;
  ligarMenu();
  montarFerramentas();
  ligarAtalhos();
  await montarArvore();
  // O campo "Database" do login abre a arvore ja na primeira tabela
  // desse banco, em vez de deixar o usuario procurar.
  if (est.database) {
    const primeira = document.querySelector(
      `.no.tab[data-db="${CSS.escape(est.database)}"]`);
    if (primeira) primeira.click();
  }
}

async function montarArvore() {
  const bancos = await api("bancos");
  est.bancos = bancos;
  let html = `<div class="no painel" data-admin="painel"><span class="ic">◎</span>Painel</div>
    <div class="grupo">Bancos de dados</div>`;
  for (const b of bancos) {
    const t = await api("tabelas", { database:b });
    html += `<div class="no db" data-db="${esc(b)}"><span class="ic">▾</span>${esc(b)}</div>`;
    const raiz = t.tabelas.filter(x => !x.includes("."));
    const porEsq = {};
    for (const x of t.tabelas.filter(x => x.includes("."))) {
      const [e, n] = x.split(".");
      (porEsq[e] ||= []).push(n);
    }
    for (const n of raiz)
      html += `<div class="no tab" data-db="${esc(b)}" data-tab="${esc(n)}">
        <span class="ic">▤</span>${esc(n)}</div>`;
    for (const e of Object.keys(porEsq).sort()) {
      html += `<div class="no esq"><span class="ic">▾</span>${esc(e)}</div>`;
      for (const n of porEsq[e])
        html += `<div class="no tab emesq" data-db="${esc(b)}" data-tab="${esc(e)}.${esc(n)}">
          <span class="ic">▤</span>${esc(n)}</div>`;
    }
    if (!t.tabelas.length) html += `<div class="vazio">sem tabelas</div>`;
  }
  html += `<div class="grupo">Administração</div>`;
  for (const [chave, rotulo, ic] of
       [["usuarios","Usuários","◉"],["acessos","Acessos","◈"],["bloqueios","Bloqueios","⛔"]])
    html += `<div class="no" data-admin="${chave}"><span class="ic">${ic}</span>${rotulo}</div>`;

  const a = $("#arvore");
  a.innerHTML = html;
  a.querySelectorAll("[data-tab]").forEach(n => n.onclick = () => {
    marcar(n); abrirTabela(n.dataset.db, n.dataset.tab);
  });
  a.querySelectorAll("[data-admin]").forEach(n => n.onclick = () => {
    marcar(n); abrirAdmin(n.dataset.admin);
  });

  // O painel e a primeira tela: quem entra ve o servidor inteiro antes de
  // escolher uma tabela.
  a.querySelector('[data-admin="painel"]').click();
}

function marcar(no) {
  document.querySelectorAll(".no.sel").forEach(x => x.classList.remove("sel"));
  no.classList.add("sel");

async function desenharAba() {
  const p = $("#painel");

    if (est.aba === "estrutura")   return p.innerHTML = await vEstrutura(db, tab);

    if (est.aba === "indices")     return p.innerHTML = await vIndices(db, tab);
    if (est.aba === "diario")      return p.innerHTML = await vDiario(db, tab);

async function vEstrutura(database, tabela_) {
  const e = await api("esquema", { database, tabela:tabela_ });
  const pag = e.paginacao;
  const fichas = [
    ["registros", e.registros], ["slots usados", e.slots],
    ["colunas", e.colunas.length], ["índices", e.indices.length],
    ["chaves estrangeiras", (e.chaves_estrangeiras||[]).length],
    ["paginação", pag ? `${pag.registros_por_arquivo}/arq` : "não"]
  ];
  let h = `<div class="fichas">${fichas.map(([r,v]) =>
    `<div class="ficha"><div class="v">${esc(v)}</div><div class="r">${r}</div></div>`).join("")}</div>`;

  h += `<h3>Colunas</h3>` + tabela(
    [{t:"#",cls:""},{t:"nome"},{t:"tipo"},{t:"obrigatória"},{t:"onde mora"}],
    e.colunas, (c,i) => {
      const ext = c.tipo === "Bin" ? "bin" : c.tipo === "Memo" ? "memo" : "reg";
      const nota = c.tipo === "Uuid" ? " 16 bytes"
                 : c.tipo === "Uuid256" ? " 32 bytes"
                 : c.tipo === "Sequence" ? " conta sozinha" : "";
      return `<tr><td class="num dado">${i}</td><td class="dado">${esc(c.nome)}</td>
        <td class="dado">${esc(c.tipo)}<span class="leg">${nota}</span></td>
        <td>${c.nullable ? '<span class="pino nao">nulo ok</span>' : '<span class="pino ok">not null</span>'}</td>
        <td><span class="pino ${ext}">.${ext}</span></td></tr>`;
    });

  if ((e.chaves_estrangeiras||[]).length) {
    h += `<h3>Chaves estrangeiras</h3>` + tabela(
      [{t:"nome"},{t:"colunas"},{t:"referencia"},{t:"ao excluir"},{t:"ao alterar"}],
      e.chaves_estrangeiras, f =>
        `<tr><td class="dado">${esc(f.nome)}</td><td class="dado">${esc(f.colunas.join(", "))}</td>
         <td class="dado">${esc(f.tabela_ref)}(${esc(f.colunas_ref.join(", "))})</td>
         <td>${esc(f.ao_excluir)}</td><td>${esc(f.ao_alterar)}</td></tr>`);
  }

  if (pag) h += `<div class="aviso">Tabela paginada: <b>${pag.registros_por_arquivo}</b>
    registros por arquivo × <b>${pag.max_arquivos}</b> arquivos =
    capacidade de <b>${pag.capacidade}</b> registros. O volume sai do rowid por divisão,
    então o <code>.ndx</code> não sabe que volume existe.</div>`;
  return h;
}

/// Mapeia o tipo do PhxSql no tipo que o grid entende.
///
/// So os que mudam a apresentacao: numero alinha a direita, moeda formata,
/// data ordena por instante. O resto e texto, e texto e o padrao do grid.
function tipoDoGrid(t) {
  // Sequence antes de UInt: ela chega como numero, mas nao e quantidade --
  // somar identificadores nao quer dizer nada.
  if (t === "Sequence") return "numero";
  if (/^Int|^UInt/.test(t)) return "numero";
  if (/^Decimal/.test(t)) return "moeda";
  if (t === "Date") return "data";           // sem hora, porque nao ha hora
  if (t === "DateTime" || t === "Time") return "dataHora";
  return "texto";                            // Uuid e Uuid256 vem em texto
}

function ligarConteudo() {
  const s = $("#ord");
  if (s) s.onchange = () => { est.ordem = s.value; desenharAba(); };
  const t = $("#teto");
  if (t) t.onchange = () => { est.teto = Number(t.value); desenharAba(); };

  const alvo = $("#grade");
  if (!alvo || !window.PhxGrid || !est.esquemaAtual) return;

  // O grid do Phoenix, com a faixa de agrupamento ligada. As colunas saem do
  // esquema da tabela -- nada e escrito a mao aqui, entao tabela nova aparece
  // certa sem ninguem mexer nesta pagina.
  const colunas = [{ campo:"rowid", titulo:"rowid", tipo:"numero", largura:90 }]
    .concat(est.esquemaAtual.colunas.map(c => ({
      campo: c.nome,
      titulo: c.nome,
      tipo: tipoDoGrid(c.tipo),
      // Somar sequencia ou id nao significa nada; so quantidade soma.
      agregador: c.tipo !== "Sequence" && /^Int|^UInt|^Decimal/.test(c.tipo) ? "sum" : null
    })));

  if (est.grade && est.grade.destruir) { try { est.grade.destruir(); } catch {} }
  // Exposto para teste automatizado e para o console do navegador.
  est.grade = window.__phxgrade = PhxGrid.criar("#grade", {
    agrupavel: true,
    buscaGlobal: true,
    colunas: colunas,
    dados: est.linhas,
    pagina: { tamanho: 100, opcoes: [50, 100, 200] }
  });
}

// =====================================================================
// Administração
// =====================================================================
// =====================================================================
// Gráficos do painel. SVG escrito à mão, como o resto do projeto: são
// barras, área e anel — e uma biblioteca de gráfico não diria mais nada
// do que isso diz, ao custo de uma dependência.
//
// Todos usam currentColor e as variáveis do tema, então trocam de cor com
// o sol/lua sem nenhuma linha a mais.
// =====================================================================

const fmt = n => (n ?? 0).toLocaleString("pt-BR");
function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B","KB","MB","GB","TB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0).replace(".", ",") + " " + u[i];
}

/// Barras horizontais. Boa para nome longo, que é o caso de tabela e de IP.
function barras(itens, opc = {}) {
  if (!itens.length) return `<div class="vazioc">sem dados ainda</div>`;
  // Largura próxima da real do cartão: o SVG escala o desenho INTEIRO, então
  // um viewBox largo demais encolhe o texto junto — 12 px viram 7 px.
  const L = opc.largura ?? 360;
  const alt = 24, teto = Math.max(...itens.map(i => i.valor), 1);
  const larguraRotulo = opc.rotulo ?? 120;
  const h = itens.length * alt + 6;
  const linhas = itens.map((it, k) => {
    const y = k * alt + 4;
    const util = L - larguraRotulo - (opc.texto ?? 78);
    const w = Math.max(1, (it.valor / teto) * util);
    const segundo = it.segundo || 0;
    const w2 = segundo ? Math.max(1, (segundo / teto) * util) : 0;
    return `<g>
      <text x="0" y="${y + 14}" font-size="11.5" fill="currentColor" opacity=".85">${esc(it.nome)}</text>
      <rect x="${larguraRotulo}" y="${y + 4}" width="${w.toFixed(1)}" height="13" rx="3"
            fill="${it.cor || "var(--laranja)"}" opacity=".9"/>
      ${segundo ? `<rect x="${(larguraRotulo + w).toFixed(1)}" y="${y + 4}" width="${w2.toFixed(1)}"
            height="13" rx="3" fill="var(--log)" opacity=".85"/>` : ""}
      <text x="${(larguraRotulo + w + w2 + 7).toFixed(1)}" y="${y + 14}" font-size="10.5"
            font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".7">${esc(it.texto ?? fmt(it.valor))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${L} ${h}" role="img" aria-label="${esc(opc.titulo || "gráfico de barras")}">${linhas}</svg>`;
}

/// Área ao longo do tempo. Vinte e quatro baldes de uma hora.
function areaHoras(serie, recusadas) {
  // Carta larga: o viewBox nasce largo, senão o texto sairia esticado 2×.
  const L = 1180, A = 210, base = A - 30, topo = 16;
  const teto = Math.max(...serie, 1);
  const px = i => (i / (serie.length - 1)) * (L - 24) + 12;
  const py = v => base - (v / teto) * (base - topo);
  const linha = serie.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area = `12,${base} ${linha} ${(L - 12)},${base}`;
  const barrasRec = recusadas.map((v, i) =>
    v ? `<rect x="${(px(i) - 3).toFixed(1)}" y="${py(v).toFixed(1)}" width="6"
             height="${(base - py(v)).toFixed(1)}" fill="var(--log)" opacity=".75"/>` : "").join("");
  const marcas = [0, 4, 8, 12, 16, 20, 23].map(i =>
    `<text x="${px(i).toFixed(1)}" y="${A - 10}"
           text-anchor="${i === 23 ? "end" : i === 0 ? "start" : "middle"}"
           font-size="11" fill="currentColor" opacity=".55">${i === 23 ? "agora" : (23 - i) + "h"}</text>`).join("");
  // Grade, para o olho medir a altura sem contar pixel.
  const grade = [0.5, 1].map(f =>
    `<line x1="12" y1="${py(teto * f).toFixed(1)}" x2="${L - 12}" y2="${py(teto * f).toFixed(1)}"
           stroke="currentColor" stroke-width="1" opacity=".12" stroke-dasharray="3 4"/>
     <text x="${L - 12}" y="${(py(teto * f) - 4).toFixed(1)}" text-anchor="end" font-size="10"
           fill="currentColor" opacity=".45">${fmt(Math.round(teto * f))}</text>`).join("");
  return `<svg viewBox="0 0 ${L} ${A}" role="img"
    aria-label="Operações por hora nas últimas 24 horas, com as recusadas destacadas">
    ${grade}
    <line x1="12" y1="${base}" x2="${L - 12}" y2="${base}" stroke="currentColor" stroke-width="1" opacity=".25"/>
    <polygon points="${area}" fill="var(--laranja)" opacity=".16"/>
    <polyline points="${linha}" fill="none" stroke="var(--laranja)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
    ${barrasRec}
    <text x="12" y="${topo - 4}" font-size="11" fill="currentColor" opacity=".55">operações por hora</text>
    ${marcas}
  </svg>`;
}

/// Anel. Para composição — quantos usuários de cada nível.
function anel(fatias) {
  const total = fatias.reduce((a, f) => a + f.valor, 0);
  if (!total) return `<div class="vazioc">sem dados ainda</div>`;
  const R = 52, r = 33, cx = 70, cy = 70;
  let ang = -Math.PI / 2;
  const arcos = fatias.map(f => {
    const passo = (f.valor / total) * Math.PI * 2;
    const [a0, a1] = [ang, ang + passo];
    ang = a1;
    const grande = passo > Math.PI ? 1 : 0;
    const p = (raio, a) => `${(cx + raio * Math.cos(a)).toFixed(2)},${(cy + raio * Math.sin(a)).toFixed(2)}`;
    // Fatia única vira anel inteiro: o arco de 360° some, porque começa e
    // termina no mesmo ponto.
    if (fatias.length === 1 || passo >= Math.PI * 2 - 1e-6)
      return `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none"
                stroke="${f.cor}" stroke-width="${R - r}"/>`;
    return `<path d="M${p(R, a0)} A${R},${R} 0 ${grande},1 ${p(R, a1)}
              L${p(r, a1)} A${r},${r} 0 ${grande},0 ${p(r, a0)} Z" fill="${f.cor}"/>`;
  }).join("");
  const legenda = fatias.map((f, i) =>
    `<g transform="translate(150,${28 + i * 21})">
       <rect width="11" height="11" rx="2" fill="${f.cor}"/>
       <text x="18" y="10" font-size="12" fill="currentColor">${esc(f.nome)}</text>
       <text x="150" y="10" font-size="12" text-anchor="end"
             font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".7">${f.valor}</text>
     </g>`).join("");
  return `<svg viewBox="0 0 320 ${Math.max(145, 34 + fatias.length * 21)}" role="img"
    aria-label="Composição: ${fatias.map(f => f.nome + " " + f.valor).join(", ")}">
    ${arcos}
    <text x="${cx}" y="${cy + 1}" text-anchor="middle" font-size="20" font-weight="700"
          fill="currentColor">${total}</text>
    <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="9.5"
          fill="currentColor" opacity=".55">TOTAL</text>
    ${legenda}
  </svg>`;
}

  const kpi = (v, r, u, classe) =>

       <div class="r">${r}</div>${u ? `<div class="u">${u}</div>` : ""}</div>`;

  const kpis = [
    kpi(fmt(s.bancos), "bancos", s.tabelas === 1 ? "1 tabela" : `${fmt(s.tabelas)} tabelas`),
    kpi(fmt(s.registros), "registros", fmtBytes(s.bytes_reg) + " no .reg"),
    kpi(fmt(s.usuarios), "usuários",
        d.por_nivel.length === 1 ? "1 nível" : `${d.por_nivel.length} níveis`),
    kpi(fmt(s.conexoes), "conexões",
        s.sessoes_web === 1 ? "1 sessão web" : `${fmt(s.sessoes_web)} sessões web`, "viva"),
    kpi(fmt(s.acessos), "acessos", `${s.ms_medio} ms em média`),

        s.acessos_recusados ? "mal" : ""),
    kpi(fmt(s.bloqueios), "IPs bloqueados", "", s.bloqueios ? "mal" : ""),
    kpi(fmt(s.tabelas_em_ram), "em memória", fmtBytes(s.bytes_em_ram)),

  const carta = (titulo, legenda, corpo, larga) =>
    `<div class="carta ${larga ? "larga" : ""}"><h4>${titulo}</h4>

  const CORES = { admin:"var(--vermelhao)", dono:"var(--laranja)", operador:"var(--ambar)",
                  leitor:"var(--reg)", nenhum:"var(--texto-3)" };

  return `<div class="kpis">${kpis}</div><div class="cartas">
    ${carta("Operações por hora", "últimas 24 horas · as barras vermelhas são as recusadas",
        areaHoras(d.por_hora, d.recusadas_por_hora), true)}
    ${carta("Operações mais pedidas", "verde é o que passou, vermelho o que foi recusado",
        barras(d.por_operacao.map(o => ({ nome:o.op, valor:o.ok, segundo:o.recusados,
          texto: o.recusados ? `${fmt(o.ok)} + ${fmt(o.recusados)}✕` : fmt(o.ok) })),
          { rotulo:112, titulo:"Operações mais pedidas" }))}
    ${carta("Usuários por nível", "quem pode o quê, do config.json",
        anel(d.por_nivel.map(n => ({ nome:n.nivel, valor:n.quantos, cor:CORES[n.nivel] || "var(--texto-3)" }))))}
    ${carta("Maiores tabelas", "por registro · o tamanho é o do .reg",
        barras(d.maiores_tabelas.map(t => ({ nome:t.tabela, valor:t.registros,
          texto: `${fmt(t.registros)} · ${fmtBytes(t.bytes)}` })), { rotulo:150, texto:104 }))}
    ${carta("De onde vêm", "por IP · vermelho é o que foi recusado",
        barras(d.top_ips.map(i => ({ nome:i.ip, valor:i.acessos - i.recusados, segundo:i.recusados,
          texto: fmt(i.acessos) })), { rotulo:118 }))}
    ${carta("Bancos", "tabelas por banco de dados",
        barras(d.bancos.map(b => ({ nome:b.nome, valor:b.tabelas,
          texto: `${b.tabelas} tab · ${fmt(b.registros)} reg`, cor:"var(--reg)" })), { rotulo:104, texto:104 }))}
    ${carta("Quem mais usou", "por login, no log inteiro",
        barras(d.usuarios_ativos.map(u => ({ nome:u.usuario, valor:u.acessos, cor:"var(--memo)" })),
          { rotulo:112 }))}

}

function montarFerramentas() {
  $("#ferramentas").innerHTML = FERRAMENTAS.map((f, i) => {
    if (f === "risco") return `<div class="risco" role="separator"></div>`;
    const pendente = !!f.falta && !f.faz;
    return `<button class="fer${pendente ? " afazer" : ""}"
      data-f="${i}" style="color:${f.cor}"
      title="${esc(f.rot)}${pendente ? " · ainda não existe" : ""}">
      ${svg(f.ico)}<span class="rot">${esc(f.rot)}</span></button>`;
  }).join("");

  $("#ferramentas").onclick = ev => {
    const b = ev.target.closest(".fer");
    if (!b) return;
    const f = FERRAMENTAS[+b.dataset.f];
    if (!f.faz) return aindaNao(f);
    Promise.resolve().then(f.faz).catch(e => avisar(`${e}`, true));
  };
}

async function abrirConsulta() {
  folha("Consulta", "SelectMemory — a consulta que não toca o disco",
    `<div class="nota">
       <p><strong>Isto não é SQL.</strong> O PhxSql não tem camada SQL: não há
       parser nem executor. O que existe é o <code>SelectMemory</code>, que
       consulta uma tabela já carregada na RAM.</p>
     </div>
     <div class="form-consulta">
       <label>Database <input id="cDb" value="${esc(est.atual ? est.atual.db : (est.database || ""))}"></label>
       <label>Tabela <input id="cTab" value="${esc(est.atual ? est.atual.tab : "")}"></label>
       <label>Coluna <input id="cCol" placeholder="nome da coluna"></label>
       <label>Operador
         <select id="cOp">
           <option value="igual">=</option><option value="diferente">≠</option>
           <option value="menor">&lt;</option><option value="maior">&gt;</option>
           <option value="contem">contém</option><option value="comeca">começa com</option>
         </select></label>
       <label>Valor <input id="cVal" placeholder="deixe vazio para trazer tudo"></label>
       <label>Máximo <input id="cMax" type="number" value="200" min="1"></label>
       <button class="botao" id="btConsultar">Consultar</button>
     </div>
     <div id="saidaConsulta"><p class="leg">A tabela precisa estar na RAM:
       menu <b>Memória → Carregar esta tabela</b>.</p></div>`);

  $("#btConsultar").onclick = async () => {
    const saida = $("#saidaConsulta");
    saida.innerHTML = `<div class="centro">consultando…</div>`;
    try {
      const onde = $("#cCol").value.trim()
        ? [{ coluna: $("#cCol").value.trim(), op: $("#cOp").value, valor: $("#cVal").value }]
        : [];
      const r = await api("selecionar_memoria", {
        database: $("#cDb").value.trim(),
        tabela: $("#cTab").value.trim(),
        onde,
        max: +$("#cMax").value || 200,
      });
      const linhas = r.linhas || [];
      const cols = linhas.length ? Object.keys(linhas[0]) : [];
      saida.innerHTML =
        `<p class="leg">${r.achadas ?? linhas.length} achadas de
         ${r.examinadas ?? "?"} examinadas${r.por_mapa
           ? ` · atalho pelo mapa de <code>${esc(r.por_mapa)}</code>` : ""}</p>` +
        (linhas.length
          ? tabela(cols.map(c => ({ t: c })), linhas,
              l => `<tr>${cols.map(c => `<td class="dado">${celulaValor(l[c])}</td>`).join("")}</tr>`)
          : `<div class="vazio">nada encontrado</div>`);
    } catch (e) {
      saida.innerHTML = `<div class="nota"><p>${esc(String(e))}</p>
        <p class="leg">A tabela está na RAM? Menu <b>Memória → Carregar esta tabela</b>.</p></div>`;
    }
  };
}

    const rotulo = letra && nome.includes(letra)
      ? nome.replace(letra, `<u>${letra}</u>`)
      : `<u>${nome[0]}</u>${nome.slice(1)}`;
    const linhas = itens.map((it, j) => {
      if (it === "sep") return `<div class="sep" role="separator"></div>`;
      const off = it.quando && !it.quando();
      return `<button class="item" role="menuitem" data-m="${i}" data-i="${j}"
        ${off ? "disabled" : ""}><span class="ico">${it.ico || ""}</span
        ><span class="rot">${esc(it.rot)}</span
        ><span class="tecla">${it.tecla || ""}</span></button>`;
    }).join("");
    return `<div class="menu" data-m="${i}">
      <button class="titulo" role="menuitem" aria-haspopup="true"
              aria-expanded="false" data-m="${i}">${rotulo}</button>
      <div class="lista" role="menu" aria-label="${esc(nome)}">${linhas}</div>
    </div>`;
  }).join("");
}

/** Acende e apaga os itens conforme o estado de agora.
 *
 * Atualiza o `disabled` dos botoes que ja existem, em vez de refazer o
 * `innerHTML` da barra. Refazer parecia mais simples e tinha um defeito
 * sutil: o clique que abria o menu destruia o proprio elemento clicado, o
 * `ev.target` virava um no solto, e o `closest("#menubar")` do
 * fechar-ao-clicar-fora devolvia `null` -- entao o menu fechava no mesmo
 * clique que o abriu. So apareceu no teste de navegador. */
function atualizarItens() {
  $$(".menubar .item").forEach(b => {
    const entrada = MENUS[+b.dataset.m][2][+b.dataset.i];
    b.disabled = !!(entrada.quando && !entrada.quando());
  });
}

let menuAberto = null;

function fecharMenu() {
  if (menuAberto === null) return;
  const m = $(`.menubar .menu[data-m="${menuAberto}"]`);
  if (m) {
    m.classList.remove("aberto");
    m.querySelector(".titulo").setAttribute("aria-expanded", "false");
  }
  menuAberto = null;
}

function abrirMenu(i) {
  if (menuAberto === i) return fecharMenu();
  fecharMenu();
  // O "cinza porque nao ha tabela aberta" tem de refletir o estado de AGORA,
  // e nao o de quando a pagina carregou.
  atualizarItens();
  const m = $(`.menubar .menu[data-m="${i}"]`);
  if (!m) return;
  m.classList.add("aberto");
  m.querySelector(".titulo").setAttribute("aria-expanded", "true");
  menuAberto = i;
}

function itensVisiveis(i) {
  return [...$$(`.menubar .menu[data-m="${i}"] .item:not(:disabled)`)];
}

function ligarMenu() {
  montarMenu();
  const bar = $("#menubar");

  bar.addEventListener("click", ev => {
    const t = ev.target.closest(".titulo");
    if (t) { abrirMenu(+t.dataset.m); return; }
    const it = ev.target.closest(".item");
    if (!it || it.disabled) return;
    const entrada = MENUS[+it.dataset.m][2][+it.dataset.i];
    fecharMenu();
    Promise.resolve().then(entrada.faz).catch(e => avisar(`${e}`, true));
  });

  // Passar o mouse por outro titulo com um menu aberto troca de menu, como
  // em qualquer barra de menu que ja se usou.
  bar.addEventListener("mouseover", ev => {
    if (menuAberto === null) return;
    const t = ev.target.closest(".titulo");
    if (t && +t.dataset.m !== menuAberto) abrirMenu(+t.dataset.m);
  });

  document.addEventListener("click", ev => {
    if (!ev.target.closest("#menubar")) fecharMenu();
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && menuAberto !== null) {
      fecharMenu();
      ev.preventDefault();
      return;
    }
    // Alt + letra abre o menu correspondente.
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey) {
      const i = MENUS.findIndex(([n, l]) => l.toLowerCase() === ev.key.toLowerCase());
      if (i >= 0) {
        abrirMenu(i);
        const [primeiro] = itensVisiveis(i);
        if (primeiro) primeiro.focus();
        ev.preventDefault();
        return;
      }
    }
    if (menuAberto === null) return;

    const itens = itensVisiveis(menuAberto);
    const at = itens.indexOf(document.activeElement);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      const passo = ev.key === "ArrowDown" ? 1 : -1;
      const alvo = itens[(at + passo + itens.length) % itens.length] || itens[0];
      if (alvo) alvo.focus();
      ev.preventDefault();
    } else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      const passo = ev.key === "ArrowRight" ? 1 : -1;
      const i = (menuAberto + passo + MENUS.length) % MENUS.length;
      abrirMenu(i);
      const [primeiro] = itensVisiveis(i);
      if (primeiro) primeiro.focus();
      ev.preventDefault();
    }
  });
}

/* ------------------------------------------------------- atalhos globais */
function ligarAtalhos() {
  document.addEventListener("keydown", ev => {
    if (!$("#app").classList.contains("ativo")) return;
    if (ev.target.matches("input, textarea, select")) return;

    if (ev.key === "F5") { ev.preventDefault(); atualizarVista(); return; }
    if (ev.ctrlKey && (ev.key === "b" || ev.key === "B")) {
      ev.preventDefault(); backupAgora(); return;
    }
    if (ev.altKey && ev.key === "1") { ev.preventDefault(); irPara("painel"); return; }
    if (ev.altKey && ev.key === "2" && est.atual) { ev.preventDefault(); irAba("estrutura"); return; }
    if (ev.altKey && ev.key === "3" && est.atual) { ev.preventDefault(); irAba("conteudo"); }
  });
}

function irAba(qual) {
  if (!est.atual) return;

function atualizarVista() {
  if (est.atual) { abrirTabela(est.atual.db, est.atual.tab); return; }
  montarArvore();
  abrirAdmin("painel");
}

/** Mostra um resultado numa folha simples, sem abas.
 *
 * NAO limpa `est.atual` de proposito. Limpava, e isso apagava qual tabela
 * estava aberta: carregar a tabela na RAM pelo menu mostrava uma folha, a
 * folha esquecia a tabela, e a ferramenta de consulta abria com o database
 * vazio -- o erro saia com uma barra solta, `/naoexiste`. Quem escolhe uma
 * tabela na arvore continua com ela escolhida; o que muda e o que esta na
 * tela. */
function folha(titulo, subtitulo, corpoHtml) {
  $("#abas").innerHTML = "";
  $("#titulo").textContent = titulo;
  $("#subtitulo").textContent = subtitulo || "";
  $("#painel").innerHTML = corpoHtml;
}

function fichasDe(obj, rotulos) {
  return `<div class="fichas">` + rotulos.map(([k, r, u]) =>
    `<div class="ficha"><div class="v">${esc(String(obj[k] ?? "—"))}</div>
       <div class="r">${esc(r)}</div>${u ? `<div class="u">${esc(u)}</div>` : ""}</div>`
  ).join("") + `</div>`;
}

async function novoDatabase() {
  const nome = prompt("Nome do database novo:");
  if (!nome) return;
  const r = await api("criar_database", { database: nome.trim() });
  avisar(`database "${esc(r.database || nome)}" criado`);
  await montarArvore();
}

async function backupAgora() {
  const db = est.atual ? est.atual.db : (est.database || "");
  const alvo = prompt("Database para o backup (vazio = todos):", db);
  if (alvo === null) return;
  folha("Backup", "copiando e conferindo…", `<div class="centro">rodando…</div>`);
  const r = await api("backup", alvo.trim() ? { database: alvo.trim() } : {});
  folha("Backup", r.zip ? "em zip, com manifesto SHA-256" : "com manifesto SHA-256",
    fichasDe(r, [["destino","destino"],["arquivos","arquivos"],
                 ["bytes","bytes"],["segundos","segundos"]]) +
    `<pre class="dado">${esc(JSON.stringify(r, null, 1))}</pre>`);
}

async function conferirBackup() {
  const caminho = prompt("Caminho do backup a conferir:");
  if (!caminho) return;
  folha("Conferência do backup", "recalculando o SHA-256 de cada arquivo…",
        `<div class="centro">conferindo…</div>`);
  const r = await api("conferir_backup", { destino: caminho.trim() });
  const ok = r.integro !== false;
  folha("Conferência do backup",
        ok ? "confere com o manifesto" : "NÃO confere com o manifesto",
        fichasDe(r, [["conferidos","conferidos"],["diferentes","diferentes"],
                     ["faltando","faltando"]]) +
        `<pre class="dado">${esc(JSON.stringify(r, null, 1))}</pre>`);
}

  const { db, tab } = est.atual;

    Array.isArray(linhas) && linhas.length
      ? tabela([{t:"tabela"},{t:"linhas",cls:"num"},{t:"bytes",cls:"num"},{t:"carregada em"}],
          linhas, t => `<tr><td class="dado">${esc(t.tabela || t.nome || "—")}</td>

       <div class="ficha"><div class="v">${esc(v)}</div><div class="r">versão</div></div>

         <div class="u">só a std do Rust</div></div>
     </div>
     <p>Motor de dados em Rust no modelo de arquivos separados do HFSQL(R). O
     <code>.reg</code> guarda a ordem em que você digitou, e nada nunca a
     embaralha.</p>
     <p class="leg">Manual completo em <code>MANUAL.txt</code>; formato byte a

function lembrar(chave, valor) {
  try { localStorage.setItem(chave, valor); } catch {}
}
function lembrado(chave) {
  try { return localStorage.getItem(chave); } catch { return null; }
}

function aplicarTema(qual) {
  const claro = qual === "claro";
  document.documentElement.setAttribute("data-tema", claro ? "claro" : "escuro");
  // O icone mostra PARA ONDE o clique leva, nao onde se esta: no escuro
  // aparece o sol, porque clicar acende.
  $("#btTema").textContent = claro ? TEMAS.escuro : TEMAS.claro;
  $("#btTema").title = claro ? "Mudar para o tema escuro" : "Mudar para o tema claro";
  lembrar("phxsql-tema", claro ? "claro" : "escuro");
}

const sistemaClaro = () =>
  window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;

aplicarTema(lembrado("phxsql-tema") || (sistemaClaro() ? "claro" : "escuro"));
$("#btTema").onclick = () =>
  aplicarTema(document.documentElement.getAttribute("data-tema") === "claro"
    ? "escuro" : "claro");

$("#btEntrar").onclick = entrar;
$("#s").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("#t").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("#btSair").onclick = async () => {
  if (!est.demo && est.sessao) { try { await api("sair"); } catch {} }
  location.reload();
};
detectarModo();
