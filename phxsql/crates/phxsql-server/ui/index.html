// o sol/lua sem nenhuma linha a mais.
// =====================================================================

const fmt = n => (n ?? 0).toLocaleString("pt-BR");
function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B","KB","MB","GB","TB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0).replace(".", ",") + " " + u[i];
}

/// Barras horizontais. Boa para nome longo, que é o caso de tabela e de IP.
function barras(itens, opc = {}) {
  if (!itens.length) return `<div class="vazioc">sem dados ainda</div>`;
  // Largura próxima da real do cartão: o SVG escala o desenho INTEIRO, então
  // um viewBox largo demais encolhe o texto junto — 12 px viram 7 px.
  const L = opc.largura ?? 360;
  const alt = 24, teto = Math.max(...itens.map(i => i.valor), 1);
  const larguraRotulo = opc.rotulo ?? 120;
  const h = itens.length * alt + 6;
  const linhas = itens.map((it, k) => {
    const y = k * alt + 4;
    const util = L - larguraRotulo - (opc.texto ?? 78);
    const w = Math.max(1, (it.valor / teto) * util);
    const segundo = it.segundo || 0;
    const w2 = segundo ? Math.max(1, (segundo / teto) * util) : 0;
    return `<g>
      <text x="0" y="${y + 14}" font-size="11.5" fill="currentColor" opacity=".85">${esc(it.nome)}</text>
      <rect x="${larguraRotulo}" y="${y + 4}" width="${w.toFixed(1)}" height="13" rx="3"
            fill="${it.cor || "var(--laranja)"}" opacity=".9"/>
      ${segundo ? `<rect x="${(larguraRotulo + w).toFixed(1)}" y="${y + 4}" width="${w2.toFixed(1)}"
            height="13" rx="3" fill="var(--log)" opacity=".85"/>` : ""}
      <text x="${(larguraRotulo + w + w2 + 7).toFixed(1)}" y="${y + 14}" font-size="10.5"
            font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".7">${esc(it.texto ?? fmt(it.valor))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${L} ${h}" role="img" aria-label="${esc(opc.titulo || "gráfico de barras")}">${linhas}</svg>`;
}

/// Área ao longo do tempo. Vinte e quatro baldes de uma hora.
function areaHoras(serie, recusadas) {
  // Carta larga: o viewBox nasce largo, senão o texto sairia esticado 2×.
  const L = 1180, A = 210, base = A - 30, topo = 16;
  const teto = Math.max(...serie, 1);
  const px = i => (i / (serie.length - 1)) * (L - 24) + 12;
  const py = v => base - (v / teto) * (base - topo);
  const linha = serie.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area = `12,${base} ${linha} ${(L - 12)},${base}`;
  const barrasRec = recusadas.map((v, i) =>
    v ? `<rect x="${(px(i) - 3).toFixed(1)}" y="${py(v).toFixed(1)}" width="6"
             height="${(base - py(v)).toFixed(1)}" fill="var(--log)" opacity=".75"/>` : "").join("");
  const marcas = [0, 4, 8, 12, 16, 20, 23].map(i =>
    `<text x="${px(i).toFixed(1)}" y="${A - 10}"
           text-anchor="${i === 23 ? "end" : i === 0 ? "start" : "middle"}"
           font-size="11" fill="currentColor" opacity=".55">${i === 23 ? "agora" : (23 - i) + "h"}</text>`).join("");
  // Grade, para o olho medir a altura sem contar pixel.
  const grade = [0.5, 1].map(f =>
    `<line x1="12" y1="${py(teto * f).toFixed(1)}" x2="${L - 12}" y2="${py(teto * f).toFixed(1)}"
           stroke="currentColor" stroke-width="1" opacity=".12" stroke-dasharray="3 4"/>
     <text x="${L - 12}" y="${(py(teto * f) - 4).toFixed(1)}" text-anchor="end" font-size="10"
           fill="currentColor" opacity=".45">${fmt(Math.round(teto * f))}</text>`).join("");
  return `<svg viewBox="0 0 ${L} ${A}" role="img"
    aria-label="Operações por hora nas últimas 24 horas, com as recusadas destacadas">
    ${grade}
    <line x1="12" y1="${base}" x2="${L - 12}" y2="${base}" stroke="currentColor" stroke-width="1" opacity=".25"/>
    <polygon points="${area}" fill="var(--laranja)" opacity=".16"/>
    <polyline points="${linha}" fill="none" stroke="var(--laranja)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
    ${barrasRec}
    <text x="12" y="${topo - 4}" font-size="11" fill="currentColor" opacity=".55">operações por hora</text>
    ${marcas}
  </svg>`;
}

/// Anel. Para composição — quantos usuários de cada nível.
function anel(fatias) {
  const total = fatias.reduce((a, f) => a + f.valor, 0);
  if (!total) return `<div class="vazioc">sem dados ainda</div>`;
  const R = 52, r = 33, cx = 70, cy = 70;
  let ang = -Math.PI / 2;
  const arcos = fatias.map(f => {
    const passo = (f.valor / total) * Math.PI * 2;
    const [a0, a1] = [ang, ang + passo];
    ang = a1;
    const grande = passo > Math.PI ? 1 : 0;
    const p = (raio, a) => `${(cx + raio * Math.cos(a)).toFixed(2)},${(cy + raio * Math.sin(a)).toFixed(2)}`;
    // Fatia única vira anel inteiro: o arco de 360° some, porque começa e
    // termina no mesmo ponto.
    if (fatias.length === 1 || passo >= Math.PI * 2 - 1e-6)
      return `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none"
                stroke="${f.cor}" stroke-width="${R - r}"/>`;
    return `<path d="M${p(R, a0)} A${R},${R} 0 ${grande},1 ${p(R, a1)}
              L${p(r, a1)} A${r},${r} 0 ${grande},0 ${p(r, a0)} Z" fill="${f.cor}"/>`;
  }).join("");
  const legenda = fatias.map((f, i) =>
    `<g transform="translate(150,${28 + i * 21})">
       <rect width="11" height="11" rx="2" fill="${f.cor}"/>
       <text x="18" y="10" font-size="12" fill="currentColor">${esc(f.nome)}</text>
       <text x="150" y="10" font-size="12" text-anchor="end"
             font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".7">${f.valor}</text>
     </g>`).join("");
  return `<svg viewBox="0 0 320 ${Math.max(145, 34 + fatias.length * 21)}" role="img"
    aria-label="Composição: ${fatias.map(f => f.nome + " " + f.valor).join(", ")}">
    ${arcos}
    <text x="${cx}" y="${cy + 1}" text-anchor="middle" font-size="20" font-weight="700"
          fill="currentColor">${total}</text>
    <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="9.5"
          fill="currentColor" opacity=".55">TOTAL</text>
    ${legenda}
  </svg>`;
}


// ---------------------------------------------------------------- a máquina
//
// Os monitores de CPU, memória, disco e rede. Vêm da operação `sistema`, que
// lê /proc — e por isso trazem taxa só a partir da segunda leitura: /proc dá
// contador desde o boot, e taxa precisa de dois instantes.

/// Medidor de arco. Para o que é percentual de um todo — CPU e memória.
function medidor(percentual, rotulo, detalhe, limite = 90) {
  const p = Math.max(0, Math.min(100, Number(percentual) || 0));
  // O arco abre 240°, e as duas pontas caem em baixo, a y = cy + R·sen(135°).
  // Com cy=58 e R=46 elas caíam em 90, que era exatamente a linha do detalhe —
  // o traço laranja passava por cima do texto. Subir o centro e descer o
  // detalhe separa os dois.
  const R = 42, cx = 60, cy = 50, esp = 10;
  // Arco de 240°, aberto embaixo: a abertura é onde o texto respira, e um
  // anel fechado obrigaria o número a disputar espaço com o traço.
  const a0 = Math.PI * 0.75, total = Math.PI * 1.5;
  const ponto = (a) => `${(cx + R * Math.cos(a)).toFixed(2)},${(cy + R * Math.sin(a)).toFixed(2)}`;
  const arco = (de, ate, cor, opac) => {
    if (ate - de < 1e-4) return "";
    return `<path d="M${ponto(de)} A${R},${R} 0 ${ate - de > Math.PI ? 1 : 0},1 ${ponto(ate)}"
      fill="none" stroke="${cor}" stroke-width="${esp}" stroke-linecap="round" opacity="${opac}"/>`;
  };
  const cor = p >= limite ? "var(--log)" : p >= limite * 0.75 ? "var(--ambar)" : "var(--laranja)";
  return `<svg viewBox="0 0 120 ${detalhe ? 104 : 86}" role="img"
    aria-label="${esc(rotulo)}: ${p.toFixed(1)}%">
    ${arco(a0, a0 + total, "currentColor", ".14")}
    ${arco(a0, a0 + total * (p / 100), cor, ".95")}
    <text x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="21" font-weight="700"
          fill="currentColor" font-variant-numeric="tabular-nums">${p.toFixed(0)}<tspan font-size="12">%</tspan></text>
    <text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="9.5" fill="currentColor"
          opacity=".55" letter-spacing=".08em">${esc(rotulo.toUpperCase())}</text>
    ${detalhe ? `<text x="${cx}" y="${cy + 49}" text-anchor="middle" font-size="9.5"
          fill="currentColor" opacity=".6">${esc(detalhe)}</text>` : ""}
  </svg>`;
}

/// Barra de ocupação, de 0 a 100. Para disco, onde o total é conhecido e o que
/// interessa é quanto falta.
function barrasCheias(itens, largura = 1180) {
  if (!itens.length) return `<div class="vazioc">sem dados ainda</div>`;
  // O SVG escala o desenho INTEIRO, texto junto: um viewBox de 360 esticado
  // até a largura da carta larga faz 11 px virarem 38 px. A largura tem de
  // nascer perto da real — é a mesma armadilha anotada em `barras`.
  const L = largura, alt = 40;
  const h = itens.length * alt + 4;
  return `<svg viewBox="0 0 ${L} ${h}" role="img" aria-label="Ocupação dos discos">` +
    itens.map((it, k) => {
      const y = k * alt + 4;
      const p = Math.max(0, Math.min(100, it.percentual));
      const cor = it.alerta ? "var(--log)" : p >= 90 ? "var(--ambar)" : "var(--laranja)";
      return `<g>
        <text x="0" y="${y + 11}" font-size="11.5" fill="currentColor" opacity=".85">${esc(it.nome)}</text>
        <text x="${L}" y="${y + 11}" text-anchor="end" font-size="10.5"
              font-family="IBM Plex Mono, monospace" fill="currentColor"
              opacity=".7">${esc(it.texto)}</text>
        <rect x="0" y="${y + 18}" width="${L}" height="10" rx="5" fill="currentColor" opacity=".1"/>
        <rect x="0" y="${y + 18}" width="${Math.max(2, (p / 100) * L).toFixed(1)}" height="10"
              rx="5" fill="${cor}" opacity=".9"/>
      </g>`;
    }).join("") + `</svg>`;
}

const fmtTaxa = b => fmtBytes(Number(b) || 0) + "/s";

/// Os quatro monitores da máquina, prontos para entrar no painel.
///
/// Devolve string vazia quando o servidor não sabe medir (fora do Linux) ou
/// quando quem está olhando não é administrador: o monitor some da tela em vez
/// de aparecer zerado, porque zero seria mentira.
function maquinaHtml(m) {
  if (!m) return "";
  const carta = (titulo, legenda, corpo, larga) =>
    `<div class="carta ${larga ? "larga" : ""}"><h4>${titulo}</h4>
       <p class="leg">${legenda}</p>${corpo}</div>`;

  if (!m.disponivel) {
    return carta("A máquina", `monitor de sistema indisponível em <b>${esc(m.sistema)}</b>`,
      `<div class="vazioc">CPU, memória e rede saem do /proc, que só existe no Linux.
       O espaço em disco continua valendo — ele vem do <code>df</code>.</div>`,
      true) + (m.discos && m.discos.length ? carta("Espaço em disco",
        "cada caminho que este servidor usa", discosHtml(m), true) : "");
  }

  const cpu = m.cpu || {}, mem = m.memoria || {};
  const primeira = cpu.primeira_leitura;
  const memPerc = Number(mem.usada_percentual) || 0;
  const carga = (cpu.carga || []).join("  ");

  // Medidores à esquerda, discos à direita: os dois arcos ocupam largura
  // fixa, e o resto da carta larga fica todo para as barras de disco — que é
  // o que cresce com o número de caminhos vigiados.
  const medidores = `<div class="medidores">
    ${medidor(primeira ? 0 : cpu.uso_percentual, "cpu",
      `${cpu.nucleos || "?"} núcleos${carga ? " · carga " + carga : ""}`)}
    ${medidor(memPerc, "memória",
      `${fmtBytes((mem.usada_kb || 0) * 1024)} de ${fmtBytes((mem.total_kb || 0) * 1024)}`)}
  </div>`;

  const rede = (m.rede || []).filter(r => r.rx_bytes || r.tx_bytes);
  const io = (m.io || []).filter(d => d.leituras || d.escritas);

  return carta("A máquina", primeira
      ? "primeira leitura · a taxa aparece na próxima, porque taxa precisa de dois instantes"
      : `medido nos últimos ${(m.segundos_desde_a_ultima || "0").replace(".", ",")} s`,
      `<div class="maquina">${medidores}
         <div>${m.discos && m.discos.length ? discosHtml(m) : ""}</div>
       </div>`, true) +
    carta("Placas de rede", primeira ? "aguardando o segundo instante" : "tráfego por interface",
      barras(rede.map(r => ({
        nome: r.interface,
        valor: Number(r.rx_bytes_s) + Number(r.tx_bytes_s),
        texto: `↓${fmtTaxa(r.rx_bytes_s)}  ↑${fmtTaxa(r.tx_bytes_s)}`,
        cor: r.erros > 0 ? "var(--log)" : "var(--reg)",
      })), { rotulo: 92, texto: 168, titulo: "Tráfego por placa de rede" })) +
    carta("Discos", primeira ? "aguardando o segundo instante" : "leitura e escrita por disco físico",
      barras(io.map(d => ({
        nome: d.disco,
        valor: Number(d.lidos_bytes_s) + Number(d.escritos_bytes_s),
        texto: `↓${fmtTaxa(d.lidos_bytes_s)}  ↑${fmtTaxa(d.escritos_bytes_s)}`,
        cor: "var(--ndx)",
      })), { rotulo: 92, texto: 168, titulo: "Leitura e escrita por disco" }));
}

function discosHtml(m) {
  const apertados = new Set(m.apertados || []);
  // 800 é a largura real da coluna da direita nesta carta; o viewBox tem de
  // nascer perto dela, senão o texto sai esticado ou espremido.
  return barrasCheias((m.discos || []).map(d => ({
    nome: d.caminho + (d.montagem && d.montagem !== d.caminho ? `  ·  ${d.montagem}` : ""),
    percentual: Number(d.usado_percentual),
    alerta: apertados.has(d.caminho),
    // O denominador é o alcançável (usado + livre), e não o tamanho do disco:
    // reserva de sistema de arquivos e cota não estão à disposição de ninguém,
    // e contá-las como livres é o que faz um disco cheio parecer vazio.
    texto: `${fmtBytes(d.livre_kb * 1024)} livres de ${fmtBytes((d.utilizavel_kb ?? d.total_kb) * 1024)}`
      + (d.reservado_kb ? `  ·  ${fmtBytes(d.reservado_kb * 1024)} reservados` : ""),
  })), 800);
}

/// Lê a máquina sem derrubar o painel se não puder.
///
/// Um leitor não tem direito de ver nome de placa de rede, e nesse caso o
/// servidor recusa — o que é a resposta certa, e não um erro para mostrar na
/// tela. O painel simplesmente não desenha os monitores.
async function lerMaquina() {
  try { return await api("sistema"); } catch { return null; }
}

/// Renova só os monitores da máquina, de tempos em tempos.
///
/// Só eles: repintar o painel inteiro faria o servidor varrer todos os bancos
/// a cada quatro segundos para atualizar um número de CPU. E o intervalo é o
/// que define a taxa — a leitura de agora é comparada com a de quatro segundos
/// atrás, então uma janela curta demais mostraria ruído e uma longa demais
/// esconderia o pico.
function ligarMonitor(segundos = 4) {
  pararMonitor();
  if (!est.maquina) return;   // sem permissão ou sem /proc: nada a renovar
  est.relogioMaquina = setInterval(async () => {
    const alvo = $("#maquina");
    // A tela pode ter mudado entre dois tiques; sem o alvo, o relógio para
    // sozinho em vez de escrever num elemento que já saiu da página.
    if (!alvo) return pararMonitor();
    const m = await lerMaquina();
    if (!m) return pararMonitor();
    est.maquina = m;
    if ($("#maquina")) $("#maquina").innerHTML = maquinaHtml(m);
  }, segundos * 1000);
}

function pararMonitor() {
  if (est.relogioMaquina) clearInterval(est.relogioMaquina);
  est.relogioMaquina = null;
}

async function vPainel() {
  // As duas chamadas em paralelo: o `painel` varre os bancos e o `sistema`
  // chama o `df`, e uma esperar a outra dobraria o tempo da tela por nada.
  const [d, maquina] = await Promise.all([api("painel"), lerMaquina()]);
  const s = d.resumo;
  est.painel = d;
  est.maquina = maquina;

  const kpi = (v, r, u, classe) =>
    `<div class="kpi ${classe || ""}"><div class="v">${v}</div>
       <div class="r">${r}</div>${u ? `<div class="u">${u}</div>` : ""}</div>`;

  const kpis = [
    kpi(fmt(s.bancos), "bancos", s.tabelas === 1 ? "1 tabela" : `${fmt(s.tabelas)} tabelas`),
    kpi(fmt(s.registros), "registros", fmtBytes(s.bytes_reg) + " no .reg"),
    kpi(fmt(s.usuarios), "usuários",
        d.por_nivel.length === 1 ? "1 nível" : `${d.por_nivel.length} níveis`),
    kpi(fmt(s.conexoes), "conexões",
        s.sessoes_web === 1 ? "1 sessão web" : `${fmt(s.sessoes_web)} sessões web`, "viva"),
    kpi(fmt(s.acessos), "acessos", `${s.ms_medio} ms em média`),
    kpi(fmt(s.acessos_recusados), "recusados",
        s.acessos ? ((s.acessos_recusados / s.acessos) * 100).toFixed(1).replace(".", ",") + "% do total" : "",
        s.acessos_recusados ? "mal" : ""),
    kpi(fmt(s.bloqueios), "IPs bloqueados", "", s.bloqueios ? "mal" : ""),
    kpi(fmt(s.tabelas_em_ram), "em memória", fmtBytes(s.bytes_em_ram)),
  ].join("");

  const carta = (titulo, legenda, corpo, larga) =>
    `<div class="carta ${larga ? "larga" : ""}"><h4>${titulo}</h4>
       <p class="leg">${legenda}</p>${corpo}</div>`;

  const CORES = { admin:"var(--vermelhao)", dono:"var(--laranja)", operador:"var(--ambar)",
                  leitor:"var(--reg)", nenhum:"var(--texto-3)" };

  return `<div class="kpis">${kpis}</div><div class="cartas" id="cartas">
    <div id="maquina" class="passa">${maquinaHtml(maquina)}</div>
    ${carta("Operações por hora", "últimas 24 horas · as barras vermelhas são as recusadas",
        areaHoras(d.por_hora, d.recusadas_por_hora), true)}
    ${carta("Operações mais pedidas", "verde é o que passou, vermelho o que foi recusado",
        barras(d.por_operacao.map(o => ({ nome:o.op, valor:o.ok, segundo:o.recusados,
          texto: o.recusados ? `${fmt(o.ok)} + ${fmt(o.recusados)}✕` : fmt(o.ok) })),
          { rotulo:112, titulo:"Operações mais pedidas" }))}
    ${carta("Usuários por nível", "quem pode o quê, do config.json",
        anel(d.por_nivel.map(n => ({ nome:n.nivel, valor:n.quantos, cor:CORES[n.nivel] || "var(--texto-3)" }))))}
    ${carta("Maiores tabelas", "por registro · o tamanho é o do .reg",
        barras(d.maiores_tabelas.map(t => ({ nome:t.tabela, valor:t.registros,
          texto: `${fmt(t.registros)} · ${fmtBytes(t.bytes)}` })), { rotulo:150, texto:104 }))}
    ${carta("De onde vêm", "por IP · vermelho é o que foi recusado",
        barras(d.top_ips.map(i => ({ nome:i.ip, valor:i.acessos - i.recusados, segundo:i.recusados,
          texto: fmt(i.acessos) })), { rotulo:118 }))}
    ${carta("Bancos", "tabelas por banco de dados",
        barras(d.bancos.map(b => ({ nome:b.nome, valor:b.tabelas,
          texto: `${b.tabelas} tab · ${fmt(b.registros)} reg`, cor:"var(--reg)" })), { rotulo:104, texto:104 }))}
    ${carta("Quem mais usou", "por login, no log inteiro",
        barras(d.usuarios_ativos.map(u => ({ nome:u.usuario, valor:u.acessos, cor:"var(--memo)" })),
          { rotulo:112 }))}
  </div>`;
}

async function abrirAdmin(qual) {
  est.atual = null;
  $("#abas").innerHTML = "";
  pararMonitor();
  const p = $("#painel");
  p.innerHTML = `<div class="centro">carregando…</div>`;
  try {
    if (qual === "painel") {
      $("#titulo").textContent = "Painel";
      $("#subtitulo").textContent =
        "o servidor inteiro numa tela · os monitores da máquina renovam sozinhos";
      p.innerHTML = await vPainel();
      ligarMonitor();
      return;
    }
    if (qual === "usuarios") {
      $("#titulo").textContent = "Usuários";
      $("#subtitulo").textContent = "cadastro do config.json · a senha nunca sai daqui";
      const us = await api("usuarios");
      p.innerHTML = tabela(
        [{t:"id"},{t:"nome"},{t:"login"},{t:"e-mail"},{t:"telefone"},{t:"supervisor"},{t:"ativo"},{t:"poder por base"}],
        us, u => {
          const bases = u.supervisor ? "tudo, em toda base"
            : Object.entries(u.bases||{}).map(([b,perm]) =>
                `${b}=${Object.entries(perm).filter(([,v])=>v).map(([k])=>k).join("+")||"nada"}`
              ).join("  ") || "nenhuma";
          return `<tr><td class="dado num">${u.id}</td><td>${esc(u.nome)}</td>
            <td class="dado">${esc(u.login)}</td><td class="dado">${esc(u.email)}</td>
            <td class="dado">${esc(u.telefone)}</td>
            <td>${u.supervisor?'<span class="pino ok">sim</span>':'<span class="pino nao">não</span>'}</td>
            <td>${u.ativo?'<span class="pino ok">sim</span>':'<span class="pino mal">não</span>'}</td>
            <td class="dado">${esc(bases)}</td></tr>`;
        });
    } else if (qual === "acessos") {
      $("#titulo").textContent = "Acessos";
      $("#subtitulo").textContent = "toda tentativa entra, inclusive as recusadas";
      const a = await api("acessos", { max:200 });
      p.innerHTML = `<div class="ferramentas"><span class="conta">${a.total}
          registros no <code>acessos.log</code></span></div>` + tabela(
        [{t:"quando"},{t:"ip"},{t:"operação"},{t:"usuário"},{t:"resultado"},{t:"ms"}],
        a.acessos, x => `<tr><td class="dado">${esc(x.quando)}</td>
          <td class="dado">${esc(x.ip)}</td><td class="dado">${esc(x.op)}</td>
          <td class="dado">${esc(x.usuario||"—")}</td>
          <td>${x.ok?'<span class="pino ok">ok</span>'
                    :`<span class="pino mal">${esc(x.erro||"negado")}</span>`}</td>
          <td class="dado num">${x.ms}</td></tr>`);
    } else {
      $("#titulo").textContent = "Bloqueios";
      $("#subtitulo").textContent = "blacklist.json · o IP é recusado antes do token";
      const b = await api("bloqueios");
      p.innerHTML = (b.ativos.length ? "" :
          `<div class="aviso">Nenhum IP bloqueado.</div>`) + tabela(
        [{t:"ip"},{t:"desde"},{t:"até"},{t:"motivo"},{t:"comando"},{t:"tentativas"},{t:"firewall"}],
        b.ativos, x => `<tr><td class="dado">${esc(x.ip)}</td>
          <td class="dado">${esc(x.desde)}</td><td class="dado">${esc(x.ate)}</td>
          <td>${esc(x.motivo)}</td><td class="dado">${esc(x.comando)}</td>
          <td class="dado num">${x.tentativas}</td>
          <td>${x.firewall?'<span class="pino ok">aplicado</span>'
                          :'<span class="pino nao">só no servidor</span>'}</td></tr>`);
    }
  } catch (e) {
    p.innerHTML = `<div class="aviso mal">${esc(e.message)}</div>`;
  }
}

// =====================================================================
// Tema. Comeca no que o sistema pede e lembra a escolha por navegador --
// localStorage, que e do visitante e nunca chega ao servidor. Em janela
// anonima o acesso levanta excecao em vez de devolver vazio, entao toda
// leitura e escrita vai dentro de try.
// =====================================================================
const TEMAS = { escuro:"🌙", claro:"☀️" };

/* ================================================== View Database e o editor
   Browse -> Form, que e o padrao do Clarion(R) de onde este projeto vem: uma
   grade lista, um clique abre a ficha, a ficha grava.

   E o que fecha o buraco maior da interface. Ate aqui a tela SO NAVEGAVA: as
   operacoes `ler`, `inserir`, `atualizar` e `excluir` existiam no servidor e
   nao tinham porta nenhuma. */

/** O View Database do database corrente, ou pergunta qual. */
function viewDatabaseAtual() {
  const db = (est.atual && est.atual.db) || est.database
    || (est.bancos && est.bancos[0]);
  if (!db) {
    avisar("nenhum database — crie um pelo [+] da árvore", true);
    return;
  }
  return verDatabase(db);
}

async function verDatabase(db) {
  est.database = db;
  folha(db, "as tabelas deste database · clique numa para ver e editar",
        `<div class="centro">carregando…</div>`);

  const t = await api("tabelas", { database: db });
  const nomes = t.tabelas || [];

  // Uma chamada de esquema por tabela: o numero de registros e o tamanho
  // saem dai. Em paralelo, porque sao independentes.
  const fichas = await Promise.all(nomes.map(async nome => {
    try {
      const e = await api("esquema", { database: db, tabela: nome });
      return { nome, registros: e.registros, slots: e.slots,
               colunas: (e.colunas || []).length, indices: (e.indices || []).length };
    } catch (err) {
      return { nome, erro: String(err) };
    }
  }));

  folha(db, `${nomes.length} ${nomes.length === 1 ? "tabela" : "tabelas"} · clique numa linha para ver e editar`,
    nomes.length
      ? tabela([{t:"tabela"},{t:"registros",cls:"num"},{t:"slots",cls:"num"},
                {t:"colunas",cls:"num"},{t:"índices",cls:"num"},{t:""}],
          fichas, f => `<tr class="linha-tab" data-tab="${esc(f.nome)}">
            <td class="dado"><b>${esc(f.nome)}</b></td>
            <td class="num">${esc(String(f.registros ?? "—"))}</td>
            <td class="num">${esc(String(f.slots ?? "—"))}</td>
            <td class="num">${esc(String(f.colunas ?? "—"))}</td>
            <td class="num">${esc(String(f.indices ?? "—"))}</td>
            <td><span class="pino">abrir</span></td></tr>`)
      : `<div class="vazio">nenhuma tabela neste database</div>`);

  $$("#painel .linha-tab").forEach(tr =>
    tr.onclick = () => verConteudoEditavel(db, tr.dataset.tab));
}

/** A grade de dados, com a coluna de acao que abre a ficha.
 *
 * A grade tem DOIS modos: o normal, que nao enxerga linha marcada como
 * excluida, e o dos excluidos, que mostra so elas com o botao de restaurar.
 * O segundo existe porque marcar sem ter como desmarcar seria so uma forma
 * elaborada de perder o dado.
 *
 * Anda por CURSOR e SALTA por posicao, que sao coisas diferentes e as duas
 * baratas:
 *
 * - anterior/proxima mandam `antes`/`depois` com o rowid onde a pagina parou.
 *   Continuar depois do rowid um milhao e uma conta, nao uma procura.
 * - «ir para a pagina N» manda `pular`, e o servidor bisseta pelo `rownum` --
 *   164 us contra 246 ms de andar ate la, medido com 800 mil linhas.
 *
 * O numero da pagina e o total so aparecem porque agora sao baratos: o
 * servidor devolve `visiveis` a partir de dois contadores do cabecalho, sem
 * varrer. Era por nao existir esse numero que a grade nao dizia «de quantas». */
/* Como a página foi buscada, em português e com o porquê no `title`. O
   protocolo fala sem acento de propósito -- é chave de JSON --, e a tela é
   quem traduz. */
const NOME_DO_MODO = { cursor:"cursor", bisseccao:"bissecção", passo:"passo a passo",
                       posicao:"posição", rownum:"nº de ordem", indice:"índice" };
const COMO_PAGINOU = {
  cursor:"continuou do rowid onde a página anterior parou: o custo é o da página, não o da tabela",
  bisseccao:"a posição é o nº de ordem, então o início da página saiu de uma busca binária: ~20 leituras",
  passo:"a tabela tem linha excluída, ou é particionada por letra: aqui a posição não é o nº de ordem, e o motor anda até ela",
  rownum:"a página começou no nº de ordem pedido",
};

async function verConteudoEditavel(db, tab, verExcluidos = false, cursor = null) {
  est.atual = { db, tab };
  folha(`${tab}`, `${db} · clique numa linha para editar`,
        `<div class="centro">carregando…</div>`);

  // `cursor` é o rowid da última linha da página anterior — o servidor
  // devolve o par pronto. A grade não guarda "página 37": guarda o ponto onde
  // parou, que é o que faz a página 37 custar o mesmo que a página 1.
  const pedido = { database: db, tabela: tab, max: est.teto,
                   visao: verExcluidos ? "excluidas" : "ativas" };
  if (cursor && cursor.antes !== undefined) pedido.antes = cursor.antes;
  else if (cursor && cursor.depois !== undefined) pedido.depois = cursor.depois;
  else if (cursor && cursor.pular) pedido.pular = cursor.pular;

  const [e, r] = await Promise.all([
    api("esquema", { database: db, tabela: tab }),
    api("varrer", pedido),
  ]);
  est.esquemaAtual = e;
  // As colunas de sistema não viram colunas da grade: quem lê a marca é o
  // estilo da linha e o botão de restaurar, e o número de ordem tem coluna
  // própria à esquerda. Repetir "softdeleted: não" em toda linha só ocuparia
  // espaço.
  const sistemas = e.colunas.filter(c => c.sistema).map(c => c.nome);
  const cols = e.colunas.filter(c => !c.sistema).map(c => c.nome);
  const temRownum = e.colunas.some(c => c.nome === "rownum");

  // Quantas páginas, e em qual estamos. O total é exato porque `visiveis` é
  // exato; o número da página é CONTADO pela navegação (uma a mais quando
  // avança, uma a menos quando volta) porque o cursor não sabe a posição
  // dele -- e não saber é justamente o que faz ele ser barato.
  const paginas = Math.max(1, Math.ceil((r.visiveis ?? r.registros) / est.teto));
  const pagina = Math.min(paginas, Math.max(1, (cursor && cursor.pagina) || 1));

  const barra = `<div class="acoes">
      <button class="botao incluir" id="btNova">Nova linha</button>
      <button class="botao secundario" id="btVoltarDb">← ${esc(db)}</button>
      <span class="chip-visao">
        <button id="vwAtivas" class="${verExcluidos ? "" : "ativo"}">ativas</button>
        <button id="vwExcl" class="marcadas ${verExcluidos ? "ativo" : ""}">excluídas</button>
      </span>
      <span class="paginar">
        <button class="botao mini" id="pgInicio" ${r.ha_antes ? "" : "disabled"}>⏮ início</button>
        <button class="botao mini" id="pgAntes" ${r.ha_antes ? "" : "disabled"}>← anterior</button>
        <button class="botao mini" id="pgDepois" ${r.ha_mais ? "" : "disabled"}>próxima →</button>
        <button class="botao mini" id="pgFim" ${paginas > 1 ? "" : "disabled"}>fim ⏭</button>
        <input id="pgIr" class="campo-pagina" type="number" min="1" max="${paginas}"
               value="${pagina}" title="ir para a página" ${paginas > 1 ? "" : "disabled"}>
        <span class="leg">de ${fmt(paginas)}</span>
      </span>
      <span class="cores-acao" title="a mesma cor vale em toda tela">
        <b><i style="background:var(--acao-incluir)"></i>incluir</b>
        <b><i style="background:var(--acao-alterar)"></i>alterar</b>
        <b><i style="background:var(--acao-marcar)"></i>marcar</b>
        <b><i style="background:var(--acao-excluir)"></i>excluir de vez</b>
        <b><i style="background:var(--acao-consultar)"></i>consultar</b>
      </span>
      <span class="leg" title="${esc(COMO_PAGINOU[r.salto || r.modo] || "")}">${
        fmt(r.devolvidas)} de ${fmt(r.visiveis ?? r.registros)} ·
        <b>${esc(NOME_DO_MODO[r.salto || r.modo] || r.modo)}</b></span>
    </div>`;

  const vazio = verExcluidos
    ? `<div class="vazio">nenhuma linha marcada como excluída</div>`
    : `<div class="vazio">tabela vazia</div>`;

  $("#painel").innerHTML = barra + (r.linhas.length
    ? tabela([...(temRownum ? [{t:"nº",cls:"num"}] : []),
              {t:"rowid",cls:"num"}, ...cols.map(c => ({t:c})), {t:""}],
        r.linhas, l => `<tr class="linha-dado${verExcluidos ? " linha-excluida" : ""}"
              data-rowid="${esc(String(l.rowid))}">
          ${temRownum ? `<td class="num dado ordem">${esc(String(l.rownum ?? "—"))}</td>` : ""}
          <td class="num dado">${esc(String(l.rowid))}</td>
          ${cols.map(c => celulaValor(l[c])).join("")}
          <td>${verExcluidos
            ? `<button class="botao mini incluir restaurar" data-rowid="${esc(String(l.rowid))}">restaurar</button>`
            : `<span class="pino">editar</span>`}</td></tr>`)
    : vazio);

  $("#btNova").onclick = () => abrirFicha(db, tab, null);
  $("#btVoltarDb").onclick = () => verDatabase(db);
  $("#vwAtivas").onclick = () => verConteudoEditavel(db, tab, false);
  $("#vwExcl").onclick = () => verConteudoEditavel(db, tab, true);
  $("#pgInicio").onclick = () => verConteudoEditavel(db, tab, verExcluidos, null);
  $("#pgAntes").onclick = () =>
    verConteudoEditavel(db, tab, verExcluidos,
                        { antes: r.cursor_inicio, pagina: pagina - 1 });
  $("#pgDepois").onclick = () =>
    verConteudoEditavel(db, tab, verExcluidos,
                        { depois: r.cursor_fim, pagina: pagina + 1 });
  // O salto: manda a POSIÇÃO, e o servidor bisseta pelo rownum quando pode.
  const irPara = n => {
    const alvo = Math.min(paginas, Math.max(1, Math.round(n) || 1));
    if (alvo === 1) return verConteudoEditavel(db, tab, verExcluidos, null);
    verConteudoEditavel(db, tab, verExcluidos,
                        { pular: (alvo - 1) * est.teto, pagina: alvo });
  };
  $("#pgFim").onclick = () => irPara(paginas);
  $("#pgIr").onchange = ev => irPara(+ev.target.value);
  $("#pgIr").onkeydown = ev => { if (ev.key === "Enter") irPara(+ev.target.value); };
  $$("#painel .linha-dado").forEach(tr =>
    tr.onclick = ev => {
      // O clique no botao de restaurar nao pode abrir a ficha junto.
      if (ev.target.closest(".restaurar")) return;
      abrirFicha(db, tab, +tr.dataset.rowid);
    });
  $$("#painel .restaurar").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    restaurarLinha(db, tab, +b.dataset.rowid,
      () => verConteudoEditavel(db, tab, true));
  });
}

/** Um campo por coluna, do tipo certo. `Bin` e `Memo` moram fora do slot. */
function campoDaColuna(c, valor) {
  const id = `f_${c.nome}`;
  const v = valor === null || valor === undefined ? "" : String(valor);
  const obrig = c.nullable ? "" : ` <span class="obrig">*</span>`;
  const dica = `<span class="tipo">${esc(c.tipo)}</span>`;

  if (c.tipo === "Memo")
    return `<label class="largo"><span>${esc(c.nome)}${obrig} ${dica}</span>
      <textarea id="${id}" rows="4">${esc(v)}</textarea></label>`;

  if (c.tipo === "Bool")
    return `<label><span>${esc(c.nome)}${obrig} ${dica}</span>
      <select id="${id}"><option value="">—</option>
        <option value="true"${v === "true" ? " selected" : ""}>verdadeiro</option>
        <option value="false"${v === "false" ? " selected" : ""}>falso</option>
      </select></label>`;

  // Sequence vem do motor quando fica em branco; Uuid aceita a palavra "novo".
  const ph = c.tipo === "Sequence" ? "em branco = o motor numera"
           : c.tipo === "Uuid" ? "em branco ou \"novo\" para gerar um v7"
           : c.tipo === "Uuid256" ? "64 hexadecimais, ou \"novo\""
           : c.tipo === "Date" ? "2026-08-28"
           : c.tipo.startsWith("Decimal") ? "12.34 (texto, para não perder centavo)"
           : "";
  return `<label><span>${esc(c.nome)}${obrig} ${dica}</span>
    <input id="${id}" value="${esc(v)}" placeholder="${esc(ph)}"></label>`;
}

/** A ficha: le um registro (ou nasce vazia), grava e exclui. */
async function abrirFicha(db, tab, rowid) {
  const e = est.esquemaAtual
    || (est.esquemaAtual = await api("esquema", { database: db, tabela: tab }));
  const novo = rowid === null;

  // A versão da linha no instante da leitura. Ela volta no `atualizar` e é o
  // que faz o servidor recusar a gravação quando outra sessão mexeu no meio —
  // a janela de conflito de escrita. Numa linha nova não há versão: não há
  // nada de ninguém para atropelar.
  let linha = {}, versao = 0;
  if (!novo) {
    const r = await api("ler", { database: db, tabela: tab, rowid, com_versao: true });
    if (!r) {
      avisar(`o registro ${rowid} não existe mais`, true);
      return verConteudoEditavel(db, tab);
    }
    linha = r.linha;
    versao = r.versao;
  }

  // A coluna de sistema NAO vira campo de formulario. Quem manda nela e o
  // botao de excluir e o de restaurar; oferecer um `select` com «verdadeiro /
  // falso» convidaria a excluir uma linha digitando, sem motivo registrado e
  // sem passar por lugar nenhum que registre.
  // TODAS as colunas de sistema ficam de fora — não só a primeira. Enquanto
  // era `find(c => c.sistema)`, só o `softdeleted` saía e o `rownum` continuava
  // na ficha: o formulário mandava 8 valores para uma tabela de 9 colunas, e
  // TODO salvar e TODO incluir pela tela falhavam com «a lista tem 8 valores».
  // O servidor completa as duas no fim — herdando o valor anterior, que é o
  // que impede um salvar de rotina de ressuscitar linha excluída ou renumerar.
  const editaveis = e.colunas.filter(c => !c.sistema);
  const marcada = linha["softdeleted"] === true;

  folha(novo ? `Nova linha em ${tab}` : `${tab} · registro ${rowid}`,
    novo ? `${db} · em branco significa nulo`
         : `${db} · rowid ${rowid} — a posição física, que não muda`,
    `${marcada ? `<div class="aviso">
        <b class="marca-excluida">Esta linha está marcada como excluída.</b>
        Ela não aparece nas listas e continua inteira no <code>.reg</code>.
        <button class="botao mini incluir" id="btRestaurarFicha">restaurar</button>
      </div>` : ""}
     <form class="ficha-edit" id="fichaEdit" autocomplete="off">
       ${editaveis.map(c => campoDaColuna(c, linha[c.nome])).join("")}
     </form>
     <div class="acoes">
       <button class="botao ${novo ? "incluir" : "alterar"}" id="btSalvar">${novo ? "Incluir" : "Salvar"}</button>
       ${novo || marcada ? "" : `<button class="botao excluir" id="btExcluir">Excluir</button>`}
       <button class="botao secundario" id="btVoltar">Voltar</button>
       <span class="leg" id="recadoFicha"></span>
     </div>`);

  // A lista sai SEM a coluna de sistema, e o motor entende: numa inclusao ela
  // nasce falsa, e numa alteracao mantem o que a linha ja tinha. E o que
  // impede um «salvar» de rotina de ressuscitar linha marcada.
  const valores = () => editaveis.map(c => {
    const el = $(`#f_${c.nome}`);
    const v = el.value.trim();
    if (v === "") return null;              // vazio e NULL, sempre
    if (c.tipo === "Bool") return v === "true";
    if (/^Int|^UInt|^Sequence$/.test(c.tipo)) return Number(v);
    if (c.tipo === "Real4" || c.tipo === "Real8") return Number(v);
    return v;                                // texto, data, decimal, uuid…
  });

  if (marcada) $("#btRestaurarFicha").onclick = ev => {
    ev.preventDefault();
    restaurarLinha(db, tab, rowid, () => {
      est.esquemaAtual = null;
      abrirFicha(db, tab, rowid);
    });
  };

  $("#btSalvar").onclick = async ev => {
    ev.preventDefault();
    const rec = $("#recadoFicha");
    rec.textContent = "gravando…";
    try {
      if (novo) {
        const r = await api("inserir", { database: db, tabela: tab, valores: valores() });
        avisar(`linha ${r.rowid} incluída em ${tab}`);
      } else {
        await api("atualizar",
          { database: db, tabela: tab, rowid, valores: valores(), versao });
        avisar(`registro ${rowid} salvo`);
      }
      est.esquemaAtual = null;
      verConteudoEditavel(db, tab);
    } catch (err) {
      rec.textContent = "";
      // Conflito não é erro de digitação: alguém gravou primeiro, e o que
      // falta é uma DECISÃO, não uma correção. Em vez do recado vermelho, a
      // comparação lado a lado.
      if (err.nome === "CONFLITO" && !novo) {
        return dialogoConflito(db, tab, rowid, {
          editaveis, lida: linha, versaoLida: versao, meus: valores(),
          aoTerminar: () => { est.esquemaAtual = null; verConteudoEditavel(db, tab); }
        });
      }
      avisar(String(err), true);
    }
  };

  // O botao nao existe na linha ja marcada -- ali o que se oferece e
  // restaurar. Sem esta guarda, ligar o clique estoura na abertura da ficha.
  if (!novo && !marcada) $("#btExcluir").onclick = ev => {
    ev.preventDefault();
    // A versão vai junto: excluir uma linha que outra pessoa acabou de
    // alterar é a mesma janela de conflito, e apagar o trabalho dela sem
    // avisar seria pior do que sobrescrever.
    dialogoExcluir(db, tab, rowid, () => {
      est.esquemaAtual = null;
      verConteudoEditavel(db, tab);
    }, versao);
  };

  $("#btVoltar").onclick = ev => { ev.preventDefault(); verConteudoEditavel(db, tab); };
}

/* ==================================================== Gestao das tabelas
   O botao "Tabelas": as tabelas do database corrente numa grade, e as oito
   operacoes de gestao sobre a que for escolhida.

   Tres delas nasceram junto com esta tela, porque nao existiam no servidor --
   `criar_tabela`, `duplicar_tabela` e `excluir_tabela`. As outras cinco ja
   existiam e nao tinham porta nenhuma na interface. */

/** Os tipos oferecidos na criacao, com o que cada um custa em bytes.
 *
 * A largura aparece porque ela decide o `slot_size`, e o `slot_size` decide o
 * endereco: `offset = inicio + (rowid-1) x slot_size`. Escolher tipo aqui e
 * escolher o tamanho de cada linha da tabela para sempre. */
const TIPOS = [
  ["Int8",        "inteiro com sinal · 8 bytes"],
  ["Int4",        "inteiro com sinal · 4 bytes"],
  ["Int2",        "inteiro com sinal · 2 bytes"],
  ["Int1",        "inteiro com sinal · 1 byte"],
  ["UInt8",       "inteiro sem sinal · 8 bytes"],
  ["UInt4",       "inteiro sem sinal · 4 bytes"],
  ["UInt2",       "inteiro sem sinal · 2 bytes"],
  ["UInt1",       "inteiro sem sinal · 1 byte"],
  ["Bool",        "verdadeiro ou falso · 1 byte"],
  ["Real8",       "ponto flutuante · 8 bytes"],
  ["Real4",       "ponto flutuante · 4 bytes"],
  ["Decimal(15,2)", "decimal exato · não perde centavo"],
  ["Str(60)",     "texto de largura fixa"],
  ["Date",        "data · 4 bytes"],
  ["Time",        "hora · 4 bytes"],
  ["DateTime",    "data e hora · 8 bytes"],
  ["Memo",        "texto longo · mora no .memo"],
  ["Bin",         "binário livre · mora no .bin"],
  ["Uuid",        "128 bits · v7 é crescente"],
  ["Uuid256",     "256 bits · cabe um SHA-256"],
  ["Sequence",    "contador da tabela · o motor numera"],
];

/** O database sobre o qual a gestao trabalha, ou um recado dizendo que falta. */
/** O database sobre o qual a gestao trabalha.
 *
 * A ordem importa: o que a TELA esta mostrando ganha do que a arvore tem
 * selecionado, senao abrir a gestao de um banco e clicar em "Gerir" levaria
 * para outro. O primeiro da lista e ultimo recurso, para quem acabou de
 * entrar e nao escolheu nada. */
function databaseCorrente() {
  return est.database || (est.atual && est.atual.db) || (est.bancos || [])[0] || "";
}

function gerirTabelasAtual() {
  const db = databaseCorrente();
  if (!db) return avisar("nenhum database — crie um pelo [+] da árvore", true);
  return gerirTabelas(db);
}

/** A grade de gestao: uma linha por tabela, com o que ela pesa. */
async function gerirTabelas(db) {
  est.database = db;
  folha(`Tabelas de ${db}`, "carregando…", `<div class="centro">carregando…</div>`);

  const t = await api("tabelas", { database: db });
  const nomes = t.tabelas || [];
  const fichas = await Promise.all(nomes.map(async nome => {
    try {
      const e = await api("esquema", { database: db, tabela: nome });
      const pag = e.paginacao;
      return { nome, registros:e.registros, slots:e.slots,
               colunas:(e.colunas||[]).length, indices:(e.indices||[]).length,
               volumes: pag ? volumesDe(e).length : 1, paginada: !!pag };
    } catch (err) { return { nome, erro:String(err) }; }
  }));

  folha(`Tabelas de ${db}`,
    `${nomes.length} ${nomes.length === 1 ? "tabela" : "tabelas"} · clique numa linha para gerir`,
    `<div class="acoes">
       <button class="botao" id="btNovaTab">✚ Nova tabela…</button>
       <button class="botao secundario" id="btColar" ${est.copia ? "" : "disabled"}>
         ⧉ Colar${est.copia ? ` ${esc(est.copia.db)}.${esc(est.copia.tab)}` : ""}</button>
       <button class="botao secundario" id="btRecarregarTabs">↻ Atualizar</button>
       <button class="botao secundario" id="btGerirBanco">⛁ Gerir ${esc(db)}</button>
       <span class="leg">clique numa linha para as oito operações</span>
     </div>` +
    (nomes.length
      ? tabela([{t:"tabela"},{t:"registros",cls:"num"},{t:"slots",cls:"num"},
                {t:"colunas",cls:"num"},{t:"índices",cls:"num"},
                {t:"volumes",cls:"num"},{t:""}],
          fichas, f => `<tr class="linha-tab" data-tab="${esc(f.nome)}">
            <td class="dado"><b>${esc(f.nome)}</b>${
              f.erro ? ` <span class="pino mal">ilegível</span>` : ""}</td>
            <td class="num">${esc(String(f.registros ?? "—"))}</td>
            <td class="num">${esc(String(f.slots ?? "—"))}</td>
            <td class="num">${esc(String(f.colunas ?? "—"))}</td>
            <td class="num">${esc(String(f.indices ?? "—"))}</td>
            <td class="num">${f.paginada ? esc(String(f.volumes)) : "1"}</td>
            <td><span class="pino">gerir</span></td></tr>`)
      : `<div class="vazio">nenhuma tabela em ${esc(db)} — comece pelo “Nova tabela”</div>`));

  $("#btNovaTab").onclick = () => telaNovaTabela(db);
  $("#btRecarregarTabs").onclick = () => gerirTabelas(db);
  $("#btGerirBanco").onclick = () => gerirDatabase(db);
  $("#btColar").onclick = () => telaCopiarColar(db);
  $$("#painel .linha-tab").forEach(tr =>
    tr.onclick = () => gerirTabela(db, tr.dataset.tab));
}
