<style>
/* A marca do PhxSql e escura por natureza, e um console de banco se usa em
   sessao longa. Esta pagina assume o mundo escuro de proposito: pinta todas
   as cores explicitamente e nao depende do tema de quem abre. */
:root{
  --fundo:#010418; --painel:#0a1122; --painel-2:#0f182c; --realce:#152238;
  --linha:#1e2940; --linha-forte:#2b3a56;
  --texto:#dde2eb; --texto-2:#a8b0c0; --texto-3:#7c8598;
  --laranja:#ff8a1c; --ambar:#ffc43d; --vermelhao:#ff4d10; --vermelho:#ff5f5f;
  --reg:#5fa6e8; --ndx:#b394f0; --bin:#3fc8d4; --memo:#7bcb6a; --log:#ff5f5f;
  --ok:#6cc98c; --aviso:#ffc43d;
  /* As cores da ACAO. Convencao pedida, e ela vale mais que a paleta da marca
     aqui porque o usuario aprende a cor uma vez e ela vale em toda tela:
     verde inclui, amarelo altera, vermelho exclui de vez, rosa marca (o
     excluir que volta), azul consulta. */
  --acao-incluir:#6cc98c; --acao-alterar:#ffc43d; --acao-excluir:#ff5f5f;
  --acao-marcar:#ff8fc7;  --acao-consultar:#5fa6e8;
  --barra:52px; --arvore:268px;
  --sombra-fenix:0 6px 22px rgba(255,77,16,.28);
  --brilho-entrada:#0d1830; --tinta-botao:#160a00;
}

/* Tema claro. Nao e o escuro invertido: sobre papel, o vermelhao #ff4d10 da
   3,5:1 de contraste -- abaixo do minimo para texto. Escurece para #c63c0a,
   que mantem a cor da marca e passa dos 4,5:1. E a mesma adaptacao que o
   dossie ja fazia; agora as duas paginas concordam.

   As cinco cores de arquivo tambem escurecem: elas precisam se distinguir
   entre si E do fundo, e as do tema escuro somem no branco. */
:root[data-tema="claro"]{
  --fundo:#f7f5f2; --painel:#ffffff; --painel-2:#f2efeb; --realce:#e9e4de;
  --linha:#ded7cf; --linha-forte:#c4bab0;
  --texto:#1a1210; --texto-2:#4a3f3a; --texto-3:#7a6d66;
  --laranja:#c63c0a; --ambar:#a06a00; --vermelhao:#c63c0a; --vermelho:#b71414;
  --reg:#1f5c93; --ndx:#6a44a8; --bin:#0e7a85; --memo:#37702e; --log:#b71414;
  --ok:#2f7a3e; --aviso:#8a6a1f;
  /* No papel as cinco escurecem: verde e rosa claros dao menos de 4,5:1 sobre
     branco, que e o minimo para texto. E a mesma adaptacao que o vermelhao da
     marca ja fazia. */
  --acao-incluir:#2f7a3e; --acao-alterar:#8a6a1f; --acao-excluir:#b71414;
  --acao-marcar:#b5257f;  --acao-consultar:#1f5c93;
  --sombra-fenix:0 6px 18px rgba(198,60,10,.18);
  --brilho-entrada:#efe7dd; --tinta-botao:#fff6f0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fundo);color:var(--texto);
  font-family:"Exo 2","Helvetica Neue",Arial,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.mono,code,td.dado,th.dado,pre{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

/* --------------------------------------------------------------- entrada */
#entrada{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1200px 600px at 50% -10%,var(--brilho-entrada) 0%,var(--fundo) 62%);
  z-index:50;
}
.cartao{
  width:min(400px,92vw);background:var(--painel);border:1px solid var(--linha);
  border-radius:10px;padding:34px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
/* A fenix vem do logo oficial, com o fundo #010418 retirado para o alfa --
   assim ela assenta em cima do painel sem deixar emenda de retangulo. */
.cartao .simbolo{
  display:block;width:172px;height:auto;margin:0 auto 18px;
  filter:drop-shadow(var(--sombra-fenix));
}
.cartao h1{
  font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;
  text-align:center;
}
.cartao h1 .x{color:var(--laranja)}
.cartao .assin{
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--texto-3);margin:0 0 8px;text-align:center;
}
.cartao .lema{
  font-size:9px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--texto-3);opacity:.62;margin:0 0 26px;text-align:center;
}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-3);margin:0 0 6px}
label .opc{text-transform:none;letter-spacing:0;font-size:10.5px;opacity:.6;
  font-style:italic}
.onde{display:grid;grid-template-columns:1fr 88px;gap:10px}
input,select{
  width:100%;background:var(--fundo);border:1px solid var(--linha-forte);
  color:var(--texto);border-radius:6px;padding:10px 12px;font-size:14px;
  font-family:inherit;
}
input:focus,select:focus{border-color:var(--laranja);outline:none}
.campo{margin-bottom:16px}
.botao{
  width:100%;background:var(--laranja);color:var(--tinta-botao);border:none;border-radius:6px;
  padding:11px;font-weight:600;letter-spacing:.02em;
}
.botao:hover{background:var(--ambar)}
.botao.secundario{background:transparent;border:1px solid var(--linha-forte);color:var(--texto-2);width:auto;padding:7px 14px;font-weight:500}
.botao.secundario:hover{border-color:var(--laranja);color:var(--texto)}
.recado{margin-top:14px;font-size:12.5px;min-height:18px}
.recado.erro{color:var(--vermelho)}
.recado.info{color:var(--texto-3)}
.modo{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--linha);
  font-size:11.5px;color:var(--texto-3);line-height:1.5;
}

/* ----------------------------------------------------------------- barra */
#app{display:none;height:100%;grid-template-rows:var(--barra) auto auto 1fr;
  grid-template-columns:var(--arvore) 1fr;
  grid-template-areas:"barra barra" "menu menu" "tools tools" "arvore corpo"}
#app.ativo{display:grid}

/* ------------------------------------------------------- barra de ferramentas
   Dezesseis botoes, e nem todos tem motor por tras. Os que ainda nao existem
   aparecem apagados e com a tarja "a fazer" -- clicar neles diz o que falta e
   de que dependem, em vez de nao fazer nada.

   Botao que parece funcionar e nao funciona custa mais caro do que botao que
   falta: o primeiro so se descobre no meio do trabalho. */
.ferramentas{
  grid-area:tools;display:flex;align-items:stretch;gap:2px;
  padding:5px 8px;overflow-x:auto;overflow-y:hidden;
  background:var(--painel);border-bottom:1px solid var(--linha);
  scrollbar-width:thin;
}
.ferramentas .fer{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:1px solid transparent;border-radius:5px;
  padding:5px 9px 4px;min-width:62px;cursor:pointer;
  font-family:inherit;font-size:10px;line-height:1.15;color:var(--texto-2);
  white-space:nowrap;position:relative;flex:none;
}
.ferramentas .fer:hover{background:var(--painel-3);border-color:var(--linha-forte);color:var(--texto)}
.ferramentas .fer:focus-visible{outline:2px solid var(--laranja);outline-offset:1px}
.ferramentas .fer svg{width:19px;height:19px;display:block;flex:none}
/* A cor vem do proprio botao: cada ferramenta tem a sua, e o SVG a herda. */
.ferramentas .fer svg *{stroke:currentColor}
.ferramentas .fer .rot{color:var(--texto-2)}
.ferramentas .fer:hover .rot{color:var(--texto)}

/* O que ainda nao existe: apagado, mas presente e clicavel. */
.ferramentas .fer.afazer{opacity:.42}
.ferramentas .fer.afazer:hover{opacity:.75}
.ferramentas .fer.afazer::after{
  content:"";position:absolute;top:4px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--pend);
}
/* ------------------------------------------------- View Database e a ficha */
.linha-tab,.linha-dado,.linha-seq{cursor:pointer}
.linha-seq:hover{background:var(--realce)}
.linha-tab:hover,.linha-dado:hover{background:var(--realce)}

.acoes{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;
}
/* O `.botao` nasceu com `width:100%` para o cartao de entrada, onde ele e o
   unico da linha. Numa barra de acoes isso o faz ocupar a largura inteira e
   empurrar os outros para baixo -- aqui ele cabe no proprio texto. */
.acoes .botao{width:auto;padding:8px 16px}
/* Sem apagar o fundo, o `.botao` continuava laranja e o texto vermelho ficava
   ilegivel em cima dele -- e como o botao de excluir aparecia. A borda so
   significa alguma coisa sobre fundo transparente. */
.botao.perigo{background:transparent;border:1px solid var(--log);color:var(--log);
              font-weight:500}
.botao.perigo:hover{background:var(--log);color:#fff;border-color:var(--log)}

/* AS CORES DA ACAO -- contorno, e nao fundo cheio.
   A licao esta duas linhas acima: fundo laranja com texto escuro em cima
   ficava ilegivel. O contorno diz a cor sem apostar o contraste do texto
   nela; o preenchimento so acontece no hover, quando ha intencao. */
.botao.incluir,.botao.alterar,.botao.excluir,.botao.marcar,.botao.consultar{
  background:transparent;border:1px solid currentColor;font-weight:600;width:auto;
  padding:9px 16px;
}
.botao.incluir{color:var(--acao-incluir)}
.botao.alterar{color:var(--acao-alterar)}
.botao.excluir{color:var(--acao-excluir)}
.botao.marcar{color:var(--acao-marcar)}
.botao.consultar{color:var(--acao-consultar)}
.botao.incluir:hover{background:var(--acao-incluir);color:var(--fundo)}
.botao.alterar:hover{background:var(--acao-alterar);color:var(--fundo)}
.botao.excluir:hover{background:var(--acao-excluir);color:#fff}
.botao.marcar:hover{background:var(--acao-marcar);color:var(--fundo)}
.botao.consultar:hover{background:var(--acao-consultar);color:var(--fundo)}
.botao.mini.incluir,.botao.mini.alterar,.botao.mini.excluir,
.botao.mini.marcar,.botao.mini.consultar{padding:4px 10px;font-size:11px;font-weight:500}

/* A legenda das cinco cores, para a convencao ser aprendida uma vez. */
.cores-acao{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-size:11px;color:var(--texto-3);margin:10px 0 0}
.cores-acao b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.cores-acao i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* --------------------------------- profiler --------------------------- */
.prof-topo{flex-wrap:wrap;align-items:flex-end;gap:12px}
.mini-campo{display:flex;flex-direction:column;gap:4px;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3)}
.mini-campo input,.mini-campo select{padding:6px 8px;font-size:12.5px;
  border:1px solid var(--linha);border-radius:6px;background:var(--painel-2);
  color:var(--texto);font-family:inherit;min-width:140px}
.mini-campo.largo input{min-width:320px}
/* A caixa de marcar nao herda a largura minima dos campos de texto: sem isto
   ela estica e vira um retangulo vazio do lado do quadradinho. */
.mini-campo.caixa{flex-direction:row;align-items:center;gap:7px;text-transform:none;
  letter-spacing:0;font-size:12.5px;color:var(--texto-2);padding-bottom:7px;
  white-space:nowrap}
.mini-campo.caixa input{min-width:0;width:15px;height:15px;padding:0;margin:0;
  border:1px solid var(--linha);accent-color:var(--acao-consultar)}
table.prof{font-size:12.5px}
table.prof td,table.prof th{padding:5px 10px}
/* O pedido e o unico campo de tamanho livre: ele corta com reticencias e o
   texto inteiro fica no `title`. Sem o corte, uma insercao grande empurraria
   a tabela inteira para fora da tela. */
.prof-pedido{max-width:640px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--texto-2)}
tr.prof-mal td{background:color-mix(in srgb,var(--log) 8%,transparent)}

.ficha-edit{
  display:grid;gap:13px;margin:16px 0;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  background:var(--painel-2);border:1px solid var(--linha);
  border-radius:7px;padding:16px;
}
.ficha-edit label{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.ficha-edit label.largo{grid-column:1/-1}
.ficha-edit label > span{color:var(--texto-3);display:flex;align-items:center;gap:6px}
.ficha-edit .obrig{color:var(--log);font-weight:700}
.ficha-edit .tipo{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--texto-3);
  border:1px solid var(--linha);border-radius:3px;padding:0 4px;margin-left:auto;
}
.ficha-edit input,.ficha-edit textarea,.ficha-edit select{
  background:var(--painel);border:1px solid var(--linha-forte);border-radius:5px;
  padding:7px 9px;font-family:inherit;font-size:12.5px;color:var(--texto);width:100%;
}
.ficha-edit textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;resize:vertical}
.ficha-edit input:focus,.ficha-edit textarea:focus,.ficha-edit select:focus{
  outline:none;border-color:var(--laranja);
}
.ficha-edit input::placeholder{color:var(--texto-3);opacity:.7;font-size:11.5px}

/* ------------------------------------------------------- assistente do pivot */
.passos{display:flex;align-items:center;gap:8px;margin:16px 0 20px;flex-wrap:wrap}
.passo{
  display:flex;align-items:center;gap:8px;font:inherit;font-size:12px;cursor:pointer;
  background:var(--painel-2);border:1px solid var(--linha);border-radius:99px;
  padding:6px 14px 6px 6px;color:var(--texto-3);
}
.passo:hover:not(:disabled){border-color:var(--laranja);color:var(--texto)}
.passo:disabled{opacity:.45;cursor:default}
.passo-n{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  background:var(--linha);color:var(--texto-2);font-size:10.5px;font-weight:700;
}
.passo.agora{border-color:var(--laranja);color:var(--texto);font-weight:600}
.passo.agora .passo-n{background:var(--laranja);color:var(--tinta-botao)}
.passo.feito .passo-n{background:var(--ok);color:var(--tinta-botao)}
.passo-traco{flex:0 0 18px;height:1px;background:var(--linha)}

.pv-montagem{display:grid;grid-template-columns:250px 1fr;gap:14px;margin:16px 0}
@media (max-width:860px){.pv-montagem{grid-template-columns:1fr}}
.pv-paleta,.pv-zona{
  background:var(--painel-2);border:1px solid var(--linha);border-radius:7px;
}
.pv-zona-cab{
  padding:9px 12px;border-bottom:1px solid var(--linha);
  display:flex;flex-direction:column;gap:2px;
}
.pv-zona-cab b{font-size:11.5px}
.pv-zona-cab span{font-size:10.5px;color:var(--texto-3);line-height:1.4}
.pv-paleta-lista{padding:8px;display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto}
.pv-campo{
  display:flex;align-items:center;gap:7px;cursor:grab;font-size:11.5px;
  padding:5px 9px;border-radius:5px;border:1px solid var(--linha);
  background:var(--painel);
}
.pv-campo:hover{border-color:var(--laranja)}
.pv-campo.usado{opacity:.42}
.pv-campo-ico{
  font-family:"IBM Plex Mono",monospace;font-size:10px;width:16px;text-align:center;
  color:var(--texto-3);
}
.pv-campo em{font-style:normal;margin-left:auto;font-size:9.5px;color:var(--texto-3);opacity:.8}

.pv-zonas{display:flex;flex-direction:column;gap:10px}
.pv-zona.sobre{border-color:var(--laranja);background:var(--realce)}
.pv-zona-corpo{padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;min-height:42px;align-items:center}
.pv-zona-vazia{font-size:11px;color:var(--texto-3);opacity:.7}
.pv-chip{
  display:inline-flex;align-items:center;gap:6px;cursor:grab;font-size:11.5px;
  padding:4px 6px 4px 10px;border-radius:99px;
  background:var(--painel);border:1px solid var(--linha-forte);
}
.pv-chip-x{
  background:none;border:none;cursor:pointer;color:var(--texto-3);font-size:13px;
  line-height:1;padding:0 3px;
}
.pv-chip-x:hover{color:var(--log)}
.pv-gran{
  font:inherit;font-size:10.5px;padding:1px 4px;border-radius:4px;
  background:var(--painel-2);border:1px solid var(--linha);color:var(--texto-2);
}
.pv-agg{
  background:var(--painel-2);border:1px solid var(--linha);border-radius:7px;padding:12px;
}
.pv-agg label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;text-transform:none;letter-spacing:0}
.pv-agg label > span{color:var(--texto-3)}
.pv-agg select{
  background:var(--painel);border:1px solid var(--linha-forte);border-radius:5px;
  padding:7px 9px;font-family:inherit;font-size:12.5px;color:var(--texto);width:100%;
}

/* A grade do resultado: o total ganha peso, a célula vazia perde. */
table.pivot th.pv-canto{text-align:left}
table.pivot .pv-rot{font-weight:600}
table.pivot .pv-vazia{color:var(--texto-3);opacity:.45}
table.pivot .pv-tot{font-weight:700;background:rgba(127,127,127,.07)}
table.pivot .pv-geral{background:rgba(127,127,127,.15)}
table.pivot tfoot td{border-top:2px solid var(--linha-forte)}
.linha-tab.escolhida{background:var(--realce)}
.linha-tab.escolhida .pino{border-color:var(--laranja);color:var(--laranja)}

/* ------------------------------------------------- cadastro de campos */
table.montar.campos td{padding:4px 6px}
table.montar.campos .pos{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--texto-3);
}
.criar .chk{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--texto-2);
  text-transform:none;letter-spacing:0;cursor:pointer;margin:0;
}
.criar .chk input{width:auto}
.secao .chk{margin-left:auto;font-weight:400;white-space:nowrap;flex:0 0 auto}
.leg.chave{
  margin:10px 0 0;padding:8px 11px;border-radius:5px;
  background:var(--painel-2);border:1px solid var(--linha);
}
.leg.chave b{color:var(--laranja)}
.leg.chave.sem{border-color:var(--log);color:var(--texto-2)}

/* ------------------------------------------------- configurações e catálogo */
.bloco-user{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 11px;border-bottom:1px solid var(--linha);font-size:11.5px;
}
.bloco-user b{min-width:110px;font-family:"IBM Plex Mono",monospace}
.pino.ok{border-color:var(--ok);color:var(--ok)}
.nota.mal{border-color:var(--log)}
.nota.mal strong{color:var(--log)}

/* ------------------------------------------------- gestão de tabelas */
.ops{
  display:grid;gap:10px;margin:16px 0;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}
.op{
  display:flex;align-items:flex-start;gap:11px;text-align:left;cursor:pointer;
  background:var(--painel-2);border:1px solid var(--linha);border-radius:7px;
  padding:13px 14px;color:var(--texto);font-family:inherit;
  transition:border-color .12s,background .12s;
}
.op:hover{border-color:var(--laranja);background:var(--realce)}
.op.perigo:hover{border-color:var(--log)}
.op-ico{
  font-size:17px;line-height:1;color:var(--laranja);flex:0 0 auto;
  width:26px;height:26px;display:grid;place-items:center;
  border:1px solid var(--linha);border-radius:5px;background:var(--painel);
}
.op.perigo .op-ico{color:var(--log)}
.op-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.op-txt b{font-size:12.5px;font-weight:600}
.op-txt span{font-size:11px;color:var(--texto-3);line-height:1.45}
.pino.mal{border-color:var(--log);color:var(--log)}

/* ------------------------------------------------- formulário da nova tabela */
.criar{margin:16px 0}
.criar .bloco{
  display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  background:var(--painel-2);border:1px solid var(--linha);border-radius:7px;padding:16px;
}
.criar label{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.criar label.largo{grid-column:1/-1}
/* Caixa-alta e a regra da casa para rotulo curto, e estraga rotulo com
   parentese: "TETO DE VOLUMES (0 = O QUE COUBER NO SUFIXO)" grita e quebra em
   duas linhas. Aqui o rotulo fica em caixa normal e a dica desce sozinha. */
.criar label > span{
  color:var(--texto-3);text-transform:none;letter-spacing:.02em;
  display:flex;flex-direction:column;gap:2px;
}
.criar label em{font-style:normal;opacity:.72;font-size:10.5px}
.criar label em code{font-size:10px}
.criar input,.criar select{
  background:var(--painel);border:1px solid var(--linha-forte);border-radius:5px;
  padding:7px 9px;font-family:inherit;font-size:12.5px;color:var(--texto);width:100%;
}
.criar input:focus,.criar select:focus{outline:none;border-color:var(--laranja)}
.secao{
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--texto-3);
  margin:20px 0 8px;display:flex;align-items:center;gap:10px;font-weight:600;
}
.secao em{font-style:normal;text-transform:none;letter-spacing:0;opacity:.75}
.mini{
  font-family:inherit;font-size:10.5px;cursor:pointer;padding:3px 8px;
  background:var(--painel-2);border:1px solid var(--linha-forte);border-radius:4px;
  color:var(--texto-2);
}
.mini:hover{border-color:var(--laranja);color:var(--laranja)}
.mini.perigo:hover{border-color:var(--log);color:var(--log)}
table.montar input[type=text],table.montar input:not([type]),table.montar select{
  background:var(--painel);border:1px solid var(--linha);border-radius:4px;
  padding:5px 7px;font-family:inherit;font-size:11.5px;color:var(--texto);width:100%;
}
table.montar th em{font-style:normal;font-weight:400;opacity:.7;text-transform:none}
table.montar td{padding:5px 7px}

/* --------------------------------------------------------------- creditos */
.creditos{max-width:70ch}
.creditos .ave{
  display:block;width:224px;height:auto;margin:6px 0 2px;
  image-rendering:auto;
}
.creditos .nomao{
  font-size:31px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;
}
.creditos .nomao .x{color:var(--laranja)}
.creditos .assinatura{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--texto-3);margin:2px 0 22px;
}
.creditos .quem{display:grid;gap:14px;margin-bottom:26px}
@media (min-width:780px){.creditos .quem{grid-template-columns:1fr 1fr}}
.creditos .pessoa{
  background:var(--painel-2);border:1px solid var(--linha);
  border-left:3px solid var(--laranja);border-radius:0 6px 6px 0;padding:13px 15px;
}
.creditos .papel{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--laranja);
}
.creditos .nome{font-size:16px;font-weight:700;margin:3px 0 6px}
.creditos .oque{font-size:12.5px;color:var(--texto-2);line-height:1.55}
.creditos h4{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--texto-3);margin:26px 0 10px;
}

.form-consulta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:end;
  padding:14px;background:var(--painel-2);border:1px solid var(--linha);
  border-radius:7px;margin:14px 0;
}
.form-consulta label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--texto-3)}
.form-consulta input,.form-consulta select{
  background:var(--painel);border:1px solid var(--linha-forte);border-radius:5px;
  padding:6px 9px;font-family:inherit;font-size:12.5px;color:var(--texto);min-width:130px;
}
.form-consulta input:focus,.form-consulta select:focus{outline:none;border-color:var(--laranja)}

.ferramentas .risco{
  width:1px;background:var(--linha);margin:4px 5px;flex:none;
}

@media (max-width:900px){
  .ferramentas .fer{min-width:54px;padding:5px 6px 4px;font-size:9.5px}
  .ferramentas .fer svg{width:17px;height:17px}
}

/* ------------------------------------------------------------ menu superior
   Barra de menu tradicional: titulos na horizontal, cada um abrindo uma lista
   por baixo. O motivo de existir e simples -- metade do que o servidor sabe
   fazer (backup, reparo, reindex, tabela em memoria) nao tinha porta de
   entrada nenhuma na tela. */
.menubar{
  grid-area:menu;display:flex;align-items:stretch;
  background:var(--painel-2);border-bottom:1px solid var(--linha);
  position:relative;z-index:60;user-select:none;
}
.menubar > .menu{position:relative;display:flex}
.menubar .titulo{
  background:none;border:0;border-radius:0;padding:0 13px;height:30px;
  font-family:inherit;font-size:12.5px;color:var(--texto-2);cursor:pointer;
  display:flex;align-items:center;gap:1px;white-space:nowrap;
}
.menubar .titulo:hover{background:var(--painel-3);color:var(--texto)}
.menubar .menu.aberto .titulo{background:var(--laranja);color:#fff}
/* A letra sublinhada e a tecla de atalho com Alt, como manda a tradicao. */
.menubar .titulo u{text-decoration:underline;text-underline-offset:2px}

.menubar .lista{
  display:none;position:absolute;top:100%;left:0;min-width:238px;
  background:var(--painel);border:1px solid var(--linha-forte);
  border-radius:0 0 5px 5px;box-shadow:0 8px 24px rgba(0,0,0,.22);
  padding:4px 0;
}
.menubar .menu.aberto .lista{display:block}
.menubar .item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;text-align:left;padding:6px 14px 6px 12px;
  font-family:inherit;font-size:12.5px;color:var(--texto);cursor:pointer;
}
.menubar .item:hover:not(:disabled),
.menubar .item:focus-visible{background:var(--laranja);color:#fff;outline:none}
.menubar .item:disabled{color:var(--texto-3);cursor:default;opacity:.55}
.menubar .item .ico{width:16px;text-align:center;font-size:12px;flex:none}
.menubar .item .rot{flex:1}
.menubar .item .tecla{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--texto-3);
  flex:none;letter-spacing:.02em;
}
.menubar .item:hover:not(:disabled) .tecla{color:rgba(255,255,255,.75)}
.menubar .sep{height:1px;background:var(--linha);margin:4px 0}

/* Em tela estreita a arvore some e o menu continua sendo o caminho. */
@media (max-width:820px){
  .menubar .titulo{padding:0 9px;font-size:12px}
  .menubar .lista{min-width:200px}
}
.barra{
  grid-area:barra;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--painel);border-bottom:1px solid var(--linha);
}
.barra .marca{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.barra .marca img{width:auto;height:30px;display:block}
.barra .marca .x{color:var(--laranja)}
.barra .fita{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texto-3);
}
.barra .espaco{flex:1}
.barra .recado{
  font-size:11.5px;padding:3px 10px;border-radius:99px;
  background:var(--painel-3);border:1px solid var(--linha-forte);
  color:var(--texto-2);white-space:nowrap;max-width:42ch;
  overflow:hidden;text-overflow:ellipsis;
}
.barra .recado.mal{border-color:var(--log);color:var(--log)}
.tema{
  background:none;border:1px solid var(--linha-forte);border-radius:99px;
  width:34px;height:26px;display:grid;place-items:center;font-size:13px;
  line-height:1;padding:0;color:var(--texto-2);
}
.tema:hover{border-color:var(--laranja);color:var(--laranja)}
body,.cartao,.barra,.arvore,table,td,th{
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.demo{
  background:rgba(255,196,61,.12);border:1px solid rgba(255,196,61,.35);
  color:var(--ambar);border-radius:99px;padding:3px 11px;font-size:11px;
}
.eu{font-size:12.5px;color:var(--texto-2)}
.eu b{color:var(--texto);font-weight:600}

/* ---------------------------------------------------------------- arvore */
.arvore{
  grid-area:arvore;background:var(--painel);border-right:1px solid var(--linha);
  overflow-y:auto;padding:12px 0 24px;
}
.grupo .mais{
  float:right;background:none;border:1px solid var(--linha-forte);
  border-radius:4px;width:18px;height:18px;line-height:1;padding:0;
  font-family:inherit;font-size:14px;color:var(--texto-3);cursor:pointer;
  display:grid;place-items:center;margin-top:-1px;
}
.grupo .mais:hover{border-color:var(--laranja);color:var(--laranja);background:var(--painel-2)}
.grupo .mais:focus-visible{outline:2px solid var(--laranja);outline-offset:1px}

.grupo{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--texto-3);padding:14px 16px 7px;
}
.no{
  display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;
  border-left:2px solid transparent;color:var(--texto-2);
}
.no:hover{background:var(--painel-2);color:var(--texto)}
.no.sel{background:var(--realce);color:var(--texto);border-left-color:var(--laranja)}
.no .ic{width:14px;text-align:center;color:var(--texto-3);font-size:11px}
.no.db{font-weight:600;color:var(--texto)}
.no.tab{padding-left:34px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.no.esq{padding-left:26px;color:var(--texto-3);font-size:12px}
.no.tab.emesq{padding-left:46px}
.vazio{padding:10px 16px;font-size:12px;color:var(--texto-3);font-style:italic}

/* ----------------------------------------------------------------- corpo */
.corpo{grid-area:corpo;overflow:hidden;display:flex;flex-direction:column}
.cabecalho{padding:16px 22px 0}
.cabecalho h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.cabecalho .sub{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--texto-3);
  margin-top:3px;
}
.abas{display:flex;gap:2px;padding:14px 22px 0;border-bottom:1px solid var(--linha)}
.aba{
  background:none;border:none;padding:8px 14px;color:var(--texto-3);
  border-bottom:2px solid transparent;font-size:13px;
}
.aba:hover{color:var(--texto-2)}
.aba.sel{color:var(--laranja);border-bottom-color:var(--laranja);font-weight:600}
.painel{flex:1;overflow:auto;padding:20px 22px 40px}

.ferramentas{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ferramentas label{margin:0}
.ferramentas select,.ferramentas input{width:auto;padding:6px 10px;font-size:13px}
.conta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--texto-3)}
.dica{font-size:11.5px;color:var(--texto-3);opacity:.8;font-style:italic;margin-left:auto}

/* ------------------------------------------------------------------ painel */
.no.painel{font-weight:600;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;
      margin-bottom:22px}
.kpi{background:var(--painel-2);border:1px solid var(--linha);border-radius:9px;
     padding:13px 15px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
        font-variant-numeric:tabular-nums}
.kpi .r{font-size:10px;letter-spacing:.11em;text-transform:uppercase;
        color:var(--texto-3);margin-top:5px}
.kpi .u{font-size:11px;color:var(--texto-3);margin-top:2px}
.kpi.viva .v{color:var(--laranja)}
.kpi.mal .v{color:var(--log)}
/* align-items:start para carta de 1 item nao esticar ate a altura da de 12.
   O grid iguala a altura da linha por padrao, e sobra branco no meio. */
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;
        align-items:start}
.carta{background:var(--painel-2);border:1px solid var(--linha);border-radius:10px;
       padding:15px 17px 12px}
.carta h4{margin:0 0 2px;font-size:13px;font-weight:600;letter-spacing:-.01em}
.carta .leg{font-size:11px;color:var(--texto-3);margin:0 0 12px}
.carta svg{width:100%;height:auto;display:block;overflow:visible}
.carta.larga{grid-column:1/-1}
.vazioc{color:var(--texto-3);font-size:12.5px;font-style:italic;padding:14px 0}
/* display:contents faz o embrulho sumir do grid: os cartoes da maquina viram
   filhos diretos de .cartas, e sao repintados sozinhos a cada leitura sem que
   o embrulho vire uma celula gorda no meio do painel. */
.passa{display:contents}
.maquina{display:grid;grid-template-columns:auto 1fr;gap:8px 26px;align-items:center}
.medidores{display:flex;gap:14px}
.medidores svg{width:168px;height:auto;display:block}
/* Numa janela estreita os arcos passam para cima das barras: lado a lado eles
   espremeriam o disco ate o texto do caminho nao caber. */
@media (max-width:960px){.maquina{grid-template-columns:1fr}
                         .medidores{justify-content:center}}

.formatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
          gap:10px;margin:6px 0 18px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
     padding:12px 14px;background:var(--painel-2);border:1px solid var(--linha);
     border-radius:9px;color:var(--texto-2);cursor:pointer;font:inherit;
     width:auto;text-align:left}
.fmt:hover{border-color:var(--laranja);color:var(--texto)}
.fmt .f-ico{font-size:17px;line-height:1;color:var(--laranja)}
.fmt .f-rot{font-size:13px;font-weight:600}
.fmt .f-ext{font-size:10.5px;font-family:"IBM Plex Mono",monospace;color:var(--texto-3)}
.fmt .f-diz{font-size:10.5px;color:var(--texto-3);line-height:1.35}

/* ------------------------------------------------- dialogo de exclusao
   Um sobreposto e nao um `confirm()` do navegador porque a escolha aqui tem
   DUAS partes -- o modo e o motivo --, e `confirm` so sabe perguntar sim ou
   nao. E o modo importa: um dos dois nao tem volta. */
.sobre{position:fixed;inset:0;background:rgba(1,4,24,.62);z-index:90;
       display:flex;align-items:center;justify-content:center;padding:20px}
.caixa{background:var(--painel);border:1px solid var(--linha-forte);
       border-radius:12px;max-width:560px;width:100%;padding:20px 22px;
       box-shadow:0 18px 50px rgba(0,0,0,.45)}
.caixa h3{margin:0 0 4px;font-size:16px}
.caixa .sub{color:var(--texto-3);font-size:11.5px;margin-bottom:14px}
.modos{display:grid;gap:8px;margin-bottom:14px}
.modo{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;
      background:var(--painel-2);border:1px solid var(--linha);border-radius:9px;
      cursor:pointer;text-align:left;font:inherit;color:var(--texto-2);width:auto}
.modo:hover{border-color:var(--linha-forte)}
.modo.escolhido{border-color:var(--laranja);color:var(--texto)}
.modo.escolhido.risco{border-color:var(--vermelhao)}
.modo .m-ico{font-size:16px;line-height:1.2}
.modo .m-rot{font-size:13px;font-weight:600;display:block}
.modo .m-diz{font-size:10.5px;color:var(--texto-3);line-height:1.4;display:block;
             margin-top:2px}
.marca-excluida{color:var(--log);font-weight:600}
.por-tabela{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}

/* A caixa do conflito de escrita e mais larga que as outras de proposito: sao
   tres valores lado a lado, e espremer a comparacao em 560px derrotaria o
   unico motivo de ela existir. */
.caixa.larga{max-width:880px}
/* Largura fixa nas quatro colunas: sem isto, um valor comprido numa delas
   empurra as outras para fora da caixa, e a coluna que some e justamente a
   ultima -- «voce escreve». Com `fixed`, o texto quebra dentro da celula. */
table.conf{table-layout:fixed}
table.conf td,table.conf th{padding:5px 9px;font-size:12px;overflow-wrap:anywhere}
table.conf .col{font-weight:600}
table.conf col.c-nome{width:19%} table.conf col.c-val{width:27%}
table.conf tr.diverge td{background:rgba(255,196,61,.06)}
/* O `label` da folha nasce em caixa alta -- e ali ele e ROTULO. Aqui dentro
   ele embrulha um VALOR, e valor mostrado em caixa alta e uma mentira: quem
   olha nao sabe se «BLUMENAU» esta gravado assim ou se e a tela gritando. */
table.conf .esc{display:flex;gap:7px;align-items:baseline;cursor:pointer;margin:0;
  text-transform:none;letter-spacing:0;font-size:12px;color:var(--texto)}
/* O `input` da folha tem `width:100%` -- num radio isso vira uma bolinha que
   ocupa a celula inteira e joga o valor para o outro lado dela. */
table.conf .esc input{margin:0;flex:0 0 auto;width:14px;height:14px;padding:0}
.vazio-nulo{color:var(--texto-3);font-style:italic}
tr.linha-excluida td{opacity:.55;text-decoration:line-through}
.chip-visao{display:inline-flex;gap:0;border:1px solid var(--linha-forte);
            border-radius:7px;overflow:hidden;margin-left:8px}
.chip-visao button{padding:3px 10px;font-size:11px;background:transparent;
                   border:0;color:var(--texto-3);cursor:pointer;font:inherit;width:auto}
.chip-visao button.ativo{background:var(--laranja);color:#10060a}
/* A visao das marcadas herda o rosa da acao: a mesma cor do botao que marca. */
.chip-visao button.marcadas.ativo{background:var(--acao-marcar);color:var(--fundo)}
textarea.campo.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5}
label.cmp.largo{grid-column:1/-1}
.paginar{display:inline-flex;gap:6px;margin-left:8px;align-items:center}
/* A caixa de ir para a pagina: larga o bastante para cinco digitos, porque
   uma tabela com mais de dez mil paginas e exatamente o caso em que ela
   serve. `tabular-nums` para o numero nao dancar enquanto se digita. */
.campo-pagina{width:5.5em;padding:3px 6px;border:1px solid var(--linha);
  border-radius:6px;background:var(--painel-2);color:var(--texto);
  font:inherit;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.campo-pagina:disabled{opacity:.35}
.paginar .botao.mini:disabled{opacity:.35;cursor:default;border-color:var(--linha)}
.paginar .botao.mini:disabled:hover{border-color:var(--linha);color:var(--texto-3)}
td.ordem{color:var(--texto-3);font-size:11px}
tr.balde-vazio{opacity:.45}

.botao.mini{width:auto;padding:4px 10px;font-size:11px;font-weight:500;
            background:transparent;border:1px solid var(--linha-forte);
            color:var(--texto-3)}
.botao.mini:hover{border-color:var(--log);color:var(--log)}
td.num.mal{color:var(--log)}

/* ----------------------------------------------------------------- juncoes */
.vennes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:10px;margin:18px 0}
.venn{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 10px;
  background:var(--painel-2);border:1px solid var(--linha);border-radius:9px;
  color:var(--texto-2);cursor:pointer;font:inherit;width:auto;text-align:center;
}
.venn:hover{border-color:var(--linha-forte);color:var(--texto)}
.venn.viva{border-color:var(--laranja);background:var(--realce);color:var(--texto)}
.venn svg{width:96px;height:auto;display:block}
.venn .v-rot{font-size:12px;font-weight:600}
.venn .v-sql{font-size:9.5px;font-family:"IBM Plex Mono",monospace;
             color:var(--texto-3);line-height:1.3}
.venn .v-exp{font-size:10px;color:var(--texto-3);line-height:1.35}
.un-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
          gap:6px;margin-bottom:16px}
.un-item{display:flex;align-items:center;gap:8px;padding:8px 11px;margin:0;
         background:var(--painel-2);border:1px solid var(--linha);border-radius:6px;
         font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--texto-2)}
.un-item input{width:auto;margin:0}
.un-item:hover{border-color:var(--linha-forte)}

/* ------------------------------------------------------------------ dblink */
.barra-dbl{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.barra-dbl label{display:flex;flex-direction:column;gap:4px;font-size:11px;
                 color:var(--texto-3)}
.barra-dbl select{
  padding:7px 9px;border:1px solid var(--linha);border-radius:5px;
  background:var(--painel);color:var(--texto);font-size:12.5px;min-width:170px;
}
.barra-dbl .botao{width:auto;padding:7px 14px}
/* Lista a esquerda, dado a direita: e a forma do Centro de Controle, e e a
   que deixa trocar de tabela sem perder de vista as outras. */
.dbl-corpo{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.dbl-corpo{grid-template-columns:1fr}}
.dbl-lista{
  border:1px solid var(--linha);border-radius:8px;background:var(--painel);
  max-height:70vh;overflow:auto;
}
.dbl-cab{padding:9px 12px;font-size:11px;color:var(--texto-3);
         border-bottom:1px solid var(--linha);position:sticky;top:0;
         background:var(--painel-2);z-index:1}
.dbl-tab{
  display:block;width:100%;text-align:left;padding:9px 12px;background:none;
  border:none;border-bottom:1px solid var(--linha);color:var(--texto);
  cursor:pointer;font:inherit;
}
.dbl-tab:hover{background:var(--painel-2)}
.dbl-tab.viva{background:var(--realce);box-shadow:inset 3px 0 0 var(--laranja)}
.dbl-tab .n{display:block;font-size:12.5px;font-weight:600}
.dbl-tab .m{display:block;font-size:10.5px;color:var(--texto-3);margin-top:2px;
            font-variant-numeric:tabular-nums}
.dbl-titulo{display:flex;gap:10px;align-items:center;margin-bottom:10px;
            flex-wrap:wrap}
.dbl-titulo .leg{font-size:11px;color:var(--texto-3)}
.dbl-titulo .cresce{flex:1}
.dbl-titulo .botao{width:auto;padding:6px 12px;font-size:11.5px}
.form-dbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
          gap:12px 16px;text-align:left}
/* O `label` global e maiusculo e espacado -- bom para o rotulo, ruim para a
   dica embaixo do campo, que virava um grito. */
.form-dbl .cmp{display:flex;flex-direction:column;gap:4px;margin:0;
               text-transform:none;letter-spacing:0;color:var(--texto-3)}
.form-dbl .cmp > span:first-child{font-size:10.5px;letter-spacing:.1em;
                                  text-transform:uppercase}
.form-dbl .cmp .leg{font-size:10.5px;line-height:1.4;color:var(--texto-3);
                    text-transform:none;letter-spacing:0}
.form-dbl input,.form-dbl select{
  padding:8px 10px;border:1px solid var(--linha);border-radius:5px;
  background:var(--painel);color:var(--texto);font-size:12.5px;margin:0;
}
.form-dbl input:focus,.form-dbl select:focus{outline:none;border-color:var(--laranja)}
.form-dbl .linha-chk{grid-column:1/-1;flex-direction:row;align-items:center;
                     gap:8px;font-size:12px;color:var(--texto-2)}
.form-dbl .linha-chk input{width:auto}
.form-sql{margin-bottom:16px}
#sqlDbl{
  width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:6px;
  background:var(--painel);color:var(--texto);font-size:12.5px;
  font-family:"IBM Plex Mono",monospace;resize:vertical;margin:0 0 12px;
}

/* O phx-grid traz o proprio tema claro. Aqui ele passa a seguir o do
   console: os tokens dele apontam para os nossos, e o sol/lua troca os dois
   ao mesmo tempo. Sem isso, no tema escuro o grid ficaria branco no meio da
   pagina preta. */
.phx-grid{
  --phx-bg:var(--painel); --phx-bg2:var(--painel-2); --phx-fg:var(--texto);
  --phx-meta:var(--texto-3); --phx-borda:var(--linha); --phx-acc:var(--laranja);
  font-family:"Exo 2","Helvetica Neue",Arial,sans-serif;
}
.phx-grid input,.phx-grid select,.phx-grid button{
  background:var(--painel-2);color:var(--texto);border-color:var(--linha-forte);
}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
thead th{
  position:sticky;top:0;background:var(--painel-2);z-index:1;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500;white-space:nowrap;
}
tbody tr:hover{background:var(--painel-2)}
td.dado{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.nulo{color:var(--texto-3);font-style:italic}
.rolo{overflow:auto;border:1px solid var(--linha);border-radius:8px;background:var(--painel)}

.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--linha);border:1px solid var(--linha);border-radius:8px;overflow:hidden;margin-bottom:20px}
.ficha{background:var(--painel);padding:13px 15px}
.ficha .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ficha .r{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--texto-3);margin-top:4px}

.pino{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;
  border:1px solid currentColor;white-space:nowrap;
}
.pino.ok{color:var(--ok)} .pino.nao{color:var(--texto-3)} .pino.mal{color:var(--vermelho)}
.pino.reg{color:var(--reg)} .pino.ndx{color:var(--ndx)} .pino.bin{color:var(--bin)}
.pino.memo{color:var(--memo)} .pino.log{color:var(--log)}

h3{font-size:13px;font-weight:600;margin:26px 0 10px;color:var(--texto-2)}
h3:first-child{margin-top:0}
.aviso{
  border-left:2px solid var(--ambar);background:rgba(255,196,61,.07);
  padding:11px 14px;border-radius:0 6px 6px 0;font-size:12.5px;
  color:var(--texto-2);margin:16px 0;
}
.aviso.mal{border-left-color:var(--vermelho);background:rgba(255,95,95,.07)}
.centro{display:grid;place-items:center;height:100%;color:var(--texto-3);
  text-align:center;font-size:13.5px;line-height:1.6}
/* --------------------------------------------------- diagrama ER (#127)
   As cores todas saem das variáveis do console, então o desenho acompanha o
   tema claro e o escuro sem uma segunda paleta.

   ATENÇÃO ao CSS global: `label{text-transform:uppercase}` não morde texto de
   SVG (que não é `label`), mas `input{width:100%}` morde o seletor de banco
   desta tela — por isso ele tem largura própria abaixo. */
.er-rolo{
  overflow:auto;background:var(--painel-2);border:1px solid var(--linha);
  border-radius:8px;padding:14px;max-height:calc(100vh - 320px);
}
/* Sem `min-width:100%`: com uma tabela só, esticar o SVG para a largura do
   painel jogava o desenho para o meio de um retângulo vazio. Ele fica no
   tamanho que tem, encostado à esquerda, e quem passar da largura rola. */
svg.er{display:block}
.er-caixa{fill:var(--painel);stroke:var(--linha-forte);stroke-width:1}
.er-topo{fill:var(--realce);stroke:none}
.er-risco{stroke:var(--linha-forte);stroke-width:1}
.er-nome{font-family:"Exo 2",sans-serif;font-size:12.5px;font-weight:600;
  fill:var(--texto)}
.er-conta{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  fill:var(--texto-3);text-anchor:end}
.er-col{font-family:"IBM Plex Mono",monospace;font-size:11px}
.er-marca{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.05em}
.er-tipo{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  fill:var(--texto-3);text-anchor:end}
/* O «+ N coluna(s)» é ancorado à ESQUERDA. Com o `er-tipo`, que é ancorado à
   direita, ele saía pela borda esquerda da caixa. */
.er-mais{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  fill:var(--texto-3);font-style:italic}
.er-seta{fill:none;stroke:var(--laranja);stroke-width:1.4}
.er-seta.solta{stroke:var(--texto-3);stroke-dasharray:4 3}
.er-rot{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  fill:var(--texto-3);text-anchor:middle}
/* Encostado à esquerda: o rótulo fica AO LADO da seta, não em cima dela. */
.er-rot.lado{text-anchor:start}
.er-rot.solta{fill:var(--texto-3);font-style:italic}
.er-tabela:hover .er-caixa{stroke:var(--laranja)}
.er-legenda{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-size:11px;color:var(--texto-3);margin:10px 0 0}
.er-legenda b{display:inline-flex;align-items:center;gap:5px;font-weight:500;
  font-family:"IBM Plex Mono",monospace}

/* ------------------------------------------- jobs, serviço e dado pessoal
   Um `<select>` dentro de uma barra de ações herda `width:100%` do CSS global
   e vira uma faixa da largura da tela. Aqui os campos têm tamanho próprio. */
.barra-acao{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 14px;
}
.barra-acao label{
  display:flex;flex-direction:column;gap:4px;margin:0;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3);
}
.barra-acao input,.barra-acao select{
  width:auto;min-width:150px;padding:7px 10px;font-size:12.5px;
  background:var(--painel);border:1px solid var(--linha);border-radius:5px;
}
.barra-acao .botao{width:auto}
/* Rótulo de célula não vira caixa-alta: «Blumenau» tem de continuar
   «Blumenau», senão a tela mente sobre o dado. */
td label,td .rot-dado{text-transform:none;letter-spacing:0;font-size:inherit;
  color:inherit;display:inline}
.forma-job{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px 16px;margin:0 0 14px;
}
.forma-job label{
  display:flex;flex-direction:column;gap:4px;margin:0;
  text-transform:none;letter-spacing:0;color:var(--texto-3);
}
.forma-job label > span:first-child{font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase}
.forma-job label.largo{grid-column:1/-1}
.forma-job input,.forma-job select,.forma-job textarea{
  width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:5px;
  background:var(--painel);color:var(--texto);font-size:12.5px;margin:0;
}
.forma-job textarea{font-family:"IBM Plex Mono",monospace;min-height:92px;
  resize:vertical}
.forma-job .chk{flex-direction:row;align-items:center;gap:8px;
  font-size:12.5px;color:var(--texto-2)}
.forma-job .chk input{width:15px;height:15px;padding:0;margin:0}
.forma-job .leg{font-size:10.5px;line-height:1.4;text-transform:none;
  letter-spacing:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function api(op, params = {}) {
  if (est.demo) return demo(op, params);
  const r = await fetch("/api", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              ...(est.sessao ? {"X-Sessao":est.sessao} : {}) },
    body: JSON.stringify({ token: est.token, op, ...params })
  });
  const j = await r.json();
  if (j.sessao) est.sessao = j.sessao;
  if (!j.ok) {
    // O texto é para quem lê; o nome e o código são para quem programa. Sem
    // eles pendurados aqui, distinguir «conflito de escrita» de qualquer
    // outra recusa obrigaria a comparar a REDAÇÃO da mensagem — e o dia em
    // que alguém a melhorasse, a tela quebrava calada.
    const e = new Error(j.erro || "falha");
    e.nome = j.nome || "";
    e.codigo = j.codigo || 0;
    throw e;
  }
  return j.resultado;
}

// ---------------------------------------------------------------------
// Desafio-resposta. Base64 tira a senha do olho de quem passa; isto tira a
// senha do FIO. Quem grava o pacote nao consegue reproduzir a prova, porque
// o nonce do servidor vale uma vez so.
//
// Depende de crypto.subtle, que so existe em contexto seguro: https, ou
// http em 127.0.0.1. Fora disso a interface cai no Base64 e avisa.
// ---------------------------------------------------------------------
const podeProvar = () => !!(window.crypto && crypto.subtle && crypto.subtle.deriveBits);

const bytesDeHex = h => Uint8Array.from(h.match(/../g) || [], b => parseInt(b, 16));
const hexDeBytes = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");

/// Assina o MESMO desafio da senha, com a chave privada Ed25519.
///
/// Segundo fator: a senha prova que voce sabe, a chave prova que voce tem.
/// Depende de crypto.subtle com Ed25519 -- que e recente. Sem ele, a pagina
/// diz para usar a linha de comando em vez de fingir que assinou.
async function assinarDesafio(chaveHex, nonce, nonceCliente, usuario) {
  if (!/^[0-9a-fA-F]{64}$/.test(chaveHex))
    throw new Error("a chave privada tem 64 hexadecimais");
  let chave;
  try {
    chave = await crypto.subtle.importKey(
      "raw", bytesDeHex(chaveHex), { name:"Ed25519" }, false, ["sign"]);
  } catch {
    throw new Error("este navegador não assina Ed25519; entre sem chave por "
                  + "um cliente de linha de comando");
  }
  const msg = new TextEncoder().encode(`${nonce},${nonceCliente},${usuario}`);
  return hexDeBytes(await crypto.subtle.sign("Ed25519", chave, msg));
}

async function calcularProva(senha, salHex, iteracoes, nonce, nonceCliente, usuario) {
  const cru = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  const dk = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt: bytesDeHex(salHex), iterations: iteracoes, hash:"SHA-256" },
    cru, 256);
  const chave = await crypto.subtle.importKey(
    "raw", dk, { name:"HMAC", hash:"SHA-256" }, false, ["sign"]);
  const msg = new TextEncoder().encode(`${nonce},${nonceCliente},${usuario}`);
  return hexDeBytes(await crypto.subtle.sign("HMAC", chave, msg));
}

      if (p.indice === "porNome") l.sort((a,b)=>a.nome.localeCompare(b.nome));
      if (p.indice === "porCidadeLimite") l.sort((a,b)=>
        a.cidade.localeCompare(b.cidade) || parseFloat(b.limite)-parseFloat(a.limite));
      return {total:l.length, devolvidas:l.length,
              ordem:p.indice?`indice ${p.indice}`:"digitacao", linhas:l};
    }
    case "diario": return {total:d.diario.length, eventos:d.diario};
    case "verificar": return {tabela:nome, registros:6, slots:7, eventos:8,
      indices:{porId:6,porNome:6,porCidadeLimite:6}, volumes:{reg:4,bin:1,memo:1,log:1}};
    case "usuarios": return d.usuarios;
    case "acessos": return {total:d.acessos.length, acessos:[...d.acessos].reverse()};
    case "bloqueios": return {arquivo:"blacklist.json", ativos:d.bloqueios};
    // As telas novas também precisam existir sem servidor, senão avaliar a
    // interface antes de instalar deixa três botões dando erro.
    case "servico": return {no_ar:true, endereco:"127.0.0.1:5000",
      bind_configurado:"0.0.0.0:5000", difere_do_arquivo:false, conexoes:1,
      web:"127.0.0.1:5001", web_ligada:true};
    case "jobs": return {arquivo:"jobs.json", log:"jobs.log",
      jobs:d.jobs, historico:d.corridas};
    default: throw new Error("operação sem demonstração: " + op);
  }
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/** Recado curto no rodape da barra, que some sozinho.
 *
 * Um `alert()` interromperia quem esta trabalhando para dizer "backup
 * pronto"; um recado que aparece e sai nao interrompe ninguem. Erro fica
 * mais tempo, porque erro se le. */
let sumicoDoAviso = null;
function avisar(texto, ehErro) {
  const alvo = $("#aviso");
  if (!alvo) return;
  alvo.textContent = texto;
  alvo.className = "recado" + (ehErro ? " mal" : "");
  alvo.hidden = false;
  clearTimeout(sumicoDoAviso);
  sumicoDoAviso = setTimeout(() => { alvo.hidden = true; }, ehErro ? 9000 : 4000);
}

function tabela(colunas, linhas, montar) {
  if (!linhas.length) return `<div class="vazio">nada aqui</div>`;
  return `<div class="rolo"><table><thead><tr>${
    colunas.map(c=>`<th class="${c.cls||""}">${esc(c.t)}</th>`).join("")
  }</tr></thead><tbody>${linhas.map(montar).join("")}</tbody></table></div>`;
}

function celulaValor(v) {
  if (v === null || v === undefined) return `<td class="dado nulo">NULL</td>`;
  if (typeof v === "number") return `<td class="dado num">${v}</td>`;
  const s = String(v);
  return `<td class="dado">${esc(s.length > 60 ? s.slice(0,57)+"…" : s)}</td>`;
}

async function detectarModo() {
  try {
    // /saude nao pede token e nao conta tentativa: e so o sinal de vida.
    const r = await fetch("/saude");
    if (!r.ok) throw new Error("sem servidor");
    const saude = await r.json();
    est.demo = false;
    // A porta que aparece no formulario e a que o servidor REALMENTE escuta,
    // lida dele. O 5000 e so o padrao de fabrica.
    est.portaLocal = saude.porta_dados || 5000;
    est.servidores = saude.servidores || [];
    $("#pt").value = est.portaLocal;
    $("#campoChave").hidden = !saude.exige_chave;
    if (est.servidores.length) {
      $("#h").setAttribute("list", "servidores");
      const dl = document.createElement("datalist");
      dl.id = "servidores";
      for (const d of est.servidores) {
        const o = document.createElement("option");
        o.value = d.split(":")[0];
        dl.appendChild(o);
      }
      document.body.appendChild(dl);
    }
    $("#modo").innerHTML = "Servidor encontrado nesta origem. Informe o token do "
      + "<code>config.json</code> e as suas credenciais.<br>"
      + (podeProvar()
          ? "Login por <b>desafio&#8209;resposta</b>: a senha não sai desta máquina."
          : "Contexto não seguro: o login cai em <b>Base64</b>, que esconde a senha "
            + "de quem olha, não de quem captura. Use HTTPS ou um túnel.");
    $("#t").parentElement.hidden = false;
  } catch {
    est.demo = true;
    $("#modo").innerHTML = "<b>Nenhum servidor nesta origem.</b> A interface abre em "
      + "modo demonstração, com dados embutidos, para ser avaliada antes de instalar. "
      + "Entre com qualquer coisa.";
    $("#t").parentElement.hidden = true;
    $("#s").value = "demonstracao";
  }
}

/// Este endereco e o proprio servidor que serviu a pagina?
function ehLocal(host, porta) {
  const h = (host || "").trim().toLowerCase();
  const aqui = h === "" || h === "localhost" || h === "127.0.0.1" || h === "::1"
            || h === location.hostname.toLowerCase();
  return aqui && Number(porta) === Number(est.portaLocal);
}

async function entrar() {
  const usuario = $("#u").value.trim(), senha = $("#s").value, token = $("#t").value;
  const host = $("#h").value.trim(), porta = $("#pt").value.trim() || "5000";
  const chave = $("#k").value.trim();
  const recado = $("#recado");
  recado.className = "recado info"; recado.textContent = "Conferindo…";
  est.token = token;
  est.database = $("#db").value.trim();
  // So manda "servidor" quando for OUTRO servidor. Para o proprio, o caminho
  // curto continua sendo o caminho curto.
  est.servidor = ehLocal(host, porta) ? "" : `${host}:${porta}`;
  try {
    if (est.demo) {
      est.usuario = { nome:"Adriano Boller", login:usuario||"demo", supervisor:true };
    } else if (podeProvar()) {
      // Caminho bom: a senha nao sai desta maquina.
      recado.textContent = "Derivando a prova…";
      const d = await api("desafio",
        est.servidor ? { usuario, servidor: est.servidor } : { usuario });
      const nonceCliente = hexDeBytes(crypto.getRandomValues(new Uint8Array(12)));
      const prova = await calcularProva(
        senha, d.sal, d.iteracoes, d.nonce, nonceCliente, usuario);
      const pedido = { usuario, prova, nonce_cliente:nonceCliente };
      if (est.servidor) pedido.servidor = est.servidor;
      if (chave) {
        recado.textContent = "Assinando o desafio…";
        pedido.assinatura = await assinarDesafio(chave, d.nonce, nonceCliente, usuario);
      }
      est.usuario = await api("login", pedido);
    } else {
      // Reserva: Base64. Nao e cifra -- so tira a senha do olho e do escape
      // do JSON. O que protege de verdade e o tunel.
      const b64 = s => btoa(unescape(encodeURIComponent(s)));
      const pedido = { usuario_b64:b64(usuario), senha_b64:b64(senha) };
      if (est.servidor) pedido.servidor = est.servidor;
      est.usuario = await api("login", pedido);
    }
    await abrirApp();
  } catch (e) {
    recado.className = "recado erro";
    recado.textContent = e.message || "não consegui entrar";
  }
}

async function abrirApp() {
  $("#entrada").style.display = "none";

  $("#selo").hidden = !est.demo;

/** Redesenha a arvore da esquerda.
 *
 * `abrirPainel` existe por causa de uma corrida real: a arvore terminava
 * SEMPRE clicando no Painel, e o `abrirAdmin` disparado por esse clique
 * chegava DEPOIS da tela que quem chamou ja tinha pintado -- criar uma tabela
 * voltava para a grade e a grade era substituida pelo painel meio segundo
 * depois. Quem vai pintar a propria tela passa `false`. */
async function montarArvore(abrirPainel = true) {
  const bancos = await api("bancos");
  est.bancos = bancos;
  let html = `<div class="no painel" data-admin="painel"><span class="ic">◎</span>Painel</div>
    <div class="grupo">Bancos de dados
      <button class="mais" id="btNovoDb" title="Novo database"
              aria-label="Adicionar um database">+</button></div>`;
  for (const b of bancos) {
    const t = await api("tabelas", { database:b });
    html += `<div class="no db" data-db="${esc(b)}"><span class="ic">▾</span>${esc(b)}</div>`;
    const raiz = t.tabelas.filter(x => !x.includes("."));
    const porEsq = {};
    for (const x of t.tabelas.filter(x => x.includes("."))) {
      const [e, n] = x.split(".");
      (porEsq[e] ||= []).push(n);
    }
    for (const n of raiz)
      html += `<div class="no tab" data-db="${esc(b)}" data-tab="${esc(n)}">
        <span class="ic">▤</span>${esc(n)}</div>`;
    for (const e of Object.keys(porEsq).sort()) {
      html += `<div class="no esq"><span class="ic">▾</span>${esc(e)}</div>`;
      for (const n of porEsq[e])
        html += `<div class="no tab emesq" data-db="${esc(b)}" data-tab="${esc(e)}.${esc(n)}">
          <span class="ic">▤</span>${esc(n)}</div>`;
    }
    if (!t.tabelas.length) html += `<div class="vazio">sem tabelas</div>`;
  }
  html += `<div class="grupo">Administração</div>`;
  for (const [chave, rotulo, ic] of
       [["usuarios","Usuários","◉"],["acessos","Acessos","◈"],["bloqueios","Bloqueios","⛔"]])
    html += `<div class="no" data-admin="${chave}"><span class="ic">${ic}</span>${rotulo}</div>`;

  const a = $("#arvore");
  a.innerHTML = html;
  a.querySelectorAll("[data-tab]").forEach(n => n.onclick = () => {
    marcar(n); abrirTabela(n.dataset.db, n.dataset.tab);
  });
  a.querySelectorAll("[data-admin]").forEach(n => n.onclick = () => {
    marcar(n); abrirAdmin(n.dataset.admin);
  });
  // O [+] ao lado do titulo do grupo. `stopPropagation` porque ele mora
  // dentro do cabecalho, e clicar nele nao e clicar no grupo.
  const mais = $("#btNovoDb");
  if (mais) mais.onclick = ev => { ev.stopPropagation(); novoDatabase(); };
  // Clicar no nome de um database abre o View Database dele.
  a.querySelectorAll(".no.db").forEach(n => n.onclick = () => {
    marcar(n); verDatabase(n.dataset.db);
  });

  // O painel e a primeira tela: quem entra ve o servidor inteiro antes de
  // escolher uma tabela.
  if (abrirPainel) a.querySelector('[data-admin="painel"]').click();
}

async function desenharAba() {
  const p = $("#painel");

    if (est.aba === "indices")     return p.innerHTML = await vIndices(db, tab);
    if (est.aba === "diario")      return p.innerHTML = await vDiario(db, tab);

async function vEstrutura(database, tabela_) {
  const e = await api("esquema", { database, tabela:tabela_ });
  const pag = e.paginacao;
  const fichas = [
    ["registros", e.registros], ["slots usados", e.slots],
    ["colunas", e.colunas.length], ["índices", e.indices.length],
    ["chaves estrangeiras", (e.chaves_estrangeiras||[]).length],
    ["paginação", pag ? `${pag.registros_por_arquivo}/arq` : "não"]
  ];
  let h = `<div class="fichas">${fichas.map(([r,v]) =>
    `<div class="ficha"><div class="v">${esc(v)}</div><div class="r">${r}</div></div>`).join("")}</div>`;

  h += `<h3>Colunas</h3>` + tabela(
    [{t:"#",cls:""},{t:"nome"},{t:"tipo"},{t:"obrigatória"},{t:"onde mora"}],
    e.colunas, (c,i) => {
      const ext = c.tipo === "Bin" ? "bin" : c.tipo === "Memo" ? "memo" : "reg";
      const nota = c.tipo === "Uuid" ? " 16 bytes"
                 : c.tipo === "Uuid256" ? " 32 bytes"
                 : c.tipo === "Sequence" ? " conta sozinha" : "";
      return `<tr><td class="num dado">${i}</td><td class="dado">${esc(c.nome)}</td>
        <td class="dado">${esc(c.tipo)}<span class="leg">${nota}</span></td>
        <td>${c.nullable ? '<span class="pino nao">nulo ok</span>' : '<span class="pino ok">not null</span>'}</td>
        <td><span class="pino ${ext}">.${ext}</span></td></tr>`;
    });

  if ((e.chaves_estrangeiras||[]).length) {
    h += `<h3>Chaves estrangeiras</h3>` + tabela(
      [{t:"nome"},{t:"colunas"},{t:"referencia"},{t:"ao excluir"},{t:"ao alterar"}],
      e.chaves_estrangeiras, f =>
        `<tr><td class="dado">${esc(f.nome)}</td><td class="dado">${esc(f.colunas.join(", "))}</td>
         <td class="dado">${esc(f.tabela_ref)}(${esc(f.colunas_ref.join(", "))})</td>
         <td>${esc(f.ao_excluir)}</td><td>${esc(f.ao_alterar)}</td></tr>`);
  }

  if (pag) h += `<div class="aviso">Tabela paginada: <b>${pag.registros_por_arquivo}</b>
    registros por arquivo × <b>${pag.max_arquivos}</b> arquivos =
    capacidade de <b>${pag.capacidade}</b> registros. O volume sai do rowid por divisão,
    então o <code>.ndx</code> não sabe que volume existe.</div>`;
  return h;
}

/// Mapeia o tipo do PhxSql no tipo que o grid entende.
///
/// So os que mudam a apresentacao: numero alinha a direita, moeda formata,
/// data ordena por instante. O resto e texto, e texto e o padrao do grid.
function tipoDoGrid(t) {
  // Sequence antes de UInt: ela chega como numero, mas nao e quantidade --
  // somar identificadores nao quer dizer nada.
  if (t === "Sequence") return "numero";
  if (/^Int|^UInt/.test(t)) return "numero";
  if (/^Decimal/.test(t)) return "moeda";
  if (t === "Date") return "data";           // sem hora, porque nao ha hora
  if (t === "DateTime" || t === "Time") return "dataHora";
  return "texto";                            // Uuid e Uuid256 vem em texto
}

async function vConteudo(database, tabela_) {
  const e = await api("esquema", { database, tabela:tabela_ });
  const r = await api("varrer", { database, tabela:tabela_,
                                  indice: est.ordem || undefined, max: est.teto });
  est.linhas = r.linhas;
  est.esquemaAtual = e;
  const opcoes = [`<option value="">ordem de digitação (.reg)</option>`]
    .concat(e.indices.map(i =>
      `<option value="${esc(i.nome)}" ${est.ordem===i.nome?"selected":""}>índice ${esc(i.nome)}</option>`));
  const tetos = [200, 1000, 5000].map(n =>
    `<option value="${n}" ${est.teto===n?"selected":""}>${n} linhas</option>`);
  return `<div class="ferramentas">
      <label for="ord">Percorrer por</label>
      <select id="ord">${opcoes.join("")}</select>
      <label for="teto">Trazer</label>
      <select id="teto">${tetos.join("")}</select>
      <span class="conta">${fmt(r.devolvidas)} de ${fmt(r.visiveis ?? r.registros)} linhas · ${esc(r.ordem)}</span>
      <span class="dica">Arraste um cabeçalho para a faixa de cima para agrupar.</span>
    </div>
    <div id="grade"></div>`;
}

function ligarConteudo() {
  const s = $("#ord");
  if (s) s.onchange = () => { est.ordem = s.value; desenharAba(); };
  const t = $("#teto");
  if (t) t.onchange = () => { est.teto = Number(t.value); desenharAba(); };

  const alvo = $("#grade");
  if (!alvo || !window.PhxGrid || !est.esquemaAtual) return;

  // O grid do Phoenix, com a faixa de agrupamento ligada. As colunas saem do
  // esquema da tabela -- nada e escrito a mao aqui, entao tabela nova aparece
  // certa sem ninguem mexer nesta pagina.
  const colunas = [{ campo:"rowid", titulo:"rowid", tipo:"numero", largura:90 }]
    .concat(est.esquemaAtual.colunas.map(c => ({
      campo: c.nome,
      titulo: c.nome,
      tipo: tipoDoGrid(c.tipo),
      // Somar sequencia ou id nao significa nada; so quantidade soma.
      agregador: c.tipo !== "Sequence" && /^Int|^UInt|^Decimal/.test(c.tipo) ? "sum" : null
    })));

  if (est.grade && est.grade.destruir) { try { est.grade.destruir(); } catch {} }
  // Exposto para teste automatizado e para o console do navegador.
  est.grade = window.__phxgrade = PhxGrid.criar("#grade", {
    agrupavel: true,
    buscaGlobal: true,
    colunas: colunas,
    dados: est.linhas,
    pagina: { tamanho: 100, opcoes: [50, 100, 200] }
  });
}

      <div class="r">${r==="registros"||r==="slots"||r==="eventos"?r:r+" volumes"}</div></div>`).join("")}</div>`;

// Gráficos do painel. SVG escrito à mão, como o resto do projeto: são
// barras, área e anel — e uma biblioteca de gráfico não diria mais nada
// do que isso diz, ao custo de uma dependência.
