/** Quem pode o que, com o poder de cada um sobre cada base. */
async function verConfigUsuarios() {
  const u = await api("usuarios");
  const lista = u.usuarios || u || [];
  folha("Configurações dos usuários", `${lista.length} cadastrado(s) · o hash da senha nunca sai daqui`,
    `<div class="fichas">
       ${ficha(lista.length, "usuários")}
       ${ficha(lista.filter(x => x.supervisor).length, "supervisores")}
       ${ficha(lista.filter(x => x.ativo === false).length, "inativos")}
       ${ficha(lista.filter(x => x.exige_chave).length, "exigem chave", "Ed25519")}
     </div>

     ${tabela([{t:"login"},{t:"nome"},{t:"nível"},{t:"supervisor"},{t:"ativo"},{t:"chave"},{t:"e-mail"}],
       lista, x => `<tr>
         <td class="dado"><b>${esc(x.login || "")}</b></td>
         <td class="dado">${esc(x.nome || "")}</td>
         <td class="dado">${esc(x.nivel || "—")}</td>
         <td class="dado">${x.supervisor ? "<span class=\"pino ok\">sim</span>" : "não"}</td>
         <td class="dado">${x.ativo === false ? "<span class=\"pino mal\">não</span>" : "sim"}</td>
         <td class="dado">${x.exige_chave ? "exige" : "—"}</td>
         <td class="dado">${esc(x.email || "")}</td></tr>`)}

     <h3 class="secao">Poder sobre cada base</h3>
     ${lista.map(x => `<div class="bloco-user">
        <b>${esc(x.login || "")}</b>
        ${x.supervisor ? `<span class="pino ok">supervisor — pode tudo em toda base</span>`
          : (() => {
              const bases = x.bases || {};
              const chaves = Object.keys(bases);
              if (!chaves.length) return `<span class="pino mal">sem base listada e sem "*" — nega tudo</span>`;
              return chaves.map(b => `<span class="pino">${esc(b)}: ${
                Object.entries(bases[b] || {}).filter(([, v]) => v).map(([k]) => esc(k)).join(", ") || "nada"
              }</span>`).join(" ");
            })()}
        ${(() => {
            // A regra de tabela SUBSTITUI a da base naquela tabela. Mostrá-la
            // na mesma linha da base seria dizer que uma soma da outra.
            const porTab = x.tabelas || {};
            const bs = Object.keys(porTab);
            if (x.supervisor || !bs.length) return "";
            return `<div class="por-tabela">${bs.map(b =>
              Object.entries(porTab[b] || {}).map(([t, perm]) => {
                const pode = Object.entries(perm || {}).filter(([, v]) => v).map(([k]) => esc(k));
                return `<span class="pino ${pode.length ? "" : "mal"}">${esc(b)}.${esc(t)}: ${
                  pode.join(", ") || "nada"}</span>`;
              }).join(" ")).join(" ")}</div>`;
          })()}
      </div>`).join("")}

     <div class="nota">
       <p><strong>Três regras decidem tudo.</strong> Nega por omissão: atividade
       que não aparece vale <code>false</code>. A base listada manda — o
       <code>"*"</code> não completa o que faltou, e base listada vazia nega
       tudo. Sem a base e sem <code>"*"</code>, nega tudo.</p>
       <p><strong>E a tabela ganha da base.</strong> Dentro do objeto da base,
       <code>"tabelas"</code> escreve a regra de cada tabela — e ela
       <em>substitui</em> a da base naquela tabela, não soma nem corta. É o que
       permite as duas coisas que a prática pede: tirar <code>folha</code> de
       quem lê o banco inteiro, e dar <code>clientes</code> a quem não lê o
       banco nenhum. A árvore e o catálogo só mostram o que dá para abrir.</p>
       <p><strong>Esta tela lê.</strong> Criar e alterar usuário pela web
       significa mexer em credencial por HTTP, e isso precisa de um desenho
       próprio — quem pode, o que fica no log, e a senha nunca em claro em
       lugar nenhum do caminho. Por enquanto: <code>phxsqld --senha</code> gera
       o hash, e ele entra no <code>config.json</code>.</p>
       <p class="leg">Nenhum campo desta tela traz o hash — o servidor não o
       devolve, e há teste que falha se a ficha vazar.</p>
     </div>`);
}

/* ================================================= Catálogo do sistema
   SysTables e SysColumns: o catalogo como se fosse tabela. E o dicionario de
   dados -- onde os metadados novos de campo aparecem todos juntos. */

async function verSysTables(db) {
  db = db || databaseCorrente();
  if (!db) return avisar("nenhum database escolhido", true);
  folha(`SysTables · ${db}`, "carregando…", `<div class="centro">carregando…</div>`);
  const r = await api("sistabelas", { database: db });
  const linhas = r.tabelas || [];

  folha(`SysTables · ${db}`, `${linhas.length} tabela(s) · o catálogo em forma de dado`,
    `<div class="acoes">
       <button class="botao secundario" id="btSysCols">SysColumns →</button>
       <button class="botao secundario" id="btVoltaDb">← Gerir ${esc(db)}</button>
     </div>` +
    tabela([{t:"tabela"},{t:"schema"},{t:"registros",cls:"num"},{t:"slots",cls:"num"},
            {t:"colunas",cls:"num"},{t:"índices",cls:"num"},{t:"chave primária"},
            {t:"FKs",cls:"num"},{t:"bytes/linha",cls:"num"},{t:"partição"},{t:"volumes",cls:"num"}],
      linhas, x => `<tr class="linha-tab" data-tab="${esc(x.tabela)}">
        <td class="dado"><b>${esc(x.tabela)}</b>${x.erro ? ` <span class="pino mal">ilegível</span>` : ""}</td>
        <td class="dado">${esc(x.schema || "")}</td>
        <td class="num">${esc(String(x.registros ?? "—"))}</td>
        <td class="num">${esc(String(x.slots ?? "—"))}</td>
        <td class="num">${esc(String(x.colunas ?? "—"))}</td>
        <td class="num">${esc(String(x.indices ?? "—"))}</td>
        <td class="dado">${x.chave_primaria ? `<code>${esc(x.chave_primaria)}</code>` : "<span class=leg>—</span>"}</td>
        <td class="num">${esc(String(x.chaves_estrangeiras ?? 0))}</td>
        <td class="num">${esc(String(x.bytes_por_linha ?? "—"))}</td>
        <td class="dado">${x.particao ? `<span class="pino">${esc(x.particao)}</span>` : "<span class=leg>—</span>"}</td>
        <td class="num">${esc(String(x.volumes ?? 0))}</td></tr>`) +
    `<div class="nota"><p>Uma linha por tabela do database. <em>bytes/linha</em> é o
     payload do slot — o que cada registro ocupa no <code>.reg</code>, sem contar
     o cabeçalho de 24 bytes nem o que mora no <code>.bin</code> e no
     <code>.memo</code>.</p></div>`);

  $("#btSysCols").onclick = () => verSysColumns(db);
  $("#btVoltaDb").onclick = () => gerirDatabase(db);
  $$("#painel .linha-tab").forEach(tr =>
    tr.onclick = () => verSysColumns(db, tr.dataset.tab));
}

async function verSysColumns(db, tabela_) {
  db = db || databaseCorrente();
  if (!db) return avisar("nenhum database escolhido", true);
  folha(`SysColumns · ${db}`, "carregando…", `<div class="centro">carregando…</div>`);
  const r = await api("siscolunas", tabela_ ? { database: db, tabela: tabela_ } : { database: db });
  const linhas = r.colunas || [];

  folha(`SysColumns · ${db}${tabela_ ? ` · ${tabela_}` : ""}`,
    `${linhas.length} coluna(s) · o dicionário de dados`,
    `<div class="acoes">
       <button class="botao secundario" id="btSysTabs">← SysTables</button>
       ${tabela_ ? `<button class="botao secundario" id="btTodas">todas as tabelas</button>` : ""}
       <button class="botao secundario" id="btVoltaDb">← Gerir ${esc(db)}</button>
     </div>` +
    tabela([{t:"tabela"},{t:"#",cls:"num"},{t:"nome"},{t:"caption"},{t:"tipo"},
            {t:"tam.",cls:"num"},{t:"obrig.",cls:"num"},{t:"chave"},{t:"máscara"},
            {t:"índices"},{t:"id"},{t:"descrição"}],
      linhas, c => `<tr>
        <td class="dado">${esc(c.tabela)}</td>
        <td class="num">${c.posicao}</td>
        <td class="dado"><b>${esc(c.nome)}</b></td>
        <td class="dado">${esc(c.caption || "")}</td>
        <td class="dado"><code>${esc(tipoCurto(c.tipo))}</code></td>
        <td class="num">${c.tamanho || "—"}</td>
        <td class="num">${c.obrigatoria ? "sim" : ""}</td>
        <td class="dado">${chaveEmPino(c)}</td>
        <td class="dado">${c.mascara ? `<code>${esc(c.mascara)}</code>` : ""}</td>
        <td class="dado leg">${(c.nos_indices || []).map(esc).join(", ")}</td>
        <td class="dado leg"><code title="${esc(c.id)}">${esc((c.id || "").slice(0, 8))}…</code></td>
        <td class="dado leg">${esc(c.descricao || "")}</td></tr>`) +
    `<div class="nota"><p>O <code>id</code> é um UUID v7 sorteado quando a coluna
     nasce e <strong>nunca reaproveitado</strong>. Renomear a coluna troca o
     nome; o id segue o mesmo — é por ele que uma tela ou um relatório apontam
     para o campo sem quebrar no primeiro <em>rename</em>.</p>
     <p>As marcas de chave são <strong>derivadas</strong> dos índices e das
     chaves estrangeiras, não gravadas no campo. Guardar “é primária” na coluna
     criaria uma segunda verdade ao lado do índice, e as duas divergiriam.</p></div>`);

  $("#btSysTabs").onclick = () => verSysTables(db);
  if ($("#btTodas")) $("#btTodas").onclick = () => verSysColumns(db);
  $("#btVoltaDb").onclick = () => gerirDatabase(db);
}

/** `Decimal { precisao: 15, escala: 2 }` cansa a vista numa grade. */
function tipoCurto(t) {
  const m = /^Decimal.*?precisao:\s*(\d+).*?escala:\s*(\d+)/.exec(t || "");
  return m ? `Decimal(${m[1]},${m[2]})` : (t || "");
}

function chaveEmPino(c) {
  const p = [];
  if (c.primaria) p.push(`<span class="pino ok">PK</span>`);
  if (c.estrangeira) p.push(`<span class="pino">FK</span>`);
  if (c.composta) p.push(`<span class="pino">composta</span>`);
  return p.join(" ");
}

/* ==================================================== Gestão de transações
   Uma tela que diz a verdade em vez de um botao apagado: o que ja existe hoje
   (o desfazer de uma insercao, o diario por tabela) e o que nao existe (commit
   e rollback de varias operacoes). Sem isto, "livro-razao" e conversa. */

async function verTransacoes() {
  // O espelho e por servidor, entao a ficha le a configuracao DESTE em vez de
  // dizer "se ligado no config" -- que e verdade em toda parte e informacao em
  // lugar nenhum.
  let espelho = null;
  try { espelho = !!(await api("config")).espelho; } catch (_) { /* sem sessão */ }

  folha("Gestão de transações", "o que existe hoje, o que falta e por quê",
    `<div class="fichas">
       <div class="ficha"><div class="v">não</div><div class="r">commit/rollback</div>
         <div class="u">de várias operações</div></div>
       <div class="ficha"><div class="v">sim</div><div class="r">desfazer da inserção</div>
         <div class="u">se um índice recusar</div></div>
       <div class="ficha"><div class="v">sim</div><div class="r">diário .log</div>
         <div class="u">por tabela</div></div>
       <div class="ficha"><div class="v">${espelho === null ? "—" : espelho ? "sim" : "não"}</div>
         <div class="r">espelho .bkp</div>
         <div class="u">neste servidor</div></div>
     </div>

     <div class="nota">
       <p><strong>Transações de verdade não existem no PhxSql hoje.</strong>
       Não há <code>BEGIN</code>, <code>COMMIT</code> nem <code>ROLLBACK</code>,
       e por isso esta tela não tem uma lista de transações abertas para mostrar
       — mostrar uma vazia daria a entender que o mecanismo existe e está
       parado.</p>

       <p>O que existe é menor e vale dizer com precisão:</p>
       <ul>
         <li><b>A inserção se desfaz sozinha.</b> Se a linha entra no
         <code>.reg</code> e um índice único recusa a chave, o registro gravado
         é desfeito antes do erro voltar. É atômico dentro de <em>uma</em>
         operação, não entre várias.</li>
         <li><b>Uma trava global serializa tudo.</b> Cada escrita toma o mesmo
         <code>Mutex</code>, então duas conexões nunca escrevem ao mesmo tempo.
         Isso dá isolamento, não durabilidade transacional.</li>
         <li><b>O <code>.log</code> registra o que aconteceu</b>, por tabela,
         e serve para auditar — mas não guarda a imagem anterior da linha,
         então não dá para desfazer por ele.</li>
       </ul>

       <p><strong>O que falta, em ordem:</strong> um journal com a imagem
       anterior de cada slot tocado; um identificador de transação carregado na
       sessão; e o <code>COMMIT</code> que troca o journal por um marco no
       disco. É o furo que o uso como livro-razão — a
       <em>blockchain</em> e o correio — exigiria fechar primeiro, e por isso
       os dois estão marcados como planejados.</p>
     </div>

     <p class="leg">O estado de cada pedido está em <code>docs/PENDENCIAS.md</code>.</p>`);
}

/* ================================================== Exportar uma tabela
   Sete formatos, e os dois de escritório saem do mesmo compactador que o
   backup já usava: um .xlsx e um .docx são ZIP de XML.

   O download acontece no navegador, a partir de um Blob: o servidor devolve o
   arquivo (texto ou base64) e a página o entrega. Assim o mesmo caminho serve
   para quem clica e para quem chama por `curl`. */

const FORMATOS = [
  { id:"xlsx", rot:"Excel",    ico:"▦", diz:"planilha formatada, com filtro e painel congelado" },
  { id:"csv",  rot:"CSV",      ico:"☰", diz:"ponto e vírgula, decimal com vírgula, BOM para o acento" },
  { id:"json", rot:"JSON",     ico:"{}", diz:"uma lista de objetos, tipos preservados" },
  { id:"xml",  rot:"XML",      ico:"◇", diz:"um elemento por linha, nulo declarado" },
  { id:"html", rot:"HTML",     ico:"◫", diz:"tabela pronta, com filtro que funciona sem rede" },
  { id:"docx", rot:"Word",     ico:"▤", diz:"documento em paisagem, cabeçalho repetido por página" },
  { id:"txt",  rot:"Texto",    ico:"⌷", diz:"largura fixa, alinhado para ler no terminal" },
];

/// Entrega o arquivo ao navegador.
///
/// `base64` para binário, texto direto para o resto — decodificar base64 de um
/// CSV de 40 MB seria pagar um terço a mais de transporte e uma passada a mais
/// de CPU por nada.
function baixar(nome, mime, conteudo, ehBase64) {
  let corpo;
  if (ehBase64) {
    const bin = atob(conteudo);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    corpo = bytes;
  } else {
    corpo = conteudo;
  }
  const url = URL.createObjectURL(new Blob([corpo], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  // Revogar na hora cancelaria o download em alguns navegadores.
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function telaExportar(db, tab) {
  db = db || (est.atual || {}).db || databaseCorrente();
  tab = tab || (est.atual || {}).tab;
  if (!db || !tab) return avisar("escolha uma tabela primeiro", true);

  folha(`Exportar ${tab}`, `${esc(db)} · escolha o formato`,
    `<div class="formatos" id="fmts">
       ${FORMATOS.map(f => `<button class="fmt" data-f="${f.id}">
            <span class="f-ico">${f.ico}</span>
            <span class="f-rot">${f.rot}</span>
            <span class="f-ext">.${f.id}</span>
            <span class="f-diz">${f.diz}</span>
          </button>`).join("")}
     </div>
     <div class="form-dbl">
       <label class="cmp"><span>Máximo de linhas</span>
         <input id="expMax" class="campo" type="number" value="100000" min="1">
         <span class="leg">a tabela inteira, se couber — o teto existe para não
           montar um arquivo de gigabytes por engano</span></label>
     </div>
     <div id="expSaida"></div>
     <div class="acoes">
       <button class="botao secundario" id="btVoltaExp">← Gerir tabelas</button>
     </div>`);

  $("#btVoltaExp").onclick = () => gerirTabelasAtual();
  $$("#fmts .fmt").forEach(b => b.onclick = async () => {
    const f = b.dataset.f;
    $("#expSaida").innerHTML = `<div class="centro">gerando ${esc(f)}…</div>`;
    let r;
    try {
      r = await api("exportar", {
        database: db, tabela: tab, formato: f,
        max: Number($("#expMax").value) || 100000,
      });
    } catch (e) { return $("#expSaida").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }
    baixar(r.arquivo, r.mime, r.binario ? r.base64 : r.conteudo, r.binario);
    $("#expSaida").innerHTML =
      `<div class="aviso"><b>${esc(r.arquivo)}</b> — ${fmt(r.linhas)} linha(s),
        ${fmtBytes(r.bytes)}, ${r.ms} ms.${
        r.truncado ? ` <b>Cortado no teto</b>: há mais linhas do que o máximo pedido.` : ""}</div>`;
  });
}

/* ============================================== Importar: colar uma carga
   O caminho de volta do Exportar. Os cinco formatos de TEXTO voltam; o XLSX e
   o DOCX não — ler ZIP de XML é outro trabalho, e quem tem planilha salva como
   CSV em dois cliques.

   A tela adivinha o formato pelo primeiro caractere, e mostra o que entendeu
   ANTES de gravar. Uma carga que entra errada é pior que uma que não entra:
   dar para conferir a prévia é metade da funcionalidade. */

const FORMATOS_ENTRADA = [
  ["auto", "adivinhar", "pelo primeiro caractere do que foi colado"],
  ["csv",  "CSV",  "separado por ; ou , — com aspas quando o campo tem separador dentro"],
  ["txt",  "TXT",  "separado por tabulação"],
  ["json", "JSON", "lista de objetos, ou o que o Exportar escreve"],
  ["xml",  "XML",  "elementos repetidos com campos simples dentro"],
  ["html", "HTML", "a primeira <table> do documento"],
];

async function telaImportar(db, tab) {
  db = db || (est.atual || {}).db || databaseCorrente();
  tab = tab || (est.atual || {}).tab;
  if (!db || !tab) return avisar("escolha uma tabela primeiro", true);

  folha(`Importar para ${tab}`, `${esc(db)} · cole a carga e confira antes de gravar`,
    `<div class="form-dbl">
       <label class="cmp"><span>Formato</span>
         <select id="impFmt" class="campo">${FORMATOS_ENTRADA.map(([k, r, d]) =>
           `<option value="${k}">${esc(r)} — ${esc(d)}</option>`).join("")}</select></label>
       <label class="cmp"><span>Ao encontrar erro</span>
         <select id="impErro" class="campo">
           <option value="parar">parar na primeira linha ruim</option>
           <option value="seguir">pular a linha ruim e seguir</option>
         </select>
         <span class="leg"><b>Não há transação.</b> O que entrou antes do erro
           fica gravado — não há como desfazer, porque o <code>.reg</code> não
           reaproveita slot e desfazer deixaria buracos.</span></label>
     </div>
     <label class="cmp largo"><span>A carga</span>
       <textarea id="impTexto" rows="12" class="campo mono"
         placeholder="id;nome;cidade&#10;1;Adriano;Blumenau&#10;2;Maria;Itajaí"></textarea>
       <span class="leg">A primeira linha é o <b>cabeçalho</b>, e os nomes são
         casados com as colunas da tabela <b>por nome</b> — não por posição.
         Coluna que a tabela não tem é erro; coluna que falta fica nula.</span></label>
     <div class="acoes">
       <button class="botao secundario" id="btPrever">Conferir</button>
       <button class="botao incluir" id="btImportar" disabled>Gravar</button>
       <button class="botao secundario" id="btVoltaImp">← Gerir tabelas</button>
     </div>
     <div id="impSaida"></div>`);

  $("#btVoltaImp").onclick = () => gerirTabelasAtual();

  const previa = () => {
    const texto = $("#impTexto").value;
    if (!texto.trim()) { avisar("cole a carga primeiro", true); return null; }
    return texto;
  };

  $("#btPrever").onclick = async () => {
    const texto = previa();
    if (texto === null) return;
    // A prévia é lida NO NAVEGADOR pelo mesmo caminho do servidor? Não —
    // seria uma segunda implementação, e as duas divergiriam. Manda para o
    // servidor com `conferir`, que lê e devolve sem gravar nada.
    $("#impSaida").innerHTML = `<div class="centro">lendo…</div>`;
    try {
      const r = await api("importar_conferir", {
        database: db, tabela: tab, texto,
        formato: $("#impFmt").value,
      });
      const cols = r.colunas || [];
      $("#impSaida").innerHTML =
        `<div class="aviso">Entendi como <b>${esc(r.formato)}</b>:
           ${fmt(r.linhas_lidas)} linha(s), ${cols.length} coluna(s).
           ${r.desconhecidas && r.desconhecidas.length
             ? `<b class="marca-excluida">Colunas que a tabela não tem:
                 ${r.desconhecidas.map(esc).join(", ")}</b>`
             : ""}
           ${r.faltando && r.faltando.length
             ? `<span class="leg">Ficam nulas: ${r.faltando.map(esc).join(", ")}</span>`
             : ""}</div>
         ${r.amostra && r.amostra.length
           ? tabela(cols.map(c => ({ t: c })), r.amostra,
               l => `<tr>${l.map(v => celulaValor(v)).join("")}</tr>`)
           : `<div class="vazio">nenhuma linha</div>`}
         <p class="leg">Amostra das primeiras ${r.amostra ? r.amostra.length : 0} linhas,
           como o leitor entendeu — <b>antes</b> de converter para o tipo de cada coluna.</p>`;
      $("#btImportar").disabled = !!(r.desconhecidas && r.desconhecidas.length) || !r.linhas_lidas;
    } catch (e) {
      $("#impSaida").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`;
      $("#btImportar").disabled = true;
    }
  };

  $("#btImportar").onclick = async () => {
    const texto = previa();
    if (texto === null) return;
    $("#impSaida").innerHTML = `<div class="centro">gravando…</div>`;
    try {
      const r = await api("inserir_lote", {
        database: db, tabela: tab, texto,
        formato: $("#impFmt").value,
        parar_no_erro: $("#impErro").value === "parar",
      });
      $("#impSaida").innerHTML =
        `<div class="aviso ${r.recusadas ? "mal" : ""}">
           <b>${fmt(r.gravadas)}</b> de ${fmt(r.recebidas)} linha(s) gravadas em
           ${r.ms} ms${r.por_segundo ? ` — ${fmt(r.por_segundo)} linhas/s` : ""}.
           ${r.gravadas ? `rowid ${r.primeiro_rowid} a ${r.ultimo_rowid}.` : ""}
           ${r.aviso ? `<br><b>${esc(r.aviso)}</b>` : ""}</div>
         ${(r.erros || []).length
           ? tabela([{t:"linha da carga",cls:"num"},{t:"por quê"}], r.erros,
               e => `<tr><td class="num">${e.linha}</td><td>${esc(e.erro)}</td></tr>`)
           : ""}`;
      if (r.gravadas) avisar(`${fmt(r.gravadas)} linha(s) gravadas em ${tab}`);
      $("#btImportar").disabled = true;
    } catch (e) {
      $("#impSaida").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`;
    }
  };
}

/* ================================================= Exclusão: as duas formas
   O botão de excluir passou a perguntar DUAS coisas, e por isso deixou de ser
   um `confirm()`: qual das duas exclusões, e por quê.

   O padrão é a reversível, e isso é uma decisão e não uma preferência: a que
   não tem volta não pode ser escolhida por distração. Quem quer apagar de vez
   troca o modo e lê, em vermelho, o que vai acontecer.

   O campo do motivo aparece sempre. Fica obrigatório quando a tabela foi
   criada com «exigir motivo» — e aí o servidor recusa mesmo que a tela deixe
   passar, porque validação de tela é conveniência e não regra. */

/** Pergunta o modo e o motivo, e executa. `aoTerminar` roda se deu certo. */
async function dialogoExcluir(db, tab, rowid, aoTerminar, versao) {
  // Quem sabe se a tabela exige motivo é o servidor. Perguntar antes evita
  // o vaivém de mandar sem motivo e receber a recusa.
  let exige = false;
  try {
    exige = !!(await api("motivos", { database: db, tabela: tab, limite: 1 })).motivo_obrigatorio;
  } catch (_) {
    // Sem poder de administrar não dá para saber, e isso não pode impedir a
    // exclusão: quem tem `excluir` continua excluindo. O servidor decide.
  }

  const fundo = document.createElement("div");
  fundo.className = "sobre";
  fundo.innerHTML = `
    <div class="caixa" role="dialog" aria-modal="true" aria-label="Excluir registro">
      <h3>Excluir o registro ${rowid}</h3>
      <div class="sub">${esc(db)} · ${esc(tab)}</div>
      <div class="modos" id="modosExc">
        <button class="modo escolhido" data-modo="suave">
          <span class="m-ico">🚫</span>
          <span><span class="m-rot">Marcar como excluído</span>
            <span class="m-diz">A linha some das listas e continua no
              <code>.reg</code>, inteira. Dá para restaurar.</span></span>
        </button>
        <button class="modo risco" data-modo="fisico">
          <span class="m-ico">🗑</span>
          <span><span class="m-rot">Excluir de vez</span>
            <span class="m-diz">Sai do <code>.reg</code>. A linha inteira vai
              antes para o <code>.trash</code>, de onde só o administrador
              lê — e o slot não é reaproveitado.</span></span>
        </button>
      </div>
      <label class="cmp"><span>Motivo${exige ? " <b>(obrigatório)</b>" : ""}</span>
        <input id="excMotivo" class="campo" maxlength="2000"
               placeholder="${exige ? "esta tabela exige o motivo escrito"
                                    : "opcional, mas fica registrado no .reason"}">
        <span class="leg">Vai para o <code>.reason</code> com a data, a hora e
          quem você é. Sobrevive à linha.</span></label>
      <div id="excRecado"></div>
      <div class="acoes">
        <button class="botao secundario" id="btExcNao">Cancelar</button>
        <button class="botao marcar" id="btExcSim">Marcar como excluído</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);

  const fechar = () => fundo.remove();
  let modo = "suave";

  const pintar = () => {
    [...fundo.querySelectorAll(".modo")].forEach(b =>
      b.classList.toggle("escolhido", b.dataset.modo === modo));
    const sim = fundo.querySelector("#btExcSim");
    sim.textContent = modo === "suave" ? "Marcar como excluído" : "Excluir de vez";
    // Rosa para a que volta, vermelho para a que não volta. O botão troca de
    // cor junto com o texto: quem clica sem ler o texto ainda vê a cor mudar.
    sim.classList.toggle("marcar", modo === "suave");
    sim.classList.toggle("excluir", modo === "fisico");
  };
  [...fundo.querySelectorAll(".modo")].forEach(b => b.onclick = ev => {
    ev.preventDefault(); modo = b.dataset.modo; pintar();
  });
  pintar();

  fundo.querySelector("#btExcNao").onclick = ev => { ev.preventDefault(); fechar(); };
  fundo.onclick = ev => { if (ev.target === fundo) fechar(); };
  document.addEventListener("keydown", function fuga(ev) {
    if (ev.key === "Escape") { fechar(); document.removeEventListener("keydown", fuga); }
  });
  setTimeout(() => fundo.querySelector("#excMotivo").focus(), 30);

  fundo.querySelector("#btExcSim").onclick = async ev => {
    ev.preventDefault();
    const motivo = fundo.querySelector("#excMotivo").value.trim();
    if (exige && !motivo) {
      fundo.querySelector("#excRecado").innerHTML =
        `<div class="aviso mal">esta tabela exige o motivo escrito</div>`;
      return;
    }
    // A que não tem volta pede uma confirmação a mais. A reversível não pede:
    // encher de confirmação o caminho seguro ensina a clicar em «sim» sem ler,
    // e aí a confirmação que importa também passa batida.
    if (modo === "fisico" &&
        !confirm(`Excluir de vez o registro ${rowid}?\n\n`
          + `A linha sai do .reg. Ela fica no .trash, que só o administrador `
          + `lê, e o slot NÃO é reaproveitado — é assim que a ordem de `
          + `digitação se mantém.`)) return;
    try {
      const r = await api("excluir",
        { database: db, tabela: tab, rowid, motivo, fisico: modo === "fisico",
          ...(versao ? { versao } : {}) });
      fechar();
      avisar(r.modo === "suave"
        ? `registro ${rowid} marcado como excluído — dá para restaurar`
        : `registro ${rowid} excluído; a linha está no .trash`);
      if (aoTerminar) aoTerminar();
    } catch (err) {
      fundo.querySelector("#excRecado").innerHTML =
        `<div class="aviso mal">${esc(String(err))}</div>`;
    }
  };
}

/* ============================================== A janela de conflito de escrita
   O caso: você abre a ficha do registro 42 às 9h02, sai para o café, volta às
   9h11 e clica em «Salvar». Entre uma coisa e outra, outra pessoa gravou a
   mesma linha. Sem esta janela, o seu «Salvar» apagava o trabalho dela — sem
   erro, sem registro, sem ninguém perceber até faltar o dado.

   A peça que faz isso funcionar já estava no formato desde o começo: cada slot
   do `.reg` guarda uma VERSÃO, que sobe a cada regravação. A ficha lê a linha e
   guarda a versão; o «Salvar» manda a versão de volta; o servidor recusa se ela
   não for mais a atual. Custa 24 bytes de leitura e não trava nada — travar a
   linha na leitura prenderia o registro toda vez que alguém fechasse o
   navegador com a ficha aberta.

   O que se mostra aqui são os TRÊS valores, que é o que o HFSQL(R) mostra:
   o que você leu, o que o outro escreveu, e o que você ia escrever. Quem
   decide é gente. */

/** Mostra os três valores e grava a escolha.
 *
 * `ctx`: `{ editaveis, lida, versaoLida, meus, aoTerminar }` — as colunas do
 * formulário, a linha como você a leu, a versão que ela tinha, o que você ia
 * gravar, e o que fazer depois. Vai num objeto e não em sete parâmetros
 * soltos porque a caixa se chama de novo quando um terceiro grava no meio, e
 * uma lista posicional dessa altura erra calada na recursão. */
async function dialogoConflito(db, tab, rowid, ctx) {
  const { editaveis, lida, versaoLida, meus, aoTerminar } = ctx;
  // O que o outro escreveu só se sabe relendo. É uma leitura a mais, e ela só
  // acontece no conflito — que é raro. Pagar isso em toda gravação para ter o
  // valor à mão seria trocar o caso raro pelo caso comum.
  let atual;
  try {
    atual = await api("ler", { database: db, tabela: tab, rowid, com_versao: true });
  } catch (e) { return avisar(String(e), true); }

  const fundo = document.createElement("div");
  fundo.className = "sobre";
  const fechar = () => fundo.remove();

  // Excluída de vez não tem o que reconciliar: não há linha para gravar por
  // cima. O que dá para dizer é onde ela foi parar.
  if (!atual) {
    fundo.innerHTML = `
      <div class="caixa" role="dialog" aria-modal="true" aria-label="Conflito de escrita">
        <h3>O registro ${rowid} foi excluído</h3>
        <div class="sub">${esc(db)} · ${esc(tab)}</div>
        <div class="aviso mal">Outra sessão excluiu esta linha <b>de vez</b>
          depois que você a abriu. A sua alteração não tem mais onde ser
          gravada.</div>
        <p class="leg">A linha inteira está no <code>.trash</code>, e o motivo
          no <code>.reason</code> — quem administra consegue ver as duas
          coisas, e o slot não foi reaproveitado.</p>
        <div class="acoes">
          <button class="botao secundario" id="btCfFecha">Voltar à lista</button>
        </div>
      </div>`;
    document.body.appendChild(fundo);
    fundo.querySelector("#btCfFecha").onclick = ev => {
      ev.preventDefault(); fechar(); if (aoTerminar) aoTerminar();
    };
    return;
  }

  const outra = atual.linha;
  const mostrar = v => v === null || v === undefined
    ? `<span class="vazio-nulo">nulo</span>` : esc(String(v));
  // Dois valores que se ESCREVEM igual são o mesmo valor para quem está
  // decidindo. Comparar pelo texto mostrado, e não pelo tipo, evita marcar
  // como divergência o 10 que voltou número e o 10 que saiu do formulário
  // como texto — divergência que só existiria na cabeça do JavaScript.
  const igual = (a, b) => mostrar(a) === mostrar(b);

  const linhas = editaveis.map((c, i) => ({
    nome: c.nome,
    antes: lida[c.nome] === undefined ? null : lida[c.nome],
    outro: outra[c.nome] === undefined ? null : outra[c.nome],
    meu: meus[i]
  }));
  const briga = linhas.filter(l => !igual(l.outro, l.meu));
  const iguais = linhas.length - briga.length;

  fundo.innerHTML = `
    <div class="caixa larga" role="dialog" aria-modal="true"
         aria-label="Conflito de escrita">
      <h3>Conflito de escrita no registro ${rowid}</h3>
      <div class="sub">${esc(db)} · ${esc(tab)} — você leu a versão
        ${versaoLida} e a atual é a ${atual.versao}</div>
      <div class="aviso">Outra sessão gravou esta linha depois que você a abriu.
        Nada foi sobrescrito: escolha coluna por coluna o que fica.</div>
      ${outra["softdeleted"] === true ? `<div class="aviso mal">
        <b class="marca-excluida">O outro marcou esta linha como excluída.</b>
        Gravar aqui mantém a marca — a linha continua fora das listas.</div>` : ""}
      ${briga.length ? `
      <div class="rolo"><table class="conf">
        <colgroup><col class="c-nome"><col class="c-val"><col class="c-val"><col></colgroup>
        <thead><tr>
        <th>Coluna</th><th>Valor anterior</th>
        <th>O outro escreveu</th><th>Você escreve</th></tr></thead><tbody>
        ${briga.map(l => {
          // O padrão de cada coluna não é «o meu» nem «o outro»: é quem MEXEU
          // nela. Coluna que eu não toquei fica com a alteração do outro;
          // coluna que eu digitei fica com a minha. Duas pessoas que editaram
          // campos diferentes da mesma linha saem daqui com os dois trabalhos
          // preservados, sem ter de escolher nada.
          const mexi = !igual(l.meu, l.antes);
          return `<tr class="diverge">
            <td class="col">${esc(l.nome)}</td>
            <td>${mostrar(l.antes)}</td>
            <td><label class="esc">
              <input type="radio" name="cf_${esc(l.nome)}" value="outro"
                     ${mexi ? "" : "checked"}><span>${mostrar(l.outro)}</span>
            </label></td>
            <td><label class="esc">
              <input type="radio" name="cf_${esc(l.nome)}" value="meu"
                     ${mexi ? "checked" : ""}><span>${mostrar(l.meu)}</span>
            </label></td></tr>`;
        }).join("")}
      </tbody></table></div>
      <p class="leg">Já vem marcado quem <b>mexeu</b> em cada coluna: a que
        você digitou fica com o seu valor, a que só o outro mudou fica com o
        dele.${iguais ? ` As outras ${iguais} coluna(s) estão iguais dos dois
        lados.` : ""}</p>`
      : `<div class="aviso">As suas alterações e as do outro <b>não se
           cruzam</b> em nenhuma coluna: gravar não desfaz nada.</div>`}
      <div id="cfRecado"></div>
      <div class="acoes">
        <button class="botao secundario" id="btCfNao">Descartar o meu</button>
        <button class="botao alterar" id="btCfSim">Gravar o escolhido</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);

  fundo.onclick = ev => { if (ev.target === fundo) fechar(); };
  fundo.querySelector("#btCfNao").onclick = ev => {
    ev.preventDefault(); fechar(); if (aoTerminar) aoTerminar();
  };

  fundo.querySelector("#btCfSim").onclick = async ev => {
    ev.preventDefault();
    const escolhido = editaveis.map((c, i) => {
      const r = fundo.querySelector(`input[name="cf_${c.nome}"]:checked`);
      if (!r) return meus[i];                     // coluna sem briga
      return r.value === "meu" ? meus[i]
                               : (outra[c.nome] === undefined ? null : outra[c.nome]);
    });
    try {
      await api("atualizar", { database: db, tabela: tab, rowid,
                               valores: escolhido, versao: atual.versao });
      fechar();
      avisar(`registro ${rowid} gravado com a versão escolhida`);
      if (aoTerminar) aoTerminar();
    } catch (err) {
      // Um TERCEIRO gravou enquanto esta caixa estava aberta. A resposta é a
      // mesma caixa outra vez, agora com a escolha desta rodada no papel de
      // «você escreve» — e não um «tente de novo» que perderia o trabalho.
      if (err.nome === "CONFLITO") {
        fechar();
        return dialogoConflito(db, tab, rowid, { editaveis, lida: outra,
          versaoLida: atual.versao, meus: escolhido, aoTerminar });
      }
      fundo.querySelector("#cfRecado").innerHTML =
        `<div class="aviso mal">${esc(String(err))}</div>`;
    }
  };
}

/** Restaura uma linha marcada. */
async function restaurarLinha(db, tab, rowid, aoTerminar) {
  const motivo = prompt(`Restaurar o registro ${rowid}?\n\n`
    + `Motivo (fica no .reason):`, "");
  if (motivo === null) return;
  try {
    await api("restaurar", { database: db, tabela: tab, rowid, motivo: motivo.trim() });
    avisar(`registro ${rowid} restaurado`);
    if (aoTerminar) aoTerminar();
  } catch (err) { avisar(String(err), true); }
}

/* ------------------------------------------------------------- a lixeira
   Só quem administra chega aqui, e o servidor recusa quem não tem o poder.
   A tela diz isso com todas as letras em vez de mostrar uma lista vazia. */

async function telaLixeira(db, tab) {
  db = db || (est.atual || {}).db || databaseCorrente();
  tab = tab || (est.atual || {}).tab;
  if (!db || !tab) return avisar("escolha uma tabela primeiro", true);

  folha(`Lixeira de ${tab}`, `${esc(db)} · carregando…`,
    `<div class="centro">carregando…</div>`);
  let d;
  try {
    d = await api("lixeira", { database: db, tabela: tab, limite: 300 });
  } catch (e) {
    folha(`Lixeira de ${tab}`, esc(db),
      `<div class="aviso mal">${esc(String(e))}</div>
       <p class="leg">O <code>.trash</code> guarda o dado que alguém mandou
         apagar. Ver o conteúdo dele exige <b>administrar</b> — quem só tem
         <code>ler</code> perdeu o direito àquela linha no instante em que ela
         foi excluída, e a lixeira devolveria o direito por outra porta.</p>
       <div class="acoes">
         <button class="botao secundario" id="btVoltaLix">← Gerir tabelas</button>
       </div>`);
    $("#btVoltaLix").onclick = () => gerirTabelasAtual();
    return;
  }

  const cols = (d.colunas || []).filter(c => !c.sistema);
  const itens = d.descartadas || [];
  const EXTERNO = t => /^(Bin|Memo)$/.test(String(t || ""));
  // Um campo externo vazio na listagem quer dizer «não carreguei», e não
  // «não tinha». Dizer NULL nos dois casos faria quem investiga concluir que
  // a foto nunca existiu — que é exatamente o oposto do que a lixeira serve
  // para provar. O botão «ver» busca aquela linha inteira.
  const celulaDa = (item, c) =>
    (!d.anexos_carregados && EXTERNO(c.tipo) && item.anexos > 0)
      ? `<td class="dado nulo">anexo · não carregado</td>`
      : celulaValor((item.linha || {})[c.nome]);
  $("#subtitulo").textContent =
    `${esc(db)} · ${fmt(d.total)} linha(s), ${fmtBytes(d.bytes)}`;

  $("#painel").innerHTML =
    `<p class="leg">Cada linha aqui saiu do <code>.reg</code>. Ela foi gravada

/** Uma linha da lixeira, inteira, com os anexos. */
async function verLinhaDescartada(db, tab, uuid) {
  let d;
  try {
    d = await api("lixeira", { database: db, tabela: tab, uuid });
  } catch (e) { return avisar(String(e), true); }
  const item = (d.descartadas || [])[0];
  if (!item) return avisar("essa linha não está mais na lixeira", true);

  folha(`Linha descartada`, `${esc(db)} · ${esc(tab)} · rowid ${item.rowid}`,
    `<div class="fichas">
       <div class="ficha"><div class="v">${esc(item.quando)}</div><div class="r">quando</div></div>
       <div class="ficha"><div class="v">${esc(item.usuario_nome || "—")}</div><div class="r">quem excluiu</div></div>
       <div class="ficha"><div class="v">${item.anexos}</div><div class="r">anexos</div></div>
       <div class="ficha"><div class="v">${fmtBytes(item.bytes)}</div><div class="r">no .trash</div></div>
     </div>
     ${item.aviso ? `<div class="aviso mal">${esc(item.aviso)}</div>` : ""}

        c => `<tr><td class="dado"><b>${esc(c.rotulo || c.nome)}</b>

         ? `<b>Esta tabela exige motivo escrito</b> em toda exclusão.`

     ${regs.length === 0

             <td class="dado">${esc(m.quando)}</td>
             <td><b style="color:${CORES[m.tipo] || "var(--texto-2)"}">${esc(m.tipo)}</b></td>

/* ============================================ Sessões e estatísticas de uso
   Duas telas que o console não tinha e que todo motor maduro tem: quem está
   falando agora (o SHOW PROCESSLIST) e o que o log já sabia e ninguém
   perguntava (as estatísticas por tabela, por usuário e a cauda da latência).

   A média some daqui de propósito. Mil respostas de 1 ms e uma de 30 s dão
   média de 30 ms, e o número parece bom enquanto alguém espera meio minuto —
   quem responde «está rápido?» é o p95, não a média. */

async function verSessoes() {
  folha("Sessões", "carregando…", `<div class="centro">carregando…</div>`);
  let d;
  try { d = await api("sessoes"); }
  catch (e) { return folha("Sessões", "", `<div class="aviso mal">${esc(String(e))}</div>`); }

  const dur = ms => ms == null ? "—"
    : ms < 1000 ? `${fmt(ms)} ms`
    : ms < 60000 ? `${(ms/1000).toFixed(1).replace(".", ",")} s`
    : `${Math.floor(ms/60000)} min ${Math.round((ms%60000)/1000)} s`;

  folha("Sessões", "quem está falando com o servidor agora · atualiza a cada 3 s",
    `<div class="fichas">
       ${ficha(d.quantas, "na porta de dados")}
       ${ficha(d.sessoes_web ?? 0, "sessões web")}
       ${ficha(d.executando, "executando")}
       ${ficha(dur(d.mais_longa_ms), "a mais demorada", d.mais_longa_ms > 5000 ? "há mais de 5 s" : "")}
     </div>` +
    tabela([{t:"id",cls:"num"},{t:"origem"},{t:"usuário"},{t:"aberta há",cls:"num"},
            {t:"estado"},{t:"operação"},{t:"objeto"},{t:"há",cls:"num"},
            {t:"pedidos",cls:"num"},{t:""}],
      d.sessoes, x => `<tr>
        <td class="num dado">${x.id}</td>
        <td class="dado">${esc(x.ip)}:${x.porta}</td>
        <td class="dado">${esc(x.usuario || "—")}</td>
        <td class="num">${dur(x.aberta_s * 1000)}</td>
        <td>${x.encerrando ? `<span class="pino mal">encerrando</span>`
             : x.estado === "executando" ? `<span class="pino ndx">executando</span>`
             : `<span class="pino nao">esperando</span>`}</td>
        <td class="dado">${esc(x.op || "—")}</td>
        <td class="dado">${esc(x.objeto || "—")}</td>
        <td class="num${x.ha_ms > 5000 ? " mal" : ""}">${dur(x.ha_ms)}</td>
        <td class="num">${fmt(x.pedidos)}</td>
        <td><button class="botao secundario mini" data-kill="${x.id}">Encerrar</button></td>
      </tr>`) +
    ((d.web || []).length
      ? `<h3>Sessões do navegador</h3>` + tabela(
          [{t:"id"},{t:"usuário"},{t:"aberta há",cls:"num"},{t:"expira em",cls:"num"},{t:""}],
          d.web, x => `<tr>
            <td class="dado">${esc(x.id)}…</td>
            <td class="dado">${esc(x.usuario || "—")}</td>
            <td class="num">${dur(x.aberta_s * 1000)}</td>
            <td class="num">${dur(x.expira_em_s * 1000)}</td>
            <td><button class="botao secundario mini" data-killweb="${esc(x.id)}">Encerrar</button></td>
          </tr>`)
      : "") +
    `<div class="aviso"><b>Encerrar fecha o soquete.</b> É imediato para a conexão
      que está esperando pedido — o caso comum da conexão esquecida aberta. Uma
      operação que <em>já entrou</em> na trava de dados termina assim mesmo: não há
      como abandonar uma varredura no meio sem arriscar deixar a tabela aberta pela
      metade. O que muda é que o resultado não vai para lugar nenhum.</div>
     <div class="acoes">
       <button class="botao secundario" id="btEstat">Estatísticas de uso…</button>
     </div>`);

  $("#btEstat").onclick = () => verEstatisticas();
  $$("#painel [data-killweb]").forEach(b => b.onclick = async () => {
    const id = b.dataset.killweb;
    if (!confirm(`Encerrar a sessão web ${id}…?\n\nO próximo clique de quem estava usando cai no login.`)) return;
    try {
      const r = await api("encerrar_sessao", { id });
      avisar(`sessão ${r.encerrada} encerrada — ${r.aviso}`);
      verSessoes();
    } catch (e) { avisar(String(e), true); }
  });
  $$("#painel [data-kill]").forEach(b => b.onclick = async () => {
    const id = b.dataset.kill;
    if (!confirm(`Encerrar a conexão ${id}?\n\nO cliente do outro lado perde a conexão.`)) return;
    try {
      const r = await api("encerrar_sessao", { id: Number(id) });
      avisar(`conexão ${r.encerrada} (${r.estava}) — ${r.aviso}`);
      verSessoes();
    } catch (e) { avisar(String(e), true); }
  });

  // O relógio das sessões usa o mesmo motor do monitor da máquina: uma tela
  // que mostra «agora» e não se renova sozinha mente depois de meio minuto.
  pararMonitor();
  est.relogioMaquina = setInterval(() => {
    if (!$("#painel [data-kill], #painel .fichas")) return pararMonitor();
    if ($("#titulo").textContent === "Sessões") verSessoes(); else pararMonitor();
  }, 3000);
}

/// Histograma de latência: faixas que dobram, desenhadas à mão.
///
/// As faixas dobram porque a diferença entre 1 ms e 2 ms importa tanto quanto
/// entre 1 s e 2 s. Faixa de largura fixa esmagaria a metade rápida num balde só.
function histograma(faixas) {
  const vivas = faixas.filter(f => f.quantas > 0);
  if (!vivas.length) return `<div class="vazioc">sem acessos no período</div>`;
  const L = 700, alt = 22, teto = Math.max(...vivas.map(f => f.quantas));
  const h = vivas.length * alt + 8;
  return `<svg viewBox="0 0 ${L} ${h}" role="img" aria-label="Distribuição do tempo de resposta">` +
    vivas.map((f, k) => {
      const y = k * alt + 4;
      const w = Math.max(2, (f.quantas / teto) * (L - 250));
      const rot = f.ate_ms == null ? `${fmt(f.de_ms)} ms ou mais`
        : `${fmt(f.de_ms)} – ${fmt(f.ate_ms)} ms`;
      // Acima de um segundo o olho precisa de aviso; a cor é o aviso.
      const cor = f.de_ms >= 1000 ? "var(--log)" : f.de_ms >= 100 ? "var(--ambar)" : "var(--laranja)";
      return `<g>
        <text x="140" y="${y + 15}" text-anchor="end" font-size="11"
              font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".75">${rot}</text>
        <rect x="150" y="${y + 4}" width="${w.toFixed(1)}" height="13" rx="3" fill="${cor}" opacity=".9"/>
        <text x="${(158 + w).toFixed(1)}" y="${y + 15}" font-size="10.5"
              font-family="IBM Plex Mono, monospace" fill="currentColor" opacity=".7">${fmt(f.quantas)}</text>
      </g>`;
    }).join("") + `</svg>`;
}

/* ================================================= Junções e união
   As sete figuras do diagrama clássico, escolhidas clicando no desenho em vez
   de num menu de texto: quem sabe que quer «tudo de A e o que casar de B» nem
   sempre lembra que isso se chama LEFT JOIN, mas reconhece o desenho na hora.

   Cada cartão mostra o SQL equivalente embaixo — a tela ensina o nome enquanto
   é usada, em vez de exigir que ele já se saiba. */

const JUNCOES = [
  { id:"interna",      rot:"Interna",        sql:"INNER JOIN",
    exp:"só o que casa dos dois lados" },
  { id:"esquerda",     rot:"Esquerda",       sql:"LEFT JOIN",
    exp:"tudo de A, e B quando houver" },
  { id:"direita",      rot:"Direita",        sql:"RIGHT JOIN",
    exp:"tudo de B, e A quando houver" },
  { id:"completa",     rot:"Completa",       sql:"FULL OUTER JOIN",
    exp:"tudo dos dois lados" },
  { id:"so_esquerda",  rot:"Só A",           sql:"LEFT JOIN … WHERE B.chave IS NULL",
    exp:"o que existe em A e não em B" },
  { id:"so_direita",   rot:"Só B",           sql:"RIGHT JOIN … WHERE A.chave IS NULL",
    exp:"o que existe em B e não em A" },
  { id:"so_dos_lados", rot:"Só as pontas",   sql:"FULL OUTER … WHERE A.chave IS NULL OR B.chave IS NULL",
    exp:"o que sobra dos dois lados, sem o meio" },
];

/// O diagrama de Venn de uma junção, desenhado à mão.
///
/// Os `id` de máscara levam o nome do tipo porque sete desenhos convivem na
/// mesma página: `id` repetido faria o navegador usar a primeira máscara em
/// todos, e as sete figuras sairiam iguais.
function venn(tipo) {
  const A = { cx:36, cy:29, r:24 }, B = { cx:60, cy:29, r:24 };
  const c = (o, extra = "") => `<circle cx="${o.cx}" cy="${o.cy}" r="${o.r}" ${extra}/>`;
  const F = `fill="var(--laranja)"`;
  // Os dois círculos como UM caminho de dois subcaminhos, com
  // `clip-rule="evenodd"`: sobra o que está dentro de exatamente um deles — os
  // dois crescentes, sem o meio. Uma máscara faria o mesmo e exigiria branco e
  // preto literais, que não seguem o tema; o recorte não precisa de cor
  // nenhuma.
  const soUm = `M12,29 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0 Z`
             + ` M36,29 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0 Z`;
  const defs = `<defs>
    <clipPath id="cA-${tipo}">${c(A)}</clipPath>
    <clipPath id="cUm-${tipo}"><path clip-rule="evenodd" d="${soUm}"/></clipPath>
  </defs>`;
  const pintado = {
    interna:      `<g clip-path="url(#cA-${tipo})">${c(B, F)}</g>`,
    esquerda:     c(A, F),
    direita:      c(B, F),
    completa:     c(A, F) + c(B, F),
    so_esquerda:  `<g clip-path="url(#cUm-${tipo})">${c(A, F)}</g>`,
    so_direita:   `<g clip-path="url(#cUm-${tipo})">${c(B, F)}</g>`,
    so_dos_lados: `<g clip-path="url(#cUm-${tipo})">${c(A, F)}${c(B, F)}</g>`,
  }[tipo] || "";
  return `<svg viewBox="0 0 96 58" role="img" aria-label="Diagrama de ${tipo}">
    ${defs}${pintado}
    ${c(A, 'fill="none" stroke="currentColor" stroke-width="1.3"')}
    ${c(B, 'fill="none" stroke="currentColor" stroke-width="1.3"')}
    <text x="24" y="34" text-anchor="middle" font-size="13" font-weight="700"
          fill="currentColor">A</text>
    <text x="72" y="34" text-anchor="middle" font-size="13" font-weight="700"
          fill="currentColor">B</text>
  </svg>`;
}

const JN = { db:"", a:"", b:"", chaveA:"", chaveB:"", tipo:"interna", grade:null };

async function telaJuncao(db) {
  JN.db = db || JN.db || databaseCorrente();
  if (!JN.db) return avisar("escolha um banco primeiro", true);
  folha("Junção de tabelas", "carregando…", `<div class="centro">carregando…</div>`);

  const t = await api("tabelas", { database: JN.db });
  const tabs = t.tabelas || [];
  if (tabs.length < 2) {
    return folha("Junção de tabelas", esc(JN.db),
      `<div class="aviso mal">O banco <b>${esc(JN.db)}</b> tem
        ${tabs.length} tabela(s). Uma junção precisa de duas.</div>`);
  }
  JN.a = tabs.includes(JN.a) ? JN.a : tabs[0];
  JN.b = tabs.includes(JN.b) && JN.b !== JN.a ? JN.b : (tabs.find(x => x !== JN.a) || tabs[1]);

  const opc = (lista, sel) => lista.map(x =>
    `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");

  folha("Junção de tabelas", `${esc(JN.db)} · escolha o formato clicando no desenho`,
    `<div class="form-dbl">
       <label class="cmp"><span>Tabela A</span>
         <select id="jA" class="campo">${opc(tabs, JN.a)}</select></label>
       <label class="cmp"><span>Chave de A</span>
         <select id="jKA" class="campo"></select>
         <span class="leg">vazio = a chave primária</span></label>
       <label class="cmp"><span>Tabela B</span>
         <select id="jB" class="campo">${opc(tabs, JN.b)}</select></label>
       <label class="cmp"><span>Chave de B</span>
         <select id="jKB" class="campo"></select>
         <span class="leg">vazio = a chave primária</span></label>
     </div>
     <div class="vennes" id="vennes">
       ${JUNCOES.map(j => `<button class="venn ${j.id === JN.tipo ? "viva" : ""}" data-t="${j.id}">
            ${venn(j.id)}
            <span class="v-rot">${j.rot}</span>
            <span class="v-sql">${esc(j.sql)}</span>
            <span class="v-exp">${j.exp}</span>
          </button>`).join("")}
     </div>
     <div class="acoes">
       <button class="botao" id="jRodar">Juntar</button>
       <button class="botao secundario" id="jUniao">União (UNION)…</button>
     </div>
     <div id="jSaida"></div>`);

  const encher = async (qual, alvo) => {
    const e = await api("esquema", { database: JN.db, tabela: qual });
    const pk = (e.indices || []).find(i => i.primario);
    const nomes = (e.colunas || []).map(c => c.nome);
    const atual = alvo === "jKA" ? JN.chaveA : JN.chaveB;
    $("#" + alvo).innerHTML =
      `<option value="">— chave primária${pk ? ` (${esc(pk.colunas.map(c=>c.coluna).join(" + "))})` : ": não tem"} —</option>`
      + opc(nomes, atual);
  };
  await Promise.all([encher(JN.a, "jKA"), encher(JN.b, "jKB")]);

  $("#jA").onchange = e => { JN.a = e.target.value; JN.chaveA = ""; telaJuncao(); };
  $("#jB").onchange = e => { JN.b = e.target.value; JN.chaveB = ""; telaJuncao(); };
  $("#jKA").onchange = e => JN.chaveA = e.target.value;
  $("#jKB").onchange = e => JN.chaveB = e.target.value;
  $("#jUniao").onclick = () => telaUniao(JN.db);
  $$("#vennes .venn").forEach(b => b.onclick = () => {
    JN.tipo = b.dataset.t;
    $$("#vennes .venn").forEach(x => x.classList.toggle("viva", x === b));
    rodarJuncao();
  });
  $("#jRodar").onclick = rodarJuncao;
}

async function rodarJuncao() {
  const alvo = $("#jSaida");
  if (!alvo) return;
  alvo.innerHTML = `<div class="centro">juntando…</div>`;
  const pedido = {
    op: "juntar", database: JN.db, tipo: JN.tipo,
    a: { tabela: JN.a, prefixo: "a" },
    b: { tabela: JN.b, prefixo: "b" },
  };
  if (JN.chaveA) pedido.a.chave = JN.chaveA;
  if (JN.chaveB) pedido.b.chave = JN.chaveB;
  let r;
  try { r = await api("juntar", pedido); }
  catch (e) { return alvo.innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }

  // As linhas sem par contam: um INNER que trouxe menos do que se esperava
  // costuma ter aqui a explicação, e escondê-la faz o número virar mistério.
  const nulas = r.chave_nula_a + r.chave_nula_b
    ? `<div class="aviso"><b>Chave nula não casa com chave nula.</b>
         ${fmt(r.chave_nula_a)} linha(s) de A e ${fmt(r.chave_nula_b)} de B têm a chave
         vazia. Em SQL isso não é «igual a outro vazio»: é desconhecido, e a
         linha se comporta como linha sem par.</div>`
    : "";

  alvo.innerHTML = `
    <div class="dbl-titulo">
      <b>${fmt(r.quantas)} linha(s)</b>
      <span class="leg"><code>${esc(r.sql)}</code> · A leu ${fmt(r.lidas_a)},
        B leu ${fmt(r.lidas_b)} · ${r.ms} ms${r.truncado ? " · cortado no teto" : ""}</span>
    </div>${nulas}
    <div id="jGrade"></div>`;

  desenharGradeDeLinhas("#jGrade", r, g => JN.grade = g);
}

/// A grade de um resultado posicional (junção ou união).
///
/// Junção e união devolvem `colunas` e `linhas` como vetores, e não objetos:
/// os dois lados podem trazer uma coluna `id`, e um objeto perderia a segunda.
/// Aqui elas viram objeto com o nome já desambiguado pelo servidor.
function desenharGradeDeLinhas(seletor, r, guardar) {
  const dados = r.linhas.map(l => {
    const o = {};
    r.colunas.forEach((c, i) => o[c.nome] = l[i]);
    return o;
  });
  const g = PhxGrid.criar(seletor, {
    agrupavel: true,
    buscaGlobal: true,
    colunas: r.colunas.map(c => ({
      campo: c.nome,
      titulo: c.nome + (c.chave ? " ★" : ""),
      tipo: tipoDoGrid(c.tipo.replace(/\(.*/, "")),
      agregador: !c.chave && /^Int|^UInt|^Decimal|^Real/.test(c.tipo) ? "sum" : null,
    })),
    dados,
    pagina: { tamanho: 100, opcoes: [50, 100, 200] },
  });
  if (guardar) guardar(g);
  return g;
}

const UN = { db:"", escolhidas:[], modo:"distinta" };

async function telaUniao(db) {
  UN.db = db || UN.db || databaseCorrente();
  if (!UN.db) return avisar("escolha um banco primeiro", true);
  folha("União de tabelas", "carregando…", `<div class="centro">carregando…</div>`);
  const t = await api("tabelas", { database: UN.db });
  const tabs = t.tabelas || [];
  UN.escolhidas = UN.escolhidas.filter(x => tabs.includes(x));

  folha("União de tabelas",
    `${esc(UN.db)} · empilha duas ou mais tabelas, posição a posição`,
    `<div class="un-lista">
       ${tabs.map(x => `<label class="un-item">
            <input type="checkbox" value="${esc(x)}" ${UN.escolhidas.includes(x) ? "checked" : ""}>
            <span>${esc(x)}</span></label>`).join("")}
     </div>
     <div class="form-dbl">
       <label class="cmp"><span>Modo</span>
         <select id="unModo" class="campo">
           <option value="distinta" ${UN.modo === "distinta" ? "selected" : ""}>UNION — tira as repetidas</option>
           <option value="tudo" ${UN.modo === "tudo" ? "selected" : ""}>UNION ALL — mantém tudo</option>
         </select></label>
     </div>
     <div class="aviso"><b>Empilhar é por posição, e não por nome.</b> A primeira
       coluna de uma parte cai na primeira da outra, e é o <em>tipo</em> que precisa
       bater — o nome sai da primeira parte, como no SQL. Casar por nome pareceria
       mais amigável e seria uma armadilha: duas tabelas com as mesmas colunas em
       ordem diferente empilhariam trocando os valores, caladas.</div>
     <div class="acoes">
       <button class="botao" id="unRodar">Unir</button>
       <button class="botao secundario" id="unJuncao">← Junção</button>
     </div>
     <div id="unSaida"></div>`);

  $("#unModo").onchange = e => UN.modo = e.target.value;
  $("#unJuncao").onclick = () => telaJuncao(UN.db);
  $$(".un-item input").forEach(c => c.onchange = () => {
    UN.escolhidas = $$(".un-item input").filter(x => x.checked).map(x => x.value);
  });
  $("#unRodar").onclick = async () => {
    if (UN.escolhidas.length < 2) return avisar("marque ao menos duas tabelas", true);
    $("#unSaida").innerHTML = `<div class="centro">unindo…</div>`;
    let r;
    try { r = await api("unir", { database: UN.db, modo: UN.modo, tabelas: UN.escolhidas }); }
    catch (e) { return $("#unSaida").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }
    $("#unSaida").innerHTML = `
      <div class="dbl-titulo">
        <b>${fmt(r.quantas)} linha(s)</b>
        <span class="leg"><code>${esc(r.sql)}</code> · ${
          r.por_parte.map((n, i) => `${esc(UN.escolhidas[i])}: ${fmt(n)}`).join(" + ")
        }${r.repetidas ? ` · ${fmt(r.repetidas)} repetida(s) descartada(s)` : ""} · ${r.ms} ms${
          r.truncado ? " · cortado no teto" : ""}</span>
      </div>
      <div id="unGrade"></div>`;
    desenharGradeDeLinhas("#unGrade", r);
  };
}

/* ========================================================== DbLink
   Ligações para bancos de fora. Duas telas, porque são duas coisas:

   - `telaDbLinkDefinicoes` é o CADASTRO — endereço, credencial, se a ligação
     pode escrever. Fica no menu Configurações, junto com o resto do que se
     configura uma vez.
   - `telaDbLink` é o NAVEGADOR — escolher a ligação, ver as tabelas do outro
     banco e abrir o conteúdo na mesma grade que serve as tabelas daqui. É o
     botão da barra, porque é o que se usa todo dia.

   A grade é a MESMA (`PhxGrid`): agrupar por coluna, buscar e paginar valem
   igual num `.reg` daqui e numa tabela do MySQL(R) de lá. Escrever uma
   segunda grade só para o dado de fora seria manter dois comportamentos e
   corrigir todo defeito duas vezes. */

const DBL = { ligacao:"", database:"", tabela:"", grade:null };

/// O tipo do MySQL(R) traduzido para o que a grade entende.
function tipoDoGridExterno(c) {
  if (/DATE|TIME|YEAR/.test(c.tipo)) return "texto";   // vem como texto ISO
  return c.numerico ? "numero" : "texto";
}

/// Quantas casas a coluna mostra.
///
/// «moeda» não serve para o dado de fora: ela prefixa R$, e um DECIMAL do
/// outro banco tanto pode ser dinheiro quanto quantidade ou taxa. O tipo é
/// «numero» com o número de casas que o próprio servidor declarou — sem isso
/// um DECIMAL(12,2) de 15000,50 aparecia como 15.001, que é outro número.
///
/// FLOAT e DOUBLE chegam com 31, o «não fixo» do protocolo — não há casa
/// declarada. Aí a casa sai do próprio dado que veio: a maior que apareceu na
/// coluna, até dez. Fixar zero arredondaria 0,5 para 1, e fixar um número
/// alto encheria a tela de zeros que ninguém escreveu.
function casasDoExterno(c, linhas, i) {
  if (!c.numerico) return undefined;
  if (c.decimais < 31) return c.decimais;
  let maior = 0;
  for (const l of linhas || []) {
    const v = l[i];
    if (typeof v !== "string") continue;
    const ponto = v.indexOf(".");
    if (ponto >= 0) maior = Math.max(maior, Math.min(10, v.length - ponto - 1));
  }
  return maior;
}

/// As linhas vêm como vetor posicional; a grade quer objeto por nome.
///
/// Nome repetido acontece (`SELECT a.id, b.id`), e sem desempate a segunda
/// coluna apagaria a primeira. O sufixo mantém as duas.
function linhasParaObjetos(r) {
  const nomes = [];
  r.colunas.forEach(c => {
    let n = c.nome, k = 2;
    while (nomes.includes(n)) n = `${c.nome}_${k++}`;
    nomes.push(n);
  });
  return {
    nomes,
    dados: (r.linhas || []).map(l => {
      const o = {};
      nomes.forEach((n, i) => o[n] = l[i] === null ? null : l[i]);
      return o;
    }),
  };
}

async function telaDbLink(nome) {
  folha("DbLink", "carregando…", `<div class="centro">carregando…</div>`);
  let d;
  try { d = await api("dblink"); }
  catch (e) { return folha("DbLink", "não deu", `<div class="aviso mal">${esc(String(e))}</div>`); }

  const ligacoes = d.ligacoes || [];
  DBL.ligacao = nome || DBL.ligacao ||
    (ligacoes.find(l => l.conecta) || ligacoes[0] || {}).nome || "";
  const atual = ligacoes.find(l => l.nome === DBL.ligacao);

  if (!ligacoes.length) {
    return folha("DbLink", "nenhuma ligação cadastrada ainda",
      `<div class="aviso">
         <p><strong>Um DbLink guarda um apelido, um endereço e uma
         credencial.</strong> Depois disso o banco de fora aparece nesta tela
         como se fosse mais um — as tabelas na lista, o conteúdo na mesma
         grade das tabelas daqui.</p>
         <p>Hoje o cliente escrito é o do <b>MySQL(R)</b>. A definição de
         PostgreSQL(R) já pode ser guardada; o cliente ainda não existe.</p>
       </div>
       <div class="acoes"><button class="botao" id="btDef">Cadastrar uma ligação…</button></div>`);
    $("#btDef").onclick = () => telaDbLinkDefinicoes();
    return;
  }

  const opcoes = ligacoes.map(l =>
    `<option value="${esc(l.nome)}" ${l.nome === DBL.ligacao ? "selected" : ""}
      ${l.conecta ? "" : "disabled"}>${esc(l.nome)} — ${esc(l.motor)}${
        l.conecta ? "" : " (sem cliente)"}</option>`).join("");

  folha("DbLink",
    atual ? `${esc(atual.usuario)}@${esc(atual.host)}:${atual.porta}${
      atual.somente_leitura ? " · somente leitura" : " · PODE ESCREVER"}` : "",
    `<div class="barra-dbl">
       <label>Ligação <select id="selLig">${opcoes}</select></label>
       <label>Base <select id="selBase"><option>carregando…</option></select></label>
       <button class="botao secundario" id="btTestar">Testar</button>
       <button class="botao secundario" id="btSql">Consulta SQL…</button>
       <button class="botao secundario" id="btDef">Definições…</button>
     </div>
     <div id="avisoDbl"></div>
     <div class="dbl-corpo">
       <div class="dbl-lista" id="listaTab"><div class="centro">carregando…</div></div>
       <div class="dbl-dado" id="dadoTab">
         <div class="vazioc">escolha uma tabela à esquerda</div>
       </div>
     </div>`);

  $("#selLig").onchange = e => { DBL.ligacao = e.target.value; DBL.database = ""; DBL.tabela = ""; telaDbLink(DBL.ligacao); };
  $("#btDef").onclick = () => telaDbLinkDefinicoes();
  $("#btSql").onclick = () => telaDbLinkSql(DBL.ligacao);
  $("#btTestar").onclick = () => testarDbLink(DBL.ligacao);
  $("#selBase").onchange = e => { DBL.database = e.target.value; DBL.tabela = ""; carregarTabelasDbl(); };

  // As bases primeiro: sem elas a lista de tabelas não sabe onde olhar.
  try {
    const b = await api("dblink_bancos", { dblink: DBL.ligacao });
    // As bases de serviço do outro servidor ficam por último: quem abre o
    // DbLink quer a base da aplicação, não o information_schema.
    const servico = ["information_schema", "performance_schema", "mysql", "sys"];
    const bases = (b.bancos || []).slice().sort((x, y) =>
      (servico.includes(x) - servico.includes(y)) || x.localeCompare(y));
    DBL.database = DBL.database || (atual && atual.database) || bases[0] || "";
    $("#selBase").innerHTML = bases.map(x =>
      `<option ${x === DBL.database ? "selected" : ""}>${esc(x)}</option>`).join("");
  } catch (e) {
    $("#selBase").innerHTML = `<option>—</option>`;
    $("#avisoDbl").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`;
    $("#listaTab").innerHTML = "";
    return;
  }
  carregarTabelasDbl();
}

async function carregarTabelasDbl() {
  const alvo = $("#listaTab");
  if (!alvo) return;
  alvo.innerHTML = `<div class="centro">carregando…</div>`;
  let t;
  try { t = await api("dblink_tabelas", { dblink: DBL.ligacao, database: DBL.database }); }
  catch (e) { return alvo.innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }

  const tabs = t.tabelas || [];
  if (!tabs.length) return alvo.innerHTML = `<div class="vazioc">a base ${esc(DBL.database)} não tem tabela</div>`;
  alvo.innerHTML = `<div class="dbl-cab">${tabs.length} tabela(s) em <b>${esc(DBL.database)}</b></div>` +
    tabs.map(x => `<button class="dbl-tab ${x.nome === DBL.tabela ? "viva" : ""}" data-t="${esc(x.nome)}">
        <span class="n">${esc(x.nome)}</span>
        <span class="m">${fmt(x.registros_estimados)} reg · ${fmtBytes(x.bytes)}${
          x.tipo === "VIEW" ? " · view" : ""}</span>
      </button>`).join("");
  $$("#listaTab .dbl-tab").forEach(b => b.onclick = () => abrirTabelaDbl(b.dataset.t));
  if (DBL.tabela) abrirTabelaDbl(DBL.tabela);
}

async function abrirTabelaDbl(tabela, salto = 0) {
  DBL.tabela = tabela;
  $$("#listaTab .dbl-tab").forEach(b => b.classList.toggle("viva", b.dataset.t === tabela));
  const alvo = $("#dadoTab");
  alvo.innerHTML = `<div class="centro">lendo ${esc(tabela)}…</div>`;
  let r;
  try {
    r = await api("dblink_ler", { dblink: DBL.ligacao, database: DBL.database, tabela, salto });
  } catch (e) { return alvo.innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }

  const { nomes, dados } = linhasParaObjetos(r);
  alvo.innerHTML = `
    <div class="dbl-titulo">
      <b>${esc(DBL.database)}.${esc(tabela)}</b>
      <span class="leg">${fmt(r.quantas)} linha(s)${salto ? ` a partir da ${fmt(salto + 1)}` : ""}${
        r.tem_mais ? " · há mais" : ""}</span>
      <span class="cresce"></span>
      ${salto ? `<button class="botao secundario" id="btAnt">← anteriores</button>` : ""}
      ${r.tem_mais ? `<button class="botao secundario" id="btProx">próximas →</button>` : ""}
      <button class="botao secundario" id="btEstr">Estrutura</button>
    </div>
    <div id="gradeDbl"></div>`;

  if (DBL.grade && DBL.grade.destruir) { try { DBL.grade.destruir(); } catch {} }
  DBL.grade = window.__phxgradedbl = PhxGrid.criar("#gradeDbl", {
    agrupavel: true,
    buscaGlobal: true,
    colunas: r.colunas.map((c, i) => ({
      campo: nomes[i],
      titulo: c.nome + (c.primaria ? " ★" : ""),
      tipo: tipoDoGridExterno(c),
      decimais: casasDoExterno(c, r.linhas, i),
      // Somar chave primária não significa nada; só medida soma.
      agregador: c.numerico && !c.primaria ? "sum" : null,
    })),
    dados,
    pagina: { tamanho: 100, opcoes: [50, 100, 200] },
  });

  const p = $("#btProx"), a = $("#btAnt");
  if (p) p.onclick = () => abrirTabelaDbl(tabela, salto + r.quantas);
  if (a) a.onclick = () => abrirTabelaDbl(tabela, Math.max(0, salto - 1000));
  $("#btEstr").onclick = () => estruturaDbl(tabela);
}

async function estruturaDbl(tabela) {
  let e;
  try { e = await api("dblink_estrutura", { dblink: DBL.ligacao, database: DBL.database, tabela }); }
  catch (er) { return avisar(String(er), true); }
  // O SHOW COLUMNS do MySQL(R) devolve as colunas na ordem Field, Type,
  // Collation, Null, Key, Default, Extra, Privileges, Comment.
  const col = e.colunas, idx = e.indices;
  const linha = (l, i) => l[i] === null ? "" : String(l[i]);
  folha(`Estrutura de ${DBL.database}.${tabela}`,
    `colunas e índices como o ${DBL.ligacao} os reporta`,
    tabela([{t:"campo"},{t:"tipo"},{t:"nulo"},{t:"chave"},{t:"padrão"},{t:"extra"},{t:"comentário"}],
      col.linhas, l => `<tr>
        <td class="dado"><b>${esc(linha(l,0))}</b></td>
        <td class="dado">${esc(linha(l,1))}</td>
        <td>${linha(l,3) === "YES" ? `<span class="pino nao">nulo ok</span>`
                                   : `<span class="pino ok">obrigatório</span>`}</td>
        <td>${linha(l,4) ? `<span class="pino ndx">${esc(linha(l,4))}</span>` : ""}</td>
        <td class="dado">${esc(linha(l,5))}</td>
        <td class="dado">${esc(linha(l,6))}</td>
        <td class="dado">${esc(linha(l,8))}</td></tr>`) +
    `<h4 style="margin:18px 0 6px">Índices</h4>` +
    tabela([{t:"nome"},{t:"único"},{t:"coluna"},{t:"ordem"},{t:"cardinalidade",cls:"num"}],
      idx.linhas, l => `<tr>
        <td class="dado"><span class="pino ndx">${esc(linha(l,2))}</span></td>
        <td>${linha(l,1) === "0" ? `<span class="pino ok">único</span>`
                                 : `<span class="pino nao">duplicado ok</span>`}</td>
        <td class="dado">${esc(linha(l,4))}</td>
        <td class="dado">${esc(linha(l,5)) || "ASC"}</td>
        <td class="num">${esc(linha(l,6))}</td></tr>`) +
    `<div class="acoes">
       <button class="botao secundario" id="btVoltaEstr">← ${esc(tabela)}</button>
     </div>`);
  $("#btVoltaEstr").onclick = () => { telaDbLink(DBL.ligacao); };
}

async function testarDbLink(nome) {
  try {
    const r = await api("dblink_testar", { nome });
    avisar(`${r.dblink}: ${r.motor} ${r.versao} · ${r.usuario_efetivo} · base ${r.database || "—"} · ${r.ms} ms`);
  } catch (e) { avisar(String(e), true); }
}

async function telaDbLinkSql(nome) {
  const d = await api("dblink");
  const l = (d.ligacoes || []).find(x => x.nome === nome) || {};
  folha(`Consulta no DbLink ${nome}`,
    l.somente_leitura ? "esta ligação só consulta — SELECT, SHOW, DESCRIBE e EXPLAIN"
                      : "ATENÇÃO: esta ligação pode escrever no banco do outro lado",
    `<div class="form-sql">
       <textarea id="sqlDbl" class="campo" rows="5"
         placeholder="SELECT * FROM clientes WHERE cidade = 'Joinville'">SELECT </textarea>
       <div class="acoes">
         <button class="botao" id="btRodar">Executar</button>
         <button class="botao secundario" id="btVoltaDbl">← DbLink</button>
       </div>
     </div>
     <div id="saidaSql"></div>`);
  $("#btVoltaDbl").onclick = () => telaDbLink(nome);
  $("#btRodar").onclick = async () => {
    const sql = $("#sqlDbl").value.trim();
    if (!sql) return avisar("escreva a instrução", true);
    $("#saidaSql").innerHTML = `<div class="centro">executando…</div>`;
    let r;
    try { r = await api("dblink_consultar", { dblink: nome, sql }); }
    catch (e) { return $("#saidaSql").innerHTML = `<div class="aviso mal">${esc(String(e))}</div>`; }
    if (!r.colunas.length) {
      return $("#saidaSql").innerHTML =
        `<div class="aviso">${fmt(r.afetadas)} linha(s) afetada(s) · ${r.ms} ms</div>`;
    }
    const { nomes, dados } = linhasParaObjetos(r);
    $("#saidaSql").innerHTML =
      `<div class="dbl-titulo"><b>${fmt(r.quantas)} linha(s)</b>
         <span class="leg">${r.ms} ms${r.truncado ? " · cortado no teto da ligação" : ""}</span></div>
       <div id="gradeSql"></div>`;
    PhxGrid.criar("#gradeSql", {
      agrupavel: true, buscaGlobal: true,
      colunas: r.colunas.map((c, i) => ({
        campo: nomes[i], titulo: c.nome, tipo: tipoDoGridExterno(c),
        decimais: casasDoExterno(c, r.linhas, i), agregador: c.numerico ? "sum" : null,
      })),
      dados, pagina: { tamanho: 100, opcoes: [50, 100, 200] },
    });
  };
}

/* ------------------------------------------------ o cadastro das ligações */

async function telaDbLinkDefinicoes() {
  folha("Definições do DbLink", "carregando…", `<div class="centro">carregando…</div>`);
  const d = await api("dblink");
  const ls = d.ligacoes || [];
  folha("Definições do DbLink",
    `${ls.length} ligação(ões) · guardadas em ${esc(d.arquivo)}`,
    tabela([{t:"apelido"},{t:"motor"},{t:"endereço"},{t:"usuário"},{t:"base"},
                 {t:"senha"},{t:"escrita"},{t:"teto",cls:"num"},{t:""}],
      ls, l => `<tr class="linha-dbl" data-n="${esc(l.nome)}">
        <td class="dado"><b>${esc(l.nome)}</b>${l.descricao
          ? `<div class="leg">${esc(l.descricao)}</div>` : ""}</td>
        <td>${l.conecta ? `<span class="pino ndx">${esc(l.motor)}</span>`
          : `<span class="pino nao">${esc(l.motor)} · sem cliente</span>`}</td>
        <td class="dado">${esc(l.host)}:${l.porta}</td>
        <td class="dado">${esc(l.usuario)}</td>
        <td class="dado">${esc(l.database) || "—"}</td>
        <td class="dado">${esc(l.senha)}</td>
        <td>${l.somente_leitura ? `<span class="pino ok">só lê</span>`
                                : `<span class="pino mal">escreve</span>`}</td>
        <td class="num">${fmt(l.max_linhas)}</td>
        <td><span class="pino">editar</span></td></tr>`) +
    `<div class="aviso">
       <p><strong>A conversa com o banco do outro lado é em texto claro.</strong>
       Não há TLS: a <code>std</code> do Rust não traz TLS e o projeto não
       aceita dependência externa. Use rede interna ou um túnel — a senha
       nunca viaja em texto (o MySQL(R) a embaralha com um sal por conexão),
       mas o <em>dado devolvido</em> viaja.</p>
       <p><strong>A senha fica no arquivo de ligações</strong>, que é gravado
       com permissão só do dono (<code>0600</code>). Ela precisa ser
       apresentada ao outro banco, então não dá para guardar só o hash. Quem
       preferir não tê-la em arquivo usa <code>senha_env</code> e deixa o
       valor numa variável de ambiente.</p>
       <p><strong>Uma ligação não carrega permissão.</strong> Ela guarda uma
       credencial, e todo mundo que a usa fala com o outro banco como aquele
       usuário. Por isso toda operação de DbLink exige <b>administrar</b>.</p>
       <p><strong>MySQL(R) 8 e o <code>caching_sha2_password</code>:</strong>
       o caminho rápido funciona quando o servidor já tem a senha em cache. O
       caminho completo exige TLS ou a chave RSA e não cabe sem dependência —
       nesse caso o teste diz exatamente isso e o que fazer.</p>
     </div>
     <div class="acoes">
       <button class="botao" id="btNovaLig">Nova ligação…</button>
       <button class="botao secundario" id="btIrDbl">← DbLink</button>
     </div>`);
  $("#btNovaLig").onclick = () => editarDbLink(null);
  $("#btIrDbl").onclick = () => telaDbLink();
  $$("#painel .linha-dbl").forEach(tr => tr.onclick = () => editarDbLink(tr.dataset.n));
}

async function editarDbLink(nome) {
  const d = await api("dblink");
  const l = nome ? (d.ligacoes || []).find(x => x.nome === nome) : null;
  const motores = d.motores || [];
  const campo = (id, rot, valor, tipo = "text", dica = "") =>
    `<label class="cmp"><span>${rot}</span>
       <input id="${id}" class="campo" type="${tipo}" value="${esc(String(valor ?? ""))}">
       ${dica ? `<span class="leg">${dica}</span>` : ""}</label>`;

  folha(l ? `Ligação ${l.nome}` : "Nova ligação",
    l ? "o apelido não muda — para renomear, crie outra e apague esta"
      : "letras, números, _ e - no apelido",
    `<div class="form-dbl">
       ${l ? `<label class="cmp"><span>Apelido</span>
              <input id="fNome" class="campo" value="${esc(l.nome)}" disabled></label>`
           : campo("fNome", "Apelido", "", "text", "é por ele que os comandos chamam a ligação")}
       <label class="cmp"><span>Motor</span>
         <select id="fMotor" class="campo">${motores.map(m =>
           `<option value="${esc(m.nome)}" ${l && l.motor === m.nome ? "selected" : ""}>${
             esc(m.nome)}${m.conecta ? "" : " (cliente ainda não escrito)"}</option>`).join("")}
         </select></label>
       ${campo("fHost", "Endereço", l ? l.host : "127.0.0.1")}
       ${campo("fPorta", "Porta", l ? l.porta : 3306, "number")}
       ${campo("fUsuario", "Usuário", l ? l.usuario : "")}
       ${campo("fSenha", "Senha", "", "password",
         l ? "em branco mantém a que já está guardada" : "fica no arquivo de ligações, com permissão 0600")}
       ${campo("fSenhaEnv", "Variável de ambiente da senha", l ? l.senha_env : "", "text",
         "preenchida, a senha vem daqui e não do arquivo")}
       ${campo("fBase", "Base padrão", l ? l.database : "")}
       ${campo("fDesc", "Descrição", l ? l.descricao : "")}
       ${campo("fTeto", "Teto de linhas", l ? l.max_linhas : 1000, "number")}
       ${campo("fTimeout", "Espera (s)", l ? l.timeout_s : 10, "number")}
       <label class="cmp linha-chk">
         <input type="checkbox" id="fLer" ${!l || l.somente_leitura ? "checked" : ""}>
         <span>Somente leitura — recusa qualquer coisa que não seja consulta</span>
       </label>
     </div>
     <div class="aviso">Desmarcar «somente leitura» deixa esta tela apagar dado no
       banco do outro lado. Marcado é o padrão de fábrica, e é o certo para
       quase todo caso.</div>
     <div class="acoes">
       <button class="botao" id="btGravar">Gravar</button>
       <button class="botao secundario" id="btTest2">Gravar e testar</button>
       ${l ? `<button class="botao perigo" id="btApagar">Excluir ligação</button>` : ""}
       <button class="botao secundario" id="btVolta2">← Definições</button>
     </div>`);

  $("#btVolta2").onclick = () => telaDbLinkDefinicoes();
  const gravar = async () => {
    const nomeF = (l ? l.nome : $("#fNome").value).trim();
    const p = {
      nome: nomeF,
      motor: $("#fMotor").value,
      host: $("#fHost").value.trim(),
      porta: Number($("#fPorta").value),
      usuario: $("#fUsuario").value.trim(),
      database: $("#fBase").value.trim(),
      descricao: $("#fDesc").value.trim(),
      max_linhas: Number($("#fTeto").value),
      timeout_s: Number($("#fTimeout").value),
      somente_leitura: $("#fLer").checked,
    };
    const env = $("#fSenhaEnv").value.trim();
    if (env) p.senha_env = env;
    // Só manda `senha` quando foi digitada: sem o campo, o servidor mantém a
    // que já está guardada — e é isso que faz editar a porta não apagar a
    // credencial.
    else if ($("#fSenha").value) p.senha = $("#fSenha").value;
    await api("dblink_salvar", p);
    return nomeF;
  };
  $("#btGravar").onclick = async () => {
    try { const n = await gravar(); avisar(`ligação ${n} gravada`); telaDbLinkDefinicoes(); }
    catch (e) { avisar(String(e), true); }
  };
  $("#btTest2").onclick = async () => {
    try { const n = await gravar(); await testarDbLink(n); }
    catch (e) { avisar(String(e), true); }
  };
  const ap = $("#btApagar");
  if (ap) ap.onclick = async () => {
    if (!confirm(`Excluir a ligação ${l.nome}?\n\nO banco do outro lado não é tocado — só o cadastro daqui.`)) return;
    try { await api("dblink_excluir", { nome: l.nome }); avisar(`${l.nome} excluída`); telaDbLinkDefinicoes(); }
    catch (e) { avisar(String(e), true); }
  };
}

/* A cor agrupa por familia, nao por gosto: dezessete ferramentas para oito
   matizes, entao a repeticao e inevitavel e deve significar alguma coisa.
     verde   serviço e salvaguarda ... Start/Stop, Backup
     roxo    consulta e réplica ...... Query, Replicação
     azul    gente e mensagem ........ Usuários, Server Mail
     laranja política ................ Diretivas
     turquesa dados .................. Bancos, View DB, Tabelas, Duplicar, Importar
     verde-claro rede ................ Conexões
     vermelho risco .................. Transações
     âmbar   conserto e cadeia ....... Repair, Blockchain
   Atencao: `--vermelhao` e `--laranja` sao a MESMA cor no tema claro, por
   decisao da marca. Escolher entre os dois seria escolher nada. */
const FERRAMENTAS = [
  { ico:"energia",  rot:"Start/Stop", cor:"var(--ok)",     faz:verServico },
  { ico:"consulta", rot:"Query",      cor:"var(--ndx)",    faz:abrirConsulta },
  { ico:"pivot",    rot:"Pivot",      cor:"var(--ndx)",    faz:() => telaPivot() },
  { ico:"venn",     rot:"Junção",     cor:"var(--ndx)",    faz:() => telaJuncao() },
  "risco",
  { ico:"gente",    rot:"Usuários",   cor:"var(--reg)",    faz:() => irPara("usuarios") },
  { ico:"escudo",   rot:"Diretivas",  cor:"var(--laranja)",faz:verDiretivas },
