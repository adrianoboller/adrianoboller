<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Phoenix">
  <title>Phoenix — símbolo (fênix e cilindro)</title>
  <defs>
    <linearGradient id="fogo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC43D"/>
      <stop offset=".45" stop-color="#FF8A1C"/>
      <stop offset=".8" stop-color="#FF4D10"/>
      <stop offset="1" stop-color="#D71A1A"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC43D"/>
      <stop offset=".5" stop-color="#FF8A1C"/>
      <stop offset="1" stop-color="#FF4D10"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05081a"/>
      <stop offset=".5" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#05081a"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFC43D" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FF4D10" stop-opacity="0"/>
    </radialGradient>
    <g id="asa-esq">
      <!-- a asa e um crescente: borda externa larga, ponta enrolada para
           dentro no alto, como a chama da folha de marca -->
      <path fill="url(#asa)" d="M214 292 C140 292 78 250 70 176 C66 134 86 92 124 66 C112 92 110 116 116 138 C122 110 138 86 162 70 C150 104 150 136 162 164 C168 136 182 114 202 100 C190 142 196 186 222 226 C232 242 240 254 244 262 Z"/>
      <path fill="#D71A1A" opacity=".55" d="M214 292 C168 290 126 272 102 238 C134 254 168 258 200 252 C176 244 156 230 142 210 C170 222 200 228 230 226 Z"/>
      <path fill="#FFC43D" opacity=".85" d="M116 138 C112 170 124 200 150 222 C132 196 126 168 130 140 C126 122 126 108 132 94 C122 108 116 122 116 138 Z"/>
    </g>
    <g id="trilhas-esq" fill="none" stroke="#FF8A1C" stroke-width="4" stroke-linecap="round">
      <path d="M180 300 H112 L100 288 H70"/>
      <path d="M182 322 H96"/>
      <path d="M186 344 H120 L108 356 H80"/>
      <circle cx="64" cy="288" r="6" fill="#FFC43D" stroke="none"/>
      <circle cx="90" cy="322" r="6" fill="#FFC43D" stroke="none"/>
      <circle cx="74" cy="356" r="6" fill="#FFC43D" stroke="none"/>
    </g>
  </defs>

  <circle cx="256" cy="300" r="150" fill="url(#brilho)" opacity=".35"/>
  <use href="#trilhas-esq"/>
  <use href="#trilhas-esq" transform="translate(512 0) scale(-1 1)"/>
  <use href="#asa-esq"/>
  <use href="#asa-esq" transform="translate(512 0) scale(-1 1)"/>

  <!-- cauda: tres labaredas que descem do cilindro -->
  <path fill="url(#fogo)" d="M256 470 C236 440 222 414 226 384 L286 384 C290 414 276 440 256 470 Z"/>
  <path fill="url(#fogo)" opacity=".85" d="M216 452 C200 428 196 404 206 380 L236 384 C230 410 228 432 216 452 Z"/>
  <path fill="url(#fogo)" opacity=".85" d="M296 452 C312 428 316 404 306 380 L276 384 C282 410 284 432 296 452 Z"/>

  <!-- o cilindro: o banco de dados no peito da fenix -->
  <path fill="url(#corpo)" stroke="#FF8A1C" stroke-width="5" d="M186 250 V372 C186 388 218 400 256 400 C294 400 326 388 326 372 V250"/>
  <ellipse cx="256" cy="250" rx="70" ry="20" fill="#0a1122" stroke="#FFC43D" stroke-width="5"/>
  <g fill="none" stroke="#FF8A1C" stroke-width="4">
    <path d="M186 290 C186 306 218 318 256 318 C294 318 326 306 326 290"/>
    <path d="M186 331 C186 347 218 359 256 359 C294 359 326 347 326 331"/>
  </g>
  <g fill="#FFC43D">
    <circle cx="208" cy="305" r="4.5"/><circle cx="222" cy="309" r="4.5"/>
    <circle cx="208" cy="346" r="4.5"/><circle cx="222" cy="350" r="4.5"/>
    <circle cx="208" cy="382" r="4.5"/><circle cx="222" cy="386" r="4.5"/>
  </g>
  <path fill="#FFC43D" d="M256 238 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4 z"/>

  <!-- a fenix: pescoco em S, cabeca com bico voltado para a direita e a
       crista em tres penas -- sobe do cilindro -->
  <path fill="url(#fogo)" d="M234 240 C222 206 228 172 250 148 C262 134 278 124 296 122 C310 121 322 126 330 134 L352 142 L330 150 C320 152 310 150 302 146 C290 150 282 160 278 174 C272 196 276 218 288 240 Z"/>
  <path fill="#FFC43D" d="M300 124 C288 108 282 90 284 70 C292 88 302 98 314 104 C308 88 308 72 314 56 C320 76 330 90 344 98 C342 84 346 72 354 62 C356 84 352 104 340 120 C332 122 318 122 300 124 Z"/>
  <path fill="#FF8A1C" d="M330 134 L352 142 L330 150 C334 144 334 140 330 134 Z"/>
  <circle cx="314" cy="134" r="4" fill="#010418"/>
</svg>
