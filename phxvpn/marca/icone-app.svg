<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="phxvpn">
<defs><linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1630"/><stop offset="1" stop-color="#010418"/></linearGradient></defs>
<rect x="8" y="8" width="496" height="496" rx="110" fill="url(#fundo)" stroke="#FF4D10" stroke-opacity=".55" stroke-width="4"/>
<svg x="46" y="40" width="420" height="420" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ifogo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B0D0D"/><stop offset=".3" stop-color="#D71A1A"/>
      <stop offset=".55" stop-color="#FF4D10"/><stop offset=".8" stop-color="#FF8A1C"/><stop offset="1" stop-color="#FFC43D"/>
    </linearGradient>
    <linearGradient id="ipena" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D71A1A"/><stop offset=".45" stop-color="#FF4D10"/><stop offset=".8" stop-color="#FF8A1C"/><stop offset="1" stop-color="#FFC43D"/>
    </linearGradient>
    <linearGradient id="iclara" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8A1C"/><stop offset="1" stop-color="#FFC43D"/>
    </linearGradient>
    <linearGradient id="imetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5678"/><stop offset=".35" stop-color="#1a2240"/><stop offset=".7" stop-color="#0b1024"/><stop offset="1" stop-color="#2c3656"/>
    </linearGradient>
    <linearGradient id="iaro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE2EB"/><stop offset="1" stop-color="#8a93a8"/>
    </linearGradient>
    <filter id="ibrilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ihalo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <g id="iasa">
      <path fill="url(#ipena)" d="M292 262 C362 232 420 160 450 52 C458 138 424 226 330 292 Z"/>
      <path fill="url(#ipena)" d="M292 284 C372 272 432 222 474 142 C466 226 414 288 318 316 Z"/>
      <path fill="url(#ipena)" d="M290 306 C362 310 424 286 468 234 C448 298 384 338 304 342 Z"/>
      <path fill="url(#ipena)" d="M284 328 C342 344 394 340 436 316 C406 362 344 382 288 364 Z"/>
      <path fill="none" stroke="#FFC43D" stroke-width="2.5" stroke-linecap="round" opacity=".75" d="M300 262 C360 228 408 164 440 84 M302 288 C370 272 420 230 458 166 M300 312 C360 312 410 292 450 252"/>
    </g>
  </defs>

  <!-- halo quente atras de tudo -->
  <ellipse cx="256" cy="270" rx="150" ry="150" fill="#FF4D10" opacity=".22" filter="url(#ihalo)"/>

  <!-- circuitos saindo do cano -->
  <g stroke="#FF8A1C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M108 472 H70 L52 454 H30"/><path d="M108 486 H84 L70 500 H42"/>
    <path d="M404 472 H442 L460 454 H482"/><path d="M404 486 H428 L442 500 H470"/>
  </g>
  <g fill="#FFC43D"><circle cx="30" cy="454" r="4"/><circle cx="42" cy="500" r="4"/><circle cx="482" cy="454" r="4"/><circle cx="470" cy="500" r="4"/></g>

  <!-- asas -->
  <use href="#iasa"/>
  <use href="#iasa" transform="translate(512 0) scale(-1 1)"/>

  <!-- cauda de chama descendo ao cano -->
  <path fill="url(#ifogo)" d="M256 360 C278 392 280 420 262 452 C258 432 252 420 256 360 Z"/>
  <path fill="url(#ifogo)" d="M244 356 C214 386 210 414 226 446 C234 424 240 404 244 356 Z"/>
  <path fill="url(#ifogo)" d="M268 356 C298 386 302 414 286 446 C278 424 272 404 268 356 Z"/>

  <!-- pernas ate as garras -->
  <path fill="url(#ifogo)" d="M240 372 C236 400 232 424 228 448 L236 448 C242 424 248 398 252 376 Z"/>
  <path fill="url(#ifogo)" d="M272 372 C276 400 280 424 284 448 L276 448 C270 424 264 398 260 376 Z"/>
  <!-- corpo -->
  <path fill="url(#ifogo)" d="M256 146 C292 166 304 226 296 296 C290 344 274 374 256 398 C238 374 222 344 216 296 C208 226 220 166 256 146 Z"/>
  <!-- pescoco e cabeca, olhando para a direita -->
  <path fill="url(#iclara)" d="M238 190 C228 150 234 116 256 98 C272 86 296 88 308 100 L338 108 L308 118 C300 122 294 128 288 136 C276 154 272 172 276 196 Z"/>
  <path fill="url(#iclara)" d="M262 96 C256 62 238 36 212 26 C230 48 240 70 244 104 Z"/>
  <path fill="url(#ipena)" d="M256 100 C240 72 214 58 184 58 C208 72 224 90 234 116 Z"/>
  <path fill="url(#ipena)" d="M250 110 C230 94 204 90 176 98 C202 104 218 116 230 132 Z"/>
  <path fill="url(#iclara)" d="M272 92 C274 66 286 48 304 40 C294 58 290 74 290 94 Z"/>
  <circle cx="290" cy="106" r="4.2" fill="#010418"/><circle cx="291.5" cy="104.6" r="1.3" fill="#FFC43D"/>

  <!-- cadeado no peito -->
  <g filter="url(#ibrilho)">
    <path d="M234 262 V244 A22 22 0 0 1 278 244 V262" fill="none" stroke="url(#iaro)" stroke-width="8" stroke-linecap="round"/>
    <rect x="222" y="256" width="68" height="54" rx="10" fill="#0b1024" stroke="#FFC43D" stroke-width="3"/>
    <text x="256" y="289" text-anchor="middle" font-family="'Exo 2','Segoe UI',Arial,sans-serif" font-weight="800" font-size="25" letter-spacing="1" fill="#FFC43D">VPN</text>
    <circle cx="256" cy="297" r="3.6" fill="#FF4D10"/><rect x="254.2" y="298" width="3.6" height="8" rx="1.2" fill="#FF4D10"/>
  </g>

  <!-- o cano (tunel), com as garras por cima -->
  <rect x="120" y="458" width="272" height="42" rx="6" fill="url(#imetal)" stroke="#2c3656" stroke-width="1.5"/>
  <rect x="104" y="450" width="20" height="58" rx="4" fill="url(#imetal)" stroke="#8a93a8" stroke-width="1.5"/>
  <rect x="388" y="450" width="20" height="58" rx="4" fill="url(#imetal)" stroke="#8a93a8" stroke-width="1.5"/>
  <rect x="136" y="477" width="240" height="4" rx="2" fill="#FF4D10" filter="url(#ibrilho)"/>
  <g fill="none" stroke="#FF8A1C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M146 468 l8 11 l-8 11 M156 468 l8 11 l-8 11"/><path d="M366 468 l-8 11 l8 11 M356 468 l-8 11 l8 11"/>
  </g>
  <g fill="#8a93a8"><circle cx="114" cy="458" r="2.5"/><circle cx="114" cy="500" r="2.5"/><circle cx="398" cy="458" r="2.5"/><circle cx="398" cy="500" r="2.5"/></g>
  <g fill="#FFC43D" filter="url(#ibrilho)"><circle cx="176" cy="479" r="3.5"/><circle cx="256" cy="479" r="3.5"/><circle cx="336" cy="479" r="3.5"/></g>
  <g fill="none" stroke="url(#iclara)" stroke-width="6" stroke-linecap="round">
    <path d="M226 446 C222 452 222 462 230 466 M226 446 C236 450 240 458 238 466"/>
    <path d="M286 446 C290 452 290 462 282 466 M286 446 C276 450 272 458 274 466"/>
  </g>
</svg>
</svg>