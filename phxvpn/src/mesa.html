<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phxvpn</title>
<style>
:root{--fundo:#010418;--painel:#0a1122;--linha:#1c2742;--texto:#DDE2EB;--fraco:#8a93a8;
--acento:#FF4D10;--ambar:#FFC43D;--verde:#3ecf8e;--vermelho:#ff5a5a;--azul:#5aa9ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:14px/1.4 "Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--linha)}
header h1{font-size:17px;margin:0}
header h1 b{color:var(--acento)}
#minha-chave{margin-left:auto;font:11px ui-monospace,monospace;color:var(--fraco);cursor:pointer;border:1px solid var(--linha);border-radius:10px;padding:2px 8px}
.barra{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--azul);color:var(--azul);border-radius:6px;padding:6px 11px}
button:hover{background:var(--azul);color:var(--fundo)}
button.inclui{border-color:var(--verde);color:var(--verde)}button.inclui:hover{background:var(--verde);color:var(--fundo)}
button.exclui{border-color:var(--vermelho);color:var(--vermelho)}button.exclui:hover{background:var(--vermelho);color:var(--fundo)}
button:disabled{opacity:.5;cursor:wait}
main{flex:1;overflow:auto;padding:0 14px 14px}
.rede{border:1px solid var(--linha);border-radius:8px;margin-bottom:10px;background:var(--painel);overflow:hidden}
.topo{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.lampada{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--fraco);flex:none}
.lampada.on{background:var(--verde);border-color:var(--verde)}
.nome{font-weight:600}
.info{color:var(--fraco);font-size:12px;width:100%;padding-left:18px}
.acoes{margin-left:auto;display:flex;gap:6px}
.acoes button{padding:4px 9px;font-size:13px}
.membro{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 28px;border-top:1px solid var(--linha);font-size:13px}
.membro .ip{font-family:ui-monospace,monospace;color:var(--ambar);cursor:pointer}
.membro .caminho{color:var(--fraco);font-size:12px;margin-left:auto;text-align:right}
.ponto{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--fraco);flex:none}
.ponto.on{background:var(--verde);border-color:var(--verde)}
.vazio{color:var(--fraco);padding:24px 6px;text-align:center}
.rodape{padding:6px 14px;border-top:1px solid var(--linha);color:var(--fraco);font-size:12px;min-height:28px}
.rodape.erro{color:var(--vermelho)}.rodape.ok{color:var(--verde)}
dialog{background:var(--painel);color:var(--texto);border:1px solid var(--linha);border-radius:10px;width:calc(100% - 32px);max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-size:16px}
.campo{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.campo span{font-size:12px;color:var(--fraco)}
.campo input,.campo textarea,.campo select{width:100%;background:#050a1c;color:var(--texto);border:1px solid var(--linha);border-radius:6px;padding:7px;font:inherit}
.campo textarea{min-height:90px;font:12px ui-monospace,monospace;word-break:break-all}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--acento);outline-offset:-1px}
.linha-botoes{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.msg{min-height:18px;font-size:12px;color:var(--vermelho)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1><b>phx</b>vpn</h1>
  <span id="minha-chave" title="Sua chave publica (clique para copiar)">…</span>
</header>
<div class="barra">
  <button class="inclui" id="b-criar">Criar rede</button>
  <button id="b-entrar">Entrar na rede</button>
</div>
<main id="lista"></main>
<div class="rodape" id="rodape"></div>

<dialog id="d-criar"><form method="dialog" id="f-criar">
  <h2>Criar rede</h2>
  <label class="campo"><span>Nome da rede</span><input name="rede" required maxlength="40"></label>
  <label class="campo"><span>Meu IP virtual</span><input name="ip" value="10.78.0.1/24"></label>
  <label class="campo"><span>Modo</span><select name="modo">
    <option value="direto">Direto (sem servidor)</option>
    <option value="auto">Auto (direto; se nao der, servidor intermediario)</option>
    <option value="repasse">Sempre pelo servidor intermediario</option></select></label>
  <label class="campo"><span>Servidor intermediario (CHAVE@HOST:PORTA, para auto e repasse)</span><input name="repasse"></label>
  <label class="campo"><span>Meu usuario no servidor intermediario</span><input name="repasse_usuario" autocomplete="username"></label>
  <p class="msg"></p>
  <div class="linha-botoes"><button type="button" data-fechar>Cancelar</button><button class="inclui">Criar</button></div>
</form></dialog>

<dialog id="d-entrar"><form method="dialog" id="f-entrar">
  <h2>Entrar na rede</h2>
  <label class="campo"><span>Codigo do convite</span><textarea name="codigo" required placeholder="phxvpn1...."></textarea></label>
  <label class="campo"><span>Senha da rede</span><input name="senha" type="password" required autocomplete="off"></label>
  <p class="msg"></p>
  <div class="linha-botoes"><button type="button" data-fechar>Cancelar</button><button class="inclui">Entrar</button></div>
</form></dialog>

<dialog id="d-convidar"><form method="dialog" id="f-convidar">
  <h2>Convidar para <span data-rede></span></h2>
  <label class="campo"><span>Senha da rede</span><input name="senha" type="password" required autocomplete="off"></label>
  <label class="campo"><span>Meu endereco na internet (HOST:PORTA) — opcional</span><input name="endereco" placeholder="203.0.113.5:51820"></label>
  <label class="campo"><span>Validade (horas)</span><input name="validade" value="24"></label>
  <label class="campo" hidden><span>Codigo — mande por um canal seguro; vale uma entrada</span><textarea name="codigo" readonly></textarea></label>
  <p class="msg"></p>
  <div class="linha-botoes"><button type="button" data-fechar>Fechar</button><button type="button" id="b-copiar" hidden>Copiar codigo</button><button class="inclui" id="b-gerar">Gerar convite</button></div>
</form></dialog>

<dialog id="d-ligar"><form method="dialog" id="f-ligar">
  <h2>Ligar <span data-rede></span></h2>
  <label class="campo"><span>Senha da rede</span><input name="senha" type="password" required autocomplete="off"></label>
  <fieldset id="repasse-conta" hidden style="border:1px solid var(--linha);border-radius:8px;margin:4px 0 8px;padding:8px">
    <legend style="color:var(--ambar);font-size:12px;padding:0 6px">Servidor intermediario</legend>
    <label class="campo"><span>Usuario</span><input name="repasse_usuario" autocomplete="username"></label>
    <label class="campo"><span>Senha</span><input name="repasse_senha" type="password" autocomplete="current-password"></label>
  </fieldset>
  <p class="msg"></p>
  <div class="linha-botoes"><button type="button" data-fechar>Cancelar</button><button class="inclui">Ligar</button></div>
</form></dialog>

<script src="/mesa.js"></script>
</body>
</html>
