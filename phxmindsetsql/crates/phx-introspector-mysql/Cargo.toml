[package]
name = "phx-introspector-mysql"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "MySQL/MariaDB live catalog introspector for PhxMindSetSQL"

[dependencies]
async-trait = "0.1"
phx-sql-introspection-api = { path = "../phx-sql-introspection-api" }
phx-sql-model = { path = "../phx-sql-model" }
phx-sql-parser-api = { path = "../phx-sql-parser-api" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
