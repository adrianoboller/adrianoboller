# Os tres portoes obrigatorios da casa (ver CLAUDE.md, secao "Antes de
# commitar"): formatacao, lints sem aviso nenhum e a suite inteira. Roda em
# todo push e em toda pull request para que nenhum branch avance com o
# codigo fora do padrao ou com um teste quebrado.
#
# Sem cano nenhum na saida dos comandos (nada de "| tail", "| grep" etc.):
# um cano troca o codigo de saida do comando pelo do ultimo elo do cano, e
# ja foi defeito real aqui um portao que engolia o proprio fracasso porque
# a saida ia por um cano. Cada portao roda puro, e o job falha se qualquer
# um deles sair com codigo diferente de zero.
name: Portoes

on:
  push:
  pull_request:

jobs:
  portoes:
    name: fmt + clippy + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        # O Cargo.toml do workspace mora em phxsql/, nao na raiz do repo.
        working-directory: phxsql
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # phxsql/rust-toolchain.toml pina a versao exata do compilador e os
      # componentes rustfmt/clippy. O rustup ja vem instalado nos runners do
      # GitHub e le esse arquivo sozinho no primeiro comando cargo/rustc,
      # baixando o toolchain pinado sem precisar de nenhuma acao de
      # terceiro so para isso.
      - name: Mostrar o toolchain resolvido
        run: rustc --version --verbose

      - name: "Portao 1: formatacao (cargo fmt --all --check)"
        run: cargo fmt --all --check

      - name: "Portao 2: lints, zero avisos (cargo clippy -D warnings)"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "Portao 3: suite de testes (cargo test --workspace)"
        run: cargo test --workspace

  # Pedido 662: a recusa de link no Windows (`util::abrir_sem_seguir`, com
  # `FILE_FLAG_OPEN_REPARSE_POINT`) so se prova no Windows de verdade -- a
  # compilacao cruzada no Linux diz que o codigo existe, nao que o NTFS
  # devolve o handle do link. Roda SO o teste dela: a suite inteira no
  # Windows e outra conversa, com outros testes que pressupoem Unix.
  windows:
    name: recusa de link no Windows (pedido 662)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phxsql
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Mostrar o toolchain resolvido
        run: rustc --version --verbose

      # Filtro de teste que nao casa nada sai VERDE com «0 passed» -- o mesmo
      # portao que engole o proprio fracasso, por outro caminho. Antes de
      # rodar, a lista tem de trazer o teste pelo nome exato. Sem cano: a
      # saida vai para uma variavel e o codigo do cargo se confere a parte.
      - name: "O teste existe para o filtro (sem isso o verde nao prova nada)"
        run: |
          $lista = cargo test -p phxsql-store --lib -- --exact util::tests::sem_seguir_no_windows_recusa_link_plantado --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($lista -match '^util::tests::sem_seguir_no_windows_recusa_link_plantado: test$')) {
            Write-Error "o filtro nao achou util::tests::sem_seguir_no_windows_recusa_link_plantado"
            exit 1
          }

      - name: "Prova: link plantado e recusado, arquivo comum abre"
        run: cargo test -p phxsql-store --lib -- --exact util::tests::sem_seguir_no_windows_recusa_link_plantado
