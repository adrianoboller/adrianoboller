[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phxclaw"
version = "0.70.0"
description = "SDK Python do PhxClaw: cliente da API HTTP de tarefas e do servidor MCP por stdio"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# So a biblioteca padrao: o SDK entra em qualquer ambiente sem arrastar arvore nenhuma.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["phxclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["phxclaw"]
