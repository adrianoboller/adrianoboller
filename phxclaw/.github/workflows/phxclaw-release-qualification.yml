name: PhxClaw Release Qualification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  qualify-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phxclaw_ci
          POSTGRES_PASSWORD: phxclaw_ci
          POSTGRES_DB: phxclaw_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U phxclaw_ci -d phxclaw_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PHXCLAW_TEST_DATABASE_URL: postgresql://phxclaw_ci:phxclaw_ci@127.0.0.1:55432/phxclaw_ci
      PHXCLAW_RLS_DATABASE_URL: postgresql://phxclaw_rls:phxclaw_rls@127.0.0.1:55432/phxclaw_ci
      PHXCLAW_MISSION_E2E_CMD: ${{ vars.PHXCLAW_MISSION_E2E_CMD }}
      PHXCLAW_TAURI_E2E_CMD: ${{ vars.PHXCLAW_TAURI_E2E_CMD }}
      PHXCLAW_PROVIDER_MODEL_E2E_CMD: ${{ vars.PHXCLAW_PROVIDER_MODEL_E2E_CMD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python3 -m pip install --disable-pip-version-check jsonschema cryptography
          cargo install cargo-deny --locked
      - name: Provision RLS-constrained role
        run: |
          psql "$PHXCLAW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'phxclaw_rls') THEN
              CREATE ROLE phxclaw_rls LOGIN PASSWORD 'phxclaw_rls' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          SQL
      - name: Strict qualification
        run: python3 tools/qualify_release.py . --output reports/release-qualification/github-linux --strict
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phxclaw-release-qualification-linux
          path: reports/release-qualification/github-linux
          if-no-files-found: error
