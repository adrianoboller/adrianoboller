[package]
name = "phxclaw"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phxclaw-device-transport = { path = "../../crates/phxclaw-device-transport" }
anyhow.workspace = true
axum.workspace = true
serde_json.workspace = true
# `io-std`: o `mcp-serve` fala MCP pelo stdin/stdout do processo.
tokio = { workspace = true, features = ["io-std"] }
phxclaw-agent = { path = "../../crates/phxclaw-agent" }
phxclaw-api-gateway = { path = "../../crates/phxclaw-api-gateway" }
phxclaw-browser = { path = "../../crates/phxclaw-browser" }
phxclaw-core-runtime = { path = "../../crates/phxclaw-core-runtime" }
phxclaw-postgres-bootstrap = { path = "../../crates/phxclaw-postgres-bootstrap" }
phxclaw-secret-broker = { path = "../../crates/phxclaw-secret-broker" }
# A distancia de edicao da sugestao de comando e a mesma da sugestao de chave do config.json.
phxclaw-config-runtime = { path = "../../crates/phxclaw-config-runtime" }

[features]
# O alvo da versao e o Linux de mesa (decisao do dono, 01/10): mouse, teclado e captura
# entram no binario. Servidor sem sessao grafica compila com --no-default-features, porque
# a feature liga libgbm, libdrm, libwayland-client e libxcb no executavel.
default = ["desktop"]
desktop = ["phxclaw-agent/desktop"]
