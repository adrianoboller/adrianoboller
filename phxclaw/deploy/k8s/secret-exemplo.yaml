# EXEMPLO SEM VALOR. Este arquivo mostra a FORMA do Secret e propositalmente não está no
# kustomization.yaml: aplicá-lo como está criaria um token vazio e uma chave-mestra vazia
# (o agente recusa as duas). Crie o Secret de verdade, direto no cluster, fora do git:
#
#   kubectl -n phxclaw create secret generic phxclaw-segredos \
#     --from-literal=api-token="$(openssl rand -hex 32)" \
#     --from-literal=master.key="$(openssl rand -base64 32)"
#
# ou use um gerenciador de segredos (External Secrets, Sealed Secrets, Vault) que produza um
# Secret com estes dois nomes de chave.
apiVersion: v1
kind: Secret
metadata:
  name: phxclaw-segredos
  namespace: phxclaw
  labels:
    app.kubernetes.io/name: phxclaw
type: Opaque
stringData:
  # Bearer da API, 24+ caracteres.
  api-token: ""
  # Chave-mestra do cofre: base64 de 32 bytes.
  master.key: ""
