# ClusterIP de propósito: expor a API fora do cluster (Ingress, LoadBalancer) é decisão
# escrita do operador, com TLS à frente — a API fala HTTP puro.
apiVersion: v1
kind: Service
metadata:
  name: phxclaw
  namespace: phxclaw
  labels:
    app.kubernetes.io/name: phxclaw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phxclaw
  ports:
    - name: api
      port: 8787
      targetPort: api
      protocol: TCP
