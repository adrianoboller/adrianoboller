resolver = "3"

[workspace.package]
version = "0.70.0"
edition = "2024"
license = "Apache-2.0"
authors = ["PhxClaw Team"]

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

axum = { version = "0.8", features = ["json", "ws"] }
futures-util = "0.3"
getrandom = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
ed25519-dalek = "2"
enigo = "0.6.1"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "blocking", "stream", "query", "form"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "sync", "net"] }
url = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v7", "serde"] }
xcap = "0.9.8"

walkdir = "2"
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"

# Informacao de depuracao so com arquivo e linha (backtrace continua util). Medido em
# 30/09/2026: com debug completo, target/debug/deps chegou a 18 GB e encheu o disco duas
# vezes no meio da suite.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
