<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhxClaw Config</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0b1020;color:#e8ecf8}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-rows:auto 1fr;height:100vh}header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:#111831;border-bottom:1px solid #27304d}header b{font-size:18px}.pill{padding:4px 8px;border-radius:999px;background:#1e2947;color:#9fc5ff;font-size:12px}button,input,select,textarea{font:inherit}button{background:#2957d8;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}button.secondary{background:#27304d}.layout{display:grid;grid-template-columns:270px 1fr;min-height:0}aside{padding:12px;border-right:1px solid #27304d;overflow:auto;background:#0e1529}.search{width:100%;padding:9px;border-radius:8px;border:1px solid #34405f;background:#151d35;color:#fff;margin-bottom:10px}.nav button{width:100%;text-align:left;margin:2px 0;background:transparent;color:#cad3e8}.nav button.active{background:#20335d;color:#fff}main{overflow:auto;padding:18px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.status{margin-left:auto;color:#9fb0cd}.card{background:#111831;border:1px solid #27304d;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#a8b4cf}.field input,.field select,.field textarea{width:100%;padding:9px;border-radius:8px;border:1px solid #34405f;background:#0d1427;color:#fff}.bool{display:flex;align-items:center;gap:8px}.raw{width:100%;height:60vh;font-family:ui-monospace,monospace;white-space:pre}.error{color:#ff8f8f}.ok{color:#8deda5}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}}
</style></head><body>
<header><b>🔥 PhxClaw Config</b><span class="pill">v0.40</span><span id="meta" class="pill"></span></header>
<div class="layout"><aside><input id="search" class="search" placeholder="Buscar configuração…"><div id="nav" class="nav"></div></aside>
<main><div class="toolbar"><button id="load">Recarregar</button><button id="save">Salvar</button><button id="validate" class="secondary">Validar</button><button id="import" class="secondary">Importar JSON</button><button id="export" class="secondary">Exportar JSON</button><button id="rawBtn" class="secondary">JSON bruto</button><span id="status" class="status"></span></div><div id="content"></div><input id="file" type="file" accept="application/json,.json" hidden></main></div>
<script>
const API='/v1/config'; let cfg=null, baseRevision=0, active=null, rawMode=false;
const SECRET=/password|api.?key|token|private.?key|client.?secret/i; const REF=/_secret_uuid$|_secret_ref$|^password_secret_uuid$/i;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(msg,ok=true){const e=document.querySelector('#status');e.textContent=msg;e.className='status '+(ok?'ok':'error')}
function validateLocal(x){if(!x||x.schema_version!=='0.40.0')throw Error('schema_version deve ser 0.40.0');if(!Number.isInteger(x.revision)||x.revision<1)throw Error('revision inválida');if(x.security?.deny_by_default!==true||x.security?.secrets_plaintext_forbidden!==true)throw Error('guards de segurança não podem ser desativados');scan(x,'');return true}
function scan(v,path){if(Array.isArray(v)){v.forEach((x,i)=>scan(x,path+'/'+i));return}if(v&&typeof v==='object'){for(const[k,x]of Object.entries(v)){const p=path+'/'+k;if(SECRET.test(k)&&!REF.test(k)&&typeof x==='string'&&x)throw Error('segredo em claro proibido: '+p);scan(x,p)}}}
function nav(){const q=document.querySelector('#search').value.toLowerCase();const n=document.querySelector('#nav');n.innerHTML='';Object.keys(cfg).filter(k=>!['schema_version','config_uuid','revision'].includes(k)&&k.toLowerCase().includes(q)).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.className=k===active?'active':'';b.onclick=()=>{active=k;rawMode=false;render()};n.appendChild(b)});if(!active)active=Object.keys(cfg).find(k=>!['schema_version','config_uuid','revision'].includes(k))}
function inputFor(path,key,val){let id='f_'+path.join('_')+'_'+key;if(typeof val==='boolean')return `<div class="field"><label>${esc(key)}</label><label class="bool"><input id="${id}" data-path="${esc([...path,key].join('.'))}" type="checkbox" ${val?'checked':''}> ${val?'Ativo':'Inativo'}</label></div>`;if(typeof val==='number')return `<div class="field"><label>${esc(key)}</label><input id="${id}" data-path="${esc([...path,key].join('.'))}" type="number" value="${val}"></div>`;if(typeof val==='string'||val===null)return `<div class="field"><label>${esc(key)}</label><input id="${id}" data-path="${esc([...path,key].join('.'))}" value="${val===null?'':esc(val)}" placeholder="${val===null?'null / referência opcional':''}"></div>`;return `<div class="field"><label>${esc(key)}</label><textarea id="${id}" data-json="1" data-path="${esc([...path,key].join('.'))}">${esc(JSON.stringify(val,null,2))}</textarea></div>`}
function render(){nav();document.querySelector('#meta').textContent=`rev ${cfg.revision} • ${cfg.config_uuid}`;const c=document.querySelector('#content');if(rawMode){c.innerHTML=`<div class="card"><textarea id="raw" class="raw">${esc(JSON.stringify(cfg,null,2))}</textarea></div>`;return}let obj=cfg[active];let body='';if(obj&&typeof obj==='object'&&!Array.isArray(obj)){body='<div class="grid">'+Object.entries(obj).map(([k,v])=>inputFor([active],k,v)).join('')+'</div>'}else body=inputFor([],active,obj);c.innerHTML=`<div class="card"><h2>${esc(active)}</h2>${body}</div>`;c.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>updateField(el));}
function updateField(el){let p=el.dataset.path.split('.'),o=cfg;for(let i=0;i<p.length-1;i++)o=o[p[i]];let v;if(el.type==='checkbox')v=el.checked;else if(el.type==='number')v=Number(el.value);else if(el.dataset.json)v=JSON.parse(el.value);else v=el.value===''?null:el.value;o[p.at(-1)]=v;setStatus('Alterações locais — ainda não salvas')}
async function load(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('API indisponível');cfg=await r.json();validateLocal(cfg);baseRevision=cfg.revision;active=null;render();setStatus('Configuração carregada da API')}catch(e){if(!cfg){cfg=window.__PHXCLAW_CONFIG__||null}if(cfg){validateLocal(cfg);baseRevision=cfg.revision;render();setStatus('Modo local: use Importar/Exportar',false)}else setStatus('API indisponível. Importe phxclaw.config.json.',false)}}
async function save(){try{if(rawMode)cfg=JSON.parse(document.querySelector('#raw').value);validateLocal(cfg);let r=await fetch(API,{method:'PUT',headers:{'content-type':'application/json','if-match':String(baseRevision)},body:JSON.stringify(cfg)});if(!r.ok)throw Error(await r.text());cfg=await r.json();baseRevision=cfg.revision;render();setStatus('Salvo atomicamente na revisão '+cfg.revision)}catch(e){setStatus('Não salvo: '+e.message,false)}}
function exportCfg(){validateLocal(cfg);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)+'\n'],{type:'application/json'}));a.download='phxclaw.config.json';a.click();URL.revokeObjectURL(a.href);setStatus('JSON exportado')}
document.querySelector('#load').onclick=load;document.querySelector('#save').onclick=save;document.querySelector('#validate').onclick=()=>{try{if(rawMode)cfg=JSON.parse(document.querySelector('#raw').value);validateLocal(cfg);setStatus('Validação local OK')}catch(e){setStatus(e.message,false)}};document.querySelector('#rawBtn').onclick=()=>{rawMode=!rawMode;render()};document.querySelector('#export').onclick=exportCfg;document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{cfg=JSON.parse(await e.target.files[0].text());validateLocal(cfg);baseRevision=cfg.revision;active=null;rawMode=false;render();setStatus('JSON importado localmente')};document.querySelector('#search').oninput=nav;load();
</script></body></html>
