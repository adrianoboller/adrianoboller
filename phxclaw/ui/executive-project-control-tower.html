<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhxClaw — Executive Project Control Tower</title><style>
:root{--bg:#06111b;--panel:#0b1b28;--panel2:#102637;--line:#1d3e55;--text:#eaf6ff;--muted:#87a6bb;--cyan:#22d3ee;--blue:#38bdf8;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--violet:#a78bfa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#030912,#071725 45%,#06111b);color:var(--text);font:14px Inter,ui-sans-serif,system-ui}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#07131e;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:800;letter-spacing:.4px}.brand span{color:var(--cyan)}.small{color:var(--muted);font-size:12px}.nav{margin-top:22px}.nav button{width:100%;text-align:left;background:transparent;color:#bcd3e2;border:0;border-radius:9px;padding:10px 12px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#0e2d40;color:white}.main{padding:22px 26px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.title h1{margin:0;font-size:25px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:#b8d2e4;background:#091b29}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(130px,1fr));margin-top:20px}.card{background:linear-gradient(180deg,#0b1c2a,#091722);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 10px 30px #0005}.kpi b{font-size:24px;display:block;margin-top:8px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.cyan{color:var(--cyan)}.two{grid-template-columns:1.6fr 1fr;margin-top:14px}.three{grid-template-columns:1.1fr 1fr 1fr;margin-top:14px}.bar{height:8px;background:#132c3d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}.projects{width:100%;border-collapse:collapse}.projects th,.projects td{padding:10px;border-bottom:1px solid #173449;text-align:left}.projects th{color:#91aec2;font-size:12px}.badge{padding:4px 7px;border-radius:7px;font-size:11px;font-weight:700}.bgreen{background:#0b3c31;color:#74f0c6}.byellow{background:#4b3910;color:#ffd86b}.bred{background:#4a1721;color:#ff9bad}.spark{display:flex;height:70px;align-items:end;gap:5px}.spark i{width:9%;background:linear-gradient(var(--cyan),#0c5d7b);border-radius:3px 3px 0 0}.list{display:grid;gap:8px}.item{padding:9px;border:1px solid #16384c;border-radius:9px;background:#0b1c29}.actions button{background:#0e7490;color:white;border:0;padding:9px 11px;border-radius:8px;margin-right:6px}.actions button.warn{background:#7c2d12}.actions button.secondary{background:#163347}.view{display:none}.view.active{display:block}@media(max-width:1100px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Phx<span>Claw</span></div><div class="small">Executive Project Control Tower · v0.48</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div class="title"><div class="small">PORTFOLIO / EXECUTIVE CONTROL</div><h1 id="heading">Visão Executiva</h1></div><div class="chips"><span class="chip">26 sprints 🟡</span><span class="chip">1.117+ capabilities</span><span class="chip">Read-only default</span></div></div><div id="content"></div></main></div><script>
const views={
'Visão Executiva':()=>`<section class="grid kpis"><div class="card kpi"><span class="small">Projetos ativos</span><b>7</b><span class="green">5 saudáveis</span></div><div class="card kpi"><span class="small">Saúde portfólio</span><b class="cyan">82%</b><span>↑ 4 pts</span></div><div class="card kpi"><span class="small">Custo atual</span><b>US$ 3.8k</b><span>de US$ 5.1k</span></div><div class="card kpi"><span class="small">Forecast final</span><b>US$ 4.7k</b><span class="green">8% abaixo</span></div><div class="card kpi"><span class="small">Agentes ativos</span><b>31</b><span>110 disponíveis</span></div><div class="card kpi"><span class="small">Alertas</span><b class="yellow">6</b><span>1 crítico</span></div></section>${projects()}<section class="grid three"><div class="card"><b>Attention Queue</b><div class="list"><div class="item"><span class="badge bred">CRITICAL</span> Portal Legacy — risco prazo 78%</div><div class="item"><span class="badge byellow">HIGH</span> Data Hub — WIP saturado</div><div class="item"><span class="badge byellow">HIGH</span> Mobile — budget risk 61%</div></div></div><div class="card"><b>Custo IA</b><div class="spark">${[35,48,42,58,50,67,55,71,62,76].map(x=>`<i style="height:${x}%"></i>`).join('')}</div><div class="small">Ollama 64% das execuções elegíveis · cloud 36%</div></div><div class="card"><b>PDCA</b><div class="list"><div class="item">PLAN 14 ciclos</div><div class="item">DO 9 ciclos</div><div class="item">CHECK 5 ciclos</div><div class="item">ACT 3 ciclos</div></div></div></section>`,
'Projetos':()=>projects(true),
'Custos & EVM':()=>panel('Custos & EVM','EAC / ETC / VAC / CPI / SPI consolidados por projeto, agente, modelo e Sprint.',[['CPI médio','1.06'],['SPI médio','0.97'],['EAC','US$ 4.7k'],['VAC','US$ +0.4k']]),
'Riscos & Prazos':()=>panel('Riscos & Prazos','Risco preditivo v0.46 + Supervisor v0.47 + caminho crítico.',[['Riscos high/critical','11'],['Marcos em risco','4'],['Projetos atrasáveis','2'],['Ações supervisor','8']]),
'Agentes & Modelos':()=>panel('Agentes & Modelos','Carga dos 110 agentes, custo, modelos, Ollama/local-first e fallback cloud.',[['Agentes ativos','31'],['Saturados','4'],['Ollama share','64%'],['Cloud escalation','12']]),
'PDCA & Conhecimento':()=>panel('PDCA & Conhecimento','Ciclos, base frutífera e infrutífera, promotion state e freshness.',[['Frutíferos','286'],['Infrutíferos','73'],['Candidates','41'],['Governed','122']]),
'Supervisor':()=>panel('Supervisor Autônomo','Intervenções propostas/executadas. Alterações sensíveis continuam em approval.',[['Auto low-risk','17'],['Pendentes approval','6'],['Bloqueadas por gate','3'],['Rollback','1']]),
'Alertas':()=>panel('Alertas Executivos','Fila consolidada, evidência, severidade e delegação ao Supervisor.',[['Critical','1'],['High','5'],['Medium','9'],['Low','14']]),
'Relatórios':()=>panel('Relatórios','Resumo executivo, status report, custos, riscos, modelo/agent utilization e evidence links.',[['Relatórios hoje','8'],['Exportações','3'],['Auditáveis','100%'],['Fresh','7/8']])};
function projects(){return `<section class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><b>Projetos por atenção executiva</b><span class="small">ordenado por risco + ações abertas</span></div><table class="projects"><thead><tr><th>Projeto</th><th>Saúde</th><th>Prazo</th><th>Budget</th><th>Agentes</th><th>Bloqueios</th><th>Status</th></tr></thead><tbody><tr><td>Portal Legacy → Rust</td><td>54%</td><td class="red">78%</td><td>42%</td><td>9</td><td>5</td><td><span class="badge bred">Ação</span></td></tr><tr><td>Data Hub</td><td>67%</td><td>39%</td><td>31%</td><td>7</td><td>3</td><td><span class="badge byellow">Atenção</span></td></tr><tr><td>Mobile Commerce</td><td>72%</td><td>44%</td><td class="yellow">61%</td><td>5</td><td>1</td><td><span class="badge byellow">Atenção</span></td></tr><tr><td>PhxSQL</td><td>89%</td><td>21%</td><td>18%</td><td>6</td><td>0</td><td><span class="badge bgreen">Saudável</span></td></tr><tr><td>PrintGuard AI</td><td>91%</td><td>17%</td><td>22%</td><td>4</td><td>0</td><td><span class="badge bgreen">Saudável</span></td></tr></tbody></table></section>`}
function panel(t,d,ks){return `<section class="grid kpis">${ks.map(([a,b])=>`<div class="card kpi"><span class="small">${a}</span><b>${b}</b></div>`).join('')}</section><section class="grid two"><div class="card"><b>${t}</b><p class="small">${d}</p><div class="spark">${[20,32,28,44,39,58,51,68,62,74].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></div><div class="card"><b>Governança</b><p class="small">A Control Tower é read-only por padrão. Ações reais são delegadas ao Supervisor v0.47.</p><div class="actions"><button>Gerar relatório</button><button class="secondary">Abrir evidências</button><button class="warn">Solicitar intervenção</button></div></div></section>`}
const nav=document.getElementById('nav'), content=document.getElementById('content'), heading=document.getElementById('heading');
Object.keys(views).forEach((k,i)=>{let b=document.createElement('button');b.textContent=k;b.className=i===0?'active':'';b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');heading.textContent=k;content.innerHTML=views[k]()};nav.appendChild(b)});content.innerHTML=views['Visão Executiva']();
</script></body></html>
