<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhxClaw · Project Management</title><style>
:root{color-scheme:dark;--bg:#06111d;--panel:#0b1c2d;--line:#173754;--text:#e8f4ff;--muted:#86a9c4;--accent:#29a8ff;--ok:#27d17f;--warn:#f6b83f;--bad:#ff6464}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui;background:linear-gradient(135deg,#04101b,#071827);color:var(--text)}header{height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#071522eF;backdrop-filter:blur(12px);z-index:3}.brand{font-size:22px;font-weight:800;color:#76cfff}.search{flex:1;background:#0a1b2a;border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:white}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}nav{border-right:1px solid var(--line);padding:16px;position:sticky;top:64px;height:calc(100vh - 64px)}nav button{width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:#bcd5e8;margin:2px 0;cursor:pointer}nav button.active,nav button:hover{background:#0e3152;color:white}main{padding:18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(180deg,#0a1d2e,#081725);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 30px #0004}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.kpi{font-size:28px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.bar{height:8px;background:#10283d;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#20a6ff,#51e1c5)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #14314b;text-align:left}.tag{padding:3px 7px;border:1px solid #295171;border-radius:999px;color:#bde0fa;font-size:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#0a2034;border:1px solid var(--line);color:#c9e0ef;padding:8px 11px;border-radius:8px;cursor:pointer}.tabs button.active{background:#0d5c96;color:white}.view{display:none}.view.active{display:block}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.col{background:#07131f;border:1px solid var(--line);padding:10px;border-radius:10px;min-height:220px}.ticket{background:#0d2438;border:1px solid #21445e;padding:9px;border-radius:8px;margin:8px 0}.gantt{display:grid;grid-template-columns:180px 1fr;gap:8px}.gantt-row{display:contents}.timeline{position:relative;height:26px;background:#091a28;border-radius:7px}.taskbar{position:absolute;top:5px;height:16px;border-radius:5px;background:linear-gradient(90deg,#198fe0,#3fc8ff)}@media(max-width:1000px){.wrap{grid-template-columns:1fr}nav{display:none}.span3,.span4,.span6,.span8{grid-column:span 12}.kanban{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="brand">◆ PhxClaw PM</div><input class="search" placeholder="Buscar projeto, tarefa, risco, sprint, marco..."><span class="tag">v0.42</span></header><div class="wrap"><nav id="nav"></nav><main><div class="tabs" id="tabs"></div><div id="views"></div></main></div><script>
const screens=['Portfolio','Visão Geral','WBS & Gantt','Scrum','Kanban','PDCA','Riscos & Issues','Custos & EVM','Recursos','Stakeholders','Calendário & Docs','Relatórios','Configuração'];
const nav=document.querySelector('#nav'),tabs=document.querySelector('#tabs'),views=document.querySelector('#views');
screens.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>show(i);nav.appendChild(b);let t=b.cloneNode(true);t.onclick=()=>show(i);tabs.appendChild(t)});
function dashboard(title,body){return `<section class="view"><h1>${title}</h1><p class="muted">MS Project ↔ Scrum ↔ Kanban ↔ PDCA ↔ Custos ↔ Riscos ↔ Recursos ↔ IA</p>${body}</section>`}
views.innerHTML=
 dashboard('Portfolio',`<div class="grid"><div class="card span3"><div class="muted">Projetos ativos</div><div class="kpi">12</div></div><div class="card span3"><div class="muted">Saúde</div><div class="kpi ok">86%</div></div><div class="card span3"><div class="muted">Orçamento</div><div class="kpi">R$ 2,8M</div></div><div class="card span3"><div class="muted">Riscos críticos</div><div class="kpi bad">3</div></div><div class="card span8"><h3>Projetos</h3><table><tr><th>Projeto</th><th>Método</th><th>Prazo</th><th>Saúde</th></tr><tr><td>PhxClaw</td><td>Hybrid</td><td>31/12</td><td class="ok">Verde</td></tr><tr><td>PHXSQL</td><td>Scrum</td><td>15/11</td><td class="warn">Amarelo</td></tr><tr><td>PrintGuard AI</td><td>Kanban</td><td>20/10</td><td class="ok">Verde</td></tr></table></div><div class="card span4"><h3>Próxima ação</h3><p>Rebalancear recursos do PHXSQL e revisar risco de integração.</p><button>Executar com aprovação</button></div></div>`)+
 dashboard('Visão Geral',`<div class="grid"><div class="card span4"><h3>Escopo</h3><div class="bar"><i style="width:78%"></i></div><p>78% concluído</p></div><div class="card span4"><h3>Cronograma</h3><div class="bar"><i style="width:71%"></i></div><p class="warn">SPI 0,94</p></div><div class="card span4"><h3>Custo</h3><div class="bar"><i style="width:65%"></i></div><p class="ok">CPI 1,03</p></div><div class="card span12"><h3>Health Check</h3><table><tr><th>Dimensão</th><th>Score</th><th>Status</th></tr>${['Escopo','Prazo','Custo','Qualidade','Risco','Recursos','Fluxo','Stakeholders'].map((x,i)=>`<tr><td>${x}</td><td>${[92,73,88,90,68,75,84,81][i]}%</td><td>${i==4?'<span class="warn">Atenção</span>':'<span class="ok">OK</span>'}</td></tr>`).join('')}</table></div></div>`)+
 dashboard('WBS & Gantt',`<div class="card"><h3>EAP/WBS + caminho crítico</h3><div class="gantt">${[['Arquitetura',5,32],['Core',20,38],['QA',52,20],['Release',73,18]].map(x=>`<div>${x[0]}</div><div class="timeline"><i class="taskbar" style="left:${x[1]}%;width:${x[2]}%"></i></div>`).join('')}</div></div>`)+
 dashboard('Scrum',`<div class="grid"><div class="card span4"><h3>Sprint 18</h3><div class="kpi">42 pts</div><p>Velocity média: 38</p></div><div class="card span8"><h3>Backlog</h3><table><tr><th>Story</th><th>Pts</th><th>DoD</th></tr><tr><td>HA Control Plane</td><td>8</td><td class="ok">✓</td></tr><tr><td>PM Suite</td><td>13</td><td class="warn">Em revisão</td></tr></table></div></div>`)+
 dashboard('Kanban',`<div class="kanban">${['Backlog','Em andamento','Revisão','Concluído'].map((c,i)=>`<div class="col"><h3>${c} <span class="tag">WIP ${[12,4,3,0][i]}</span></h3>${['PM-142','PM-151','PM-163'].slice(0,3-i%2).map(t=>`<div class="ticket">${t}<br><small class="muted">Prioridade alta · owner IA+humano</small></div>`).join('')}</div>`).join('')}</div>`)+
 dashboard('PDCA',`<div class="grid">${['PLAN','DO','CHECK','ACT'].map((x,i)=>`<div class="card span3"><h2>${x}</h2><p>${['Meta: reduzir atraso para <5%','Executar rebalanceamento','Comparar SPI/CPI e lead time','Padronizar ou abrir correção'][i]}</p></div>`).join('')}</div>`)+
 dashboard('Riscos & Issues',`<div class="card"><table><tr><th>Risco</th><th>P</th><th>I</th><th>Score</th><th>Mitigação</th></tr><tr><td>Atraso integração</td><td>0,7</td><td>0,8</td><td class="bad">0,56</td><td>Swarm adicional</td></tr><tr><td>Custo provider</td><td>0,4</td><td>0,5</td><td class="warn">0,20</td><td>Ollama fallback</td></tr></table></div>`)+
 dashboard('Custos & EVM',`<div class="grid"><div class="card span3"><div class="muted">PV</div><div class="kpi">R$ 480k</div></div><div class="card span3"><div class="muted">EV</div><div class="kpi">R$ 452k</div></div><div class="card span3"><div class="muted">CPI</div><div class="kpi ok">1,03</div></div><div class="card span3"><div class="muted">SPI</div><div class="kpi warn">0,94</div></div></div>`)+
 dashboard('Recursos',`<div class="card"><h3>Alocação e leveling</h3><table><tr><th>Recurso</th><th>Capacidade</th><th>Uso</th><th>Conflito</th></tr><tr><td>Research Swarm</td><td>160h</td><td>124h</td><td class="ok">Não</td></tr><tr><td>QA Swarm</td><td>120h</td><td>134h</td><td class="bad">Sim</td></tr></table></div>`)+
 dashboard('Stakeholders',`<div class="card"><table><tr><th>Stakeholder</th><th>Influência</th><th>Interesse</th><th>Comunicação</th></tr><tr><td>Sponsor</td><td>Alta</td><td>Alta</td><td>Semanal</td></tr><tr><td>Equipe técnica</td><td>Média</td><td>Alta</td><td>Daily</td></tr></table></div>`)+
 dashboard('Calendário & Docs',`<div class="grid"><div class="card span6"><h3>Google Calendar</h3><p>Marcos, dailies, reviews e deadlines.</p><span class="tag">Desconectado</span></div><div class="card span6"><h3>Google Drive</h3><p>Atas, planos, relatórios e evidências.</p><span class="tag">Desconectado</span></div></div>`)+
 dashboard('Relatórios',`<div class="grid"><div class="card span4"><h3>Status Executivo</h3><p>Automático · semanal</p></div><div class="card span4"><h3>Burndown / CFD</h3><p>Atualização contínua</p></div><div class="card span4"><h3>Lessons Learned</h3><p>Evidence Graph + PDCA</p></div></div>`)+
 dashboard('Configuração',`<div class="card"><h3>Fonte canônica</h3><code>config/phxclaw.config.json → project_management</code><p>Nenhum segredo é armazenado aqui; somente referências do Secret Broker.</p></div>`);
function show(i){[...document.querySelectorAll('.view')].forEach((v,j)=>v.classList.toggle('active',i===j));[...nav.children].forEach((b,j)=>b.classList.toggle('active',i===j));[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j))}show(0);
</script></body></html>
