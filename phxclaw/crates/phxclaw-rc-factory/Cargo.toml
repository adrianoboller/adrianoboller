[package]
name = "phxclaw-rc-factory"
version = "0.26.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Release Candidate Factory contracts for PhxClaw"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
ed25519-dalek = "2"
phxclaw-release-qualification = { path = "../phxclaw-release-qualification" }
phxclaw-release-hardening = { path = "../phxclaw-release-hardening" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
