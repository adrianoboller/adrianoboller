[package]
name = "phxclaw-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phxclaw-agent-core = { path = "../phxclaw-agent-core" }
# Os 110 papeis da planilha (config/agents), ativos pelo `team_list` e `team_delegate`.
phxclaw-agent-catalog = { path = "../phxclaw-agent-catalog" }
phxclaw-browser = { path = "../phxclaw-browser" }
phxclaw-llm = { path = "../phxclaw-llm" }
phxclaw-office = { path = "../phxclaw-office" }
phxclaw-web-search = { path = "../phxclaw-web-search" }
phxclaw-evidence-ledger = { path = "../phxclaw-evidence-ledger" }
phxclaw-rustclaw-native = { path = "../phxclaw-rustclaw-native" }
phxclaw-sandbox = { path = "../phxclaw-sandbox" }
# Ponto de restauracao antes de cada escrita (objetos por hash, ver checkpoint.rs).
phxclaw-checkpoint = { path = "../phxclaw-checkpoint" }
# Orquestracao: o DAG dos fluxos, os plugins assinados como ferramenta e os nos de
# dispositivo. Todas ja sao crates do workspace (nada novo no Cargo.lock).
phxclaw-task-graph = { path = "../phxclaw-task-graph" }
phxclaw-plugin-registry = { path = "../phxclaw-plugin-registry" }
phxclaw-device-nodes = { path = "../phxclaw-device-nodes" }
phxclaw-device-transport = { path = "../phxclaw-device-transport" }
# Grep da busca_arquivos: ja estava no Cargo.lock (dependencia de outras crates).
regex = "1"
# PKCE e `state` do OAuth dos MCP remotos: a mesma fonte do broker (ja no Cargo.lock).
getrandom.workspace = true
phxclaw-ui-ir = { path = "../phxclaw-ui-ir" }
phxclaw-memory-context = { path = "../phxclaw-memory-context" }
phxclaw-skill-runtime = { path = "../phxclaw-skill-runtime" }
phxclaw-secret-broker = { path = "../phxclaw-secret-broker" }
phxclaw-media-intelligence = { path = "../phxclaw-media-intelligence" }
# Conferencia de sintaxe do script do canvas: o mesmo tree-sitter que ja analisa repositorios.
phxclaw-repo-intelligence = { path = "../phxclaw-repo-intelligence" }
phxclaw-mcp-lsp-runtime = { path = "../phxclaw-mcp-lsp-runtime" }
# Atras da feature `desktop`: o xcap liga libgbm, libdrm, libwayland-client e libxcb no
# binario, e o agente de servidor nao deve passar a exigir biblioteca de sessao grafica.
phxclaw-system-automation = { path = "../phxclaw-system-automation", optional = true }
quick-xml.workspace = true
phxclaw-types = { path = "../phxclaw-types" }
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
axum.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
phxclaw-api-gateway = { path = "../phxclaw-api-gateway" }
phxclaw-egress-broker = { path = "../phxclaw-egress-broker" }
phxclaw-http-client = { path = "../phxclaw-http-client" }
# Canal de mensagens (Telegram): provedor com token por concessao curta do broker.
phxclaw-channel-gateway = { path = "../phxclaw-channel-gateway" }
phxclaw-channel-providers = { path = "../phxclaw-channel-providers" }
phxclaw-live-bus = { path = "../phxclaw-live-bus" }
# Canais alem do Telegram: o mesmo cliente bloqueante do phxclaw-channel-providers e o
# base64 das assinaturas (LINE, Twilio). Os dois ja sao dependencias do workspace.
reqwest.workspace = true
base64.workspace = true
# Relay do Nostr (WebSocket com TLS): dependencia do workspace, ja usada pelo navegador.
tokio-tungstenite.workspace = true
# TLS de soquete dos canais IRC, Twitch, XMPP (STARTTLS) e IMAP (ver canais/tls.rs).
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
uuid.workspace = true
postgres.workspace = true
# Controle remoto pela ponte: o agente chama o PROPRIO router em processo (`oneshot`, do
# tower que o axum ja traz) e guarda a chave Ed25519 do no em arquivo 0600. Nada novo no
# Cargo.lock.
tower = { version = "0.5", default-features = false, features = ["util"] }
phxclaw-key-provider = { path = "../phxclaw-key-provider", features = ["arquivo"] }
# Medicao (`phxclaw avaliar`): a observacao e o perfil (p95, acerto) sao os do
# ai-benchmark, para o agente e o resto da base nao terem dois agregadores. Ja no workspace.
phxclaw-ai-benchmark = { path = "../phxclaw-ai-benchmark" }
# O config.json: catalogo das chaves, carga com origem e gravacao com revisao. Ja no workspace.
phxclaw-config-runtime = { path = "../phxclaw-config-runtime" }
# O workspace de varias raizes (`.phxclaw/workspace.json`), o mesmo leitor do IDE de mesa.
phxclaw-workspace = { path = "../phxclaw-workspace" }

[features]
desktop = [
    "dep:phxclaw-system-automation",
    "phxclaw-system-automation/desktop-input",
    "phxclaw-system-automation/screen-capture",
]

[dev-dependencies]
phxclaw-test-support = { path = "../phxclaw-test-support" }
reqwest.workspace = true
ed25519-dalek.workspace = true
# Servidor TLS falso dos testes dos canais (certificado fixo em tests/dados/tls) e o
# corpo de formulario do OAuth falso.
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
