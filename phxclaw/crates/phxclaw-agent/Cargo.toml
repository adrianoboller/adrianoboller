[package]
name = "phxclaw-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phxclaw-agent-core = { path = "../phxclaw-agent-core" }
# Os 110 papeis da planilha (config/agents), ativos pelo `team_list` e `team_delegate`.
phxclaw-agent-catalog = { path = "../phxclaw-agent-catalog" }
phxclaw-browser = { path = "../phxclaw-browser" }
phxclaw-llm = { path = "../phxclaw-llm" }
phxclaw-office = { path = "../phxclaw-office" }
phxclaw-web-search = { path = "../phxclaw-web-search" }
phxclaw-evidence-ledger = { path = "../phxclaw-evidence-ledger" }
phxclaw-rustclaw-native = { path = "../phxclaw-rustclaw-native" }
phxclaw-sandbox = { path = "../phxclaw-sandbox" }
phxclaw-ui-ir = { path = "../phxclaw-ui-ir" }
phxclaw-memory-context = { path = "../phxclaw-memory-context" }
phxclaw-skill-runtime = { path = "../phxclaw-skill-runtime" }
phxclaw-secret-broker = { path = "../phxclaw-secret-broker" }
phxclaw-media-intelligence = { path = "../phxclaw-media-intelligence" }
phxclaw-mcp-lsp-runtime = { path = "../phxclaw-mcp-lsp-runtime" }
# Atras da feature `desktop`: o xcap liga libgbm, libdrm, libwayland-client e libxcb no
# binario, e o agente de servidor nao deve passar a exigir biblioteca de sessao grafica.
phxclaw-system-automation = { path = "../phxclaw-system-automation", optional = true }
quick-xml.workspace = true
phxclaw-types = { path = "../phxclaw-types" }
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
axum.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
phxclaw-api-gateway = { path = "../phxclaw-api-gateway" }
phxclaw-egress-broker = { path = "../phxclaw-egress-broker" }
phxclaw-http-client = { path = "../phxclaw-http-client" }
# Canal de mensagens (Telegram): provedor com token por concessao curta do broker.
phxclaw-channel-gateway = { path = "../phxclaw-channel-gateway" }
phxclaw-channel-providers = { path = "../phxclaw-channel-providers" }
phxclaw-live-bus = { path = "../phxclaw-live-bus" }
uuid.workspace = true
postgres.workspace = true

[features]
desktop = [
    "dep:phxclaw-system-automation",
    "phxclaw-system-automation/desktop-input",
    "phxclaw-system-automation/screen-capture",
]

[dev-dependencies]
reqwest.workspace = true
