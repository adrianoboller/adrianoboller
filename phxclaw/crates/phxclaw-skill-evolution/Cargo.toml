[package]
name = "phxclaw-skill-evolution"
version = "0.22.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
