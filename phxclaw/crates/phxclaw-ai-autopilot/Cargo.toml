[package]
name = "phxclaw-ai-autopilot"
version = "0.35.0"
edition = "2021"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["serde", "v7"] }
thiserror = "2"
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
phxclaw-ai-sre = { path = "../phxclaw-ai-sre" }
phxclaw-ai-portfolio = { path = "../phxclaw-ai-portfolio" }
phxclaw-ha-control-plane = { path = "../phxclaw-ha-control-plane" }
