[package]
name = "phxclaw-ha-control-plane"
version = "0.30.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Multi-controller leader lease, fencing and reconciliation contracts for PhxClaw"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
