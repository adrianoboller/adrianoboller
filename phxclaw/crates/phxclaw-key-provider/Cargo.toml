[package]
name = "phxclaw-key-provider"
version = "0.21.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
# Backends reais por plataforma: sem eles o crate keyring cai no armazenamento SIMULADO,
# em memoria, e a chave "guardada" morre com o processo (medido em 30/09: o no de
# dispositivo pareava e, reiniciado, nao achava a propria chave).
os-keyring = [
    "dep:keyring",
    "keyring/apple-native",
    "keyring/windows-native",
    "keyring/linux-native-sync-persistent",
    "keyring/crypto-rust",
]
arquivo = []
dev-env = []

[dependencies]
base64 = "0.22"
thiserror = "2"
zeroize = "1.8"
keyring = { version = "3", optional = true }

[lints.rust]
unsafe_code = "forbid"
