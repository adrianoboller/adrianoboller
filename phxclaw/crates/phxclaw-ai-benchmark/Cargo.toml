[package]
name = "phxclaw-ai-benchmark"
version = "0.32.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Evidence-bound AI benchmark engine for PhxClaw model/provider evaluation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
