[package]
name = "phxclaw-safe-source-harvester"
version = "0.61.0"
edition = "2021"
license = "Proprietary"
publish = false
description = "Fail-closed safe source harvesting pipeline for PhxClaw"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
phxclaw-provenance-core = { path = "../phxclaw-provenance-core" }
phxclaw-evidence-ledger = { path = "../phxclaw-evidence-ledger" }
phxclaw-knowledge-evidence-graph = { path = "../phxclaw-knowledge-evidence-graph" }
