[package]
name = "phxclaw-snippet-ls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Servidor de linguagem minimo: snippets do usuario e Emmet para o Helix do IDE"

[dependencies]
serde_json.workspace = true
# O NOME das variaveis que o agente exporta ao Helix sai do catalogo (ponto unico), nunca de
# um literal aqui: variavel lida fora do catalogo e configuracao que mente. Crate do workspace.
phxclaw-config-runtime = { path = "../phxclaw-config-runtime" }

[[bin]]
name = "phxclaw-snippet-ls"
path = "src/main.rs"
