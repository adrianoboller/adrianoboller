[package]
name = "phxclaw-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motor de terminal do IDE do PhxClaw: PTY + alacritty_terminal, grade de celulas por diferenca."

[dependencies]
# Apache-2.0. Traz o PTY (rustix-openpty no Unix), o laco de leitura e o emulador VT; sem
# serde de proposito: a grade que sai daqui e nossa, e o JSON dela e decidido aqui.
alacritty_terminal = { version = "0.26", default-features = false }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# So para o kill do grupo do filho no Drop (ver `encerrar_grupo`); ja vem na arvore pelo
# alacritty_terminal.
libc = "0.2"
