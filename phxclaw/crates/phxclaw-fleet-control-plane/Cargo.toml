[package]
name = "phxclaw-fleet-control-plane"
version = "0.29.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Governed fleet inventory, selectors, remote orchestration, maintenance and recovery contracts for PhxClaw"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
phxclaw-device-nodes = { path = "../phxclaw-device-nodes" }
phxclaw-fleet-updater = { path = "../phxclaw-fleet-updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
