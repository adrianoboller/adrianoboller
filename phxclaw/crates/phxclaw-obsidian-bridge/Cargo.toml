[package]
name = "phxclaw-obsidian-bridge"
version = "0.30.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Obsidian Markdown and JSON Canvas interoperability for PhxClaw knowledge/evidence"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
