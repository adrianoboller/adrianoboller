[package]
name = "phxclaw-adaptive-model-intelligence"
version = "0.32.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Benchmark-backed adaptive model intelligence for PhxClaw AI Fabric"

[dependencies]
phxclaw-ai-fabric = { path = "../phxclaw-ai-fabric" }
phxclaw-ai-benchmark = { path = "../phxclaw-ai-benchmark" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
