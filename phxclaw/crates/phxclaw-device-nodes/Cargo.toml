[package]
name = "phxclaw-device-nodes"
version = "0.21.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
