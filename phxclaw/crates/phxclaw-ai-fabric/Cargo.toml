[package]
name = "phxclaw-ai-fabric"
version = "0.31.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Governed deterministic local/cloud model routing for PhxClaw"
[dependencies]
serde = { version = "1", features = ["derive"] }
